 class=\"code\" data-lang=\"python\"><code><span class=\"tk\">import<\/span> copy\n\na = [[1], [2]]\nb = a[:]\nc = copy.deepcopy(a)\na[0].append(9)\na[1] = [5]\n<span class=\"tk\">print<\/span>(a, b, c)<\/code><\/pre>","a":"<p>[[1, 9], [5]] [[1, 9], [2]] [[1], [2]]<\/p>","e":"<p>b는 안쪽 리스트를 공유해 [1, 9]가 보이지만, 바깥 칸 교체는 보이지 않는다. c는 완전히 독립이다.<\/p>"},{"s":"<p>다음 Python 코드의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"python\"><code>d = {<span class=\"ts\">\"a\"<\/span>: 3, <span class=\"ts\">\"b\"<\/span>: 8, <span class=\"ts\">\"c\"<\/span>: 5}\ns = <span class=\"ts\">\"\"<\/span>\n<span class=\"tk\">for<\/span> k, v <span class=\"tk\">in<\/span> d.items():\n    <span class=\"tk\">if<\/span> v % 2:\n        s = k + s\n    <span class=\"tk\">else<\/span>:\n        s += k\n<span class=\"tk\">print<\/span>(s)<\/code><\/pre>","a":"<p>cab<\/p>","e":"<p>a(홀수)는 \"a\", b(짝수)는 뒤에 붙어 \"ab\", c(홀수)는 앞에 붙어 \"cab\"이다.<\/p>"},{"s":"<p>다음 Python 코드의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"python\"><code><span class=\"tk\">class<\/span> N:\n    <span class=\"tk\">def<\/span> __init__(<span class=\"tk\">self<\/span>, v, l=<span class=\"tk\">None<\/span>, r=<span class=\"tk\">None<\/span>):\n        <span class=\"tk\">self<\/span>.v = v\n        <span class=\"tk\">self<\/span>.l = l\n        <span class=\"tk\">self<\/span>.r = r\n\n<span class=\"tk\">def<\/span> inorder(t):\n    <span class=\"tk\">if<\/span> t is <span class=\"tk\">None<\/span>:\n        <span class=\"tk\">return<\/span> []\n    <span class=\"tk\">return<\/span> inorder(t.l) + [t.v] + inorder(t.r)\n\nroot = N(1, N(2, N(4)), N(3))\n<span class=\"tk\">print<\/span>(inorder(root))<\/code><\/pre>","a":"<p>[4, 2, 1, 3]<\/p>","e":"<p>1의 왼쪽은 2, 2의 왼쪽은 4, 1의 오른쪽은 3이다. 왼쪽, 자신, 오른쪽 순서다.<\/p>"},{"s":"<p>다음 Python 코드의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"python\"><code><span class=\"tk\">def<\/span> f(s):\n    <span class=\"tk\">return<\/span> s <span class=\"tk\">if<\/span> len(s) &lt; 2 <span class=\"tk\">else<\/span> f(s[1:]) + s[0]\n\n<span class=\"tk\">print<\/span>(f(<span class=\"ts\">\"stack\"<\/span>))<\/code><\/pre>","a":"<p>kcats<\/p>","e":"<p>첫 글자를 맨 뒤로 보내는 재귀로 문자열을 뒤집는다.<\/p>"},{"s":"<p>다음 Python 코드의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"python\"><code>a = [[1, 0], [1], [0, 1, 1]]\n<span class=\"tk\">print<\/span>(sum(len(r) <span class=\"tk\">for<\/span> r <span class=\"tk\">in<\/span> a), sum(x <span class=\"tk\">for<\/span> r <span class=\"tk\">in<\/span> a <span class=\"tk\">for<\/span> x <span class=\"tk\">in<\/span> r))\n<span class=\"tk\">for<\/span> i <span class=\"tk\">in<\/span> range(len(a) - 1, -1, -1):\n    <span class=\"tk\">print<\/span>(a[i][0], end=<span class=\"ts\">\"\"<\/span>)<\/code><\/pre>","a":"<p>6 4<br>011<\/p>","e":"<p>원소 수는 2 + 1 + 3 = 6이고, 1의 개수는 4이다. 행을 거꾸로 돌며 첫 값 0, 1, 1을 출력한다.<\/p>"}]},{"id":"code-blank","title":"코드 빈칸 채우기 (정렬·진법·알고리즘)","freq":"출력값 대신 빈칸을 묻는 형식","concept":"<p>빈칸 문제는 <strong>코드의 목적과 주어진 출력<\/strong>을 먼저 확인한다. 후보를 넣고 짧은 입력으로 끝까지 돌려 본다.<\/p><div class=\"tw\"><table><thead><tr><th>알고리즘<\/th><th>알아 둘 부분<\/th><\/tr><\/thead><tbody><tr><td>선택 정렬<\/td><td>안쪽에서 최솟값 위치를 찾아 바깥 위치와 교환<\/td><\/tr><tr><td>버블 정렬<\/td><td>이웃을 비교, 안쪽 범위가 <code>n - 1 - i<\/code><\/td><\/tr><tr><td>삽입 정렬<\/td><td>key를 앞쪽 정렬 구간의 맞는 자리로 이동<\/td><\/tr><tr><td>진법 변환<\/td><td><code>% 진수<\/code>로 낮은 자리를 얻고 <code>/ 진수<\/code>로 줄임<\/td><\/tr><tr><td>약수·소수<\/td><td><code>d * d &lt;= n<\/code>까지만 검사해도 충분<\/td><\/tr><tr><td>유클리드 호제법<\/td><td><code>a, b = b, a % b<\/code>를 b가 0일 때까지 반복<\/td><\/tr><tr><td>원형 인덱스<\/td><td><code>(i + k) % n<\/code><\/td><\/tr><\/tbody><\/table><\/div><ul><li>오름차순은 최솟값을 찾으므로 <code>&lt;<\/code>, 버블 정렬은 앞이 더 크면 교환하므로 <code>&gt;<\/code>를 쓴다. 내림차순은 반대다.<\/li><\/ul>","qs":[{"s":"<p>다음은 오름차순 선택 정렬 프로그램이다. 출력이 <code>1 2 5 8<\/code>이 되도록 ①에 들어갈 연산자를 적으시오.<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">int<\/span> a[4] = {5, 2, 8, 1};\n    <span class=\"tk\">for<\/span> (<span class=\"tk\">int<\/span> i = 0; i &lt; 3; i++) {\n        <span class=\"tk\">int<\/span> min = i;\n        <span class=\"tk\">for<\/span> (<span class=\"tk\">int<\/span> j = i + 1; j &lt; 4; j++)\n            <span class=\"tk\">if<\/span> (a[j] <span class=\"tb\">( ① )<\/span> a[min])\n                min = j;\n        <span class=\"tk\">int<\/span> t = a[i];\n        a[i] = a[min];\n        a[min] = t;\n    }\n    <span class=\"tk\">for<\/span> (<span class=\"tk\">int<\/span> i = 0; i &lt; 4; i++)\n        printf(<span class=\"ts\">\"%d \"<\/span>, a[i]);\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","a":"<p>&lt;<\/p>","e":"<p>가장 작은 값의 위치를 찾아야 하므로 <code>&lt;<\/code>를 쓴다.<\/p>"},{"s":"<p>다음은 2진수 형태의 정수를 10진수로 바꾸는 프로그램이다. 출력이 <code>11<\/code>이 되도록 ①, ②에 들어갈 수를 적으시오.<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">int<\/span> b = 1011, r = 0, w = 1;\n    <span class=\"tk\">while<\/span> (b &gt; 0) {\n        r += (b % <span class=\"tb\">( ① )<\/span>) * w;\n        w *= <span class=\"tb\">( ② )<\/span>;\n        b /= 10;\n    }\n    printf(<span class=\"ts\">\"%d\\n\"<\/span>, r);\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","a":"<p>① 10  ② 2<\/p>","e":"<p>1011은 십진수로 저장되어 있으므로 10으로 나눈 나머지가 한 자리다. 자리값은 2씩 곱해 간다.<\/p>"},{"s":"<p>다음은 배열을 왼쪽으로 k칸 회전해 출력하는 프로그램이다. 출력이 <code>3 4 1 2<\/code>가 되도록 ①에 들어갈 식을 적으시오.<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">int<\/span> a[4] = {1, 2, 3, 4}, k = 2, n = 4;\n    <span class=\"tk\">for<\/span> (<span class=\"tk\">int<\/span> i = 0; i &lt; n; i++)\n        printf(<span class=\"ts\">\"%d \"<\/span>, a[<span class=\"tb\">( ① )<\/span>]);\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","a":"<p>(i + k) % n<\/p>","e":"<p>i번째 출력 자리에는 k칸 뒤의 값이 온다. 범위를 넘으면 % n으로 앞으로 돌아온다.<\/p>"},{"s":"<p>다음은 내림차순 버블 정렬 프로그램이다. 출력이 <code>9 7 4 2<\/code>가 되도록 ①, ②를 적으시오.<\/p><pre class=\"code\" data-lang=\"java\"><code><span class=\"tk\">public<\/span> <span class=\"tk\">class<\/span> Main {\n    <span class=\"tk\">public<\/span> <span class=\"tk\">static<\/span> <span class=\"tk\">void<\/span> main(String[] args) {\n        <span class=\"tk\">int<\/span>[] a = {4, 9, 2, 7};\n        <span class=\"tk\">for<\/span> (<span class=\"tk\">int<\/span> i = 0; i &lt; a.length - 1; i++) {\n            <span class=\"tk\">for<\/span> (<span class=\"tk\">int<\/span> j = 0; j &lt; a.length - 1 - <span class=\"tb\">( ① )<\/span>; j++) {\n                <span class=\"tk\">if<\/span> (a[j] <span class=\"tb\">( ② )<\/span> a[j + 1]) {\n                    <span class=\"tk\">int<\/span> t = a[j];\n                    a[j] = a[j + 1];\n                    a[j + 1] = t;\n                }\n            }\n        }\n        <span class=\"tk\">for<\/span> (<span class=\"tk\">int<\/span> v : a) System.out.print(v + <span class=\"ts\">\" \"<\/span>);\n    }\n}<\/code><\/pre>","a":"<p>① i  ② &lt;<\/p>","e":"<p>한 바퀴마다 끝자리가 확정되어 범위가 i만큼 준다. 내림차순이므로 앞이 작을 때 교환한다.<\/p>"},{"s":"<p>다음은 최대공약수를 구하는 코드다. 출력이 <code>12<\/code>가 되도록 ①에 들어갈 식을 적으시오.<\/p><pre class=\"code\" data-lang=\"python\"><code>a, b = 84, 36\n<span class=\"tk\">while<\/span> b:\n    a, b = b, <span class=\"tb\">( ① )<\/span>\n<span class=\"tk\">print<\/span>(a)<\/code><\/pre>","a":"<p>a % b<\/p>","e":"<p>유클리드 호제법이다. (84, 36) → (36, 12) → (12, 0)이므로 12를 출력한다.<\/p>"}]},{"id":"ds-file","title":"자료구조 이론과 파일 편성","freq":"2025년 2회 파일 편성, 복원 분석 글 기준 2026년 1회 트리 순회와 연계","concept":"<div class=\"tw\"><table><thead><tr><th>구조<\/th><th>특징<\/th><\/tr><\/thead><tbody><tr><td>스택<\/td><td>LIFO. 후위 표기식 계산, 함수 호출<\/td><\/tr><tr><td>큐<\/td><td>FIFO. 프로세스 대기<\/td><\/tr><tr><td>데크<\/td><td>양쪽 끝에서 삽입과 삭제<\/td><\/tr><tr><td>트리<\/td><td>차수는 자식 수, 단말 노드는 자식이 없는 노드<\/td><\/tr><tr><td>그래프<\/td><td>무방향 완전 그래프의 간선은 n(n − 1) ÷ 2, 방향은 n(n − 1)<\/td><\/tr><\/tbody><\/table><\/div><p><strong>표기법 변환:<\/strong> 연산 우선순위대로 괄호를 치고, 연산자를 해당 괄호의 앞(전위) 또는 뒤(후위)로 옮긴 다음 괄호를 지운다.<\/p><div class=\"tw\"><table><thead><tr><th>파일 편성<\/th><th>접근 방식<\/th><\/tr><\/thead><tbody><tr><td>순차 편성<\/td><td>레코드를 차례로 저장하고 읽음<\/td><\/tr><tr><td>색인(인덱스) 편성<\/td><td>인덱스에서 위치를 찾아 접근<\/td><\/tr><tr><td>직접(해싱) 편성<\/td><td>해시 함수로 키를 주소로 변환<\/td><\/tr><\/tbody><\/table><\/div><p><strong>해싱 용어:<\/strong> 충돌은 서로 다른 키가 같은 주소를 갖는 현상이다. 해시 함수로 제산법, 제곱법, 폴딩법 등을 쓴다.<\/p><div class=\"tw\"><table><thead><tr><th>정렬<\/th><th>평균 복잡도<\/th><\/tr><\/thead><tbody><tr><td>버블, 선택, 삽입<\/td><td>O(n²)<\/td><\/tr><tr><td>퀵, 힙, 합병<\/td><td>O(n log n)<\/td><\/tr><\/tbody><\/table><\/div>","qs":[{"s":"<p>빈 스택에 다음 연산을 수행할 때 꺼내지는 값을 순서대로 적으시오.<\/p><p>push A, push B, pop, push C, pop, pop<\/p>","a":"<p>B, C, A<\/p>","e":"<p>나중에 넣은 값이 먼저 나온다.<\/p>"},{"s":"<p>다음 이진 트리의 전위, 중위, 후위 순회 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"text\"><code>      A\n     / \\\n    B   C\n   / \\   \\\n  D   E   F<\/code><\/pre>","a":"<p>전위 ABDECF, 중위 DBEACF, 후위 DEBFCA<\/p>","e":"<p>자신의 위치가 앞, 가운데, 뒤로 달라진다. C는 왼쪽 자식이 없다.<\/p>"},{"s":"<p>중위 표기식 <code>(A + B) * C - D<\/code>를 후위 표기식으로 변환하시오.<\/p>","a":"<p>AB+C*D-<\/p>","e":"<p><code>(((A + B) * C) - D)<\/code>에서 각 연산자를 닫는 괄호 자리로 옮기면 AB+C*D-이다.<\/p>"},{"s":"<p>파일 편성 방식이다. 빈칸을 적으시오.<\/p><p>( ① ) 편성은 키 값과 레코드 주소를 담은 별도의 표를 먼저 조회해 레코드에 접근한다.<br>( ② ) 편성은 해시 함수로 키 값을 저장 주소로 바꾸어 바로 접근한다.<\/p>","a":"<p>① 색인 (인덱스)  ② 직접 (해싱)<\/p>","e":"<p>별도의 표가 있으면 색인, 계산으로 주소를 구하면 직접 편성이다.<\/p>"},{"s":"<p>정점이 6개인 무방향 완전 그래프의 간선 수를 적으시오.<\/p>","a":"<p>15<\/p>","e":"<p>n(n − 1) ÷ 2 = 6 × 5 ÷ 2 = 15이다.<\/p>"}]}]},{"title":"SQL과 데이터베이스","types":[{"id":"sql-select","title":"SQL 기본 조회 결과","freq":"SQL 31개 중 조건 조회·행 수 문제가 가장 많음","concept":"<p>SQL 결과 문제는 <strong>실행 순서대로 표를 줄여 나가면<\/strong> 풀린다.<\/p><p><code>FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY<\/code><\/p><div class=\"tw\"><table><thead><tr><th>문법<\/th><th>주의할 점<\/th><\/tr><\/thead><tbody><tr><td><code>COUNT(*)<\/code><\/td><td>NULL을 포함한 행 수<\/td><\/tr><tr><td><code>COUNT(열)<\/code><\/td><td>그 열이 NULL이 아닌 행 수<\/td><\/tr><tr><td><code>SUM<\/code>, <code>AVG<\/code>, <code>MIN<\/code>, <code>MAX<\/code><\/td><td>NULL을 제외하고 계산<\/td><\/tr><tr><td><code>DISTINCT<\/code><\/td><td>중복 행 제거<\/td><\/tr><tr><td><code>LIKE<\/code><\/td><td><code>%<\/code>는 0글자 이상, <code>_<\/code>는 정확히 1글자<\/td><\/tr><tr><td><code>BETWEEN a AND b<\/code><\/td><td>a와 b를 포함<\/td><\/tr><tr><td><code>IS NULL<\/code><\/td><td><code>= NULL<\/code>은 항상 참이 아님<\/td><\/tr><tr><td><code>ORDER BY<\/code><\/td><td>기본은 ASC, 여러 기준이면 앞 기준이 같을 때만 다음 기준 적용<\/td><\/tr><\/tbody><\/table><\/div><ul><li>집계 함수만 있고 GROUP BY가 없으면 결과는 항상 1행이다.<\/li><li>NULL과 비교한 조건은 참이 아니므로 <code>NOT IN<\/code> 조건에서도 NULL 행은 나오지 않는다.<\/li><\/ul>","qs":[{"s":"<p>다음 [시험] 테이블에 SQL을 실행한 결과를 쉼표로 구분해 적으시오.<\/p><div class=\"dbs\"><figure class=\"dbt\"><figcaption>[시험]<\/figcaption><div class=\"tw\"><table><thead><tr><th>이름<\/th><th>점수<\/th><\/tr><\/thead><tbody><tr><td>가<\/td><td>80<\/td><\/tr><tr><td>나<\/td><td>NULL<\/td><\/tr><tr><td>다<\/td><td>70<\/td><\/tr><tr><td>라<\/td><td>NULL<\/td><\/tr><\/tbody><\/table><\/div><\/figure><\/div><pre class=\"code\" data-lang=\"sql\"><code><span class=\"tk\">SELECT<\/span> <span class=\"tk\">COUNT<\/span>(*), <span class=\"tk\">COUNT<\/span>(점수), <span class=\"tk\">SUM<\/span>(점수) <span class=\"tk\">FROM<\/span> 시험;<\/code><\/pre>","a":"<p>4, 2, 150<\/p>","e":"<p><code>COUNT(*)<\/code>는 행 수 4, <code>COUNT(점수)<\/code>는 NULL을 뺀 2, SUM은 80 + 70 = 150이다.<\/p>"},{"s":"<p>다음 SQL의 실행 결과를 위에서부터 순서대로 적으시오. 행은 / 로 구분한다.<\/p><div class=\"dbs\"><figure class=\"dbt\"><figcaption>[학생]<\/figcaption><div class=\"tw\"><table><thead><tr><th>이름<\/th><th>학과<\/th><\/tr><\/thead><tbody><tr><td>A<\/td><td>전자<\/td><\/tr><tr><td>B<\/td><td>컴공<\/td><\/tr><tr><td>C<\/td><td>전자<\/td><\/tr><tr><td>D<\/td><td>수학<\/td><\/tr><tr><td>E<\/td><td>컴공<\/td><\/tr><\/tbody><\/table><\/div><\/figure><\/div><pre class=\"code\" data-lang=\"sql\"><code><span class=\"tk\">SELECT<\/span> <span class=\"tk\">DISTINCT<\/span> 학과 <span class=\"tk\">FROM<\/span> 학생 <span class=\"tk\">ORDER<\/span> <span class=\"tk\">BY<\/span> 학과 <span class=\"tk\">DESC<\/span>;<\/code><\/pre>","a":"<p>컴공 / 전자 / 수학<\/p>","e":"<p>중복을 없앤 수학, 전자, 컴공을 내림차순으로 정렬한다. 한글은 가나다 역순이므로 컴공, 전자, 수학이다.<\/p>"},{"s":"<p>다음 SQL의 실행 결과를 적으시오.<\/p><div class=\"dbs\"><figure class=\"dbt\"><figcaption>[회원]<\/figcaption><div class=\"tw\"><table><thead><tr><th>이름<\/th><\/tr><\/thead><tbody><tr><td>김수<\/td><\/tr><tr><td>김철수<\/td><\/tr><tr><td>이민수<\/td><\/tr><tr><td>박영희<\/td><\/tr><tr><td>김하나<\/td><\/tr><\/tbody><\/table><\/div><\/figure><\/div><pre class=\"code\" data-lang=\"sql\"><code><span class=\"tk\">SELECT<\/span> <span class=\"tk\">COUNT<\/span>(*) <span class=\"tk\">FROM<\/span> 회원 <span class=\"tk\">WHERE<\/span> 이름 <span class=\"tk\">LIKE<\/span> <span class=\"ts\">'김_'<\/span> <span class=\"tk\">OR<\/span> 이름 <span class=\"tk\">LIKE<\/span> <span class=\"ts\">'%수'<\/span>;<\/code><\/pre>","a":"<p>3<\/p>","e":"<p><code>김_<\/code>는 김수만 해당하고, <code>%수<\/code>는 김수, 김철수, 이민수가 해당한다. 중복을 빼면 3행이다.<\/p>"},{"s":"<p>다음 SQL의 실행 결과에서 나오는 이름을 순서대로 적으시오. 행은 / 로 구분한다.<\/p><div class=\"dbs\"><figure class=\"dbt\"><figcaption>[성적]<\/figcaption><div class=\"tw\"><table><thead><tr><th>이름<\/th><th>점수<\/th><\/tr><\/thead><tbody><tr><td>갑<\/td><td>60<\/td><\/tr><tr><td>을<\/td><td>70<\/td><\/tr><tr><td>병<\/td><td>NULL<\/td><\/tr><tr><td>정<\/td><td>80<\/td><\/tr><tr><td>무<\/td><td>90<\/td><\/tr><\/tbody><\/table><\/div><\/figure><\/div><pre class=\"code\" data-lang=\"sql\"><code><span class=\"tk\">SELECT<\/span> 이름 <span class=\"tk\">FROM<\/span> 성적 <span class=\"tk\">WHERE<\/span> 점수 <span class=\"tk\">NOT<\/span> <span class=\"tk\">IN<\/span> (70, 80) <span class=\"tk\">ORDER<\/span> <span class=\"tk\">BY<\/span> 점수;<\/code><\/pre>","a":"<p>갑 / 무<\/p>","e":"<p>70과 80이 제외되고, NULL인 병은 조건이 참이 되지 않아 제외된다.<\/p>"},{"s":"<p>다음 SQL의 실행 결과에서 나오는 이름을 순서대로 적으시오. 행은 / 로 구분한다.<\/p><div class=\"dbs\"><figure class=\"dbt\"><figcaption>[사원]<\/figcaption><div class=\"tw\"><table><thead><tr><th>이름<\/th><th>직급<\/th><th>급여<\/th><\/tr><\/thead><tbody><tr><td>P<\/td><td>2<\/td><td>300<\/td><\/tr><tr><td>Q<\/td><td>1<\/td><td>500<\/td><\/tr><tr><td>R<\/td><td>2<\/td><td>200<\/td><\/tr><tr><td>S<\/td><td>1<\/td><td>400<\/td><\/tr><\/tbody><\/table><\/div><\/figure><\/div><pre class=\"code\" data-lang=\"sql\"><code><span class=\"tk\">SELECT<\/span> 이름 <span class=\"tk\">FROM<\/span> 사원 <span class=\"tk\">ORDER<\/span> <span class=\"tk\">BY<\/span> 직급 <span class=\"tk\">DESC<\/span>, 급여 <span class=\"tk\">ASC<\/span>;<\/code><\/pre>","a":"<p>R / P / S / Q<\/p>","e":"<p>직급 2가 먼저이고 그 안에서 급여 오름차순이므로 R, P다. 다음 직급 1도 같은 방식으로 S, Q다.<\/p>"}]},{"id":"sql-join","title":"GROUP BY·조인·서브쿼리·집합 연산","freq":"조인 5개, 그룹 4개, 서브쿼리 4개","concept":"<div class=\"tw\"><table><thead><tr><th>문법<\/th><th>결과<\/th><\/tr><\/thead><tbody><tr><td><code>INNER JOIN<\/code><\/td><td>양쪽 조건이 맞는 행만<\/td><\/tr><tr><td><code>LEFT OUTER JOIN<\/code><\/td><td>왼쪽 행은 전부, 짝이 없으면 오른쪽은 NULL<\/td><\/tr><tr><td><code>RIGHT OUTER JOIN<\/code><\/td><td>오른쪽 행은 전부<\/td><\/tr><tr><td><code>CROSS JOIN<\/code><\/td><td>모든 조합 (행 수 곱)<\/td><\/tr><tr><td><code>UNION<\/code><\/td><td>합집합, 중복 제거<\/td><\/tr><tr><td><code>UNION ALL<\/code><\/td><td>합집합, 중복 유지<\/td><\/tr><tr><td><code>INTERSECT<\/code><\/td><td>교집합<\/td><\/tr><tr><td><code>EXCEPT<\/code> / <code>MINUS<\/code><\/td><td>차집합<\/td><\/tr><\/tbody><\/table><\/div><ul><li>WHERE는 그룹을 만들기 전에 행을 거르고, HAVING은 그룹을 만든 후에 그룹을 거른다.<\/li><li>SELECT 절에 집계 없이 쓸 수 있는 열은 GROUP BY에 있는 열이다.<\/li><li>서브쿼리는 안쪽부터 계산한다. 결과가 여러 값이면 <code>=<\/code>가 아니라 <code>IN<\/code>을 쓴다.<\/li><li><code>ALL<\/code>은 모든 값과, <code>ANY<\/code>는 하나 이상의 값과 비교해 조건을 만족해야 한다.<\/li><\/ul>","qs":[{"s":"<p>다음 SQL의 실행 결과를 적으시오. 열은 쉼표, 행은 / ode>처럼 쓴다.<\/li><\/ul>","qs":[{"s":"<p>다음 SQL의 실행 결과에서 나오는 이름을 적으시오. 행은 / 로 구분한다.<\/p><div class=\"dbs\"><figure class=\"dbt\"><figcaption>[사원]<\/figcaption><div class=\"tw\"><table><thead><tr><th>이름<\/th><th>부서<\/th><th>급여<\/th><\/tr><\/thead><tbody><tr><td>a<\/td><td>X<\/td><td>100<\/td><\/tr><tr><td>b<\/td><td>X<\/td><td>300<\/td><\/tr><tr><td>c<\/td><td>Y<\/td><td>200<\/td><\/tr><tr><td>d<\/td><td>Y<\/td><td>200<\/td><\/tr><tr><td>e<\/td><td>Z<\/td><td>500<\/td><\/tr><\/tbody><\/table><\/div><\/figure><\/div><pre class=\"code\" data-lang=\"sql\"><code><span class=\"tk\">SELECT<\/span> 이름 <span class=\"tk\">FROM<\/span> 사원 E <span class=\"tk\">WHERE<\/span> 급여 &gt; (<span class=\"tk\">SELECT<\/span> <span class=\"tk\">AVG<\/span>(급여) <span class=\"tk\">FROM<\/span> 사원 <span class=\"tk\">WHERE<\/span> 부서 = E.부서) <span class=\"tk\">ORDER<\/span> <span class=\"tk\">BY<\/span> 이름;<\/code><\/pre>","a":"<p>b<\/p>","e":"<p>X의 평균은 200이므로 b만 해당한다. Y는 모두 평균과 같고, Z의 e도 자기 평균과 같아 제외된다.<\/p>"},{"s":"<p>다음 SQL의 실행 결과를 적으시오.<\/p><div class=\"dbs\"><figure class=\"dbt\"><figcaption>[학생]<\/figcaption><div class=\"tw\"><table><thead><tr><th>이름<\/th><\/tr><\/thead><tbody><tr><td>A<\/td><\/tr><tr><td>B<\/td><\/tr><tr><td>C<\/td><\/tr><\/tbody><\/table><\/div><\/figure><figure class=\"dbt\"><figcaption>[시험]<\/figcaption><div class=\"tw\"><table><thead><tr><th>이름<\/th><th>점수<\/th><\/tr><\/thead><tbody><tr><td>A<\/td><td>70<\/td><\/tr><tr><td>A<\/td><td>80<\/td><\/tr><tr><td>B<\/td><td>90<\/td><\/tr><\/tbody><\/table><\/div><\/figure><\/div><pre class=\"code\" data-lang=\"sql\"><code><span class=\"tk\">SELECT<\/span> <span class=\"tk\">COUNT<\/span>(*) <span class=\"tk\">FROM<\/span> 학생 S <span class=\"tk\">WHERE<\/span> 80 &gt; (<span class=\"tk\">SELECT<\/span> <span class=\"tk\">AVG<\/span>(점수) <span class=\"tk\">FROM<\/span> 시험 T <span class=\"tk\">WHERE<\/span> T.이름 = S.이름);<\/code><\/pre>","a":"<p>1<\/p>","e":"<p>A의 평균 75만 조건을 만족한다. B는 90이고, C는 시험 기록이 없어 AVG가 NULL이라 조건이 참이 되지 않는다.<\/p>"},{"s":"<p>다음 SQL의 실행 결과를 적으시오.<\/p><div class=\"dbs\"><figure class=\"dbt\"><figcaption>[A]<\/figcaption><div class=\"tw\"><table><thead><tr><th>k<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><\/tr><tr><td>1<\/td><\/tr><tr><td>2<\/td><\/tr><\/tbody><\/table><\/div><\/figure><figure class=\"dbt\"><figcaption>[B]<\/figcaption><div class=\"tw\"><table><thead><tr><th>k<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><\/tr><tr><td>3<\/td><\/tr><tr><td>3<\/td><\/tr><\/tbody><\/table><\/div><\/figure><\/div><pre class=\"code\" data-lang=\"sql\"><code><span class=\"tk\">SELECT<\/span> <span class=\"tk\">COUNT<\/span>(*) <span class=\"tk\">FROM<\/span> A <span class=\"tk\">RIGHT<\/span> <span class=\"tk\">OUTER<\/span> <span class=\"tk\">JOIN<\/span> B <span class=\"tk\">ON<\/span> A.k = B.k <span class=\"tk\">WHERE<\/span> A.k <span class=\"tk\">IS<\/span> <span class=\"tk\">NULL<\/span>;<\/code><\/pre>","a":"<p>2<\/p>","e":"<p>B의 1은 A의 1 두 개와 연결되어 A.k가 NULL이 아니다. B의 3 두 행은 짝이 없어 NULL로 남는다.<\/p>"},{"s":"<p>다음 SQL의 실행 결과에서 나오는 이름을 적으시오. 행은 / 로 구분한다.<\/p><div class=\"dbs\"><figure class=\"dbt\"><figcaption>[학생]<\/figcaption><div class=\"tw\"><table><thead><tr><th>학번<\/th><th>이름<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>민<\/td><\/tr><tr><td>2<\/td><td>준<\/td><\/tr><tr><td>3<\/td><td>서<\/td><\/tr><\/tbody><\/table><\/div><\/figure><figure class=\"dbt\"><figcaption>[수강]<\/figcaption><div class=\"tw\"><table><thead><tr><th>학번<\/th><th>과목<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>DB<\/td><\/tr><tr><td>3<\/td><td>NW<\/td><\/tr><\/tbody><\/table><\/div><\/figure><\/div><pre class=\"code\" data-lang=\"sql\"><code><span class=\"tk\">SELECT<\/span> 이름 <span class=\"tk\">FROM<\/span> 학생 S <span class=\"tk\">WHERE<\/span> <span class=\"tk\">NOT<\/span> EXISTS (<span class=\"tk\">SELECT<\/span> 1 <span class=\"tk\">FROM<\/span> 수강 C <span class=\"tk\">WHERE<\/span> C.학번 = S.학번);<\/code><\/pre>","a":"<p>준<\/p>","e":"<p>수강 기록이 없는 학생만 남는다.<\/p>"},{"s":"<p>다음 SQL의 실행 결과를 적으시오. 열은 쉼표, 행은 / 로 구분한다.<\/p><div class=\"dbs\"><figure class=\"dbt\"><figcaption>[주문]<\/figcaption><div class=\"tw\"><table><thead><tr><th>고객<\/th><th>상품<\/th><th>수량<\/th><\/tr><\/thead><tbody><tr><td>가<\/td><td>펜<\/td><td>1<\/td><\/tr><tr><td>가<\/td><td>펜<\/td><td>2<\/td><\/tr><tr><td>가<\/td><td>책<\/td><td>0<\/td><\/tr><tr><td>나<\/td><td>펜<\/td><td>3<\/td><\/tr><tr><td>나<\/td><td>컵<\/td><td>1<\/td><\/tr><tr><td>다<\/td><td>책<\/td><td>5<\/td><\/tr><\/tbody><\/table><\/div><\/figure><\/div><pre class=\"code\" data-lang=\"sql\"><code><span class=\"tk\">SELECT<\/span> 고객, <span class=\"tk\">COUNT<\/span>(<span class=\"tk\">DISTINCT<\/span> 상품) <span class=\"tk\">FROM<\/span> 주문 <span class=\"tk\">WHERE<\/span> 수량 &gt; 0 <span class=\"tk\">GROUP<\/span> <span class=\"tk\">BY<\/span> 고객 <span class=\"tk\">HAVING<\/span> <span class=\"tk\">COUNT<\/span>(<span class=\"tk\">DISTINCT<\/span> 상품) &gt;= 2;<\/code><\/pre>","a":"<p>나, 2<\/p>","e":"<p>수량 0인 가의 책이 먼저 제외되어 가는 펜 하나만 남는다. 나는 펜과 컵으로 2종이다.<\/p>"}]},{"id":"sql-write","title":"SQL 작성 (DML·DDL·DCL)","freq":"쿼리 작성과 키워드 빈칸이 함께 출제","concept":"<p>실기는 문법을 직접 쓰므로 키워드 순서까지 외운다. 작은따옴표, 세미콜론까지 적는다.<\/p><div class=\"tw\"><table><thead><tr><th>분류<\/th><th>문법<\/th><\/tr><\/thead><tbody><tr><td>삽입<\/td><td><code>INSERT INTO 테이블(열) VALUES(값);<\/code><\/td><\/tr><tr><td>수정<\/td><td><code>UPDATE 테이블 SET 열 = 값 WHERE 조건;<\/code><\/td><\/tr><tr><td>삭제<\/td><td><code>DELETE FROM 테이블 WHERE 조건;<\/code><\/td><\/tr><tr><td>테이블 생성<\/td><td><code>CREATE TABLE 이름(열 타입 제약조건, ...);<\/code><\/td><\/tr><tr><td>열 추가<\/td><td><code>ALTER TABLE 이름 ADD 열 타입;<\/code><\/td><\/tr><tr><td>인덱스<\/td><td><code>CREATE INDEX 이름 ON 테이블(열);<\/code><\/td><\/tr><tr><td>뷰<\/td><td><code>CREATE VIEW 이름 AS SELECT ...;<\/code><\/td><\/tr><tr><td>테이블 삭제<\/td><td><code>DROP TABLE 이름 CASCADE;<\/code><\/td><\/tr><tr><td>권한 부여<\/td><td><code>GRANT 권한 ON 테이블 TO 사용자 WITH GRANT OPTION;<\/code><\/td><\/tr><tr><td>권한 회수<\/td><td><code>REVOKE 권한 ON 테이블 FROM 사용자 CASCADE;<\/code><\/td><\/tr><\/tbody><\/table><\/div><ul><li><code>DELETE<\/code>는 행을 지우고 구조는 남기며, <code>DROP<\/code>은 구조까지 없앤다. <code>TRUNCATE<\/code>는 모든 행을 빠르게 지운다.<\/li><li><code>ON DELETE CASCADE<\/code>는 부모 행을 지울 때 참조하는 자식 행도 지운다.<\/li><li><code>WITH GRANT OPTION<\/code>은 받은 권한을 다른 사용자에게 줄 수 있게 한다.<\/li><\/ul>","qs":[{"s":"<p>[도서] 테이블에서 가격이 20000 이상인 도서의 제목을 가격이 높은 순으로 조회하는 SQL을 작성하시오.<\/p><div class=\"dbs\"><figure class=\"dbt\"><figcaption>[도서]<\/figcaption><div class=\"tw\"><table><thead><tr><th>제목<\/th><th>가격<\/th><\/tr><\/thead><tbody><tr><td>C<\/td><td>18000<\/td><\/tr><tr><td>DB<\/td><td>30000<\/td><\/tr><tr><td>OS<\/td><td>25000<\/td><\/tr><\/tbody><\/table><\/div><\/figure><\/div>","a":"<pre class=\"code\" data-lang=\"sql\"><code><span class=\"tk\">SELECT<\/span> 제목 <span class=\"tk\">FROM<\/span> 도서 <span class=\"tk\">WHERE<\/span> 가격 &gt;= 20000 <span class=\"tk\">ORDER<\/span> <span class=\"tk\">BY<\/span> 가격 <span class=\"tk\">DESC<\/span>;<\/code><\/pre>","e":"<p>조건은 WHERE, 정렬은 ORDER BY로 쓴다. 높은 순이므로 DESC다.<\/p>"},{"s":"<p>[사원] 테이블에서 사번이 3인 사원의 부서를 '개발'로 수정하는 SQL을 작성하시오.<\/p><div class=\"dbs\"><figure class=\"dbt\"><figcaption>[사원]<\/figcaption><div class=\"tw\"><table><thead><tr><th>사번<\/th><th>부서<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>영업<\/td><\/tr><tr><td>3<\/td><td>인사<\/td><\/tr><\/tbody><\/table><\/div><\/figure><\/div>","a":"<pre class=\"code\" data-lang=\"sql\"><code><span class=\"tk\">UPDATE<\/span> 사원 <span class=\"tk\">SET<\/span> 부서 = <span class=\"ts\">'개발'<\/span> <span class=\"tk\">WHERE<\/span> 사번 = 3;<\/code><\/pre>","e":"<p>UPDATE 다음에 SET이 오며, WHERE를 빼면 모든 행이 바뀐다.<\/p>"},{"s":"<p>[주문]의 고객번호는 [고객]을 ON DELETE CASCADE로 참조한다. 다음 SQL을 실행한 뒤 [주문]에 남은 행 수를 적으시오.<\/p><div class=\"dbs\"><figure class=\"dbt\"><figcaption>[고객]<\/figcaption><div class=\"tw\"><table><thead><tr><th>번호<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><\/tr><tr><td>2<\/td><\/tr><\/tbody><\/table><\/div><\/figure><figure class=\"dbt\"><figcaption>[주문]<\/figcaption><div class=\"tw\"><table><thead><tr><th>주문번호<\/th><th>고객번호<\/th><\/tr><\/thead><tbody><tr><td>10<\/td><td>1<\/td><\/tr><tr><td>11<\/td><td>1<\/td><\/tr><tr><td>12<\/td><td>2<\/td><\/tr><\/tbody><\/table><\/div><\/figure><\/div><pre class=\"code\" data-lang=\"sql\"><code><span class=\"tk\">DELETE<\/span> <span class=\"tk\">FROM<\/span> 고객 <span class=\"tk\">WHERE<\/span> 번호 = 1;\n<span class=\"tk\">SELECT<\/span> <span class=\"tk\">COUNT<\/span>(*) <span class=\"tk\">FROM<\/span> 주문;<\/code><\/pre>","a":"<p>1<\/p>","e":"<p>고객 1을 지우면 이를 참조하는 주문 10, 11도 함께 지워진다.<\/p>"},{"s":"<p>[수강]의 내용을 [백업] 테이블에 옮기려 한다. 빈칸 ①, ②에 들어갈 키워드를 적으시오.<\/p><p><code>( ① ) INTO 백업 ( ② ) 학번, 과목 FROM 수강 WHERE 학기 = 1;<\/code><\/p>","a":"<p>① INSERT  ② SELECT<\/p>","e":"<p>다른 테이블의 조회 결과를 넣을 때는 VALUES 대신 SELECT를 쓴다.<\/p>"},{"s":"<p>사용자 KIM에게 [학생] 테이블의 SELECT 권한을 주되, KIM이 다른 사용자에게도 이 권한을 줄 수 있게 하는 SQL을 작성하시오.<\/p>","a":"<pre class=\"code\" data-lang=\"sql\"><code><span class=\"tk\">GRANT<\/span> <span class=\"tk\">SELECT<\/span> <span class=\"tk\">ON<\/span> 학생 <span class=\"tk\">TO<\/span> KIM <span class=\"tk\">WITH<\/span> <span class=\"tk\">GRANT<\/span> <span class=\"tk\">OPTION<\/span>;<\/code><\/pre>","e":"<p>GRANT 권한 ON 대상 TO 사용자 순서이며, 재부여 권한은 WITH GRANT OPTION이다.<\/p>"}]},{"id":"sql-constraint","title":"제약조건과 DDL 구문 쓰기","freq":"2026년 CHECK·CREATE DOMAIN 혼동 후기, 기출 CONSTRAINT 빈칸","concept":"<div class=\"tw\"><table><thead><tr><th>제약<\/th><th>의미<\/th><\/tr><\/thead><tbody><tr><td><code>PRIMARY KEY<\/code><\/td><td>중복과 NULL 불가<\/td><\/tr><tr><td><code>FOREIGN KEY ... REFERENCES<\/code><\/td><td>다른 테이블 참조<\/td><\/tr><tr><td><code>UNIQUE<\/code><\/td><td>중복 불가, NULL은 허용<\/td><\/tr><tr><td><code>NOT NULL<\/code><\/td><td>NULL 불가<\/td><\/tr><tr><td><code>CHECK (조건)<\/code><\/td><td>값의 허용 범위 지정<\/td><\/tr><tr><td><code>DEFAULT 값<\/code><\/td><td>값을 주지 않을 때 기본값<\/td><\/tr><\/tbody><\/table><\/div><p>제약에 이름을 붙일 때는 <code>CONSTRAINT 이름 제약<\/code> 형식을 쓴다.<\/p><pre class=\"code\" data-lang=\"text\"><code>CREATE TABLE 수강 (\n    학번 INT NOT NULL,\n    과목 VARCHAR(20),\n    CONSTRAINT PK_수강 PRIMARY KEY (학번, 과목),\n    CONSTRAINT FK_수강 FOREIGN KEY (학번) REFERENCES 학생(학번)\n        ON DELETE CASCADE\n);<\/code><\/pre><div class=\"tw\"><table><thead><tr><th>참조 옵션<\/th><th>부모를 지울 때 자식<\/th><\/tr><\/thead><tbody><tr><td><code>CASCADE<\/code><\/td><td>함께 삭제<\/td><\/tr><tr><td><code>SET NULL<\/code><\/td><td>NULL로 변경<\/td><\/tr><tr><td><code>RESTRICT<\/code><\/td><td>참조가 있으면 삭제 거부<\/td><\/tr><\/tbody><\/table><\/div><ul><li>도메인 정의: <code>CREATE DOMAIN 성별 CHAR(1) DEFAULT 'M' CHECK (VALUE IN ('M', 'F'));<\/code><\/li><li>구조 변경: <code>ALTER TABLE 표 ADD 열 타입;<\/code>, <code>ALTER TABLE 표 DROP COLUMN 열;<\/code><\/li><li><code>DROP TABLE 표 RESTRICT<\/code>는 참조하는 대상이 있으면 삭제를 거부하고, <code>CASCADE<\/code>는 함께 삭제한다.<\/li><\/ul>","qs":[{"s":"<p>다음 SQL의 빈칸에 들어갈 키워드를 적으시오.<\/p><p><code>( ① ) FK_주문 ( ② ) KEY (고객번호) ( ③ ) 고객(번호);<\/code><\/p>","a":"<p>① CONSTRAINT  ② FOREIGN  ③ REFERENCES<\/p>","e":"<p>제약 이름, 외래 키 선언, 참조 대상의 순서로 쓴다.<\/p>"},{"s":"<p>다음 테이블에 세 INSERT 문을 각각 실행할 때 저장되는 행 수를 적으시오.<\/p><p><code>CREATE TABLE 시험(번호 INT PRIMARY KEY, 점수 INT CHECK (점수 BETWEEN 0 AND 100));<\/code><\/p><p><code>INSERT INTO 시험 VALUES(1, 100);<\/code><br><code>INSERT INTO 시험 VALUES(2, 101);<\/code><br><code>INSERT INTO 시험 VALUES(1, 50);<\/code><\/p>","a":"<p>1<\/p>","e":"<p>둘째 문장은 CHECK 위반, 셋째 문장은 기본키 중복이다. BETWEEN은 100을 포함하므로 첫째만 저장된다.<\/p>"},{"s":"<p>속성의 값으로 'M'과 'F'만 허용하는 도메인을 정의한다. 빈칸을 적으시오.<\/p><p><code>( ① ) 성별 CHAR(1) ( ② ) (VALUE IN ('M', 'F'));<\/code><\/p>","a":"<p>① CREATE DOMAIN  ② CHECK<\/p>","e":"<p>도메인 안에서도 값의 허용 범위는 CHECK로 지정한다.<\/p>"},{"s":"<p>부서를 삭제하면 그 부서를 참조하던 사원의 부서번호를 NULL로 바꾸도록 설정되어 있다. 다음 SQL의 실행 결과를 적으시오.<\/p><div class=\"dbs\"><figure class=\"dbt\"><figcaption>[부서]<\/figcaption><div class=\"tw\"><table><thead><tr><th>번호<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><\/tr><tr><td>2<\/td><\/tr><\/tbody><\/table><\/div><\/figure><figure class=\"dbt\"><figcaption>[사원]<\/figcaption><div class=\"tw\"><table><thead><tr><th>이름<\/th><th>부서번호<\/th><\/tr><\/thead><tbody><tr><td>가<\/td><td>1<\/td><\/tr><tr><td>나<\/td><td>1<\/td><\/tr><tr><td>다<\/td><td>2<\/td><\/tr><\/tbody><\/table><\/div><\/figure><\/div><pre class=\"code\" data-lang=\"sql\"><code><span class=\"tk\">DELETE<\/span> <span class=\"tk\">FROM<\/span> 부서 <span class=\"tk\">WHERE<\/span> 번호 = 1;\n<span class=\"tk\">SELECT<\/span> <span class=\"tk\">COUNT<\/span>(*), <span class=\"tk\">COUNT<\/span>(부서번호) <span class=\"tk\">FROM<\/span> 사원;<\/code><\/pre>","a":"<p>3, 1<\/p>","e":"<p>사원 행은 그대로 3개이고, 가와 나의 부서번호가 NULL이 되어 값이 있는 행은 1개다.<\/p>"},{"s":"<p>[학생] 테이블에 VARCHAR(20) 타입의 주소 열을 추가하는 SQL을 작성하시오.<\/p>","a":"<pre class=\"code\" data-lang=\"sql\"><code><span class=\"tk\">ALTER<\/span> <span class=\"tk\">TABLE<\/span> 학생 <span class=\"tk\">ADD<\/span> 주소 VARCHAR(20);<\/code><\/pre>","e":"<p>구조 변경은 ALTER TABLE을 쓴다. 표준 SQL에서는 <code>ADD COLUMN<\/code>도 맞다.<\/p>"}]},{"id":"sql-advanced","title":"윈도우 함수·그룹 함수·절차형 SQL","freq":"2027 출제기준에 순위·소계·총합계, 트리거가 명시","concept":"<p>2027~2029 출제기준의 \"SQL 응용\" 항목에 명시된 범위다.<\/p><div class=\"tw\"><table><thead><tr><th>함수<\/th><th>같은 값이 90, 90, 80일 때<\/th><\/tr><\/thead><tbody><tr><td><code>ROW_NUMBER()<\/code><\/td><td>1, 2, 3<\/td><\/tr><tr><td><code>RANK()<\/code><\/td><td>1, 1, 3<\/td><\/tr><tr><td><code>DENSE_RANK()<\/code><\/td><td>1, 1, 2<\/td><\/tr><\/tbody><\/table><\/div><p><code>함수() OVER (PARTITION BY 그룹 ORDER BY 기준)<\/code> 형식이다. PARTITION BY는 행을 줄이지 않고 그룹별로 계산한다.<\/p><div class=\"tw\"><table><thead><tr><th>그룹 함수<\/th><th>만드는 결과<\/th><\/tr><\/thead><tbody><tr><td><code>ROLLUP(A, B)<\/code><\/td><td>(A, B), (A), 전체<\/td><\/tr><tr><td><code>CUBE(A, B)<\/code><\/td><td>(A, B), (A), (B), 전체<\/td><\/tr><tr><td><code>GROUPING SETS(A, B)<\/code><\/td><td>(A), (B)<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tw\"><table><thead><tr><th>절차형 SQL<\/th><th>특징<\/th><\/tr><\/thead><tbody><tr><td>프로시저<\/td><td><code>CALL<\/code>/<code>EXECUTE<\/code>로 실행, 반환값이 없어도 됨<\/td><\/tr><tr><td>사용자 정의 함수<\/td><td>반드시 값을 RETURN, SQL 안에서 호출<\/td><\/tr><tr><td>트리거<\/td><td>이벤트가 생기면 자동 실행, 직접 호출하지 않음<\/td><\/tr><\/tbody><\/table><\/div>","qs":[{"s":"<p>다음 SQL의 결과에서 '다'의 순위 값 세 개를 쉼표로 구분해 적으시오.<\/p><div class=\"dbs\"><figure class=\"dbt\"><figcaption>[점수]<\/figcaption><div class=\"tw\"><table><thead><tr><th>이름<\/th><th>값<\/th><\/tr><\/thead><tbody><tr><td>가<\/td><td>90<\/td><\/tr><tr><td>나<\/td><td>90<\/td><\/tr><tr><td>다<\/td><td>80<\/td><\/tr><\/tbody><\/table><\/div><\/figure><\/div><pre class=\"code\" data-lang=\"sql\"><code><span class=\"tk\">SELECT<\/span> r, d, n <span class=\"tk\">FROM<\/span> (<span class=\"tk\">SELECT<\/span> 이름, <span class=\"tk\">RANK<\/span>() <span class=\"tk\">OVER<\/span> (<span class=\"tk\">ORDER<\/span> <span class=\"tk\">BY<\/span> 값 <span class=\"tk\">DESC<\/span>) r, <span class=\"tk\">DENSE_RANK<\/span>() <span class=\"tk\">OVER<\/span> (<span class=\"tk\">ORDER<\/span> <span class=\"tk\">BY<\/span> 값 <span class=\"tk\">DESC<\/span>) d, <span class=\"tk\">ROW_NUMBER<\/span>() <span class=\"tk\">OVER<\/span> (<span class=\"tk\">ORDER<\/span> <span class=\"tk\">BY<\/span> 값 <span class=\"tk\">DESC<\/span>) n <span class=\"tk\">FROM<\/span> 점수) <span class=\"tk\">WHERE<\/span> 이름 = <span class=\"ts\">'다'<\/span>;<\/code><\/pre>","a":"<p>3, 2, 3<\/p>","e":"<p>RANK는 공동 1위 2명을 건너뛰어 3, DENSE_RANK는 이어서 2, ROW_NUMBER는 세 번째 행이라 3이다.<\/p>"},{"s":"<p>다음 SQL의 실행 결과를 적으시오. 열은 쉼표, 행은 / 로 구분한다.<\/p><div class=\"dbs\"><figure class=\"dbt\"><figcaption>[매출]<\/figcaption><div class=\"tw\"><table><thead><tr><th>지점<\/th><th>금액<\/th><\/tr><\/thead><tbody><tr><td>A<\/td><td>10<\/td><\/tr><tr><td>A<\/td><td>30<\/td><\/tr><tr><td>B<\/td><td>20<\/td><\/tr><\/tbody><\/table><\/div><\/figure><\/div><pre class=\"code\" data-lang=\"sql\"><code><span class=\"tk\">SELECT<\/span> 금액, <span class=\"tk\">SUM<\/span>(금액) <span class=\"tk\">OVER<\/span> (<span class=\"tk\">PARTITION<\/span> <span class=\"tk\">BY<\/span> 지점) <span class=\"tk\">FROM<\/span> 매출 <span class=\"tk\">ORDER<\/span> <span class=\"tk\">BY<\/span> 금액;<\/code><\/pre>","a":"<p>10, 40 / 20, 20 / 30, 40<\/p>","e":"<p>행 수는 그대로이고 각 행에 지점별 합계가 붙는다. A는 40, B는 20이다.<\/p>"},{"s":"<p>다음 SQL의 실행 결과를 적으시오. 열은 쉼표, 행은 / 로 구분한다.<\/p><div class=\"dbs\"><figure class=\"dbt\"><figcaption>[입금]<\/figcaption><div class=\"tw\"><table><thead><tr><th>일자<\/th><th>금액<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>5<\/td><\/tr><tr><td>2<\/td><td>7<\/td><\/tr><tr><td>3<\/td><td>3<\/td><\/tr><\/tbody><\/table><\/div><\/figure><\/div><pre class=\"code\" data-lang=\"sql\"><code><span class=\"tk\">SELECT<\/span> 일자, <span class=\"tk\">SUM<\/span>(금액) <span class=\"tk\">OVER<\/span> (<span class=\"tk\">ORDER<\/span> <span class=\"tk\">BY<\/span> 일자) <span class=\"tk\">FROM<\/span> 입금 <span class=\"tk\">ORDER<\/span> <span class=\"tk\">BY<\/span> 일자;<\/code><\/pre>","a":"<p>1, 5 / 2, 12 / 3, 15<\/p>","e":"<p>OVER 안에 ORDER BY가 있으면 현재 행까지의 누적합을 계산한다.<\/p>"},{"s":"<p>[판매] 테이블의 (지점, 상품) 조합이 서울-A, 서울-B, 부산-A의 3가지일 때, <code>GROUP BY ROLLUP(지점, 상품)<\/code>의 결과 행 수를 적으시오.<\/p>","a":"<p>6<\/p>","e":"<p>(지점, 상품) 3행, 지점별 소계 2행(서울, 부산), 전체 합계 1행이므로 6행이다.<\/p>"},{"s":"<p>다음 설명에 해당하는 절차형 SQL 객체를 [보기]에서 고르시오.<\/p><p>① 특정 테이블에 INSERT, UPDATE, DELETE가 발생하면 자동으로 실행된다.<br>② 값을 반드시 RETURN하며 SQL 문 안에서 호출할 수 있다.<br>③ 호출해서 실행하며 여러 작업을 묶어 처리하고 반환값이 없어도 된다.<\/p><p>[보기] 프로시저, 사용자 정의 함수, 트리거<\/p>","a":"<p>① 트리거  ② 사용자 정의 함수  ③ 프로시저<\/p>","e":"<p>호출 없이 이벤트로 도는 것이 트리거, RETURN이 필수인 것이 함수다.<\/p>"}]},{"id":"rel-algebra","title":"관계대수와 관계해석","freq":"2020년 이후 7개, 기호 쓰기와 결과 구하기가 반복","concept":"<p>관계대수는 결과를 얻는 <strong>절차<\/strong>, 관계해석은 원하는 결과의 <strong>조건<\/strong>을 기술한다.<\/p><div class=\"tw\"><table><thead><tr><th>연산<\/th><th>기호<\/th><th>뜻<\/th><\/tr><\/thead><tbody><tr><td>Select<\/td><td>σ<\/td><td>조건에 맞는 행 선택<\/td><\/tr><tr><td>Project<\/td><td>π<\/td><td>열 선택, 중복 제거<\/td><\/tr><tr><td>Join<\/td><td>⋈<\/td><td>공통 속성으로 결합<\/td><\/tr><tr><td>Division<\/td><td>÷<\/td><td>S의 값을 모두 가진 R의 행<\/td><\/tr><tr><td>합집합 / 교집합 / 차집합<\/td><td>∪ / ∩ / −<\/td><td>구조가 같은 두 릴레이션<\/td><\/tr><tr><td>카티션 곱<\/td><td>×<\/td><td>모든 조합<\/td><\/tr><\/tbody><\/table><\/div><ul><li>R × S의 차수(열 수)는 <strong>합<\/strong>, 카디널리티(행 수)는 <strong>곱<\/strong>이다.<\/li><li>조인 종류: 세타 조인(임의 비교), 동등 조인(<code>=<\/code>), 자연 조인(동등 조인에서 중복 열 제거).<\/li><li>관계해석 기호: ∀ 모든 것, ∃ 존재, ∧ AND, ∨ OR, ¬ NOT.<\/li><\/ul>","qs":[{"s":"<p>다음 설명에 해당하는 관계대수 기호를 적으시오.<\/p><p>① 릴레이션에서 조건을 만족하는 튜플을 고른다.<br>② 릴레이션에서 지정한 속성만 뽑고 중복을 없앤다.<br>③ S의 모든 값과 관련 있는 R의 튜플을 구한다.<\/p>","a":"<p>① σ  ② π  ③ ÷<\/p>","e":"<p>Select는 시그마(σ), Project는 파이(π), Division은 ÷이다.<\/p>"},{"s":"<p>[직원] 릴레이션이 (이름, 직급) = (A, 과장), (B, 대리), (C, 과장)일 때 다음 식의 결과 튜플 수를 적으시오.<\/p><p><code>π 직급 (직원)<\/code><\/p>","a":"<p>2<\/p>","e":"<p>Project는 중복을 제거하므로 과장, 대리 2개다.<\/p>"},{"s":"<p>R과 S가 다음과 같을 때 <code>R ÷ S<\/code>의 결과를 적으시오.<\/p><div class=\"tw\"><table><thead><tr><th>R.사람<\/th><th>R.언어<\/th><\/tr><\/thead><tbody><tr><td>가<\/td><td>C<\/td><\/tr><tr><td>가<\/td><td>Java<\/td><\/tr><tr><td>나<\/td><td>C<\/td><\/tr><tr><td>다<\/td><td>C<\/td><\/tr><tr><td>다<\/td><td>Java<\/td><\/tr><tr><td>다<\/td><td>SQL<\/td><\/tr><\/tbody><\/table><\/div><p>S.언어 = {C, Java}<\/p>","a":"<p>가, 다<\/p>","e":"<p>C와 Java를 모두 가진 사람은 가와 다이다. 나는 Java가 없다.<\/p>"},{"s":"<p>R의 차수가 3이고 카디널리티가 4, S의 차수가 2이고 카디널리티가 5일 때, R × S의 차수와 카디널리티를 적으시오.<\/p>","a":"<p>차수 5, 카디널리티 20<\/p>","e":"<p>카티션 곱은 차수를 더하고 카디널리티를 곱한다.<\/p>"},{"s":"<p>빈칸에 알맞은 조인의 이름을 적으시오.<\/p><p>( ① ): 일치 조건에 <code>=<\/code>를 쓰는 조인으로 조인 속성이 결과에 두 번 나타난다.<br>( ② ): ①의 결과에서 중복된 속성을 제거한 조인이다.<br>( ③ ): <code>=<\/code>, <code>&lt;<\/code>, <code>&gt;<\/code> 등 임의의 비교 연산자를 조건으로 쓰는 조인이다.<\/p>","a":"<p>① 동등 조인  ② 자연 조인  ③ 세타 조인<\/p>","e":"<p>동등 조인에서 중복 열을 없앤 것이 자연 조인이고, 세타 조인은 가장 넓은 개념이다.<\/p>"}]},{"id":"normalize","title":"정규화와 이상 현상","freq":"정규형 판정, 이상 3종, 반정규화 9개","concept":"<div class=\"tw\"><table><thead><tr><th>단계<\/th><th>제거하는 것<\/th><th>외우는 말<\/th><\/tr><\/thead><tbody><tr><td>1NF<\/td><td>반복 값, 다중 값 (도메인이 원자값)<\/td><td>원<\/td><\/tr><tr><td>2NF<\/td><td>부분 함수 종속<\/td><td>부<\/td><\/tr><tr><td>3NF<\/td><td>이행 함수 종속<\/td><td>이<\/td><\/tr><tr><td>BCNF<\/td><td>결정자이면서 후보키가 아닌 것<\/td><td>결<\/td><\/tr><tr><td>4NF<\/td><td>다치 종속<\/td><td>다<\/td><\/tr><tr><td>5NF<\/td><td>조인 종속<\/td><td>조<\/td><\/tr><\/tbody><\/table><\/div><ul><li><strong>부분 함수 종속:<\/strong> 복합키의 일부만으로 다른 속성이 결정된다.<\/li><li><strong>이행 함수 종속:<\/strong> A → B, B → C이므로 A → C가 성립한다.<\/li><\/ul><div class=\"tw\"><table><thead><tr><th>이상<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>삽입 이상<\/td><td>원치 않는 값도 함께 넣어야 저장할 수 있음<\/td><\/tr><tr><td>삭제 이상<\/td><td>지우면 필요한 다른 정보까지 함께 사라짐<\/td><\/tr><tr><td>갱신 이상<\/td><td>일부만 수정되어 데이터가 불일치<\/td><\/tr><\/tbody><\/table><\/div><p><strong>반정규화<\/strong>는 성능과 단순성을 위해 정규화된 구조를 의도적으로 통합, 분할, 중복하는 기법이다.<\/p>","qs":[{"s":"<p>다음 설명에 해당하는 이상 현상을 적으시오.<\/p><p>① 어떤 학생 한 명을 지웠더니 그 학생만 듣던 과목의 정보까지 사라졌다.<br>② 교수의 연락처를 일부 행에서만 고쳐 같은 교수의 연락처가 서로 달라졌다.<br>③ 아직 수강생이 없는 과목은 학번이 없어 등록할 수 없다.<\/p>","a":"<p>① 삭제 이상  ② 갱신 이상  ③ 삽입 이상<\/p>","e":"<p>각각 삭제, 수정, 등록 시 발생하는 문제다.<\/p>"},{"s":"<p>[수강](학번, 과목코드, 성적, 과목명)의 기본키는 (학번, 과목코드)이고 과목코드 → 과목명이 성립한다. 이 종속을 제거하는 정규화 단계의 이름을 적으시오.<\/p>","a":"<p>제2정규형 (2NF)<\/p>","e":"<p>기본키의 일부인 과목코드가 과목명을 결정하므로 부분 함수 종속이다.<\/p>"},{"s":"<p>[사원](사번, 부서코드, 부서명)에서 사번이 기본키이고, 사번 → 부서코드, 부서코드 → 부서명이 성립한다. 이 릴레이션의 문제가 되는 종속의 이름과, 이를 제거하는 정규화 단계의 이름을 적으시오.<\/p>","a":"<p>이행 함수 종속, 제3정규형 (3NF)<\/p>","e":"<p>사번 → 부서코드 → 부서명으로 이어지는 이행 종속이다. 사원과 부서로 분해한다.<\/p>"},{"s":"<p>정규화 단계를 순서대로 적은 것이다. 빈칸에 알맞은 정규형을 적으시오.<\/p><p>1NF → 2NF → 3NF → ( ① ) → 4NF → 5NF<\/p><p>또한 ①에서 제거하는 대상을 쓰시오.<\/p>","a":"<p>① BCNF, 결정자이면서 후보키가 아닌 것을 제거<\/p>","e":"<p>모든 결정자가 후보키가 되도록 만드는 단계다.<\/p>"},{"s":"<p>다음 설명에 해당하는 용어를 적으시오.<\/p><p>정규화된 엔티티, 속성, 관계에 대해 시스템의 성능 향상과 개발 및 운영의 단순화를 위해 통합, 분할, 중복 등을 수행하는 데이터 모델링 기법이다.<\/p>","a":"<p>반정규화 (비정규화, 역정규화, De-normalization)<\/p>","e":"<p>성능을 위해 정규화를 일부 되돌리는 기법이다.<\/p>"}]},{"id":"normalize-hard","title":"함수 종속으로 후보키·정규형 판정","freq":"2024년 1회, 2026년 2회에 판정형 출제","concept":"<p><strong>판정 순서<\/strong><\/p><ol><li>어떤 속성으로 전체를 결정할 수 있는지 따져 <strong>후보키<\/strong>를 모두 찾는다. 함수 종속의 오른쪽에 한 번도 나오지 않는 속성은 반드시 후보키에 포함된다.<\/li><li>후보키에 포함된 속성을 <strong>주속성<\/strong>으로 표시한다.<\/li><li>아래 조건을 낮은 정규형부터 검사한다.<\/li><\/ol><div class=\"tw\"><table><thead><tr><th>위반<\/th><th>조건<\/th><th>만족하는 최고 단계<\/th><\/tr><\/thead><tbody><tr><td>부분 종속<\/td><td>후보키의 일부 → 주속성이 아닌 속성<\/td><td>1NF<\/td><\/tr><tr><td>이행 종속<\/td><td>슈퍼키가 아닌 X → 주속성이 아닌 속성<\/td><td>2NF<\/td><\/tr><tr><td>결정자 위반<\/td><td>슈퍼키가 아닌 X → 주속성<\/td><td>3NF<\/td><\/tr><tr><td>위반 없음<\/td><td>모든 결정자가 슈퍼키 (수험서 표현: 후보키)<\/td><td>BCNF<\/td><\/tr><\/tbody><\/table><\/div><p><strong>속성 폐포:<\/strong> X에서 출발해 함수 종속을 반복 적용해 결정되는 속성을 모두 모은다. 폐포가 전체 속성이면 X는 슈퍼키다.<\/p><p>표에서 판단할 때는 같은 X 값에 Y 값이 항상 하나인지 확인한다.<\/p>","qs":[{"s":"<p>R(A, B, C, D)에서 A → B, B → C, A → D가 성립한다. 후보키와 R이 만족하는 가장 높은 정규형을 적으시오.<\/p>","a":"<p>후보키 A, 2NF<\/p>","e":"<p>부분 종속은 없지만 A → B → C의 이행 종속이 있어 3NF가 아니다.<\/p>"},{"s":"<p>R(A, B, C, D)에서 AB → C, B → D가 성립한다. 후보키와 R이 만족하는 가장 높은 정규형을 적으시오.<\/p>","a":"<p>후보키 AB, 1NF<\/p>","e":"<p>후보키의 일부인 B가 주속성이 아닌 D를 결정하므로 부분 종속이다.<\/p>"},{"s":"<p>R(A, B, C)에서 AB → C, C → B가 성립한다. 후보키를 모두 적고 R이 만족하는 가장 높은 정규형을 적으시오.<\/p>","a":"<p>후보키 AB, AC, 3NF<\/p>","e":"<p>C는 슈퍼키가 아닌 결정자이므로 BCNF가 아니다. 다만 C → B의 B가 주속성이므로 3NF는 만족한다.<\/p>"},{"s":"<p>[수강](학번, 과목, 교수, 성적)에서 (학번, 과목) → 교수, 성적이고, 교수 → 과목이다. 교수는 한 과목만 담당한다. 후보키를 모두 적고 가장 높은 정규형을 적으시오.<\/p>","a":"<p>후보키 (학번, 과목), (학번, 교수), 3NF<\/p>","e":"<p>결정자 교수가 슈퍼키가 아니어서 BCNF가 아니다. 과목은 주속성이므로 3NF는 만족한다. 분해하면 BCNF가 된다.<\/p>"},{"s":"<p>R(A, B, C)에서 A → B, B → A, A → C가 성립한다. 후보키를 모두 적고 가장 높은 정규형을 적으시오.<\/p>","a":"<p>후보키 A, B, BCNF<\/p>","e":"<p>결정자 A와 B가 모두 후보키다.<\/p>"}]},{"id":"db-terms","title":"키·무결성·스키마·E-R","freq":"DB 용어 문제가 매 시험 꾸준히 출제","concept":"<div class=\"tw\"><table><thead><tr><th>용어<\/th><th>뜻<\/th><\/tr><\/thead><tbody><tr><td>튜플 / 속성<\/td><td>행 / 열<\/td><\/tr><tr><td>차수 (Degree)<\/td><td>속성의 수<\/td><\/tr><tr><td>카디널리티 (Cardinality)<\/td><td>튜플의 수<\/td><\/tr><tr><td>도메인<\/td><td>속성이 가질 수 있는 값의 범위<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tw\"><table><thead><tr><th>키<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td>슈퍼키<\/td><td>유일성을 만족하는 속성 집합<\/td><\/tr><tr><td>후보키<\/td><td>유일성과 최소성을 모두 만족<\/td><\/tr><tr><td>기본키<\/td><td>후보키 중 선택, NULL 불가<\/td><\/tr><tr><td>대체키<\/td><td>기본키가 아닌 후보키<\/td><\/tr><tr><td>외래키<\/td><td>다른 릴레이션의 기본키 참조<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tw\"><table><thead><tr><th>무결성<\/th><th>규칙<\/th><\/tr><\/thead><tbody><tr><td>개체 무결성<\/td><td>기본키는 NULL이나 중복 불가<\/td><\/tr><tr><td>참조 무결성<\/td><td>외래키는 참조 값이거나 NULL<\/td><\/tr><tr><td>도메인 무결성<\/td><td>값은 정의된 도메인 안에 있어야 함<\/td><\/tr><\/tbody><\/table><\/div><ul><li><strong>스키마 3단계:<\/strong> 외부(사용자 관점), 개념(전체 논리 구조), 내부(물리 저장 구조).<\/li><li><strong>E-R 기호:<\/strong> 사각형은 개체, 마름모는 관계, 타원은 속성, 밑줄은 기본키.<\/li><li><strong>데이터 모델 구성요소:<\/strong> 구조, 연산, 제약조건.<\/li><li><strong>데이터베이스 설계 순서:<\/strong> 요구 분석 → 개념적 설계 → 논리적 설계 → 물리적 설계 → 구현.<\/li><\/ul>","qs":[{"s":"<p>행 6개, 열 4개로 된 릴레이션의 차수(Degree)와 카디널리티(Cardinality)를 각각 적으시오.<\/p>","a":"<p>차수 4, 카디널리티 6<\/p>","e":"<p>차수는 열의 수, 카디널리티는 행의 수다.<\/p>"},{"s":"<p>후보키가 만족해야 하는 두 가지 성질을 적으시오.<\/p>","a":"<p>유일성, 최소성<\/p>","e":"<p>모든 행을 구별해야 하고, 속성을 하나라도 빼면 구별할 수 없어야 한다.<\/p>"},{"s":"<p>다음 위반 사례에 해당하는 무결성을 적으시오.<\/p><p>① 기본키인 학번에 NULL을 넣었다.<br>② [수강]의 학번에 [학생]에 없는 값을 넣었다.<br>③ 성별 속성에 정의되지 않은 값 'X'를 넣었다.<\/p>","a":"<p>① 개체 무결성  ② 참조 무결성  ③ 도메인 무결성<\/p>","e":"<p>기본키, 외래키, 값의 범위 규칙을 각각 어긴 경우다.<\/p>"},{"s":"<p>다음 설명에 해당하는 스키마를 적으시오.<\/p><p>① 조직 전체의 관점에서 데이터베이스의 논리적 구조를 정의한다.<br>② 데이터가 저장 장치에 실제로 저장되는 방식을 정의한다.<br>③ 사용자나 응용 프로그래머가 각자 보는 관점의 구조를 정의한다.<\/p>","a":"<p>① 개념 스키마  ② 내부 스키마  ③ 외부 스키마<\/p>","e":"<p>외부는 사용자, 개념은 전체 논리, 내부는 물리 구조다.<\/p>"},{"s":"<p>E-R 다이어그램의 다음 기호가 나타내는 것을 적으시오.<\/p><p>① 사각형  ② 마름모  ③ 타원<\/p>","a":"<p>① 개체  ② 관계  ③ 속성<\/p>","e":"<p>개체를 사각형, 개체 사이의 관계를 마름모, 개체의 속성을 타원으로 나타낸다.<\/p>"}]},{"id":"db-physical","title":"뷰·인덱스·파티셔닝·데이터 전환","freq":"데이터 입출력 구현 항목","concept":"<div class=\"tw\"><table><thead><tr><th>대상<\/th><th>특징<\/th><\/tr><\/thead><tbody><tr><td>뷰<\/td><td>가상 테이블. 보안과 단순화에 유리. 인덱스를 만들 수 없고 정의 변경은 삭제 후 재생성<\/td><\/tr><tr><td>인덱스<\/td><td>조회는 빠르지만 쓰기 비용과 저장 공간이 늘어남<\/td><\/tr><tr><td>클러스터드 인덱스<\/td><td>데이터를 키 순서로 물리 정렬, 테이블당 1개<\/td><\/tr><tr><td>시스템 카탈로그<\/td><td>DBMS가 관리하는 메타데이터. 사용자가 직접 수정 불가<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tw\"><table><thead><tr><th>파티셔닝<\/th><th>기준<\/th><\/tr><\/thead><tbody><tr><td>범위 (Range)<\/td><td>날짜처럼 연속된 값의 구간<\/td><\/tr><tr><td>목록 (List)<\/td><td>지정한 값의 목록<\/td><\/tr><tr><td>해시 (Hash)<\/td><td>해시 함수 결과로 균등 분산<\/td><\/tr><tr><td>조합 (Composite)<\/td><td>위 방식의 혼합<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tw\"><table><thead><tr><th>용어<\/th><th>뜻<\/th><\/tr><\/thead><tbody><tr><td>CRUD 분석<\/td><td>프로세스와 테이블의 생성, 읽기, 수정, 삭제를 행렬로 분석<\/td><\/tr><tr><td>ETL<\/td><td>추출, 변환, 적재<\/td><\/tr><tr><td>데이터 마이닝<\/td><td>대량 데이터에서 규칙과 패턴을 발견<\/td><\/tr><tr><td>OLAP<\/td><td>다차원 데이터를 대화식으로 분석 (Roll-up, Drill-down, Slice, Dice)<\/td><\/tr><tr><td>샤딩<\/td><td>데이터를 여러 서버에 수평 분할<\/td><\/tr><\/tbody><\/table><\/div>","qs":[{"s":"<p>다음 설명에 해당하는 데이터베이스 객체를 적으시오.<\/p><p>하나 이상의 기본 테이블에서 유도된 가상 테이블로, 물리적으로 저장되지 않으며 사용자에게 필요한 데이터만 보여 주어 보안에 유리하다.<\/p>","a":"<p>뷰 (View)<\/p>","e":"<p>저장된 정의를 실행해 보여 주는 가상 테이블이다.<\/p>"},{"s":"<p>다음 설명에 해당하는 파티셔닝 방식을 적으시오.<\/p><p>① 월별, 연도별처럼 연속된 값의 구간으로 나눈다.<br>② 해시 함수 값에 따라 데이터를 균등하게 분산한다.<br>③ '서울', '부산'처럼 지정한 값의 목록으로 나눈다.<\/p>","a":"<p>① 범위 분할 (Range)  ② 해시 분할 (Hash)  ③ 목록 분할 (List)<\/p>","e":"<p>구간은 Range, 함수는 Hash, 나열은 List다.<\/p>"},{"s":"<p>데이터베이스에서 메타데이터를 저장하고 DBMS가 스스로 관리하며, 사용자가 직접 수정할 수 없는 테이블의 집합을 무엇이라 하는지 적으시오.<\/p>","a":"<p>시스템 카탈로그 (데이터 사전, System Catalog)<\/p>","e":"<p>데이터 사전이라고도 하며, DBMS가 DDL 실행 결과로 갱신한다.<\/p>"},{"s":"<p>다음 괄호에 공통으로 들어갈 영문 약어를 적으시오.<\/p><p>여러 원천 시스템에서 데이터를 추출하고, 형식을 변환해 데이터 웨어하우스에 적재하는 과정을 ( )라고 한다.<\/p>","a":"<p>ETL<\/p>","e":"<p>Extraction, Transformation, Loading의 약자다.<\/p>"},{"s":"<p>프로세스와 테이블 사이에서 데이터의 생성, 읽기, 수정, 삭제 여부를 행렬로 표현해 누락과 중복을 검증하는 분석 방법을 적으시오.<\/p>","a":"<p>CRUD 분석<\/p>","e":"<p>Create, Read, Update, Delete의 앞 글자다.<\/p>"}]},{"id":"transaction","title":"트랜잭션·회복·병행 제어","freq":"ACID, Redo/Undo, 로킹이 반복 출제","concept":"<div class=\"tw\"><table><thead><tr><th>ACID<\/th><th>뜻<\/th><\/tr><\/thead><tbody><tr><td>원자성 (Atomicity)<\/td><td>전부 반영되거나 전혀 반영되지 않음<\/td><\/tr><tr><td>일관성 (Consistency)<\/td><td>수행 전후 일관된 상태 유지<\/td><\/tr><tr><td>격리성·독립성 (Isolation)<\/td><td>수행 중 다른 트랜잭션이 끼어들지 못함<\/td><\/tr><tr><td>영속성·지속성 (Durability)<\/td><td>완료된 결과는 영구 반영<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tw\"><table><thead><tr><th>TCL<\/th><th>동작<\/th><\/tr><\/thead><tbody><tr><td><code>COMMIT<\/code><\/td><td>변경을 확정<\/td><\/tr><tr><td><code>ROLLBACK<\/code><\/td><td>변경을 취소<\/td><\/tr><tr><td><code>SAVEPOINT<\/code><\/td><td>되돌아갈 지점 표시<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tw\"><table><thead><tr><th>회복 기법<\/th><th>특징<\/th><\/tr><\/thead><tbody><tr><td>지연 갱신<\/td><td>COMMIT 전에는 DB에 쓰지 않음. Redo만 필요<\/td><\/tr><tr><td>즉시 갱신<\/td><td>수행 중 바로 DB에 씀. Redo와 Undo 필요<\/td><\/tr><tr><td>검사점<\/td><td>체크포인트 이후만 회복<\/td><\/tr><tr><td>그림자 페이징<\/td><td>로그 없이 복사본 페이지로 복구<\/td><\/tr><\/tbody><\/table><\/div><ul><li><strong>Redo<\/strong>는 완료된 작업을 재실행, <strong>Undo<\/strong>는 미완료 작업을 취소한다.<\/li><li>병행 제어 기법: 로킹, 타임스탬프 순서, 낙관적 검증, 다중 버전.<\/li><li>로킹 단위가 <strong>크면<\/strong> 관리가 쉽지만 병행성이 낮고, <strong>작으면<\/strong> 병행성이 높지만 오버헤드가 크다.<\/li><li>2단계 로킹(2PL)은 확장 단계와 축소 단계로 나뉜다.<\/li><\/ul>","qs":[{"s":"<p>다음 설명에 해당하는 트랜잭션의 특성을 적으시오.<\/p><p>① 계좌 이체 도중 오류가 나면 출금과 입금이 모두 취소된다.<br>② 완료된 결과는 시스템에 장애가 나도 사라지지 않는다.<br>③ 실행 중인 트랜잭션의 중간 결과를 다른 트랜잭션이 볼 수 없다.<\/p>","a":"<p>① 원자성  ② 영속성 (지속성)  ③ 격리성 (독립성)<\/p>","e":"<p>전부 또는 전무는 원자성, 영구 반영은 영속성, 간섭 차단은 격리성이다.<\/p>"},{"s":"<p>데이터베이스 회복에서 다음 설명에 해당하는 연산을 영문으로 적으시오.<\/p><p>① 로그를 이용해 완료된 트랜잭션의 변경을 다시 수행한다.<br>② 로그를 이용해 완료되지 않은 트랜잭션의 변경을 취소한다.<\/p>","a":"<p>① Redo  ② Undo<\/p>","e":"<p>Redo는 재수행, Undo는 취소다.<\/p>"},{"s":"<p>트랜잭션 수행 중 변경 내용을 바로 데이터베이스에 반영하고, 장애가 나면 로그를 이용해 Redo와 Undo를 모두 수행할 수 있는 회복 기법을 적으시오.<\/p>","a":"<p>즉시 갱신 회복 기법 (Immediate Update)<\/p>","e":"<p>COMMIT 전에도 DB에 쓰기 때문에 Undo까지 필요하다.<\/p>"},{"s":"<p>병행 제어 기법 중 하나다. 빈칸에 들어갈 용어를 적으시오.<\/p><p>( )은 트랜잭션이 사용할 자원에 잠금을 걸어 상호 배제하는 기법이다. 단위가 커지면 구현이 쉽지만 병행성은 낮아지고, 단위가 작아지면 병행성은 높아지지만 관리가 복잡해진다.<\/p>","a":"<p>로킹 (Locking)<\/p>","e":"<p>잠금 단위의 크기와 병행성은 반비례 관계다.<\/p>"},{"s":"<p>다음 SQL을 순서대로 실행한 뒤 마지막 SELECT의 결과를 적으시오.<\/p><div class=\"dbs\"><figure class=\"dbt\"><figcaption>[T]<\/figcaption><div class=\"tw\"><table><thead><tr><th>v<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><\/tr><\/tbody><\/table><\/div><\/figure><\/div><pre class=\"code\" data-lang=\"sql\"><code><span class=\"tk\">BEGIN<\/span>;\n<span class=\"tk\">UPDATE<\/span> T <span class=\"tk\">SET<\/span> v = 2;\n<span class=\"tk\">SAVEPOINT<\/span> s;\n<span class=\"tk\">UPDATE<\/span> T <span class=\"tk\">SET<\/span> v = 3;\n<span class=\"tk\">ROLLBACK<\/span> <span class=\"tk\">TO<\/span> s;\n<span class=\"tk\">COMMIT<\/span>;\n<span class=\"tk\">SELECT<\/span> v <span class=\"tk\">FROM<\/span> T;<\/code><\/pre>","a":"<p>2<\/p>","e":"<p>SAVEPOINT s 이후의 변경인 v = 3만 취소되고 v = 2가 확정된다.<\/p>"}]}]},{"title":"소프트웨어 공학","types":[{"id":"test-blackbox","title":"블랙박스 테스트 기법","freq":"테스트 전체 32개 중 경계값·동등 분할이 반복","concept":"<p>블랙박스 테스트는 내부 코드를 보지 않고 <strong>명세만으로<\/strong> 입력과 출력을 검증한다.<\/p><div class=\"tw\"><table><thead><tr><th>기법<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>동등 분할 (동치 분할, Equivalence Partitioning)<\/td><td>입력을 유효·무효 구간으로 나눠 구간마다 대표값 사용<\/td><\/tr><tr><td>경계값 분석 (Boundary Value Analysis)<\/td><td>구간의 경계와 바로 바깥 값 사용<\/td><\/tr><tr><td>원인-결과 그래프<\/td><td>입력(원인)과 출력(결과)의 논리 관계를 그래프로 분석<\/td><\/tr><tr><td>결정 테이블<\/td><td>조건 조합별 동작을 표로 정리<\/td><\/tr><tr><td>상태 전이<\/td><td>상태와 이벤트에 따른 전이 검증<\/td><\/tr><tr><td>페어와이즈<\/td><td>모든 값의 쌍이 한 번 이상 나오게 조합<\/td><\/tr><tr><td>오류 예측<\/td><td>경험을 바탕으로 오류가 날 만한 값 사용<\/td><\/tr><tr><td>비교 검사<\/td><td>여러 버전에 같은 입력을 넣어 결과 비교<\/td><\/tr><\/tbody><\/table><\/div><ul><li><code>0 ≤ x ≤ 100<\/code>의 경계값은 <strong>-1, 0, 100, 101<\/strong>이다.<\/li><li>조건이 참·거짓인 항목 n개면 결정 테이블의 전체 규칙 수는 2^n이다.<\/li><\/ul>","qs":[{"s":"<p>입력 x의 유효 범위가 <code>0 ≤ x ≤ 100<\/code>이다. 경계값 분석으로 테스트할 입력값 네 개를 적으시오.<\/p>","a":"<p>-1, 0, 100, 101<\/p>","e":"<p>유효 범위의 양 끝값과 그 바로 바깥 값을 쓴다.<\/p>"},{"s":"<p>점수가 0~59이면 불합격, 60~100이면 합격이고 그 외는 오류인 프로그램이 있다. 동등 분할로 구간마다 대표값을 하나씩 쓸 때 최소 테스트 케이스 수를 적으시오.<\/p>","a":"<p>4<\/p>","e":"<p>0 미만, 0~59, 60~100, 100 초과의 네 구간이다.<\/p>"},{"s":"<p>다음 설명에 해당하는 테스트 기법을 적으시오.<\/p><p>입력 데이터 간의 관계와 출력에 영향을 미치는 상황을 체계적으로 분석해, 효용성이 높은 테스트 케이스를 선정하는 기법으로 그래프를 활용한다.<\/p>","a":"<p>원인-결과 그래프 (Cause-Effect Graph)<\/p>","e":"<p>입력을 원인, 출력을 결과로 보고 논리 관계를 그래프로 그린다.<\/p>"},{"s":"<p>[보기]의 테스트 기법을 블랙박스와 화이트박스로 나누어 적으시오.<\/p><p>[보기] 동등 분할, 조건 커버리지, 경계값 분석, 기본 경로 검사, 상태 전이, 루프 검사<\/p>","a":"<p>블랙박스: 동등 분할, 경계값 분석, 상태 전이<br>화이트박스: 조건 커버리지, 기본 경로 검사, 루프 검사<\/p>","e":"<p>명세 기반이면 블랙박스, 코드 구조 기반이면 화이트박스다.<\/p>"},{"s":"<p>참·거짓 조건이 3개인 기능을 결정 테이블로 정리한다. 전체 규칙의 수를 적으시오.<\/p>","a":"<p>8<\/p>","e":"<p>각 조건이 2가지 값을 가지므로 2 × 2 × 2 = 8이다.<\/p>"}]},{"id":"test-whitebox","title":"화이트박스·커버리지·제어 흐름","freq":"경로 쓰기와 커버리지 이름이 자주 출제","concept":"<p>화이트박스 테스트는 <strong>코드 구조<\/strong>를 기준으로 얼마나 실행했는지 측정한다.<\/p><div class=\"tw\"><table><thead><tr><th>커버리지<\/th><th>기준<\/th><\/tr><\/thead><tbody><tr><td>문장 (Statement)<\/td><td>모든 문장을 한 번 이상 실행<\/td><\/tr><tr><td>결정·분기 (Decision, Branch)<\/td><td>전체 조건식이 참·거짓을 각각 한 번 이상<\/td><\/tr><tr><td>조건 (Condition)<\/td><td>개별 조건이 참·거짓을 각각 한 번 이상<\/td><\/tr><tr><td>조건/결정<\/td><td>조건과 결정을 모두 만족<\/td><\/tr><tr><td>MC/DC<\/td><td>각 개별 조건이 전체 결과에 독립적으로 영향을 줌을 확인<\/td><\/tr><tr><td>다중 조건<\/td><td>개별 조건의 모든 조합 (n개면 2^n)<\/td><\/tr><\/tbody><\/table><\/div><p><strong>맥케이브 순환 복잡도:<\/strong> <code>V(G) = E − N + 2<\/code> (E는 간선, N은 노드), 또는 <code>조건문 수 + 1<\/code>.<\/p><p>경로를 쓸 때는 시작 노드부터 끝 노드까지 <strong>노드 번호를 빠짐없이<\/strong> 화살표로 잇는다. 반복문은 조건 노드로 돌아오는 간선을 포함한다.<\/p>","qs":[{"s":"<p>제어 흐름 그래프의 간선이 9개, 노드가 7개이다. 맥케이브 순환 복잡도를 적으시오.<\/p>","a":"<p>4<\/p>","e":"<p>V(G) = E − N + 2 = 9 − 7 + 2 = 4이다.<\/p>"},{"s":"<p>다음 설명에 해당하는 커버리지를 [보기]에서 고르시오.<\/p><p>① 조건식 전체의 결과가 참과 거짓을 각각 한 번 이상 갖게 한다.<br>② 각 개별 조건이 다른 조건과 무관하게 전체 결과에 독립적으로 영향을 주는지 확인한다.<br>③ 조건식 안의 개별 조건이 참과 거짓을 각각 한 번 이상 갖게 한다.<\/p><p>[보기] 문장, 결정, 조건, MC/DC, 다중 조건<\/p>","a":"<p>① 결정  ② MC/DC  ③ 조건<\/p>","e":"<p>전체 결과는 결정, 개별 조건은 조건, 독립적 영향은 MC/DC다.<\/p>"},{"s":"<p><code>if (A &amp;&amp; B &amp;&amp; C)<\/code>의 다중 조건 커버리지를 100% 만족하는 테스트 케이스 수를 적으시오.<\/p>","a":"<p>8<\/p>","e":"<p>개별 조건 3개의 모든 조합이므로 2의 3제곱이다.<\/p>"},{"s":"<p>다음 코드에서 문장 커버리지와 분기 커버리지를 각각 100% 만족하는 최소 테스트 케이스 수를 적으시오.<\/p><pre class=\"code\" data-lang=\"text\"><code>if (x &gt; 0) a();\nif (y &gt; 0) b();<\/code><\/pre>","a":"<p>문장 1개, 분기 2개<\/p>","e":"<p>x &gt; 0, y &gt; 0이면 모든 문장이 실행된다. 분기는 거짓 쪽도 지나야 하므로 (참, 참), (거짓, 거짓) 2개가 필요하다.<\/p>"},{"s":"<p>다음 순서도의 노드 번호를 이용해, 분기 커버리지를 만족하는 경로 2개를 적으시오.<\/p><pre class=\"code\" data-lang=\"text\"><code>① 입력\n② if (x &gt; 0) ─ 참 → ③ a = 1\n              거짓 → ④로 이동\n③ a = 1\n④ 출력<\/code><\/pre>","a":"<p>①→②→③→④, ①→②→④<\/p>","e":"<p>조건이 참인 경로와 거짓인 경로를 각각 한 번씩 지난다.<\/p>"}]},{"id":"test-flow-hard","title":"코드를 순서도로 옮기기·MC/DC 구성","freq":"2025년 1회 코드-순서도 빈칸, 2025년 2회 반복 경로","concept":"<p>코드를 노드로 바꾸는 규칙은 다음과 같다.<\/p><div class=\"tw\"><table><thead><tr><th>코드<\/th><th>노드<\/th><\/tr><\/thead><tbody><tr><td>변수 초기화, 대입<\/td><td>처리 노드<\/td><\/tr><tr><td><code>if<\/code>, <code>while<\/code>의 조건<\/td><td>판단 노드 (간선 2개)<\/td><\/tr><tr><td>반복문 끝<\/td><td>조건 노드로 돌아가는 간선<\/td><\/tr><tr><td><code>return<\/code><\/td><td>종료 노드<\/td><\/tr><\/tbody><\/table><\/div><ul><li>경로는 반복의 조건 노드를 <strong>다시 지나고 나서<\/strong> 종료로 간다.<\/li><li>문장 커버리지는 하나의 경로로 끝날 때가 많고, 분기 커버리지는 거짓 쪽도 지나야 한다.<\/li><\/ul><p><strong>MC/DC 구성:<\/strong> 조건이 n개면 보통 n + 1개의 케이스로 만족시킨다. 한 조건만 바꿨을 때 결과가 바뀌는 쌍이 조건마다 있어야 한다. <code>A &amp;&amp; B<\/code>는 (T, T), (T, F), (F, T)이다.<\/p><p>조건 커버리지를 만족해도 결정 커버리지를 만족하지 못할 수 있다. <code>A || B<\/code>에 (T, F), (F, T)를 쓰면 조건은 각각 참·거짓을 갖지만 결과는 계속 참이다.<\/p>","qs":[{"s":"<p>다음 함수를 순서도로 옮겼다. 노드 ②, ③, ④, ⑥에 들어갈 코드를 적으시오.<\/p><pre class=\"code\" data-lang=\"text\"><code>int cnt(int a[], int n) {\n    int i = 0, c = 0;\n    while (i &lt; n) {\n        if (a[i] &lt; 0) c++;\n        i++;\n    }\n    return c;\n}\n\n① i = 0, c = 0    → ②\n② 판단            참 → ③, 거짓 → ⑥\n③ 판단            참 → ④, 거짓 → ⑤\n④ 처리            → ⑤\n⑤ i++             → ②\n⑥ 종료<\/code><\/pre>","a":"<p>② i &lt; n  ③ a[i] &lt; 0  ④ c++  ⑥ return c<\/p>","e":"<p>while 조건이 ②, if 조건이 ③이다. c++는 if가 참일 때만 지난다.<\/p>"},{"s":"<p>앞 문제의 순서도에서 배열의 원소가 1개(n = 1)이고 그 값이 음수일 때 지나는 경로를 노드 번호로 적으시오.<\/p>","a":"<p>① → ② → ③ → ④ → ⑤ → ② → ⑥<\/p>","e":"<p>한 번 반복한 뒤 ②로 돌아가 조건이 거짓이 되어 끝난다. 이 경로는 모든 문장을 지나 문장 커버리지를 만족한다.<\/p>"},{"s":"<p>앞 문제의 순서도에서 간선 수, 노드 수, 맥케이브 순환 복잡도를 적으시오.<\/p>","a":"<p>간선 7, 노드 6, 복잡도 3<\/p>","e":"<p>간선은 ①②, ②③, ②⑥, ③④, ③⑤, ④⑤, ⑤②이다. 판단 노드 2개 + 1로도 3을 확인할 수 있다.<\/p>"},{"s":"<p><code>if (A &amp;&amp; B)<\/code>에 대해 MC/DC를 만족하는 최소 테스트 케이스의 수와 (A, B) 값을 적으시오.<\/p>","a":"<p>3개, (T, T), (T, F), (F, T)<\/p>","e":"<p>(T, T)와 (T, F)는 B의 영향을, (T, T)와 (F, T)는 A의 영향을 보여 준다.<\/p>"},{"s":"<p><code>if (A || B)<\/code>에 테스트 케이스 (A, B) = (T, F), (F, T)를 사용했다. 조건 커버리지와 결정 커버리지의 만족 여부를 각각 적으시오.<\/p>","a":"<p>조건 커버리지 만족, 결정 커버리지 불만족<\/p>","e":"<p>A와 B는 각각 참과 거짓을 가지지만, 전체 결과는 두 경우 모두 참이다.<\/p>"}]},{"id":"test-level","title":"테스트 레벨·오라클·테스트 원리","freq":"스텁·드라이버, 알파·베타, 오라클이 반복","concept":"<p><strong>V 모델 순서:<\/strong> 단위 → 통합 → 시스템 → 인수 테스트.<\/p><div class=\"tw\"><table><thead><tr><th>통합 방식<\/th><th>순서<\/th><th>임시 모듈<\/th><\/tr><\/thead><tbody><tr><td>하향식<\/td><td>상위 → 하위<\/td><td>스텁 (하위 대체)<\/td><\/tr><tr><td>상향식<\/td><td>하위 → 상위<\/td><td>드라이버 (상위 대체)<\/td><\/tr><tr><td>빅뱅<\/td><td>한 번에<\/td><td>없음<\/td><\/tr><tr><td>샌드위치<\/td><td>양쪽 혼합<\/td><td>둘 다<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tw\"><table><thead><tr><th>인수 테스트<\/th><th>환경<\/th><\/tr><\/thead><tbody><tr><td>알파<\/td><td>개발자 환경, 개발자 앞에서 사용자가 수행<\/td><\/tr><tr><td>베타<\/td><td>사용자 환경, 개발자 없이 수행<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tw\"><table><thead><tr><th>오라클<\/th><th>특징<\/th><\/tr><\/thead><tbody><tr><td>참<\/td><td>모든 입력의 기대 결과 제공<\/td><\/tr><tr><td>샘플링<\/td><td>일부 입력에만 기대 결과 제공<\/td><\/tr><tr><td>휴리스틱<\/td><td>샘플링에 추정을 더함<\/td><\/tr><tr><td>일관성<\/td><td>이전 버전과 결과 비교<\/td><\/tr><\/tbody><\/table><\/div><p><strong>테스트 원리:<\/strong> 결함이 있음을 보일 뿐 없음을 증명하지 못함, 완벽한 테스트는 불가능, 초기 테스트, 결함 집중(파레토 법칙), 살충제 패러독스, 정황 의존, 오류 부재의 궤변.<\/p><p><strong>테스트 케이스 구성:<\/strong> 테스트 조건, 테스트 데이터, 예상 결과.<br><strong>용어:<\/strong> 회귀 테스트는 변경 후 기존 기능을 재검증하고, 리팩토링은 동작을 유지하며 내부 구조를 개선한다. 정적 분석은 실행 없이, 동적 분석은 실행하며 검사한다.<\/p>","qs":[{"s":"<p>다음 빈칸에 알맞은 용어를 적으시오.<\/p><p>통합 테스트에서 하향식은 아직 없는 하위 모듈을 대신하는 ( ① )을 쓰고, 상향식은 하위 모듈을 호출하는 임시 상위 모듈인 ( ② )를 쓴다.<\/p>","a":"<p>① 스텁 (Stub)  ② 드라이버 (Driver)<\/p>","e":"<p>스텁은 호출되는 쪽, 드라이버는 호출하는 쪽을 대신한다.<\/p>"},{"s":"<p>다음 설명에 해당하는 테스트를 적으시오.<\/p><p>① 개발자의 장소에서 사용자가 개발자 앞에서 수행한다.<br>② 실제 사용자 환경에서 개발자 없이 수행한다.<\/p>","a":"<p>① 알파 테스트  ② 베타 테스트<\/p>","e":"<p>모두 인수 테스트에 속하며 수행 장소와 개발자 입회 여부가 다르다.<\/p>"},{"s":"<p>다음 설명에 해당하는 테스트 오라클을 적으시오.<\/p><p>전수 검사가 어려울 때 특정한 몇 개의 입력값에 대해서만 기대하는 결과를 제공한다.<\/p>","a":"<p>샘플링 오라클 (Sampling Oracle)<\/p>","e":"<p>일부 입력에만 기대 결과를 제공한다.<\/p>"},{"s":"<p>동일한 테스트 케이스를 반복하면 더 이상 새로운 결함을 찾지 못한다는 테스트 원리의 이름을 적으시오.<\/p>","a":"<p>살충제 패러독스<\/p>","e":"<p>테스트 케이스를 주기적으로 검토하고 개선해야 한다는 원리다.<\/p>"},{"s":"<p>테스트 케이스의 구성 요소 세 가지를 빈칸에 적으시오.<\/p><p>( ① ): 테스트 실행 전에 필요한 환경과 사전 상태<br>( ② ): 프로그램에 실제로 넣는 입력값<br>( ③ ): 올바른 동작일 때 나와야 하는 결과<\/p>","a":"<p>① 테스트 조건  ② 테스트 데이터  ③ 예상 결과<\/p>","e":"<p>조건, 데이터, 예상 결과를 갖추어야 실행과 판정이 가능하다.<\/p>"}]},{"id":"uml","title":"UML","freq":"다이어그램 이름과 관계 기호가 반복","concept":"<p>UML의 3대 구성 요소는 <strong>사물, 관계, 다이어그램<\/strong>이다.<\/p><div class=\"tw\"><table><thead><tr><th>구조 다이어그램<\/th><th>행위 다이어그램<\/th><\/tr><\/thead><tbody><tr><td>클래스<\/td><td>유스케이스<\/td><\/tr><tr><td>객체<\/td><td>시퀀스<\/td><\/tr><tr><td>컴포넌트<\/td><td>커뮤니케이션<\/td><\/tr><tr><td>배치<\/td><td>상태<\/td><\/tr><tr><td>복합체 구조<\/td><td>활동<\/td><\/tr><tr><td>패키지<\/td><td>타이밍, 상호작용 개요<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tw\"><table><thead><tr><th>관계<\/th><th>의미<\/th><th>표기<\/th><\/tr><\/thead><tbody><tr><td>연관<\/td><td>서로 관련 있음<\/td><td>실선<\/td><\/tr><tr><td>집합 (Aggregation)<\/td><td>부분이 독립적으로 존재<\/td><td>빈 마름모<\/td><\/tr><tr><td>포함 (Composition)<\/td><td>전체가 사라지면 부분도 사라짐<\/td><td>채운 마름모<\/td><\/tr><tr><td>일반화<\/td><td>is-a, 상속<\/td><td>실선 + 빈 삼각형<\/td><\/tr><tr><td>의존<\/td><td>잠깐 사용<\/td><td>점선 화살표<\/td><\/tr><tr><td>실체화<\/td><td>인터페이스 구현<\/td><td>점선 + 빈 삼각형<\/td><\/tr><\/tbody><\/table><\/div><ul><li>접근 제어자: <code>+<\/code> public, <code>-<\/code> private, <code>#<\/code> protected, <code>~<\/code> package.<\/li><li>유스케이스 관계: 포함(<code>&lt;&lt;include&gt;&gt;<\/code>)은 반드시 실행, 확장(<code>&lt;&lt;extend&gt;&gt;<\/code>)은 조건에 따라 실행.<\/li><li>럼바우 분석: 객체 모델링, 동적 모델링(상태), 기능 모델링(DFD).<\/li><\/ul>","qs":[{"s":"<p>다음 설명에 해당하는 UML 다이어그램을 적으시오.<\/p><p>요소들을 그룹으로 묶어 그룹 사이의 의존 관계를 표현하는 구조적 다이어그램이다.<\/p>","a":"<p>패키지 다이어그램 (Package Diagram)<\/p>","e":"<p>구조 다이어그램의 하나로 모델 요소를 묶어 표현한다.<\/p>"},{"s":"<p>다음 설명에 해당하는 UML 관계를 영문으로 적으시오.<\/p><p>① 자동차와 타이어처럼 부분이 전체와 독립적으로 존재할 수 있다. 빈 마름모로 표기한다.<br>② 사람과 심장처럼 전체가 사라지면 부분도 사라진다. 채운 마름모로 표기한다.<br>③ 인터페이스를 클래스가 구현하는 관계다. 점선과 빈 삼각형으로 표기한다.<\/p>","a":"<p>① Aggregation  ② Composition  ③ Realization<\/p>","e":"<p>집합, 포함, 실체화 관계다.<\/p>"},{"s":"<p>클래스 다이어그램의 접근 제어자 기호를 적으시오.<\/p><p>① public  ② private  ③ protected<\/p>","a":"<p>① +  ② -  ③ #<\/p>","e":"<p>package 접근은 ~이다.<\/p>"},{"s":"<p>다음 설명에 해당하는 다이어그램을 [보기]에서 고르시오.<\/p><p>① 객체 사이의 메시지를 시간 순서로 표현한다.<br>② 시스템이 제공하는 기능과 사용자의 관계를 표현한다.<br>③ 객체의 상태가 이벤트에 따라 어떻게 변하는지 표현한다.<\/p><p>[보기] 유스케이스, 시퀀스, 상태, 배치, 컴포넌트<\/p>","a":"<p>① 시퀀스  ② 유스케이스  ③ 상태<\/p>","e":"<p>시간 순 메시지는 시퀀스, 사용자 관점 기능은 유스케이스, 상태 변화는 상태 다이어그램이다.<\/p>"},{"s":"<p>럼바우의 객체 지향 분석 기법이다. 빈칸을 적으시오.<\/p><p>( ① ) 모델링: 객체와 그 관계를 객체 다이어그램으로 표시<br>( ② ) 모델링: 시간 흐름에 따른 제어 흐름을 상태 다이어그램으로 표시<br>( ③ ) 모델링: 입력과 출력의 처리 과정을 자료 흐름도로 표시<\/p>","a":"<p>① 객체 (Object)  ② 동적 (Dynamic)  ③ 기능 (Functional)<\/p>","e":"<p>객체, 동적, 기능의 순서로 외운다.<\/p>"}]},{"id":"pattern","title":"디자인 패턴","freq":"패턴 이름 쓰기와 분류가 13개","concept":"<p>GoF 패턴은 생성 5개, 구조 7개, 행위 11개로 총 23개다.<\/p><div class=\"tw\"><table><thead><tr><th>생성<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td>Abstract Factory<\/td><td>관련 객체군을 구체 클래스 없이 생성<\/td><\/tr><tr><td>Builder<\/td><td>복잡한 객체를 단계별로 생성<\/td><\/tr><tr><td>Factory Method<\/td><td>어떤 객체를 만들지 서브클래스가 결정<\/td><\/tr><tr><td>Prototype<\/td><td>원본을 복제해 생성<\/td><\/tr><tr><td>Singleton<\/td><td>인스턴스를 하나만 생성<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tw\"><table><thead><tr><th>구조<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td>Adapter<\/td><td>호환되지 않는 인터페이스를 변환<\/td><\/tr><tr><td>Bridge<\/td><td>추상과 구현을 분리<\/td><\/tr><tr><td>Composite<\/td><td>개체와 복합체를 트리로 동일하게 처리<\/td><\/tr><tr><td>Decorator<\/td><td>객체에 기능을 동적으로 추가<\/td><\/tr><tr><td>Facade<\/td><td>복잡한 서브시스템에 단순한 창구 제공<\/td><\/tr><tr><td>Flyweight<\/td><td>공유로 메모리 절약<\/td><\/tr><tr><td>Proxy<\/td><td>대리자가 접근을 제어<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tw\"><table><thead><tr><th>행위<\/th><th>설명<\/th><\/tr><\/thead><tbody><tr><td>Chain of Responsibility<\/td><td>처리할 객체까지 요청을 전달<\/td><\/tr><tr><td>Command<\/td><td>요청을 객체로 캡슐화<\/td><\/tr><tr><td>Interpreter<\/td><td>언어의 문법을 해석<\/td><\/tr><tr><td>Iterator<\/td><td>내부 구조 노출 없이 순차 접근<\/td><\/tr><tr><td>Mediator<\/td><td>객체 간 상호작용을 중재<\/td><\/tr><tr><td>Memento<\/td><td>이전 상태를 저장하고 복원<\/td><\/tr><tr><td>Observer<\/td><td>상태 변화를 구독자에게 통지<\/td><\/tr><tr><td>State<\/td><td>상태에 따라 행위 변경<\/td><\/tr><tr><td>Strategy<\/td><td>알고리즘을 교체 가능하게 캡슐화<\/td><\/tr><tr><td>Template Method<\/td><td>알고리즘 뼈대를 상위에서 정의<\/td><\/tr><tr><td>Visitor<\/td><td>구조를 바꾸지 않고 새 연산 추가<\/td><\/tr><\/tbody><\/table><\/div>","qs":[{"s":"<p>다음 설명에 해당하는 디자인 패턴을 영문으로 적으시오.<\/p><p>한 객체의 상태가 바뀌면 그 객체에 의존하는 다른 객체들에게 자동으로 통지되어 갱신되는 일대다 의존 구조를 정의한다.<\/p>","a":"<p>Observer<\/p>","e":"<p>구독과 통지 구조다.<\/p>"},{"s":"<p>다음 패턴이 속하는 분류를 생성, 구조, 행위 중에서 적으시오.<\/p><p>① Singleton  ② Adapter  ③ Strategy  ④ Builder  ⑤ Proxy<\/p>","a":"<p>① 생성  ② 구조  ③ 행위  ④ 생성  ⑤ 구조<\/p>","e":"<p>객체 생성은 생성, 클래스와 객체의 조합은 구조, 책임과 알고리즘 분배는 행위 패턴이다.<\/p>"},{"s":"<p>다음 설명에 해당하는 디자인 패턴을 영문으로 적으시오.<\/p><p>서로 맞지 않는 인터페이스를 가진 클래스를 클라이언트가 기대하는 형태로 변환해 함께 동작하게 한다.<\/p>","a":"<p>Adapter<\/p>","e":"<p>기존 클래스의 인터페이스를 변환한다.<\/p>"},{"s":"<p>다음 설명에 해당하는 디자인 패턴을 영문으로 적으시오.<\/p><p>복합 객체의 내부 표현을 드러내지 않고, 그 안의 요소에 순차적으로 접근할 수 있게 한다.<\/p>","a":"<p>Iterator<\/p>","e":"<p>순회 방법을 객체로 분리한다.<\/p>"},{"s":"<p>빈칸에 알맞은 패턴을 영문으로 적으시오.<\/p><p>( ① ): 객체를 대신하는 대리 객체를 두어 접근 제어, 지연 로딩 등을 수행한다.<br>( ② ): 클래스의 인스턴스가 하나만 생성되도록 보장하고 전역 접근을 제공한다.<br>( ③ ): 객체의 생성 과정과 표현을 분리해 같은 절차로 다른 표현을 만든다.<\/p>","a":"<p>① Proxy  ② Singleton  ③ Builder<\/p>","e":"<p>대리자, 단일 인스턴스, 단계별 생성의 특징으로 구분한다.<\/p>"}]},{"id":"coupling","title":"결합도·응집도·객체지향 원칙","freq":"결합도·응집도 11개, 순서 쓰기 포함","concept":"<p>좋은 모듈은 <strong>결합도는 낮고 응집도는 높다.<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>결합도 (약 → 강)<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>자료<\/td><td>필요한 값만 인자로 전달<\/td><\/tr><tr><td>스탬프<\/td><td>구조체 등 자료 구조를 전달<\/td><\/tr><tr><td>제어<\/td><td>제어 플래그를 전달해 동작을 지시<\/td><\/tr><tr><td>외부<\/td><td>외부 파일, 장치, 프로토콜을 공유<\/td><\/tr><tr><td>공통<\/td><td>전역 변수를 공유<\/td><\/tr><tr><td>내용<\/td><td>다른 모듈의 내부를 직접 참조<\/td><\/tr><\/tbody><\/table><\/div><p>외우는 말: <strong>자스제외공내<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>응집도 (강 → 약)<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>기능적<\/td><td>하나의 기능만 수행<\/td><\/tr><tr><td>순차적<\/td><td>한 활동의 출력이 다음 활동의 입력<\/td><\/tr><tr><td>통신적 (교환적)<\/td><td>같은 입력과 출력을 사용<\/td><\/tr><tr><td>절차적<\/td><td>순서대로 실행되는 활동 모음<\/td><\/tr><tr><td>시간적<\/td><td>같은 시기에 실행<\/td><\/tr><tr><td>논리적<\/td><td>유사한 성격을 모음<\/td><\/tr><tr><td>우연적<\/td><td>관련 없는 요소를 모음<\/td><\/tr><\/tbody><\/table><\/div><p>외우는 말: <strong>기순통절시논우<\/strong><\/p><ul><li>팬인(Fan-in)은 자신을 호출하는 모듈 수, 팬아웃(Fan-out)은 자신이 호출하는 모듈 수다.<\/li><\/ul><div class=\"tw\"><table><thead><tr><th>SOLID<\/th><th>원칙<\/th><\/tr><\/thead><tbody><tr><td>SRP<\/td><td>단일 책임<\/td><\/tr><tr><td>OCP<\/td><td>확장에 열리고 수정에 닫힘<\/td><\/tr><tr><td>LSP<\/td><td>자식은 부모를 대체 가능<\/td><\/tr><tr><td>ISP<\/td><td>인터페이스 분리<\/td><\/tr><tr><td>DIP<\/td><td>추상에 의존<\/td><\/tr><\/tbody><\/table><\/div>","qs":[{"s":"<p>결합도가 약한 것부터 강한 순으로 빈칸을 채우시오.<\/p><p>자료 → ( ① ) → 제어 → ( ② ) → 공통 → ( ③ )<\/p>","a":"<p>① 스탬프  ② 외부  ③ 내용<\/p>","e":"<p>자스제외공내 순서다.<\/p>"},{"s":"<p>어떤 모듈이 다른 모듈에 플래그를 넘겨 그 모듈의 내부 처리 흐름을 결정한다. 이 결합도의 이름을 적으시오.<\/p>","a":"<p>제어 결합도 (Control Coupling)<\/p>","e":"<p>제어 신호로 다른 모듈의 동작을 지시한다.<\/p>"},{"s":"<p>모듈 안에서 앞 활동의 출력이 다음 활동의 입력으로 사용된다. 이 응집도의 이름을 적으시오.<\/p>","a":"<p>순차적 응집도 (Sequential Cohesion)<\/p>","e":"<p>출력과 입력이 이어지면 순차적 응집도다.<\/p>"},{"s":"<p>호출 관계가 A→B, A→C, B→D, C→D, E→D일 때, D의 팬인과 A의 팬아웃을 적으시오.<\/p>","a":"<p>D의 팬인 3, A의 팬아웃 2<\/p>","e":"<p>D를 호출하는 것은 B, C, E이고, A가 호출하는 것은 B, C다.<\/p>"},{"s":"<p>다음 설명에 해당하는 객체지향 설계 원칙을 영문 약어로 적으시오.<\/p><p>① 클라이언트는 자신이 사용하지 않는 메서드에 의존하지 않아야 한다.<br>② 소프트웨어 요소는 확장에 열려 있고 변경에 닫혀 있어야 한다.<br>③ 구체 클래스가 아니라 추상화에 의존해야 한다.<\/p>","a":"<p>① ISP  ② OCP  ③ DIP<\/p>","e":"<p>인터페이스 분리, 개방-폐쇄, 의존 역전 원칙이다.<\/p>"}]},{"id":"methodology","title":"개발 방법론·요구공학","freq":"애자일, 요구 분석 절차, 기능·비기능 분류","concept":"<div class=\"tw\"><table><thead><tr><th>모형<\/th><th>특징<\/th><\/tr><\/thead><tbody><tr><td>폭포수<\/td><td>단계를 순차로 진행, 이전 단계 복귀가 어려움<\/td><\/tr><tr><td>프로토타입<\/td><td>시제품으로 요구 확인<\/td><\/tr><tr><td>나선형<\/td><td>계획 → 위험 분석 → 개발 → 평가 반복<\/td><\/tr><tr><td>애자일<\/td><td>짧은 주기의 반복과 고객 협력 중심<\/td><\/tr><\/tbody><\/table><\/div><p><strong>애자일 XP의 5가치:<\/strong> 용기, 단순성, 의사소통, 피드백, 존중.<br><strong>스크럼 용어:<\/strong> 제품 백로그, 스프린트 계획, 스프린트(2~4주), 일일 스크럼, 스프린트 리뷰, 회고.<\/p><p><strong>요구공학 절차:<\/strong> 도출 → 분석 → 명세 → 확인.<\/p><div class=\"tw\"><table><thead><tr><th>분류<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td>기능 요구사항<\/td><td>시스템이 수행할 기능 (로그인, 결제)<\/td><\/tr><tr><td>비기능 요구사항<\/td><td>성능, 보안, 가용성 등 품질과 제약<\/td><\/tr><\/tbody><\/table><\/div><ul><li>분석 도구: DFD(자료 흐름도), DD(자료 사전), HIPO, UML.<\/li><li>자료 사전 기호: <code>=<\/code> 정의, <code>+<\/code> 연결, <code>( )<\/code> 생략 가능, <code>[ | ]<\/code> 선택, <code>{ }<\/code> 반복, <code>** **<\/code> 주석.<\/li><li>소프트웨어 개발 방법론: 구조적, 정보공학, 객체지향, CBD, 애자일, 제품 계열.<\/li><li>CMMI 단계: 초기 → 관리 → 정의 → 정량적 관리 → 최적화.<\/li><\/ul>","qs":[{"s":"<p>요구공학 프로세스를 순서대로 적으시오.<\/p><p>[보기] 명세, 도출, 확인, 분석<\/p>","a":"<p>도출 → 분석 → 명세 → 확인<\/p>","e":"<p>요구를 수집하고 분석한 뒤 문서화하고 검증한다.<\/p>"},{"s":"<p>다음 요구사항을 기능과 비기능으로 구분하시오.<\/p><p>① 사용자는 비밀번호를 재설정할 수 있어야 한다.<br>② 초당 1,000건의 요청을 3초 안에 처리해야 한다.<br>③ 관리자는 주문 내역을 조회할 수 있어야 한다.<br>④ 연간 가동률은 99.9% 이상이어야 한다.<\/p>","a":"<p>① 기능  ② 비기능  ③ 기능  ④ 비기능<\/p>","e":"<p>무엇을 하는지는 기능, 얼마나 잘 하는지는 비기능이다.<\/p>"},{"s":"<p>XP(eXtreme Programming)의 5가지 핵심 가치를 적으시오.<\/p>","a":"<p>용기, 단순성, 의사소통, 피드백, 존중<\/p>","e":"<p>XP의 핵심 가치 5개다.<\/p>"},{"s":"<p>나선형 모형의 수행 단계를 순서대로 적으시오.<\/p><p>[보기] 개발, 평가, 계획, 위험 분석<\/p>","a":"<p>계획 → 위험 분석 → 개발 → 평가<\/p>","e":"<p>위험 분석이 들어가는 것이 나선형 모형의 특징이다.<\/p>"},{"s":"<p>자료 사전(DD)에서 다음 의미를 나타내는 기호를 적으시오.<\/p><p>① 자료의 연결  ② 자료의 생략 가능  ③ 자료의 반복<\/p>","a":"<p>① +  ② ( )  ③ { }<\/p>","e":"<p>선택은 [ | ], 정의는 =, 주석은 <strong> <\/strong>이다.<\/p>"}]},{"id":"req-detail","title":"비기능 요구사항의 제약과 품질 속성","freq":"2026년 1회 제약 유형과 품질 속성 연결 출제","concept":"<div class=\"tw\"><table><thead><tr><th>제약 유형<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td>운영 (Operational)<\/td><td>특정 운영체제나 환경에서 동작<\/td><\/tr><tr><td>자원 (Resource)<\/td><td>최소 메모리, 저장 용량<\/td><\/tr><tr><td>성능 (Performance)<\/td><td>응답 시간, 처리량<\/td><\/tr><tr><td>보안 (Security)<\/td><td>암호화, 접근 제어<\/td><\/tr><tr><td>정책 (Policy)<\/td><td>법규, 조직 규정<\/td><\/tr><tr><td>품질 (Quality)<\/td><td>신뢰성, 사용성 기준<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tw\"><table><thead><tr><th>품질 속성<\/th><th>질문<\/th><\/tr><\/thead><tbody><tr><td>가용성<\/td><td>필요할 때 서비스를 쓸 수 있는가<\/td><\/tr><tr><td>보안성<\/td><td>권한 없는 접근을 막는가<\/td><\/tr><tr><td>이식성<\/td><td>다른 환경으로 옮길 수 있는가<\/td><\/tr><tr><td>유지보수성<\/td><td>고치기 쉬운가<\/td><\/tr><tr><td>확장성<\/td><td>늘어난 부하를 수용하는가<\/td><\/tr><tr><td>사용성<\/td><td>배우고 쓰기 쉬운가<\/td><\/tr><\/tbody><\/table><\/div><p><strong>구분 요령:<\/strong> 사용자가 하는 행동(조회, 등록)을 설명하면 기능 요구사항이고, 그 행동을 얼마나 빠르게, 안전하게, 어디서 수행하는지 설명하면 비기능 요구사항이다.<\/p><p><strong>요구사항 검증 기법:<\/strong> 동료 검토, 워크스루, 인스펙션, 프로토타이핑, 테스트 설계.<\/p><div class=\"tw\"><table><thead><tr><th>검토<\/th><th>진행<\/th><\/tr><\/thead><tbody><tr><td>동료 검토<\/td><td>작성자가 설명하고 동료가 결함을 찾음<\/td><\/tr><tr><td>워크스루<\/td><td>미리 배포한 자료로 짧은 회의를 진행<\/td><\/tr><tr><td>인스펙션<\/td><td>작성자 외의 전문가가 결함을 공식적으로 찾음<\/td><\/tr><\/tbody><\/table><\/div>","qs":[{"s":"<p>다음 제약사항의 유형을 [보기]에서 고르시오.<\/p><p>① 프로그램이 동작하는 데 필요한 최소 메모리를 2GB로 제한한다.<br>② Windows와 Linux 모두에서 동작해야 한다.<br>③ 요청을 받은 후 2초 안에 응답해야 한다.<\/p><p>[보기] 운영, 자원, 성능, 보안, 정책<\/p>","a":"<p>① 자원  ② 운영  ③ 성능<\/p>","e":"<p>용량은 자원, 실행 환경은 운영, 시간은 성능 제약이다.<\/p>"},{"s":"<p>다음 요구사항 중 비기능 요구사항을 기호로 모두 적으시오.<\/p><p>ㄱ. 회원은 주문 내역을 날짜별로 조회할 수 있다.<br>ㄴ. 회원의 비밀번호는 암호화해 저장한다.<br>ㄷ. 서버 장애가 나도 5분 안에 서비스를 재개한다.<br>ㄹ. 관리자는 공지를 등록할 수 있다.<\/p>","a":"<p>ㄴ, ㄷ<\/p>","e":"<p>ㄱ과 ㄹ은 사용자의 행동을 설명하는 기능 요구사항이다.<\/p>"},{"s":"<p>다음 요구사항에 해당하는 품질 속성을 적으시오.<\/p><p>① 시스템을 다른 클라우드 환경으로 설정 변경만으로 옮길 수 있어야 한다.<br>② 연중 99.9%의 시간 동안 서비스를 이용할 수 있어야 한다.<br>③ 권한 없는 사용자의 접근을 차단해야 한다.<\/p>","a":"<p>① 이식성  ② 가용성  ③ 보안성<\/p>","e":"<p>환경 이전은 이식성, 가동 시간은 가용성, 접근 차단은 보안성이다.<\/p>"},{"s":"<p>요구사항 검증 기법 중 작성자가 아닌 전문가가 명세서를 확인하며 결함을 공식적으로 찾아내는 기법을 적으시오.<\/p>","a":"<p>인스펙션 (Inspection)<\/p>","e":"<p>동료 검토는 작성자가 설명하고, 인스펙션은 다른 전문가가 공식 절차로 결함을 찾는다.<\/p>"},{"s":"<p>회의 전에 명세서를 미리 배포해 사전 검토한 뒤, 짧은 회의를 통해 오류를 조기에 검출하는 기법을 적으시오.<\/p>","a":"<p>워크스루 (Walk Through)<\/p>","e":"<p>사전 배포와 짧은 회의가 특징이다.<\/p>"}]},{"id":"cost","title":"비용 산정과 일정 계산","freq":"출제 빈도는 낮지만 계산으로 나오면 확실한 점수","concept":"<p><strong>LOC 기법<\/strong><\/p><ul><li>노력(인월) = 총 LOC ÷ 1인 월평균 생산량<\/li><li>개발 기간 = 노력 ÷ 투입 인원<\/li><\/ul><p><strong>COCOMO 유형<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>유형<\/th><th>규모<\/th><\/tr><\/thead><tbody><tr><td>조직형 (Organic)<\/td><td>5만 라인 이하<\/td><\/tr><tr><td>반분리형 (Semi-detached)<\/td><td>30만 라인 이하<\/td><\/tr><tr><td>내장형 (Embedded)<\/td><td>30만 라인 이상<\/td><\/tr><\/tbody><\/table><\/div><p><strong>그 밖의 모형:<\/strong> Putnam(Rayleigh-Norden 곡선), 기능 점수(FP), SLIM(Putnam 기반 자동화), ESTIMACS(FP 기반 자동화).<\/p><p><strong>PERT 기대 시간<\/strong> = (낙관치 + 4 × 중간치 + 비관치) ÷ 6<br><strong>CPM 임계 경로:<\/strong> 시작부터 끝까지 가장 긴 경로이며 프로젝트의 최소 기간을 결정한다.<\/p><p>2027~2029 출제기준에 비용산정 모델은 명시돼 있지만 PERT와 CPM은 이름이 나오지 않는다. 일정 계산은 짧게 익히고 넘어간다.<\/p>","qs":[{"s":"<p>총 30,000 LOC인 프로젝트에 개발자 5명이 투입되고 1인의 월평균 생산량이 300 LOC이다. 개발 기간을 계산하시오.<\/p>","a":"<p>20개월<\/p>","e":"<p>노력은 30,000 ÷ 300 = 100인월이고, 기간은 100 ÷ 5 = 20개월이다.<\/p>"},{"s":"<p>COCOMO 모형의 유형을 적으시오.<\/p><p>① 중소 규모 사무용 소프트웨어, 5만 라인 이하<br>② 트랜잭션 처리나 운영체제 등, 30만 라인 이하<br>③ 신호기 제어, 미사일 유도 등, 30만 라인 이상<\/p>","a":"<p>① 조직형 (Organic)  ② 반분리형 (Semi-detached)  ③ 내장형 (Embedded)<\/p>","e":"<p>규모와 복잡도가 커지는 순서다.<\/p>"},{"s":"<p>어떤 작업의 낙관치가 4일, 중간치가 6일, 비관치가 14일이다. PERT 기대 시간을 계산하시오.<\/p>","a":"<p>7일<\/p>","e":"<p>(4 + 4 × 6 + 14) ÷ 6 = 42 ÷ 6 = 7이다.<\/p>"},{"s":"<p>작업이 다음과 같을 때 프로젝트 최소 기간과 임계 경로를 적으시오.<\/p><div class=\"tw\"><table><thead><tr><th>작업<\/th><th>기간(일)<\/th><th>선행 작업<\/th><\/tr><\/thead><tbody><tr><td>A<\/td><td>3<\/td><td>없음<\/td><\/tr><tr><td>B<\/td><td>5<\/td><td>A<\/td><\/tr><tr><td>C<\/td><td>2<\/td><td>A<\/td><\/tr><tr><td>D<\/td><td>4<\/td><td>B, C<\/td><\/tr><\/tbody><\/table><\/div>","a":"<p>12일, A → B → D<\/p>","e":"<p>A-B-D는 3 + 5 + 4 = 12일, A-C-D는 9일이다. 가장 긴 경로가 임계 경로다.<\/p>"},{"s":"<p>Rayleigh-Norden 곡선의 노력 분포를 기초로 소프트웨어 개발 비용을 산정하는 모형의 이름을 적으시오.<\/p>","a":"<p>Putnam 모형<\/p>","e":"<p>개발 기간에 따른 노력 분포를 가정하는 동적 모형이다.<\/p>"}]},{"id":"ui-interface","title":"화면 설계와 인터페이스 기술","freq":"UI 원칙, EAI, JSON, AJAX, SOAP이 반복","concept":"<div class=\"tw\"><table><thead><tr><th>UI 설계 원칙<\/th><th>뜻<\/th><\/tr><\/thead><tbody><tr><td>직관성<\/td><td>누구나 쉽게 이해하고 사용<\/td><\/tr><tr><td>유효성<\/td><td>사용자의 목적을 정확히 달성<\/td><\/tr><tr><td>학습성<\/td><td>누구나 쉽게 배우고 익힘<\/td><\/tr><tr><td>유연성<\/td><td>사용자의 요구를 최대한 수용하고 실수를 최소화<\/td><\/tr><\/tbody><\/table><\/div><ul><li>UI 종류: CLI(명령어), GUI(그래픽), NUI(말과 몸짓 등 자연스러운 동작), VUI(음성), OUI(유기적 형태).<\/li><li>설계 도구: 와이어프레임, 스토리보드, 목업, 프로토타입.<\/li><\/ul><div class=\"tw\"><table><thead><tr><th>EAI 유형<\/th><th>특징<\/th><\/tr><\/thead><tbody><tr><td>Point-to-Point<\/td><td>1:1 직접 연결<\/td><\/tr><tr><td>Hub &amp; Spoke<\/td><td>중앙 허브를 거침<\/td><\/tr><tr><td>Message Bus<\/td><td>미들웨어 버스 사용<\/td><\/tr><tr><td>Hybrid<\/td><td>허브와 버스 혼합<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tw\"><table><thead><tr><th>기술<\/th><th>뜻<\/th><\/tr><\/thead><tbody><tr><td>JSON<\/td><td>속성-값 쌍의 경량 데이터 형식<\/td><\/tr><tr><td>XML<\/td><td>태그 기반 마크업 언어<\/td><\/tr><tr><td>AJAX<\/td><td>페이지 전체를 새로 고치지 않고 비동기로 데이터 교환<\/td><\/tr><tr><td>SOAP<\/td><td>XML 기반 메시지 교환 프로토콜<\/td><\/tr><tr><td>WSDL<\/td><td>웹 서비스 명세를 XML로 기술<\/td><\/tr><tr><td>UDDI<\/td><td>웹 서비스 정보 등록과 검색<\/td><\/tr><tr><td>REST<\/td><td>URI와 HTTP 메서드로 자원을 다루는 구조<\/td><\/tr><\/tbody><\/table><\/div>","qs":[{"s":"<p>다음 설명에 해당하는 UI 설계 원칙을 적으시오.<\/p><p>① 누구나 쉽게 이해하고 사용할 수 있어야 한다.<br>② 사용자의 목적을 정확하고 완벽하게 달성해야 한다.<br>③ 사용자의 요구를 최대한 수용하고 실수를 최소화해야 한다.<\/p>","a":"<p>① 직관성  ② 유효성  ③ 유연성<\/p>","e":"<p>학습성은 쉽게 배우고 익힐 수 있어야 한다는 원칙이다.<\/p>"},{"s":"<p>EAI 구축 유형 중 중앙에 허브 시스템을 두어 데이터를 전송하며, 확장과 유지보수가 쉽지만 허브에 장애가 나면 전체에 영향을 주는 방식을 적으시오.<\/p>","a":"<p>Hub &amp; Spoke<\/p>","e":"<p>중앙 집중형 구조이므로 허브가 단일 장애점이 된다.<\/p>"},{"s":"<p>다음 설명에 해당하는 기술을 영문으로 적으시오.<\/p><p>웹 페이지 전체를 다시 불러오지 않고, 자바스크립트로 서버와 비동기 통신해 페이지의 일부만 갱신하는 기술이다.<\/p>","a":"<p>AJAX<\/p>","e":"<p>Asynchronous JavaScript and XML의 약자다.<\/p>"},{"s":"<p>다음 설명에 해당하는 데이터 형식을 영문으로 적으시오.<\/p><p>사람이 읽기 쉬운 텍스트로 속성-값 쌍을 표현하며 비동기 통신에 널리 쓰인다. 예: <code>{\"name\": \"kim\", \"age\": 20}<\/code><\/p>","a":"<p>JSON<\/p>","e":"<p>JavaScript Object Notation의 약자다.<\/p>"},{"s":"<p>빈칸에 알맞은 용어를 영문 약어로 적으시오.<\/p><p>( ① ): HTTP 등을 이용해 XML 기반 메시지를 교환하는 프로토콜<br>( ② ): 웹 서비스의 위치와 호출 방식 등을 XML로 기술한 명세<br>( ③ ): 말이나 몸짓 등 사람의 자연스러운 행동으로 조작하는 인터페이스<\/p>","a":"<p>① SOAP  ② WSDL  ③ NUI<\/p>","e":"<p>SOAP로 통신하고, WSDL로 서비스를 설명한다. NUI는 Natural User Interface다.<\/p>"}]},{"id":"config-quality","title":"형상 관리·패키징·품질 표준","freq":"제품 패키징 항목, 도구 이름 문제","concept":"<p><strong>형상 관리 절차:<\/strong> 식별 → 통제 → 감사 → 기록.<\/p><div class=\"tw\"><table><thead><tr><th>도구<\/th><th>방식<\/th><\/tr><\/thead><tbody><tr><td>CVS<\/td><td>중앙 집중 방식, 오래된 도구<\/td><\/tr><tr><td>SVN<\/td><td>중앙 집중 방식, CVS 개선<\/td><\/tr><tr><td>Git<\/td><td>분산 저장소 방식<\/td><\/tr><\/tbody><\/table><\/div><p>Git 명령: <code>clone<\/code>, <code>add<\/code>, <code>commit<\/code>, <code>push<\/code>, <code>pull<\/code>, <code>branch<\/code>, <code>merge<\/code>.<\/p><ul><li>빌드 자동화 도구: Ant, Maven, Gradle, Jenkins.<\/li><li>릴리즈 노트 항목: 헤더, 개요, 목적, 이슈 요약, 재현 항목, 수정/개선 내용, 사용자 영향도, 지원 영향도, 노트, 면책 조항, 연락처.<\/li><\/ul><div class=\"tw\"><table><thead><tr><th>DRM 구성 요소<\/th><th>역할<\/th><\/tr><\/thead><tbody><tr><td>콘텐츠 제공자<\/td><td>콘텐츠를 제공<\/td><\/tr><tr><td>패키저<\/td><td>콘텐츠를 암호화해 묶음<\/td><\/tr><tr><td>클리어링 하우스<\/td><td>키와 라이선스를 발급하고 관리<\/td><\/tr><tr><td>콘텐츠 분배자<\/td><td>콘텐츠를 유통<\/td><\/tr><tr><td>콘텐츠 소비자<\/td><td>콘텐츠를 구매해 사용<\/td><\/tr><tr><td>DRM 컨트롤러<\/td><td>이용 권한을 통제<\/td><\/tr><tr><td>보안 컨테이너<\/td><td>콘텐츠를 안전하게 유통하는 장치<\/td><\/tr><\/tbody><\/table><\/div><ul><li><strong>탬퍼 프루핑:<\/strong> 소프트웨어의 위변조를 탐지하고 대응한다.<\/li><\/ul><p><strong>ISO/IEC 25010 품질 특성 (2011판):<\/strong> 기능 적합성, 성능 효율성, 호환성, 사용성, 신뢰성, 보안성, 유지보수성, 이식성. 관련 표준으로 ISO/IEC 12207(생명주기 프로세스), SPICE(ISO/IEC 15504), CMMI가 있다.<\/p>","qs":[{"s":"<p>소프트웨어 형상 관리 절차를 순서대로 적으시오.<\/p><p>[보기] 감사, 기록, 식별, 통제<\/p>","a":"<p>식별 → 통제 → 감사 → 기록<\/p>","e":"<p>대상을 정하고, 변경을 통제하며, 검증한 뒤 상태를 기록한다.<\/p>"},{"s":"<p>빈칸에 알맞은 형상 관리 도구를 [보기]에서 고르시오.<\/p><p>( ① ): 원격 저장소와 함께 개발자 각자가 전체 저장소 복제본을 가지는 분산 방식이다.<br>( ② ): 중앙 서버에 저장하는 방식으로 CVS의 단점을 개선했다.<\/p><p>[보기] CVS, SVN, Git<\/p>","a":"<p>① Git  ② SVN<\/p>","e":"<p>분산 방식은 Git이고, SVN은 CVS의 후속 중앙 집중 도구다.<\/p>"},{"s":"<p>DRM 구성 요소 중 키 관리와 라이선스 발급을 담당하는 요소의 이름을 적으시오.<\/p>","a":"<p>클리어링 하우스 (Clearing House)<\/p>","e":"<p>사용 권한과 결제를 관리하는 중앙 역할이다.<\/p>"},{"s":"<p>릴리즈 노트 맨 앞에서 제품명, 버전, 작성일 같은 식별 정보를 적는 부분을 부르는 이름을 적으시오.<\/p>","a":"<p>헤더 (Header)<\/p>","e":"<p>릴리즈 노트의 맨 앞에 오는 기본 정보다.<\/p>"},{"s":"<p>ISO/IEC 25010의 품질 특성 중 다음 설명에 해당하는 것을 적으시오.<\/p><p>① 다른 환경으로 쉽게 옮겨 사용할 수 있는 정도<br>② 정해진 조건에서 장애 없이 기능을 유지하는 정도<br>③ 사용자가 쉽게 배우고 효과적으로 사용할 수 있는 정도<\/p>","a":"<p>① 이식성  ② 신뢰성  ③ 사용성<\/p>","e":"<p>이식성, 신뢰성, 사용성의 정의다.<\/p>"}]}]},{"title":"운영체제와 네트워크","types":[{"id":"scheduling","title":"CPU 스케줄링 계산","freq":"평균 대기·반환 시간과 HRN 공식이 반복","concept":"<p><strong>반환 시간 = 종료 시각 − 도착 시각<\/strong><br><strong>대기 시간 = 반환 시간 − 실행 시간<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>기법<\/th><th>방식<\/th><th>선택 기준<\/th><\/tr><\/thead><tbody><tr><td>FCFS<\/td><td>비선점<\/td><td>먼저 도착<\/td><\/tr><tr><td>SJF<\/td><td>비선점<\/td><td>실행 시간이 가장 짧음<\/td><\/tr><tr><td>HRN<\/td><td>비선점<\/td><td>(대기 시간 + 서비스 시간) ÷ 서비스 시간이 가장 큼<\/td><\/tr><tr><td>우선순위<\/td><td>둘 다 가능<\/td><td>우선순위 값<\/td><\/tr><tr><td>SRT<\/td><td>선점<\/td><td>남은 시간이 가장 짧음<\/td><\/tr><tr><td>RR<\/td><td>선점<\/td><td>시간 할당량만큼 순환<\/td><\/tr><tr><td>MLFQ<\/td><td>선점<\/td><td>다단계 큐를 오가며 조정<\/td><\/tr><\/tbody><\/table><\/div><p>간트 차트를 먼저 그린 뒤 계산한다. RR에서 같은 시각에 도착과 시간 만료가 겹치면, 새 프로세스를 큐에 넣은 다음 만료된 프로세스를 뒤에 넣는다.<\/p>","qs":[{"s":"<p>FCFS로 처리할 때 평균 대기 시간을 계산하시오.<\/p><div class=\"tw\"><table><thead><tr><th>프로세스<\/th><th>도착<\/th><th>실행<\/th><\/tr><\/thead><tbody><tr><td>P1<\/td><td>0<\/td><td>6<\/td><\/tr><tr><td>P2<\/td><td>1<\/td><td>3<\/td><\/tr><tr><td>P3<\/td><td>2<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div>","a":"<p>4<\/p>","e":"<p>P1은 0, P2는 6 − 1 = 5, P3은 9 − 2 = 7을 기다린다. (0 + 5 + 7) ÷ 3 = 4이다.<\/p>"},{"s":"<p>비선점 SJF로 처리할 때 평균 대기 시간을 계산하시오.<\/p><div class=\"tw\"><table><thead><tr><th>프로세스<\/th><th>도착<\/th><th>실행<\/th><\/tr><\/thead><tbody><tr><td>P1<\/td><td>0<\/td><td>7<\/td><\/tr><tr><td>P2<\/td><td>2<\/td><td>4<\/td><\/tr><tr><td>P3<\/td><td>4<\/td><td>1<\/td><\/tr><tr><td>P4<\/td><td>5<\/td><td>4<\/td><\/tr><\/tbody><\/table><\/div>","a":"<p>4<\/p>","e":"<p>실행 순서는 P1, P3, P2, P4이다. 대기 시간은 0, 6, 3, 7이고 평균은 4다.<\/p>"},{"s":"<p>SRT로 처리할 때 평균 대기 시간을 계산하시오.<\/p><div class=\"tw\"><table><thead><tr><th>프로세스<\/th><th>도착<\/th><th>실행<\/th><\/tr><\/thead><tbody><tr><td>P1<\/td><td>0<\/td><td>7<\/td><\/tr><tr><td>P2<\/td><td>2<\/td><td>4<\/td><\/tr><tr><td>P3<\/td><td>4<\/td><td>1<\/td><\/tr><tr><td>P4<\/td><td>5<\/td><td>4<\/td><\/tr><\/tbody><\/table><\/div>","a":"<p>3<\/p>","e":"<p>P1(0~2), P2(2~4), P3(4~5), P2(5~7), P4(7~11), P1(11~16) 순서다. 대기 시간은 9, 1, 0, 2이고 평균은 3이다.<\/p>"},{"s":"<p>HRN 기법에서 먼저 실행되는 순서대로 프로세스를 적으시오.<\/p><div class=\"tw\"><table><thead><tr><th>프로세스<\/th><th>대기 시간<\/th><th>서비스 시간<\/th><\/tr><\/thead><tbody><tr><td>A<\/td><td>5<\/td><td>5<\/td><\/tr><tr><td>B<\/td><td>10<\/td><td>5<\/td><\/tr><tr><td>C<\/td><td>6<\/td><td>2<\/td><\/tr><\/tbody><\/table><\/div>","a":"<p>C → B → A<\/p>","e":"<p>우선순위는 A = 10 ÷ 5 = 2, B = 15 ÷ 5 = 3, C = 8 ÷ 2 = 4이다. 값이 클수록 먼저 실행한다.<\/p>"},{"s":"<p>시간 할당량이 2인 RR로 처리할 때 평균 반환 시간을 소수 둘째 자리까지 계산하시오.<\/p><div class=\"tw\"><table><thead><tr><th>프로세스<\/th><th>도착<\/th><th>실행<\/th><\/tr><\/thead><tbody><tr><td>P1<\/td><td>0<\/td><td>5<\/td><\/tr><tr><td>P2<\/td><td>1<\/td><td>3<\/td><\/tr><tr><td>P3<\/td><td>2<\/td><td>2<\/td><\/tr><\/tbody><\/table><\/div>","a":"<p>7.33<\/p>","e":"<p>P1(0~2), P2(2~4), P3(4~6), P1(6~8), P2(8~9), P1(9~10) 순서다. 반환 시간은 10, 8, 4이고 평균은 22 ÷ 3 ≒ 7.33이다.<\/p>"}]},{"id":"page-memory","title":"페이지 교체와 메모리 관리","freq":"페이지 부재 횟수 계산과 배치 전략","concept":"<div class=\"tw\"><table><thead><tr><th>교체 기법<\/th><th>내보내는 페이지<\/th><\/tr><\/thead><tbody><tr><td>FIFO<\/td><td>가장 먼저 들어온 것<\/td><\/tr><tr><td>LRU<\/td><td>가장 오랫동안 쓰지 않은 것<\/td><\/tr><tr><td>LFU<\/td><td>사용 횟수가 가장 적은 것<\/td><\/tr><tr><td>OPT<\/td><td>앞으로 가장 오랫동안 쓰지 않을 것<\/td><\/tr><\/tbody><\/table><\/div><p>처음 비어 있는 프레임에 들어갈 때도 <strong>페이지 부재에 포함<\/strong>한다.<\/p><div class=\"tw\"><table><thead><tr><th>배치 전략<\/th><th>선택<\/th><\/tr><\/thead><tbody><tr><td>최초 적합 (First Fit)<\/td><td>들어갈 수 있는 첫 공간<\/td><\/tr><tr><td>최적 적합 (Best Fit)<\/td><td>남는 공간이 가장 작은 곳<\/td><\/tr><tr><td>최악 적합 (Worst Fit)<\/td><td>남는 공간이 가장 큰 곳<\/td><\/tr><\/tbody><\/table><\/div><ul><li>페이지 번호 = 주소 ÷ 페이지 크기의 몫, 오프셋 = 나머지.<\/li><li>내부 단편화는 할당된 공간 안의 낭비이고, 외부 단편화는 흩어져 쓸 수 없는 공간이다.<\/li><li><strong>스래싱:<\/strong> 페이지 교체에 시간을 너무 많이 써서 처리 효율이 급감하는 현상이다.<\/li><li><strong>워킹 셋:<\/strong> 프로세스가 일정 시간 동안 자주 참조하는 페이지의 집합이다.<\/li><li><strong>구역성:<\/strong> 프로세스가 일부 페이지를 집중적으로 참조하는 성질이다.<\/li><\/ul>","qs":[{"s":"<p>프레임이 3개이고 참조열이 <code>1, 2, 3, 2, 4, 1, 5, 2<\/code>일 때 FIFO의 페이지 부재 횟수를 적으시오. 프레임은 처음에 비어 있다.<\/p>","a":"<p>7<\/p>","e":"<p>2의 재참조만 적중이다. 8번 참조 중 부재는 7번이다.<\/p>"},{"s":"<p>프레임이 3개이고 참조열이 <code>7, 0, 1, 2, 0, 3, 0, 4<\/code>일 때 LRU의 페이지 부재 횟수를 적으시오. 프레임은 처음에 비어 있다.<\/p>","a":"<p>6<\/p>","e":"<p>7, 0, 1 적재 후 2가 7을 교체하고, 0은 적중이다. 3이 1을 교체하고, 0은 적중이며, 4가 2를 교체한다.<\/p>"},{"s":"<p>빈 공간이 순서대로 100KB, 500KB, 200KB, 300KB, 600KB이다. 212KB를 최적 적합으로 배치할 때 선택되는 공간과 내부 단편화 크기를 적으시오.<\/p>","a":"<p>300KB, 88KB<\/p>","e":"<p>212 이상인 공간 중 가장 작은 것은 300KB이다. 300 − 212 = 88KB가 남는다.<\/p>"},{"s":"<p>페이지 크기가 1,024바이트일 때 논리 주소 5,000의 페이지 번호와 오프셋을 적으시오.<\/p>","a":"<p>페이지 번호 4, 오프셋 904<\/p>","e":"<p>5,000 ÷ 1,024의 몫은 4, 나머지는 904이다.<\/p>"},{"s":"<p>다음 설명에 해당하는 용어를 적으시오.<\/p><p>① 프로세스의 처리 시간보다 페이지 교체 시간이 더 많아져 CPU 이용률이 급격히 떨어지는 현상<br>② 프로세스가 일정 시간 동안 자주 참조하는 페이지들의 집합<\/p>","a":"<p>① 스래싱 (Thrashing)  ② 워킹 셋 (Working Set)<\/p>","e":"<p>워킹 셋을 메모리에 유지하면 스래싱을 줄일 수 있다.<\/p>"}]},{"id":"process","title":"프로세스·교착 상태·동기화","freq":"상태 전이, IPC, 교착 조건","concept":"<p><strong>프로세스 상태:<\/strong> 생성 → 준비 → 실행 → (대기) → 종료<\/p><div class=\"tw\"><table><thead><tr><th>전이<\/th><th>뜻<\/th><\/tr><\/thead><tbody><tr><td>Dispatch<\/td><td>준비 → 실행<\/td><\/tr><tr><td>Timeout<\/td><td>실행 → 준비<\/td><\/tr><tr><td>Block<\/td><td>실행 → 대기<\/td><\/tr><tr><td>Wakeup<\/td><td>대기 → 준비<\/td><\/tr><\/tbody><\/table><\/div><ul><li><strong>PCB:<\/strong> 프로세스의 상태, PID, 레지스터 등을 저장하는 자료 구조다.<\/li><li><strong>컨텍스트 스위칭:<\/strong> 실행 중인 프로세스의 상태를 저장하고 다른 프로세스의 상태를 복원한다.<\/li><li><strong>스레드:<\/strong> 프로세스의 실행 단위로 코드, 데이터, 힙을 공유하며 스택은 따로 가진다.<\/li><\/ul><p><strong>교착 상태 4조건:<\/strong> 상호 배제, 점유와 대기, 비선점, 환형 대기.<\/p><div class=\"tw\"><table><thead><tr><th>해결<\/th><th>방법<\/th><\/tr><\/thead><tbody><tr><td>예방<\/td><td>4조건 중 하나를 제거<\/td><\/tr><tr><td>회피<\/td><td>은행원 알고리즘<\/td><\/tr><tr><td>탐지<\/td><td>자원 할당 그래프<\/td><\/tr><tr><td>복구
