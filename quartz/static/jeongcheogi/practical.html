<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="정보처리기사 실기 유형별 핵심 개념과 직접 작성한 연습문제를 담은 비공식 학습 자료입니다.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>정처기 실기 유형집</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* 레이아웃: 왼쪽 목차와 답안지처럼 줄이 그어진 본문. 정답만 채점 펜 색으로 표시 */
:root{
  --paper:#f3f6f2;--sheet:#fcfdfb;--ink:#1b2a25;--muted:#5b6e66;--line:#cfdad4;
  --accent:#0d6b53;--accent-ink:#f5fbf8;--pen:#c2263a;--pen-bg:#fdf0f1;--code:#e9efeb;
  --tk:#0d5f8c;--ts:#8a4b08;--tc:#71837b;--good:#0d6b53;--bad:#c2263a;
  --serif:"Gowun Batang","Noto Serif KR",serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,"Apple SD Gothic Neo",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111816;--sheet:#172019;--ink:#dfe8e3;--muted:#9bb0a7;--line:#2f3d37;
  --accent:#62c9a8;--accent-ink:#0f1a16;--pen:#ff8d8d;--pen-bg:#2c1b1e;--code:#1f2a25;
  --tk:#7cc4ee;--ts:#e6b676;--tc:#7e9389;--good:#62c9a8;--bad:#ff8d8d;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111816;--sheet:#172019;--ink:#dfe8e3;--muted:#9bb0a7;--line:#2f3d37;
  --accent:#62c9a8;--accent-ink:#0f1a16;--pen:#ff8d8d;--pen-bg:#2c1b1e;--code:#1f2a25;
  --tk:#7cc4ee;--ts:#e6b676;--tc:#7e9389;--good:#62c9a8;--bad:#ff8d8d;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:16px/1.75 var(--sans)}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:292px minmax(0,1fr);min-height:100vh}
nav.toc{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;overflow-y:auto;padding-block:24px 48px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:16px;border-right:1px solid var(--line)}
.brand{display:block;font:700 25px/1.25 var(--serif);color:var(--ink);text-decoration:none}
.sub{font-size:13px;color:var(--muted);margin:4px 0 16px;font-variant-numeric:tabular-nums}
.toplinks{display:flex;gap:14px;font-size:14px;margin-bottom:12px}
.toc h2{font:600 12px/1.4 var(--sans);letter-spacing:.06em;color:var(--muted);margin:20px 0 6px}
.toc ul{list-style:none;margin:0;padding:0}
.toc li a{display:flex;justify-content:space-between;gap:8px;padding:5px 8px;border-radius:4px;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.4}
.toc li a:hover{background:var(--code)}
.toc li a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.toc .n{font:12px var(--mono);opacity:.75;white-space:nowrap}
main{padding-block:40px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.page{max-width:780px;margin:0 auto}
.eyebrow{font-size:13px;color:var(--muted);margin:0}
h1{font:700 clamp(30px,5vw,42px)/1.25 var(--serif);margin:4px 0 8px;text-wrap:balance}
.freq{color:var(--muted);font-size:14px;margin:0 0 28px}
h2.sec{font:700 22px/1.3 var(--serif);margin:40px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.concept p,.q p{margin:0 0 12px}
ul,ol{padding-left:22px;margin:0 0 12px}
li{margin:3px 0}
code{font:.9em var(--mono);background:var(--code);padding:1px 5px;border-radius:3px;overflow-wrap:anywhere}
.tw{overflow-x:auto;margin:0 0 16px}
table{border-collapse:collapse;font-size:15px;line-height:1.5}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
th{background:var(--code);font-weight:600;white-space:nowrap}
.concept table{min-width:60%}
pre.code{margin:0 0 14px;padding:14px 16px;background:var(--code);border-radius:4px;overflow-x:auto;font:14px/1.6 var(--mono);tab-size:4}
pre.code code{background:none;padding:0;font:inherit;overflow-wrap:normal}
.tk{color:var(--tk);font-weight:600}.ts{color:var(--ts)}.tc{color:var(--tc)}
.tb{color:var(--pen);font-weight:600}
.dbs{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:12px}
.dbt{margin:0;min-width:0}.dbt figcaption{font-size:13px;font-weight:600}.dbt .tw{margin:0}
.q{padding:22px 0 26px;border-bottom:1px solid var(--line)}
.qh{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.qno{font:700 19px var(--serif)}
.mark{font-size:13px;font-weight:600}
.mark.o{color:var(--good)}.mark.x{color:var(--bad)}
.q label{display:block;font-size:13px;color:var(--muted);margin-top:12px}
.q textarea{display:block;width:100%;min-height:46px;padding:9px 2px;border:0;border-bottom:1.5px solid var(--ink);background:repeating-linear-gradient(transparent,transparent 31px,var(--line) 32px);font:16px/32px var(--mono);color:var(--ink);resize:vertical;border-radius:0}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
button{font:600 14px var(--sans);min-height:40px;padding:0 16px;border:1px solid var(--ink);border-radius:4px;background:transparent;color:var(--ink);cursor:pointer}
button:hover{background:var(--code)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cta{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;background:var(--accent);color:var(--accent-ink);border-radius:4px;font-weight:600;text-decoration:none}
button.primary:hover{opacity:.9;background:var(--accent)}
button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ans{margin-top:14px;padding:12px 16px;background:var(--pen-bg);border-left:3px solid var(--pen)}
.ans .lab{font-size:12px;font-weight:700;color:var(--pen);letter-spacing:.04em}
.ans .val{font:600 17px/1.6 var(--mono);color:var(--pen);margin-bottom:6px}
.ans .val p{margin:0 0 4px}.ans .val pre{background:transparent;padding:0;margin:0;white-space:pre-wrap;color:inherit}
.ans .val pre .tk,.ans .val pre .ts{color:inherit}
.ans .ex p{margin:0;font-size:15px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:24px 0 0}
.bar .sp{flex:1}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:32px}
.pager a{display:block;max-width:48%;text-decoration:none;font-weight:600;font-size:15px;line-height:1.4}
.pager small{display:block;color:var(--muted);font-weight:400}
.hint{color:var(--muted);font-size:14px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin:0 0 8px;padding:0;list-style:none}
.steps b{display:block;font:700 18px var(--serif)}
.steps span{font-size:14px;color:var(--muted);line-height:1.5;display:block}
.dist{display:grid;grid-template-columns:150px minmax(0,1fr) 44px;gap:6px 12px;align-items:center;font-size:15px;margin-bottom:6px;font-variant-numeric:tabular-nums}
.dist i{display:block;height:14px;background:var(--accent)}
.dist span:nth-child(3n){text-align:right}
.menu{display:none}
.wrong a{font-weight:600}
@media (max-width:860px){
  .app{display:block}
  nav.toc{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-block:14px;padding-right:max(16px,env(safe-area-inset-right,0px));padding-left:max(16px,env(safe-area-inset-left,0px))}
  .menu{display:block;margin-top:8px}
  .menu summary{cursor:pointer;font-weight:600;min-height:32px}
  .sub{margin-bottom:4px}
  main{padding-block:24px 64px}
  .steps{grid-template-columns:minmax(0,1fr)}
  .dist{grid-template-columns:92px minmax(0,1fr) 40px}
}
@media (min-width:861px){.menu{display:block}.menu summary{display:none}}
</style>
<style>.toplinks{flex-wrap:wrap;gap:4px 14px}.toplinks a{white-space:nowrap}h1{overflow-wrap:anywhere}</style>

<script>
const DATA=[{"title":"프로그래밍 언어","types":[{"id":"c-pointer","title":"C 포인터와 배열","freq":"C 코드 문제의 절반 이상에 포인터가 등장","concept":"<p>포인터 문제는 <strong>주소가 움직이는지, 값이 바뀌는지<\/strong>만 구분하면 풀린다. 칸을 그리고 화살표를 옮긴다.<\/p><div class=\"tw\"><table><thead><tr><th>표현<\/th><th>뜻<\/th><th>바뀌는 것<\/th><\/tr><\/thead><tbody><tr><td><code>p = a<\/code><\/td><td>배열 첫 칸의 주소 저장<\/td><td>p<\/td><\/tr><tr><td><code>*p<\/code><\/td><td>p가 가리키는 칸의 값<\/td><td>없음<\/td><\/tr><tr><td><code>*p + 1<\/code><\/td><td>칸의 값에 1을 더한 결과<\/td><td>없음<\/td><\/tr><tr><td><code>*(p + 1)<\/code><\/td><td>다음 칸의 값 (<code>p[1]<\/code>과 같음)<\/td><td>없음<\/td><\/tr><tr><td><code>p++<\/code><\/td><td>화살표를 한 칸 뒤로 이동<\/td><td>p<\/td><\/tr><tr><td><code>(*p)++<\/code><\/td><td>칸의 값을 1 증가<\/td><td>칸의 값<\/td><\/tr><tr><td><code>*p++<\/code><\/td><td>현재 칸을 읽고 나서 p 이동<\/td><td>p<\/td><\/tr><\/tbody><\/table><\/div><ul><li>배열 이름은 첫 칸의 주소다. 그래서 <code>a[i]<\/code>, <code>*(a + i)<\/code>, <code>i[a]<\/code>는 모두 같다.<\/li><li>2차원 배열 <code>m[R][C]<\/code>는 메모리에 한 줄로 저장된다. <code>*(*(m + i) + j)<\/code>는 <code>m[i][j]<\/code>와 같다.<\/li><li>이중 포인터 <code>**q<\/code>는 화살표를 두 번 따라간다. <code>*q<\/code>를 바꾸면 <strong>q가 가리키는 포인터 변수<\/strong>가 바뀐다.<\/li><li>함수에 포인터를 넘겨도 포인터 변수 자체는 복사된다. 함수 안에서 <code>p = q<\/code>로 바꾼 것은 밖에 반영되지 않지만, <code>*p<\/code>에 쓴 값은 반영된다.<\/li><\/ul>","qs":[{"s":"<p>다음 C 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">int<\/span> a[5] = {2, 4, 6, 8, 10};\n    <span class=\"tk\">int<\/span> *p = a + 1;\n    printf(<span class=\"ts\">\"%d %d %d\\n\"<\/span>, *p + 1, *(p + 1), p[2]);\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","a":"<p>5 6 8<\/p>","e":"<p>p는 a[1]을 가리킨다. <code>*p + 1<\/code>은 4 + 1 = 5, <code>*(p + 1)<\/code>은 a[2] = 6, <code>p[2]<\/code>는 a[3] = 8이다.<\/p>"},{"s":"<p>다음 C 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">int<\/span> m[2][3] = {{1, 2, 3}, {4, 5, 6}};\n    <span class=\"tk\">int<\/span> *p = &amp;m[0][0];\n    printf(<span class=\"ts\">\"%d %d\\n\"<\/span>, *(p + 4), *(*(m + 1) + 2));\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","a":"<p>5 6<\/p>","e":"<p>2차원 배열은 1, 2, 3, 4, 5, 6 순서로 이어져 있다. <code>p + 4<\/code>는 다섯 번째 값 5다. <code>*(*(m + 1) + 2)<\/code>는 m[1][2] = 6이다.<\/p>"},{"s":"<p>다음 C 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">int<\/span> x = 5, y = 9;\n    <span class=\"tk\">int<\/span> *p = &amp;x;\n    <span class=\"tk\">int<\/span> **q = &amp;p;\n    *q = &amp;y;\n    **q += 1;\n    printf(<span class=\"ts\">\"%d %d %d\\n\"<\/span>, x, y, *p);\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","a":"<p>5 10 10<\/p>","e":"<p><code>*q = &amp;y<\/code>는 p 자체를 y로 돌린다. 이후 <code>**q<\/code>는 y이므로 y가 10이 되고, x는 그대로 5다.<\/p>"},{"s":"<p>다음 C 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n\n<span class=\"tk\">void<\/span> f(<span class=\"tk\">int<\/span> *b, <span class=\"tk\">int<\/span> n) {\n    <span class=\"tk\">for<\/span> (<span class=\"tk\">int<\/span> i = 0; i &lt; n; i++)\n        b[i] += i;\n}\n\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">int<\/span> a[4] = {1, 3, 5, 7};\n    f(a + 1, 3);\n    <span class=\"tk\">for<\/span> (<span class=\"tk\">int<\/span> i = 0; i &lt; 4; i++)\n        printf(<span class=\"ts\">\"%d \"<\/span>, a[i]);\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","a":"<p>1 3 6 9<\/p>","e":"<p>b[0]은 a[1]이다. a[1] += 0, a[2] += 1, a[3] += 2가 되어 1 3 6 9다.<\/p>"},{"s":"<p>다음 C 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n\n<span class=\"tk\">void<\/span> sw(<span class=\"tk\">int<\/span> *p, <span class=\"tk\">int<\/span> *q) {\n    <span class=\"tk\">int<\/span> *t = p;\n    p = q;\n    q = t;\n    *p = *p + 1;\n}\n\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">int<\/span> a = 1, b = 5;\n    sw(&amp;a, &amp;b);\n    printf(<span class=\"ts\">\"%d %d\\n\"<\/span>, a, b);\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","a":"<p>1 6<\/p>","e":"<p>함수 안에서 지역 포인터 p와 q만 서로 바뀐다. 바뀐 p는 b를 가리키므로 b만 6이 된다.<\/p>"}]},{"id":"c-advanced","title":"C 배열 포인터·sizeof·함수 포인터·동적 할당","freq":"2026년 1·2회에 sizeof, 배열 포인터, 함수 포인터 출제","concept":"<p>선언은 <strong>변수 이름에서 시작해 괄호 안쪽부터<\/strong> 읽는다.<\/p><div class=\"tw\"><table><thead><tr><th>선언<\/th><th>뜻<\/th><\/tr><\/thead><tbody><tr><td><code>int *p[3]<\/code><\/td><td>int 포인터 3개짜리 <strong>포인터 배열<\/strong><\/td><\/tr><tr><td><code>int (*p)[3]<\/code><\/td><td>int 3칸 배열 하나를 가리키는 <strong>배열 포인터<\/strong><\/td><\/tr><tr><td><code>int (*f)(int)<\/code><\/td><td>int를 받아 int를 돌려주는 <strong>함수 포인터<\/strong><\/td><\/tr><tr><td><code>int (*f[2])(int)<\/code><\/td><td>함수 포인터 2개짜리 배열<\/td><\/tr><tr><td><code>int **p<\/code><\/td><td>int 포인터를 가리키는 포인터<\/td><\/tr><\/tbody><\/table><\/div><p><code>p + 1<\/code>은 <strong>가리키는 대상의 크기만큼<\/strong> 이동한다. <code>int (*p)[4]<\/code>는 p++ 한 번에 int 4칸을 건너뛰므로 2차원 배열의 다음 행으로 간다.<\/p><div class=\"tw\"><table><thead><tr><th>sizeof<\/th><th>결과<\/th><\/tr><\/thead><tbody><tr><td><code>sizeof(a)<\/code> (a는 배열)<\/td><td>배열 전체 크기<\/td><\/tr><tr><td><code>sizeof(a) / sizeof(a[0])<\/code><\/td><td>원소 수<\/td><\/tr><tr><td>매개변수 <code>int b[]<\/code>의 <code>sizeof(b)<\/code><\/td><td>포인터 크기. 배열 크기가 아님<\/td><\/tr><tr><td><code>sizeof(*p)<\/code> (p는 <code>int (*)[4]<\/code>)<\/td><td>16 (int가 4바이트일 때)<\/td><\/tr><\/tbody><\/table><\/div><ul><li>함수의 매개변수에 쓴 배열은 포인터로 바뀐다. 이 점이 sizeof 문제의 함정이다.<\/li><li>함수 안에서 호출한 쪽의 포인터를 바꾸려면 이중 포인터를 넘긴다. <code>*p = malloc(...)<\/code>.<\/li><li>매크로는 <strong>글자 그대로 치환<\/strong>한다. <code>#define SQ(x) x*x<\/code>에서 <code>SQ(1+2)<\/code>는 <code>1+2*1+2<\/code>이다.<\/li><li><code>%x<\/code>는 16진수 소문자, <code>%o<\/code>는 8진수, <code>%c<\/code>는 문자로 출력한다.<\/li><\/ul>","qs":[{"s":"<p>다음 C 프로그램의 출력 결과를 적으시오. int는 4바이트이다.<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n\n<span class=\"tk\">int<\/span> f(<span class=\"tk\">int<\/span> *b) {\n    <span class=\"tk\">return<\/span> <span class=\"tk\">sizeof<\/span>(b) == <span class=\"tk\">sizeof<\/span>(<span class=\"tk\">int<\/span> *);\n}\n\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">int<\/span> a[8] = {0};\n    printf(<span class=\"ts\">\"%d %d %d\\n\"<\/span>, (<span class=\"tk\">int<\/span>)<span class=\"tk\">sizeof<\/span>(a), (<span class=\"tk\">int<\/span>)(<span class=\"tk\">sizeof<\/span>(a) / <span class=\"tk\">sizeof<\/span>(a[0])), f(a));\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","a":"<p>32 8 1<\/p>","e":"<p>main의 a는 배열이므로 4 × 8 = 32바이트, 원소 수는 8이다. f의 b는 포인터이므로 비교 결과는 참(1)이다.<\/p>"},{"s":"<p>다음 C 프로그램의 출력 결과를 적으시오. int는 4바이트이다.<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">int<\/span> m[2][4] = {{1, 2, 3, 4}, {5, 6, 7, 8}};\n    <span class=\"tk\">int<\/span> (*p)[4] = m;\n    p++;\n    printf(<span class=\"ts\">\"%d %d\\n\"<\/span>, (*p)[1], (<span class=\"tk\">int<\/span>)<span class=\"tk\">sizeof<\/span>(*p));\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","a":"<p>6 16<\/p>","e":"<p>p는 4칸 배열을 가리키므로 p++는 다음 행으로 간다. <code>(*p)[1]<\/code>은 m[1][1] = 6이고, <code>*p<\/code>는 int 4칸 배열이라 16바이트다.<\/p>"},{"s":"<p>다음 C 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n#<span class=\"tk\">include<\/span> &lt;string.h&gt;\n\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">char<\/span> *s[] = {<span class=\"ts\">\"red\"<\/span>, <span class=\"ts\">\"green\"<\/span>, <span class=\"ts\">\"blue\"<\/span>};\n    printf(<span class=\"ts\">\"%c %s %d\\n\"<\/span>, *s[1], s[2] + 1, (<span class=\"tk\">int<\/span>)strlen(*(s + 1)));\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","a":"<p>g lue 5<\/p>","e":"<p>s[1]은 \"green\"의 첫 글자 주소다. s[2] + 1은 \"lue\"이고, <code>*(s + 1)<\/code>은 \"green\"이므로 길이는 5다.<\/p>"},{"s":"<p>다음 C 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n\n<span class=\"tk\">int<\/span> add(<span class=\"tk\">int<\/span> a, <span class=\"tk\">int<\/span> b) { <span class=\"tk\">return<\/span> a + b; }\n<span class=\"tk\">int<\/span> mul(<span class=\"tk\">int<\/span> a, <span class=\"tk\">int<\/span> b) { <span class=\"tk\">return<\/span> a * b; }\n\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">int<\/span> (*f[2])(<span class=\"tk\">int<\/span>, <span class=\"tk\">int<\/span>) = {add, mul};\n    <span class=\"tk\">int<\/span> r = 0;\n    <span class=\"tk\">for<\/span> (<span class=\"tk\">int<\/span> i = 0; i &lt; 2; i++)\n        r += f[i](3, 4);\n    printf(<span class=\"ts\">\"%d\\n\"<\/span>, r);\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","a":"<p>19<\/p>","e":"<p>f[0]은 add로 7, f[1]은 mul로 12를 돌려준다. 합은 19다.<\/p>"},{"s":"<p>다음 C 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n#<span class=\"tk\">include<\/span> &lt;stdlib.h&gt;\n\n<span class=\"tk\">void<\/span> alloc(<span class=\"tk\">int<\/span> **p, <span class=\"tk\">int<\/span> n) {\n    *p = malloc(n * <span class=\"tk\">sizeof<\/span>(<span class=\"tk\">int<\/span>));\n    <span class=\"tk\">for<\/span> (<span class=\"tk\">int<\/span> i = 0; i &lt; n; i++)\n        (*p)[i] = i * i;\n}\n\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">int<\/span> *a = <span class=\"tk\">NULL<\/span>;\n    alloc(&amp;a, 4);\n    printf(<span class=\"ts\">\"%d\\n\"<\/span>, a[3] - a[1]);\n    free(a);\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","a":"<p>8<\/p>","e":"<p>이중 포인터로 main의 a 자체를 바꾼다. a는 0, 1, 4, 9이므로 9 − 1 = 8이다.<\/p>"},{"s":"<p>다음 C 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n#<span class=\"tk\">define<\/span> SQ(x) x * x\n\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    printf(<span class=\"ts\">\"%d %x\\n\"<\/span>, SQ(1 + 2), 255);\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","a":"<p>5 ff<\/p>","e":"<p>치환하면 1 + 2 * 1 + 2 = 5이다. 괄호가 없어 9가 아니다. 255는 16진수로 ff이다.<\/p>"}]},{"id":"c-string","title":"C 문자열","freq":"C 코드 문제 54개 중 16개가 문자열 처리","concept":"<p>C 문자열은 <strong>문자 배열 + 끝을 알리는 <code>'\\0'<\/code><\/strong>이다.<\/p><ul><li><code>char s[] = \"ABC\"<\/code>의 크기는 4칸이고, <code>strlen(s)<\/code>는 <code>'\\0'<\/code>을 빼고 3이다.<\/li><li><code>s + 2<\/code>를 <code>%s<\/code>로 출력하면 2번 칸부터 끝까지 출력한다. <code>%c<\/code>와 <code>s[2]<\/code>는 한 글자다.<\/li><li><code>char s[]<\/code>는 수정할 수 있지만 <code>char *p = \"ABC\"<\/code>의 문자열 상수는 수정하면 안 된다.<\/li><li>대문자 + 32 = 소문자이다. <code>'A'<\/code>는 65, <code>'a'<\/code>는 97, <code>'0'<\/code>은 48이다.<\/li><li>함수가 전역 버퍼의 주소를 돌려주면 호출할 때마다 <strong>같은 주소<\/strong>가 돌아온다. 앞서 받은 포인터도 새 내용을 보게 된다.<\/li><li><code>strcpy(a, b)<\/code>는 b를 a에 복사하고, <code>strcat(a, b)<\/code>는 a 뒤에 붙이며, <code>strcmp(a, b)<\/code>는 같을 때 0을 돌려준다.<\/li><\/ul>","qs":[{"s":"<p>다음 C 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n#<span class=\"tk\">include<\/span> &lt;string.h&gt;\n\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">char<\/span> s[] = <span class=\"ts\">\"ENGINEER\"<\/span>;\n    printf(<span class=\"ts\">\"%d %c %s\\n\"<\/span>, (<span class=\"tk\">int<\/span>)strlen(s), s[3], s + 5);\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","a":"<p>8 I EER<\/p>","e":"<p>E(0) N(1) G(2) I(3) N(4) E(5) E(6) R(7)이다. 길이는 8, s[3]은 I, s + 5부터는 EER이다.<\/p>"},{"s":"<p>다음 C 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n#<span class=\"tk\">include<\/span> &lt;string.h&gt;\n\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">char<\/span> s[] = <span class=\"ts\">\"ABCDE\"<\/span>;\n    <span class=\"tk\">int<\/span> i = 0, j = strlen(s) - 1;\n    <span class=\"tk\">while<\/span> (i &lt; j) {\n        <span class=\"tk\">char<\/span> t = s[i];\n        s[i] = s[j];\n        s[j] = t;\n        i += 2;\n        j<span class=\"tc\">--;<\/span>\n    }\n    printf(<span class=\"ts\">\"%s\\n\"<\/span>, s);\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","a":"<p>EBDCA<\/p>","e":"<p>(i, j) = (0, 4)에서 교환하면 EBCDA, (2, 3)에서 교환하면 EBDCA다. 다음은 i = 4, j = 2라 멈춘다.<\/p>"},{"s":"<p>다음 C 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">char<\/span> s[] = <span class=\"ts\">\"aB3dE\"<\/span>;\n    <span class=\"tk\">for<\/span> (<span class=\"tk\">int<\/span> i = 0; s[i] != <span class=\"ts\">'\\0'<\/span>; i++) {\n        <span class=\"tk\">if<\/span> (s[i] &gt;= <span class=\"ts\">'a'<\/span> &amp;&amp; s[i] &lt;= <span class=\"ts\">'z'<\/span>)\n            s[i] = s[i] - 32;\n        <span class=\"tk\">else<\/span> <span class=\"tk\">if<\/span> (s[i] &gt;= <span class=\"ts\">'A'<\/span> &amp;&amp; s[i] &lt;= <span class=\"ts\">'Z'<\/span>)\n            s[i] = s[i] + 32;\n        <span class=\"tk\">else<\/span>\n            s[i] = <span class=\"ts\">'*'<\/span>;\n    }\n    printf(<span class=\"ts\">\"%s\\n\"<\/span>, s);\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","a":"<p>Ab*De<\/p>","e":"<p>소문자는 대문자로, 대문자는 소문자로, 그 밖의 문자는 *로 바뀐다.<\/p>"},{"s":"<p>다음 C 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">char<\/span> a[] = <span class=\"ts\">\"CODE\"<\/span>, b[] = <span class=\"ts\">\"DECK\"<\/span>;\n    <span class=\"tk\">int<\/span> n = 0;\n    <span class=\"tk\">for<\/span> (<span class=\"tk\">int<\/span> i = 0; a[i]; i++)\n        <span class=\"tk\">for<\/span> (<span class=\"tk\">int<\/span> j = 0; b[j]; j++)\n            <span class=\"tk\">if<\/span> (a[i] == b[j]) {\n                n++;\n                <span class=\"tk\">break<\/span>;\n            }\n    printf(<span class=\"ts\">\"%d\\n\"<\/span>, n);\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","a":"<p>3<\/p>","e":"<p>a의 글자 중 C, D, E가 b에 있다. O는 없다.<\/p>"},{"s":"<p>다음 C 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n#<span class=\"tk\">include<\/span> &lt;string.h&gt;\n\n<span class=\"tk\">char<\/span> buf[10];\n\n<span class=\"tk\">char<\/span> *f(<span class=\"tk\">const<\/span> <span class=\"tk\">char<\/span> *s) {\n    strcpy(buf, s);\n    <span class=\"tk\">return<\/span> buf;\n}\n\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">char<\/span> *p = f(<span class=\"ts\">\"AB\"<\/span>);\n    <span class=\"tk\">char<\/span> *q = f(<span class=\"ts\">\"XYZ\"<\/span>);\n    printf(<span class=\"ts\">\"%s %s\\n\"<\/span>, p, q);\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","a":"<p>XYZ XYZ<\/p>","e":"<p>p와 q는 둘 다 전역 배열 buf의 주소다. 두 번째 호출이 내용을 덮어썼으므로 둘 다 XYZ를 출력한다.<\/p>"}]},{"id":"c-struct","title":"C 구조체와 연결 리스트","freq":"C 코드 문제 54개 중 15개에 구조체 등장","concept":"<p>구조체는 <strong>여러 값을 묶은 한 칸<\/strong>이고, 연결 리스트는 그 칸끼리 포인터로 이은 것이다.<\/p><div class=\"tw\"><table><thead><tr><th>문법<\/th><th>사용 대상<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td><code>.<\/code><\/td><td>구조체 변수<\/td><td><code>s.x<\/code><\/td><\/tr><tr><td><code>-&gt;<\/code><\/td><td>구조체 포인터<\/td><td><code>p-&gt;x<\/code> (= <code>(*p).x<\/code>)<\/td><\/tr><\/tbody><\/table><\/div><ul><li>구조체를 함수에 그대로 넘기면 <strong>전체가 복사<\/strong>된다. 원본을 바꾸려면 포인터로 넘긴다.<\/li><li><code>struct<\/code> 대입은 멤버를 복사한다. 멤버가 포인터면 주소만 복사되어 두 구조체가 같은 대상을 가리킨다.<\/li><li>구조체 배열에서 <code>p++<\/code>는 구조체 하나 크기만큼 이동한다.<\/li><li>연결 리스트 삭제는 <code>prev-&gt;next = cur-&gt;next<\/code>, 삽입은 <code>new-&gt;next = prev-&gt;next<\/code> 다음에 <code>prev-&gt;next = new<\/code> 순서다.<\/li><li>뒤집기는 prev, cur, next 세 포인터를 쓴다. 다음 칸을 먼저 저장한 뒤 <code>cur-&gt;next = prev<\/code>로 방향을 바꾼다.<\/li><\/ul>","qs":[{"s":"<p>다음 C 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n\n<span class=\"tk\">struct<\/span> P {\n    <span class=\"tk\">char<\/span> n[8];\n    <span class=\"tk\">int<\/span> s;\n};\n\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">struct<\/span> P a[3] = {{<span class=\"ts\">\"kim\"<\/span>, 70}, {<span class=\"ts\">\"lee\"<\/span>, 90}, {<span class=\"ts\">\"park\"<\/span>, 80}};\n    <span class=\"tk\">struct<\/span> P *p = a;\n    p++;\n    printf(<span class=\"ts\">\"%s %d\\n\"<\/span>, p-&gt;n, (p + 1)-&gt;s + p-&gt;s);\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","a":"<p>lee 170<\/p>","e":"<p>p는 a[1]이다. 이름은 lee, 점수 합은 80 + 90 = 170이다.<\/p>"},{"s":"<p>다음 C 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n\n<span class=\"tk\">struct<\/span> V {\n    <span class=\"tk\">int<\/span> x;\n};\n\n<span class=\"tk\">void<\/span> f(<span class=\"tk\">struct<\/span> V v) { v.x = 9; }\n<span class=\"tk\">void<\/span> g(<span class=\"tk\">struct<\/span> V *v) { v-&gt;x += 2; }\n\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">struct<\/span> V s = {1};\n    f(s);\n    g(&amp;s);\n    printf(<span class=\"ts\">\"%d\\n\"<\/span>, s.x);\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","a":"<p>3<\/p>","e":"<p>f는 복사본만 바꾸고, g는 원본을 바꾼다. 1 + 2 = 3이다.<\/p>"},{"s":"<p>다음 C 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n\n<span class=\"tk\">struct<\/span> N {\n    <span class=\"tk\">int<\/span> v;\n    <span class=\"tk\">struct<\/span> N *next;\n};\n\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">struct<\/span> N c = {3, <span class=\"tk\">NULL<\/span>};\n    <span class=\"tk\">struct<\/span> N b = {2, &amp;c};\n    <span class=\"tk\">struct<\/span> N a = {1, &amp;b};\n    a.next = b.next;\n    <span class=\"tk\">for<\/span> (<span class=\"tk\">struct<\/span> N *p = &amp;a; p != <span class=\"tk\">NULL<\/span>; p = p-&gt;next)\n        printf(<span class=\"ts\">\"%d \"<\/span>, p-&gt;v);\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","a":"<p>1 3<\/p>","e":"<p>a가 b를 건너뛰고 c를 가리키게 되어 b가 리스트에서 빠진다.<\/p>"},{"s":"<p>다음 C 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n\n<span class=\"tk\">struct<\/span> N {\n    <span class=\"tk\">int<\/span> v;\n    <span class=\"tk\">struct<\/span> N *next;\n};\n\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">struct<\/span> N z = {6, <span class=\"tk\">NULL<\/span>};\n    <span class=\"tk\">struct<\/span> N y = {5, &amp;z};\n    <span class=\"tk\">struct<\/span> N x = {4, &amp;y};\n    <span class=\"tk\">struct<\/span> N *prev = <span class=\"tk\">NULL<\/span>, *cur = &amp;x, *nx;\n    <span class=\"tk\">while<\/span> (cur != <span class=\"tk\">NULL<\/span>) {\n        nx = cur-&gt;next;\n        cur-&gt;next = prev;\n        prev = cur;\n        cur = nx;\n    }\n    <span class=\"tk\">for<\/span> (cur = prev; cur != <span class=\"tk\">NULL<\/span>; cur = cur-&gt;next)\n        printf(<span class=\"ts\">\"%d \"<\/span>, cur-&gt;v);\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","a":"<p>6 5 4<\/p>","e":"<p>리스트의 방향을 뒤집는 코드다. 마지막 prev는 z이므로 6, 5, 4 순서로 출력한다.<\/p>"},{"s":"<p>다음 C 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n\n<span class=\"tk\">struct<\/span> B {\n    <span class=\"tk\">int<\/span> *p;\n};\n\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">int<\/span> v = 3;\n    <span class=\"tk\">struct<\/span> B b, c;\n    b.p = &amp;v;\n    *b.p += 4;\n    c = b;\n    *c.p *= 2;\n    printf(<span class=\"ts\">\"%d\\n\"<\/span>, v);\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","a":"<p>14<\/p>","e":"<p>구조체를 복사해도 멤버 p는 같은 v를 가리킨다. v는 3 + 4 = 7이 되고, 다시 2배가 되어 14다.<\/p>"}]},{"id":"c-datastruct","title":"C 스택·큐·트리 구현 추적","freq":"복원 분석 글 기준 2026년 1회 최고 난도가 트리 후위 순회, 2025년 1회에 연결 큐","concept":"<p>구조를 <strong>그림으로 그리고<\/strong> 호출마다 그림을 고친다.<\/p><div class=\"tw\"><table><thead><tr><th>구조<\/th><th>삽입<\/th><th>삭제<\/th><th>주의<\/th><\/tr><\/thead><tbody><tr><td>배열 스택<\/td><td><code>st[++top] = v<\/code><\/td><td><code>st[top--]<\/code><\/td><td>비어 있으면 top = -1<\/td><\/tr><tr><td>원형 큐<\/td><td><code>q[r] = v; r = (r + 1) % N<\/code><\/td><td><code>q[f]; f = (f + 1) % N<\/code><\/td><td>한 칸을 비워 두면 최대 N - 1개<\/td><\/tr><tr><td>연결 큐<\/td><td>rear 뒤에 연결<\/td><td>front를 다음 노드로<\/td><td>마지막 노드를 빼면 rear도 NULL<\/td><\/tr><\/tbody><\/table><\/div><p><strong>트리 순회<\/strong><\/p><ul><li>전위: 나 → 왼쪽 → 오른쪽<\/li><li>중위: 왼쪽 → 나 → 오른쪽<\/li><li>후위: 왼쪽 → 오른쪽 → 나<\/li><\/ul><p>재귀 트리 문제는 먼저 구조체 초기화를 보고 <strong>트리를 그린다.<\/strong> <code>printf<\/code>가 재귀 호출의 앞, 사이, 뒤 중 어디에 있는지로 순회 방식이 정해진다.<\/p><p><code>typedef struct Node { ... } Node;<\/code>는 <code>struct Node<\/code>를 <code>Node<\/code>로 줄여 쓰게 하는 선언이다.<\/p>","qs":[{"s":"<p>다음 C 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n#<span class=\"tk\">define<\/span> MAX 5\n\n<span class=\"tk\">int<\/span> st[MAX], top = -1;\n\n<span class=\"tk\">void<\/span> push(<span class=\"tk\">int<\/span> v) {\n    <span class=\"tk\">if<\/span> (top &lt; MAX - 1)\n        st[++top] = v;\n}\n\n<span class=\"tk\">int<\/span> pop(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">return<\/span> top &gt;= 0 ? st[top<span class=\"tc\">--] : -1;<\/span>\n}\n\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    push(3);\n    push(7);\n    printf(<span class=\"ts\">\"%d \"<\/span>, pop());\n    push(5);\n    <span class=\"tk\">int<\/span> x = pop();\n    <span class=\"tk\">int<\/span> y = pop();\n    push(x * 10 + y);\n    printf(<span class=\"ts\">\"%d \"<\/span>, pop());\n    printf(<span class=\"ts\">\"%d\\n\"<\/span>, pop());\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","a":"<p>7 53 -1<\/p>","e":"<p>7을 꺼낸 뒤 5를 넣는다. x = 5, y = 3이므로 53을 넣고 꺼낸다. 이제 스택이 비어 -1이다.<\/p>"},{"s":"<p>다음 C 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n#<span class=\"tk\">define<\/span> N 4\n\n<span class=\"tk\">int<\/span> q[N], f = 0, r = 0;\n\n<span class=\"tk\">void<\/span> enq(<span class=\"tk\">int<\/span> v) {\n    <span class=\"tk\">if<\/span> ((r + 1) % N == f)\n        <span class=\"tk\">return<\/span>;\n    q[r] = v;\n    r = (r + 1) % N;\n}\n\n<span class=\"tk\">int<\/span> deq(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">if<\/span> (f == r)\n        <span class=\"tk\">return<\/span> -1;\n    <span class=\"tk\">int<\/span> v = q[f];\n    f = (f + 1) % N;\n    <span class=\"tk\">return<\/span> v;\n}\n\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    enq(1);\n    enq(2);\n    enq(3);\n    enq(4);\n    printf(<span class=\"ts\">\"%d \"<\/span>, deq());\n    enq(5);\n    <span class=\"tk\">for<\/span> (<span class=\"tk\">int<\/span> i = 0; i &lt; 4; i++)\n        printf(<span class=\"ts\">\"%d \"<\/span>, deq());\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","a":"<p>1 2 3 5 -1<\/p>","e":"<p>크기가 4지만 한 칸을 비워 두므로 3개까지만 들어가 4는 무시된다. 1을 뺀 뒤 5가 들어가고, 2, 3, 5 다음은 비어서 -1이다.<\/p>"},{"s":"<p>다음 C 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n\n<span class=\"tk\">struct<\/span> T {\n    <span class=\"tk\">int<\/span> v;\n    <span class=\"tk\">struct<\/span> T *l, *r;\n};\n\n<span class=\"tk\">void<\/span> post(<span class=\"tk\">struct<\/span> T *t) {\n    <span class=\"tk\">if<\/span> (t == <span class=\"tk\">NULL<\/span>)\n        <span class=\"tk\">return<\/span>;\n    post(t-&gt;l);\n    post(t-&gt;r);\n    printf(<span class=\"ts\">\"%d \"<\/span>, t-&gt;v);\n}\n\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">struct<\/span> T d = {4, <span class=\"tk\">NULL<\/span>, <span class=\"tk\">NULL<\/span>};\n    <span class=\"tk\">struct<\/span> T e = {5, <span class=\"tk\">NULL<\/span>, <span class=\"tk\">NULL<\/span>};\n    <span class=\"tk\">struct<\/span> T b = {2, &amp;d, &amp;e};\n    <span class=\"tk\">struct<\/span> T c = {3, <span class=\"tk\">NULL<\/span>, <span class=\"tk\">NULL<\/span>};\n    <span class=\"tk\">struct<\/span> T a = {1, &amp;b, &amp;c};\n    post(&amp;a);\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","a":"<p>4 5 2 3 1<\/p>","e":"<p>1의 자식은 2와 3, 2의 자식은 4와 5이다. 왼쪽, 오른쪽, 자신 순서로 출력한다.<\/p>"},{"s":"<p>다음 C 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n\n<span class=\"tk\">struct<\/span> T {\n    <span class=\"tk\">int<\/span> v;\n    <span class=\"tk\">struct<\/span> T *l, *r;\n};\n\n<span class=\"tk\">int<\/span> height(<span class=\"tk\">struct<\/span> T *t) {\n    <span class=\"tk\">if<\/span> (t == <span class=\"tk\">NULL<\/span>)\n        <span class=\"tk\">return<\/span> 0;\n    <span class=\"tk\">int<\/span> a = height(t-&gt;l), b = height(t-&gt;r);\n    <span class=\"tk\">return<\/span> 1 + (a &gt; b ? a : b);\n}\n\n<span class=\"tk\">int<\/span> leaves(<span class=\"tk\">struct<\/span> T *t) {\n    <span class=\"tk\">if<\/span> (t == <span class=\"tk\">NULL<\/span>)\n        <span class=\"tk\">return<\/span> 0;\n    <span class=\"tk\">if<\/span> (t-&gt;l == <span class=\"tk\">NULL<\/span> &amp;&amp; t-&gt;r == <span class=\"tk\">NULL<\/span>)\n        <span class=\"tk\">return<\/span> 1;\n    <span class=\"tk\">return<\/span> leaves(t-&gt;l) + leaves(t-&gt;r);\n}\n\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">struct<\/span> T d = {4, <span class=\"tk\">NULL<\/span>, <span class=\"tk\">NULL<\/span>};\n    <span class=\"tk\">struct<\/span> T b = {2, &amp;d, <span class=\"tk\">NULL<\/span>};\n    <span class=\"tk\">struct<\/span> T c = {3, <span class=\"tk\">NULL<\/span>, <span class=\"tk\">NULL<\/span>};\n    <span class=\"tk\">struct<\/span> T a = {1, &amp;b, &amp;c};\n    printf(<span class=\"ts\">\"%d %d\\n\"<\/span>, height(&amp;a), leaves(&amp;a));\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","a":"<p>3 2<\/p>","e":"<p>가장 긴 경로는 1-2-4로 높이 3이다. 자식이 없는 노드는 4와 3이다.<\/p>"},{"s":"<p>다음 C 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n#<span class=\"tk\">include<\/span> &lt;stdlib.h&gt;\n\n<span class=\"tk\">typedef<\/span> <span class=\"tk\">struct<\/span> Node {\n    <span class=\"tk\">int<\/span> v;\n    <span class=\"tk\">struct<\/span> Node *next;\n} Node;\n\n<span class=\"tk\">typedef<\/span> <span class=\"tk\">struct<\/span> {\n    Node *front, *rear;\n} Queue;\n\n<span class=\"tk\">void<\/span> enq(Queue *q, <span class=\"tk\">int<\/span> v) {\n    Node *n = malloc(<span class=\"tk\">sizeof<\/span>(Node));\n    n-&gt;v = v;\n    n-&gt;next = <span class=\"tk\">NULL<\/span>;\n    <span class=\"tk\">if<\/span> (q-&gt;rear)\n        q-&gt;rear-&gt;next = n;\n    <span class=\"tk\">else<\/span>\n        q-&gt;front = n;\n    q-&gt;rear = n;\n}\n\n<span class=\"tk\">int<\/span> deq(Queue *q) {\n    Node *n = q-&gt;front;\n    <span class=\"tk\">int<\/span> v = n-&gt;v;\n    q-&gt;front = n-&gt;next;\n    <span class=\"tk\">if<\/span> (q-&gt;front == <span class=\"tk\">NULL<\/span>)\n        q-&gt;rear = <span class=\"tk\">NULL<\/span>;\n    free(n);\n    <span class=\"tk\">return<\/span> v;\n}\n\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    Queue q = {<span class=\"tk\">NULL<\/span>, <span class=\"tk\">NULL<\/span>};\n    <span class=\"tk\">for<\/span> (<span class=\"tk\">int<\/span> i = 1; i &lt;= 3; i++)\n        enq(&amp;q, i * 3);\n    <span class=\"tk\">int<\/span> x = deq(&amp;q);\n    enq(&amp;q, x + 10);\n    <span class=\"tk\">while<\/span> (q.front)\n        printf(<span class=\"ts\">\"%d \"<\/span>, deq(&amp;q));\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","a":"<p>6 9 13<\/p>","e":"<p>3, 6, 9를 넣고 3을 꺼낸 뒤 13을 넣는다. 남은 순서는 6, 9, 13이다.<\/p>"}]},{"id":"c-operator","title":"C 연산자·제어문·재귀","freq":"비트 연산이 C 코드 문제 54개 중 13개","concept":"<p>이 유형은 연산 규칙을 정확히 적용하면 틀리지 않는다.<\/p><div class=\"tw\"><table><thead><tr><th>연산<\/th><th>규칙<\/th><th>예 (12와 10)<\/th><\/tr><\/thead><tbody><tr><td><code>&amp;<\/code><\/td><td>둘 다 1일 때 1<\/td><td>1100 &amp; 1010 = 1000 → 8<\/td><\/tr><tr><td><code>|<\/code><\/td><td>하나라도 1이면 1<\/td><td>1110 → 14<\/td><\/tr><tr><td><code>^<\/code><\/td><td>서로 다를 때 1<\/td><td>0110 → 6<\/td><\/tr><tr><td><code>~n<\/code><\/td><td>모든 비트 반전<\/td><td><code>~n<\/code> = -(n + 1)<\/td><\/tr><tr><td><code>&lt;&lt; k<\/code><\/td><td>왼쪽 이동<\/td><td>n × 2^k<\/td><\/tr><tr><td><code>&gt;&gt; k<\/code><\/td><td>오른쪽 이동<\/td><td>양수는 n ÷ 2^k의 몫<\/td><\/tr><\/tbody><\/table><\/div><ul><li>단락 평가: <code>A &amp;&amp; B<\/code>에서 A가 거짓이면 B를 실행하지 않고, <code>A || B<\/code>에서 A가 참이면 B를 실행하지 않는다. B 안의 <code>++<\/code>도 실행되지 않는다.<\/li><li><code>a++<\/code>는 값을 먼저 쓰고 증가하며, <code>++a<\/code>는 증가한 뒤 쓴다.<\/li><li><code>switch<\/code>는 <code>break<\/code>를 만날 때까지 아래 <code>case<\/code>를 계속 실행한다.<\/li><li><code>for<\/code>에서 <code>continue<\/code>는 증감식으로, <code>while<\/code>에서 <code>continue<\/code>는 조건식으로 간다.<\/li><li>재귀는 호출을 아래로 적어 내려가고, 기저 조건부터 값을 위로 채운다.<\/li><\/ul>","qs":[{"s":"<p>다음 C 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">int<\/span> a = 12, b = 10;\n    printf(<span class=\"ts\">\"%d %d %d %d\\n\"<\/span>, a &amp; b, a | b, a ^ b, a &lt;&lt; 2);\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","a":"<p>8 14 6 48<\/p>","e":"<p>1100과 1010을 비트별로 계산하면 8, 14, 6이다. 12를 왼쪽으로 2비트 옮기면 12 × 4 = 48이다.<\/p>"},{"s":"<p>다음 C 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">int<\/span> n = 6;\n    printf(<span class=\"ts\">\"%d %d\\n\"<\/span>, ~n, n &gt;&gt; 1);\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","a":"<p>-7 3<\/p>","e":"<p><code>~n<\/code>은 -(n + 1) = -7이고, 6 &gt;&gt; 1은 3이다.<\/p>"},{"s":"<p>다음 C 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">int<\/span> n = 2, r = 0;\n    <span class=\"tk\">switch<\/span> (n) {\n    <span class=\"tk\">case<\/span> 1:\n        r += 1;\n        <span class=\"tc\">/* fall through */<\/span>\n    <span class=\"tk\">case<\/span> 2:\n        r += 2;\n        <span class=\"tc\">/* fall through */<\/span>\n    <span class=\"tk\">case<\/span> 3:\n        r += 3;\n        <span class=\"tk\">break<\/span>;\n    <span class=\"tk\">default<\/span>:\n        r += 10;\n    }\n    printf(<span class=\"ts\">\"%d\\n\"<\/span>, r);\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","a":"<p>5<\/p>","e":"<p>case 2부터 들어가 break가 있는 case 3까지 실행한다. 2 + 3 = 5이다.<\/p>"},{"s":"<p>다음 C 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n\n<span class=\"tk\">int<\/span> f(<span class=\"tk\">int<\/span> n) {\n    <span class=\"tk\">if<\/span> (n &lt;= 1)\n        <span class=\"tk\">return<\/span> 1;\n    <span class=\"tk\">return<\/span> n + f(n - 2);\n}\n\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    printf(<span class=\"ts\">\"%d\\n\"<\/span>, f(7));\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","a":"<p>16<\/p>","e":"<p>7 + 5 + 3 + f(1) = 7 + 5 + 3 + 1 = 16이다.<\/p>"},{"s":"<p>다음 C 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">int<\/span> a = 0, b = 3;\n    <span class=\"tk\">int<\/span> c = a++ &amp;&amp; ++b;\n    <span class=\"tk\">int<\/span> d = a++ || ++b;\n    printf(<span class=\"ts\">\"%d %d %d %d\\n\"<\/span>, a, b, c, d);\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","a":"<p>2 3 0 1<\/p>","e":"<p>첫 줄의 a++ 값은 0이라 ++b를 건너뛰고 c = 0이다. 둘째 줄의 a++ 값은 1이라 역시 건너뛰고 d = 1이다. a는 두 번 증가해 2이고 b는 3이다.<\/p>"}]},{"id":"java-inherit","title":"Java 상속과 오버라이딩","freq":"Java 코드 문제 54개 중 15개가 상속","concept":"<p>핵심은 <strong>무엇이 실행 시점의 객체를 따르고, 무엇이 선언 타입을 따르는지<\/strong> 구분하는 것이다.<\/p><div class=\"tw\"><table><thead><tr><th>대상<\/th><th><code>A o = new B();<\/code>에서 결정 기준<\/th><\/tr><\/thead><tbody><tr><td>인스턴스 메서드<\/td><td>실제 객체 B (동적 바인딩)<\/td><\/tr><tr><td>필드<\/td><td>선언 타입 A<\/td><\/tr><tr><td>static 메서드<\/td><td>선언 타입 A<\/td><\/tr><tr><td>private 메서드<\/td><td>오버라이딩되지 않음<\/td><\/tr><\/tbody><\/table><\/div><ul><li>부모 클래스의 메서드 안에서 호출한 메서드도 실제 객체의 것이 실행된다.<\/li><li>생성자는 <strong>부모부터<\/strong> 실행된다. 첫 줄에 <code>super()<\/code>가 없으면 컴파일러가 넣는다.<\/li><li>부모 생성자 안에서 오버라이딩된 메서드를 부르면 자식 필드는 아직 초기화 전이다. int는 0으로 보인다.<\/li><li><code>super.f()<\/code>는 바로 위 부모의 메서드를 호출한다.<\/li><\/ul>","qs":[{"s":"<p>다음 Java 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"java\"><code><span class=\"tk\">class<\/span> A {\n    <span class=\"tk\">void<\/span> show() { System.out.print(<span class=\"ts\">\"A\"<\/span>); }\n    <span class=\"tk\">void<\/span> run() { show(); }\n}\n\n<span class=\"tk\">class<\/span> B <span class=\"tk\">extends<\/span> A {\n    <span class=\"tk\">void<\/span> show() { System.out.print(<span class=\"ts\">\"B\"<\/span>); }\n}\n\n<span class=\"tk\">public<\/span> <span class=\"tk\">class<\/span> Main {\n    <span class=\"tk\">public<\/span> <span class=\"tk\">static<\/span> <span class=\"tk\">void<\/span> main(String[] args) {\n        A o = <span class=\"tk\">new<\/span> B();\n        o.run();\n    }\n}<\/code><\/pre>","a":"<p>B<\/p>","e":"<p>run은 A의 메서드지만, 그 안의 show는 실제 객체 B의 메서드가 실행된다.<\/p>"},{"s":"<p>다음 Java 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"java\"><code><span class=\"tk\">class<\/span> A {\n    <span class=\"tk\">int<\/span> v = 1;\n    <span class=\"tk\">int<\/span> get() { <span class=\"tk\">return<\/span> v; }\n}\n\n<span class=\"tk\">class<\/span> B <span class=\"tk\">extends<\/span> A {\n    <span class=\"tk\">int<\/span> v = 2;\n    <span class=\"tk\">int<\/span> get() { <span class=\"tk\">return<\/span> v + 10; }\n}\n\n<span class=\"tk\">public<\/span> <span class=\"tk\">class<\/span> Main {\n    <span class=\"tk\">public<\/span> <span class=\"tk\">static<\/span> <span class=\"tk\">void<\/span> main(String[] args) {\n        A o = <span class=\"tk\">new<\/span> B();\n        System.out.println(o.v + <span class=\"ts\">\" \"<\/span> + o.get());\n    }\n}<\/code><\/pre>","a":"<p>1 12<\/p>","e":"<p>필드는 선언 타입 A를 따라 1이다. 메서드는 B의 것이 실행되고, 그 안의 v는 B의 v이므로 12다.<\/p>"},{"s":"<p>다음 Java 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"java\"><code><span class=\"tk\">class<\/span> A {\n    A() { f(); }\n    <span class=\"tk\">void<\/span> f() { System.out.print(<span class=\"ts\">\"A\"<\/span>); }\n}\n\n<span class=\"tk\">class<\/span> B <span class=\"tk\">extends<\/span> A {\n    <span class=\"tk\">int<\/span> x = 5;\n    B() { f(); }\n    <span class=\"tk\">void<\/span> f() { System.out.print(x); }\n}\n\n<span class=\"tk\">public<\/span> <span class=\"tk\">class<\/span> Main {\n    <span class=\"tk\">public<\/span> <span class=\"tk\">static<\/span> <span class=\"tk\">void<\/span> main(String[] args) {\n        <span class=\"tk\">new<\/span> B();\n    }\n}<\/code><\/pre>","a":"<p>05<\/p>","e":"<p>A 생성자가 먼저 돌 때 B의 x는 아직 0이므로 0을 출력한다. 이어서 x가 5로 초기화되고 B 생성자가 5를 출력한다.<\/p>"},{"s":"<p>다음 Java 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"java\"><code><span class=\"tk\">class<\/span> A {\n    <span class=\"tk\">static<\/span> String m() { <span class=\"tk\">return<\/span> <span class=\"ts\">\"A\"<\/span>; }\n    String n() { <span class=\"tk\">return<\/span> <span class=\"ts\">\"a\"<\/span>; }\n}\n\n<span class=\"tk\">class<\/span> B <span class=\"tk\">extends<\/span> A {\n    <span class=\"tk\">static<\/span> String m() { <span class=\"tk\">return<\/span> <span class=\"ts\">\"B\"<\/span>; }\n    String n() { <span class=\"tk\">return<\/span> <span class=\"ts\">\"b\"<\/span>; }\n}\n\n<span class=\"tk\">public<\/span> <span class=\"tk\">class<\/span> Main {\n    <span class=\"tk\">public<\/span> <span class=\"tk\">static<\/span> <span class=\"tk\">void<\/span> main(String[] args) {\n        A o = <span class=\"tk\">new<\/span> B();\n        System.out.println(o.m() + o.n());\n    }\n}<\/code><\/pre>","a":"<p>Ab<\/p>","e":"<p>static 메서드는 선언 타입 A의 것이 호출되고, 인스턴스 메서드는 B의 것이 호출된다.<\/p>"},{"s":"<p>다음 Java 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"java\"><code><span class=\"tk\">class<\/span> A {\n    <span class=\"tk\">int<\/span> f(<span class=\"tk\">int<\/span> x) { <span class=\"tk\">return<\/span> x + 1; }\n}\n\n<span class=\"tk\">class<\/span> B <span class=\"tk\">extends<\/span> A {\n    <span class=\"tk\">int<\/span> f(<span class=\"tk\">int<\/span> x) { <span class=\"tk\">return<\/span> <span class=\"tk\">super<\/span>.f(x) * 2; }\n}\n\n<span class=\"tk\">class<\/span> C <span class=\"tk\">extends<\/span> B {\n    <span class=\"tk\">int<\/span> f(<span class=\"tk\">int<\/span> x) { <span class=\"tk\">return<\/span> <span class=\"tk\">super<\/span>.f(x) - 3; }\n}\n\n<span class=\"tk\">public<\/span> <span class=\"tk\">class<\/span> Main {\n    <span class=\"tk\">public<\/span> <span class=\"tk\">static<\/span> <span class=\"tk\">void<\/span> main(String[] args) {\n        System.out.println(<span class=\"tk\">new<\/span> C().f(4));\n    }\n}<\/code><\/pre>","a":"<p>7<\/p>","e":"<p>A에서 5, B에서 10, C에서 7이 된다.<\/p>"}]},{"id":"java-recursive","title":"Java 재귀·오버라이딩 혼합과 컴파일 오류","freq":"재귀와 오버라이딩을 섞은 함정 문제, 복원 분석 글 기준 2026년 1회 생성자 누락 쟁점","concept":"<p>재귀 호출도 <strong>실제 객체의 메서드<\/strong>로 들어간다. <code>super.f()<\/code>로 부모에 올라가도, 부모 안에서 호출한 <code>f()<\/code>는 다시 자식의 f다 (private, static 메서드 제외).<\/p><p>재귀는 작은 n부터 <strong>표를 만들어<\/strong> 푸는 것이 안전하다. 조건이 <code>n &lt;= 1<\/code>이면 음수도 기저 조건에 걸린다.<\/p><div class=\"tw\"><table><thead><tr><th>구분<\/th><th>결정 시점<\/th><th>기준<\/th><\/tr><\/thead><tbody><tr><td>오버로딩 선택<\/td><td>컴파일<\/td><td>참조 변수의 선언 타입에 있는 메서드 중, 인수의 선언 타입에 맞는 것<\/td><\/tr><tr><td>오버라이딩 실행<\/td><td>실행<\/td><td>실제 객체<\/td><\/tr><\/tbody><\/table><\/div><p>그래서 <code>A a = new B();<\/code>에서 B에만 있는 오버로딩 메서드는 <code>a<\/code>로 고를 수 없다.<\/p><p><strong>예외 흐름<\/strong><\/p><ul><li>catch는 위에서부터 첫 번째로 맞는 하나만 실행한다.<\/li><li><code>continue<\/code>, <code>return<\/code>이 있어도 finally는 실행한다.<\/li><\/ul><p><strong>컴파일 오류 단골<\/strong><\/p><ul><li>static 메서드에서 인스턴스 필드나 인스턴스 메서드에 직접 접근<\/li><li>부모에 기본 생성자가 없는데 자식이 <code>super(...)<\/code>를 호출하지 않음. 생성자는 상속되지 않음<\/li><li>추상 클래스를 <code>new<\/code>로 생성<\/li><li>final 변수 재대입, final 메서드 오버라이딩<\/li><\/ul>","qs":[{"s":"<p>다음 Java 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"java\"><code><span class=\"tk\">class<\/span> P {\n    <span class=\"tk\">int<\/span> g(<span class=\"tk\">int<\/span> n) {\n        <span class=\"tk\">if<\/span> (n == 0) <span class=\"tk\">return<\/span> 1;\n        <span class=\"tk\">return<\/span> h(n - 1) + 1;\n    }\n    <span class=\"tk\">int<\/span> h(<span class=\"tk\">int<\/span> n) { <span class=\"tk\">return<\/span> g(n); }\n}\n\n<span class=\"tk\">class<\/span> C <span class=\"tk\">extends<\/span> P {\n    <span class=\"tk\">int<\/span> h(<span class=\"tk\">int<\/span> n) { <span class=\"tk\">return<\/span> 2 * <span class=\"tk\">super<\/span>.h(n); }\n}\n\n<span class=\"tk\">public<\/span> <span class=\"tk\">class<\/span> Main {\n    <span class=\"tk\">public<\/span> <span class=\"tk\">static<\/span> <span class=\"tk\">void<\/span> main(String[] args) {\n        P o = <span class=\"tk\">new<\/span> C();\n        System.out.println(o.g(2));\n    }\n}<\/code><\/pre>","a":"<p>7<\/p>","e":"<p>g 안의 h는 C의 h다. g(0) = 1, C.h(0) = 2, g(1) = 3, C.h(1) = 6, g(2) = 7이다.<\/p>"},{"s":"<p>다음 Java 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"java\"><code><span class=\"tk\">class<\/span> A {\n    <span class=\"tk\">int<\/span> f(<span class=\"tk\">int<\/span> n) {\n        <span class=\"tk\">return<\/span> n &lt;= 0 ? 0 : n + f(n - 1);\n    }\n}\n\n<span class=\"tk\">class<\/span> B <span class=\"tk\">extends<\/span> A {\n    <span class=\"tk\">int<\/span> f(<span class=\"tk\">int<\/span> n) {\n        <span class=\"tk\">return<\/span> <span class=\"tk\">super<\/span>.f(n) * 2;\n    }\n}\n\n<span class=\"tk\">public<\/span> <span class=\"tk\">class<\/span> Main {\n    <span class=\"tk\">public<\/span> <span class=\"tk\">static<\/span> <span class=\"tk\">void<\/span> main(String[] args) {\n        System.out.println(<span class=\"tk\">new<\/span> B().f(2));\n    }\n}<\/code><\/pre>","a":"<p>8<\/p>","e":"<p>A의 f 안에서 호출한 f는 B의 f다. B.f(0) = 0, A.f(1) = 1, B.f(1) = 2, A.f(2) = 2 + 2 = 4, B.f(2) = 8이다.<\/p>"},{"s":"<p>다음 Java 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"java\"><code><span class=\"tk\">class<\/span> A {\n    String f(Object o) { <span class=\"tk\">return<\/span> <span class=\"ts\">\"A-O\"<\/span>; }\n}\n\n<span class=\"tk\">class<\/span> B <span class=\"tk\">extends<\/span> A {\n    String f(Object o) { <span class=\"tk\">return<\/span> <span class=\"ts\">\"B-O\"<\/span>; }\n    String f(String s) { <span class=\"tk\">return<\/span> <span class=\"ts\">\"B-S\"<\/span>; }\n}\n\n<span class=\"tk\">public<\/span> <span class=\"tk\">class<\/span> Main {\n    <span class=\"tk\">public<\/span> <span class=\"tk\">static<\/span> <span class=\"tk\">void<\/span> main(String[] args) {\n        A a = <span class=\"tk\">new<\/span> B();\n        B b = <span class=\"tk\">new<\/span> B();\n        System.out.println(a.f(<span class=\"ts\">\"x\"<\/span>) + <span class=\"ts\">\" \"<\/span> + b.f(<span class=\"ts\">\"x\"<\/span>));\n    }\n}<\/code><\/pre>","a":"<p>B-O B-S<\/p>","e":"<p>a의 선언 타입 A에는 <code>f(Object)<\/code>만 있어 이것이 선택되고, 실행은 B의 재정의가 된다. b는 더 구체적인 <code>f(String)<\/code>을 선택한다.<\/p>"},{"s":"<p>다음 Java 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"java\"><code><span class=\"tk\">public<\/span> <span class=\"tk\">class<\/span> Main {\n    <span class=\"tk\">public<\/span> <span class=\"tk\">static<\/span> <span class=\"tk\">void<\/span> main(String[] args) {\n        <span class=\"tk\">for<\/span> (<span class=\"tk\">int<\/span> i = 0; i &lt; 3; i++) {\n            <span class=\"tk\">try<\/span> {\n                <span class=\"tk\">if<\/span> (i == 1) <span class=\"tk\">throw<\/span> <span class=\"tk\">new<\/span> IllegalArgumentException();\n                <span class=\"tk\">if<\/span> (i == 2) <span class=\"tk\">throw<\/span> <span class=\"tk\">new<\/span> RuntimeException();\n                System.out.print(<span class=\"ts\">\"P\"<\/span> + i);\n            } <span class=\"tk\">catch<\/span> (IllegalArgumentException e) {\n                System.out.print(<span class=\"ts\">\"I\"<\/span> + i);\n                <span class=\"tk\">continue<\/span>;\n            } <span class=\"tk\">catch<\/span> (RuntimeException e) {\n                System.out.print(<span class=\"ts\">\"R\"<\/span> + i);\n            } <span class=\"tk\">finally<\/span> {\n                System.out.print(<span class=\"ts\">\"F\"<\/span>);\n            }\n        }\n    }\n}<\/code><\/pre>","a":"<p>P0FI1FR2F<\/p>","e":"<p>continue가 있어도 finally를 실행한다. IllegalArgumentException은 첫 catch에서 잡힌다.<\/p>"},{"s":"<p>다음 Java 코드는 컴파일되지 않는다. 오류의 원인을 쓰고, 정수 x를 받아 부모에게 넘기는 B 클래스의 생성자를 한 줄로 작성하시오.<\/p><pre class=\"code\" data-lang=\"text\"><code>class A {\n    int x;\n    A(int x) { this.x = x; }\n}\n\nclass B extends A {\n}<\/code><\/pre>","a":"<p>A에 기본 생성자가 없어 B의 기본 생성자에서 호출하는 <code>super()<\/code>를 찾을 수 없다.<br><code>B(int x) { super(x); }<\/code><\/p>","e":"<p>생성자는 상속되지 않는다. 부모에 인자 없는 생성자가 없으면 자식이 <code>super(값)<\/code>을 직접 호출해야 한다.<\/p>"}]},{"id":"java-static","title":"Java static·생성자·오버로딩","freq":"static 9개, this·super 6개 출제","concept":"<ul><li><strong>static 필드<\/strong>는 클래스에 하나만 있고 모든 객체가 공유한다. 인스턴스 필드는 객체마다 따로 있다.<\/li><li>초기화 순서: static 블록(클래스 최초 사용 시 1회) → 인스턴스 초기화 블록 → 생성자.<\/li><li><code>this(...)<\/code>는 같은 클래스의 다른 생성자를 호출한다. 호출된 생성자가 끝난 뒤 나머지 줄이 실행된다.<\/li><li><strong>오버로딩<\/strong>은 이름이 같고 매개변수가 다른 메서드다. 컴파일 시점에 인자 타입으로 고른다.<\/li><li>선택 순서: 정확히 일치 → 더 넓은 기본형으로 자동 변환(<code>byte → short → int → long → float → double<\/code>, <code>char → int<\/code>) → 박싱 → 가변 인자.<\/li><li>Java의 인자 전달은 값 복사다. 다만 배열이나 객체는 참조값이 복사되므로 내용을 바꾸면 호출한 쪽에서도 보인다.<\/li><\/ul><div class=\"tw\"><table><thead><tr><th>구분<\/th><th>오버로딩<\/th><th>오버라이딩<\/th><\/tr><\/thead><tbody><tr><td>위치<\/td><td>같은 클래스<\/td><td>상속 관계<\/td><\/tr><tr><td>시그니처<\/td><td>매개변수가 다름<\/td><td>동일<\/td><\/tr><tr><td>결정 시점<\/td><td>컴파일<\/td><td>실행<\/td><\/tr><\/tbody><\/table><\/div>","qs":[{"s":"<p>다음 Java 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"java\"><code><span class=\"tk\">class<\/span> C {\n    <span class=\"tk\">static<\/span> <span class=\"tk\">int<\/span> s = 0;\n    <span class=\"tk\">int<\/span> i = 0;\n    C() { s++; i++; }\n}\n\n<span class=\"tk\">public<\/span> <span class=\"tk\">class<\/span> Main {\n    <span class=\"tk\">public<\/span> <span class=\"tk\">static<\/span> <span class=\"tk\">void<\/span> main(String[] args) {\n        C a = <span class=\"tk\">new<\/span> C();\n        C b = <span class=\"tk\">new<\/span> C();\n        C c = <span class=\"tk\">new<\/span> C();\n        System.out.println(C.s + <span class=\"ts\">\" \"<\/span> + c.i);\n    }\n}<\/code><\/pre>","a":"<p>3 1<\/p>","e":"<p>s는 세 객체가 공유해 3이 되고, i는 객체마다 따로라 1이다.<\/p>"},{"s":"<p>다음 Java 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"java\"><code><span class=\"tk\">class<\/span> P {\n    <span class=\"tk\">int<\/span> x, y;\n    P() { <span class=\"tk\">this<\/span>(1); x += 1; }\n    P(<span class=\"tk\">int<\/span> x) { <span class=\"tk\">this<\/span>(x, 2); y += 1; }\n    P(<span class=\"tk\">int<\/span> x, <span class=\"tk\">int<\/span> y) { <span class=\"tk\">this<\/span>.x = x; <span class=\"tk\">this<\/span>.y = y; }\n}\n\n<span class=\"tk\">public<\/span> <span class=\"tk\">class<\/span> Main {\n    <span class=\"tk\">public<\/span> <span class=\"tk\">static<\/span> <span class=\"tk\">void<\/span> main(String[] args) {\n        P p = <span class=\"tk\">new<\/span> P();\n        System.out.println(p.x + <span class=\"ts\">\" \"<\/span> + p.y);\n    }\n}<\/code><\/pre>","a":"<p>2 3<\/p>","e":"<p>가장 안쪽 생성자가 x = 1, y = 2로 설정한다. 돌아오면서 y는 3, x는 2가 된다.<\/p>"},{"s":"<p>다음 Java 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"java\"><code><span class=\"tk\">public<\/span> <span class=\"tk\">class<\/span> Main {\n    <span class=\"tk\">static<\/span> <span class=\"tk\">void<\/span> f(<span class=\"tk\">int<\/span> a) { System.out.print(<span class=\"ts\">\"int \"<\/span>); }\n    <span class=\"tk\">static<\/span> <span class=\"tk\">void<\/span> f(<span class=\"tk\">long<\/span> a) { System.out.print(<span class=\"ts\">\"long \"<\/span>); }\n    <span class=\"tk\">static<\/span> <span class=\"tk\">void<\/span> f(<span class=\"tk\">double<\/span> a) { System.out.print(<span class=\"ts\">\"double \"<\/span>); }\n\n    <span class=\"tk\">public<\/span> <span class=\"tk\">static<\/span> <span class=\"tk\">void<\/span> main(String[] args) {\n        <span class=\"tk\">byte<\/span> b = 1;\n        f(b);\n        f(3L);\n        f(3.0f);\n        f(<span class=\"ts\">'a'<\/span>);\n    }\n}<\/code><\/pre>","a":"<p>int long double int<\/p>","e":"<p>byte와 char는 가장 가까운 int로, float는 double로 넓혀진다.<\/p>"},{"s":"<p>다음 Java 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"java\"><code><span class=\"tk\">class<\/span> T {\n    <span class=\"tk\">static<\/span> { System.out.print(<span class=\"ts\">\"S\"<\/span>); }\n    { System.out.print(<span class=\"ts\">\"I\"<\/span>); }\n    T() { System.out.print(<span class=\"ts\">\"C\"<\/span>); }\n}\n\n<span class=\"tk\">public<\/span> <span class=\"tk\">class<\/span> Main {\n    <span class=\"tk\">public<\/span> <span class=\"tk\">static<\/span> <span class=\"tk\">void<\/span> main(String[] args) {\n        <span class=\"tk\">new<\/span> T();\n        <span class=\"tk\">new<\/span> T();\n    }\n}<\/code><\/pre>","a":"<p>SICIC<\/p>","e":"<p>static 블록은 한 번만 실행된다. 객체를 만들 때마다 초기화 블록과 생성자가 실행된다.<\/p>"},{"s":"<p>다음 Java 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"java\"><code><span class=\"tk\">public<\/span> <span class=\"tk\">class<\/span> Main {\n    <span class=\"tk\">static<\/span> <span class=\"tk\">void<\/span> f(<span class=\"tk\">int<\/span>[] a, <span class=\"tk\">int<\/span> b) {\n        a[0] += 1;\n        b += 1;\n    }\n\n    <span class=\"tk\">public<\/span> <span class=\"tk\">static<\/span> <span class=\"tk\">void<\/span> main(String[] args) {\n        <span class=\"tk\">int<\/span>[] x = {1};\n        <span class=\"tk\">int<\/span> y = 1;\n        f(x, y);\n        System.out.println(x[0] + <span class=\"ts\">\" \"<\/span> + y);\n    }\n}<\/code><\/pre>","a":"<p>2 1<\/p>","e":"<p>배열은 참조가 복사되어 내용 변경이 반영된다. 기본형 b는 값이 복사되어 y는 그대로다.<\/p>"}]},{"id":"java-misc","title":"Java 예외·문자열·추상 클래스·컬렉션","freq":"문자열 5개, 인터페이스 4개, 예외 3개","concept":"<ul><li><code>finally<\/code>는 <code>return<\/code> 전에도 반드시 실행된다. catch 블록의 반환값을 정해 둔 뒤 finally를 실행하고 돌아간다.<\/li><li>catch는 위에서부터 맞는 것 하나만 실행된다. 예외가 없으면 건너뛴다.<\/li><li>문자열 비교: <code>==<\/code>는 참조 비교, <code>equals<\/code>는 내용 비교다. 같은 리터럴은 상수 풀에서 공유되지만 <code>new String<\/code>은 새 객체다.<\/li><li><code>substring(a, b)<\/code>는 a 이상 b 미만이다. <code>indexOf<\/code>는 없으면 -1이다.<\/li><li>추상 클래스는 일부만 구현할 수 있고 객체를 직접 만들 수 없다. 인터페이스의 메서드는 기본이 public abstract이므로 구현할 때 <code>public<\/code>을 붙여야 한다.<\/li><li><code>List&lt;Integer&gt;<\/code>에서 <code>remove(1)<\/code>은 <strong>1번 위치<\/strong> 삭제이고, <code>remove(Integer.valueOf(1))<\/code>은 <strong>값 1<\/strong> 삭제다.<\/li><\/ul>","qs":[{"s":"<p>다음 Java 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"java\"><code><span class=\"tk\">public<\/span> <span class=\"tk\">class<\/span> Main {\n    <span class=\"tk\">static<\/span> <span class=\"tk\">int<\/span> f() {\n        <span class=\"tk\">try<\/span> {\n            <span class=\"tk\">throw<\/span> <span class=\"tk\">new<\/span> RuntimeException();\n        } <span class=\"tk\">catch<\/span> (RuntimeException e) {\n            System.out.print(<span class=\"ts\">\"c\"<\/span>);\n            <span class=\"tk\">return<\/span> 1;\n        } <span class=\"tk\">finally<\/span> {\n            System.out.print(<span class=\"ts\">\"f\"<\/span>);\n        }\n    }\n\n    <span class=\"tk\">public<\/span> <span class=\"tk\">static<\/span> <span class=\"tk\">void<\/span> main(String[] args) {\n        System.out.println(f());\n    }\n}<\/code><\/pre>","a":"<p>cf1<\/p>","e":"<p>catch에서 c를 출력하고 반환값 1을 정한다. finally에서 f를 출력한 뒤 main이 1을 출력한다.<\/p>"},{"s":"<p>다음 Java 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"java\"><code><span class=\"tk\">public<\/span> <span class=\"tk\">class<\/span> Main {\n    <span class=\"tk\">public<\/span> <span class=\"tk\">static<\/span> <span class=\"tk\">void<\/span> main(String[] args) {\n        String a = <span class=\"ts\">\"hi\"<\/span>;\n        String b = <span class=\"ts\">\"hi\"<\/span>;\n        String c = <span class=\"tk\">new<\/span> String(<span class=\"ts\">\"hi\"<\/span>);\n        System.out.println((a == b) + <span class=\"ts\">\" \"<\/span> + (a == c) + <span class=\"ts\">\" \"<\/span> + a.equals(c));\n    }\n}<\/code><\/pre>","a":"<p>true false true<\/p>","e":"<p>a와 b는 상수 풀의 같은 객체다. c는 새 객체이므로 <code>==<\/code>는 거짓, 내용 비교는 참이다.<\/p>"},{"s":"<p>다음 Java 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"java\"><code><span class=\"tk\">public<\/span> <span class=\"tk\">class<\/span> Main {\n    <span class=\"tk\">public<\/span> <span class=\"tk\">static<\/span> <span class=\"tk\">void<\/span> main(String[] args) {\n        String s = <span class=\"ts\">\"PROGRAM\"<\/span>;\n        System.out.println(s.substring(2, 5) + s.indexOf(<span class=\"ts\">\"R\"<\/span>) + s.charAt(6));\n    }\n}<\/code><\/pre>","a":"<p>OGR1M<\/p>","e":"<p>2번 이상 5번 미만은 OGR이다. R이 처음 나오는 위치는 1이고, 6번 글자는 M이다.<\/p>"},{"s":"<p>다음 Java 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"java\"><code><span class=\"tk\">abstract<\/span> <span class=\"tk\">class<\/span> S {\n    <span class=\"tk\">abstract<\/span> <span class=\"tk\">int<\/span> area();\n    <span class=\"tk\">int<\/span> twice() { <span class=\"tk\">return<\/span> area() * 2; }\n}\n\n<span class=\"tk\">interface<\/span> N {\n    String name();\n}\n\n<span class=\"tk\">class<\/span> Q <span class=\"tk\">extends<\/span> S <span class=\"tk\">implements<\/span> N {\n    <span class=\"tk\">int<\/span> a;\n    Q(<span class=\"tk\">int<\/span> a) { <span class=\"tk\">this<\/span>.a = a; }\n    <span class=\"tk\">int<\/span> area() { <span class=\"tk\">return<\/span> a * a; }\n    <span class=\"tk\">public<\/span> String name() { <span class=\"tk\">return<\/span> <span class=\"ts\">\"Q\"<\/span>; }\n}\n\n<span class=\"tk\">public<\/span> <span class=\"tk\">class<\/span> Main {\n    <span class=\"tk\">public<\/span> <span class=\"tk\">static<\/span> <span class=\"tk\">void<\/span> main(String[] args) {\n        S s = <span class=\"tk\">new<\/span> Q(3);\n        System.out.println(((N) s).name() + s.twice());\n    }\n}<\/code><\/pre>","a":"<p>Q18<\/p>","e":"<p>twice 안의 area는 Q의 구현이 실행되어 9 × 2 = 18이다.<\/p>"},{"s":"<p>다음 Java 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"java\"><code><span class=\"tk\">import<\/span> java.util.ArrayList;\n<span class=\"tk\">import<\/span> java.util.List;\n\n<span class=\"tk\">public<\/span> <span class=\"tk\">class<\/span> Main {\n    <span class=\"tk\">public<\/span> <span class=\"tk\">static<\/span> <span class=\"tk\">void<\/span> main(String[] args) {\n        List&lt;Integer&gt; list = <span class=\"tk\">new<\/span> ArrayList&lt;&gt;();\n        list.add(3);\n        list.add(5);\n        list.add(0, 1);\n        list.remove(1);\n        list.remove(Integer.valueOf(5));\n        System.out.println(list + <span class=\"ts\">\" \"<\/span> + list.size());\n    }\n}<\/code><\/pre>","a":"<p>[1] 1<\/p>","e":"<p>[1, 3, 5]에서 1번 위치의 3을 지우면 [1, 5]이고, 값 5를 지우면 [1]이다.<\/p>"}]},{"id":"java-modern","title":"Java 컬렉션·싱글톤·익명 클래스·enum·스레드","freq":"기출과 블로그 풀이에서 HashSet, 싱글톤, 스레드 등장","concept":"<div class=\"tw\"><table><thead><tr><th>컬렉션<\/th><th>특징<\/th><\/tr><\/thead><tbody><tr><td><code>ArrayList<\/code><\/td><td>순서 있음, 중복 허용<\/td><\/tr><tr><td><code>HashSet<\/code><\/td><td>중복 없음. <code>add<\/code>는 새로 추가될 때만 true<\/td><\/tr><tr><td><code>HashMap<\/code><\/td><td>키 중복 없음. 같은 키로 <code>put<\/code>하면 값을 덮어씀<\/td><\/tr><\/tbody><\/table><\/div><p><strong>싱글톤:<\/strong> private 생성자와 static 필드로 객체를 하나만 만든다. <code>getInstance()<\/code>를 몇 번 호출해도 같은 객체이므로 상태가 누적된다.<\/p><p><strong>익명 클래스와 람다:<\/strong> <code>new 인터페이스() { 구현 }<\/code>, <code>x -&gt; x + 1<\/code>은 인터페이스 구현을 간단히 쓴 것이다.<\/p><p><strong>enum:<\/strong> <code>values()<\/code>는 전체 배열, <code>ordinal()<\/code>은 0부터 시작하는 순서, <code>name()<\/code>은 이름이다.<\/p><p><strong>스레드:<\/strong> <code>start()<\/code>는 새 스레드를 만들어 <code>run()<\/code>을 실행하고, <code>run()<\/code>을 직접 부르면 일반 메서드 호출이다.<\/p><p><strong>StringBuilder:<\/strong> <code>append<\/code>, <code>insert<\/code>, <code>reverse<\/code>, <code>deleteCharAt<\/code>은 원본을 바꾼다. String은 바뀌지 않는다.<\/p>","qs":[{"s":"<p>다음 Java 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"java\"><code><span class=\"tk\">import<\/span> java.util.HashSet;\n<span class=\"tk\">import<\/span> java.util.Set;\n\n<span class=\"tk\">public<\/span> <span class=\"tk\">class<\/span> Main {\n    <span class=\"tk\">public<\/span> <span class=\"tk\">static<\/span> <span class=\"tk\">void<\/span> main(String[] args) {\n        Set&lt;Integer&gt; s = <span class=\"tk\">new<\/span> HashSet&lt;&gt;();\n        s.add(1);\n        s.add(2);\n        s.add(2);\n        s.add(3);\n        <span class=\"tk\">boolean<\/span> r = s.add(3);\n        s.remove(1);\n        System.out.println(s.size() + <span class=\"ts\">\" \"<\/span> + r + <span class=\"ts\">\" \"<\/span> + s.contains(1));\n    }\n}<\/code><\/pre>","a":"<p>2 false false<\/p>","e":"<p>{1, 2, 3}에서 3은 이미 있어 add는 false다. 1을 지우면 크기는 2이다.<\/p>"},{"s":"<p>다음 Java 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"java\"><code><span class=\"tk\">import<\/span> java.util.HashMap;\n<span class=\"tk\">import<\/span> java.util.Map;\n\n<span class=\"tk\">public<\/span> <span class=\"tk\">class<\/span> Main {\n    <span class=\"tk\">public<\/span> <span class=\"tk\">static<\/span> <span class=\"tk\">void<\/span> main(String[] args) {\n        Map&lt;String, Integer&gt; m = <span class=\"tk\">new<\/span> HashMap&lt;&gt;();\n        m.put(<span class=\"ts\">\"a\"<\/span>, 1);\n        m.put(<span class=\"ts\">\"b\"<\/span>, 2);\n        m.put(<span class=\"ts\">\"a\"<\/span>, 5);\n        m.put(<span class=\"ts\">\"b\"<\/span>, m.get(<span class=\"ts\">\"b\"<\/span>) + m.getOrDefault(<span class=\"ts\">\"c\"<\/span>, 10));\n        System.out.println(m.get(<span class=\"ts\">\"a\"<\/span>) + <span class=\"ts\">\" \"<\/span> + m.get(<span class=\"ts\">\"b\"<\/span>) + <span class=\"ts\">\" \"<\/span> + m.size());\n    }\n}<\/code><\/pre>","a":"<p>5 12 2<\/p>","e":"<p>같은 키는 덮어쓴다. c가 없으므로 기본값 10을 더해 b는 12이고, 키는 a, b 두 개다.<\/p>"},{"s":"<p>다음 Java 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"java\"><code><span class=\"tk\">class<\/span> S {\n    <span class=\"tk\">private<\/span> <span class=\"tk\">static<\/span> S i;\n    <span class=\"tk\">int<\/span> c = 0;\n    <span class=\"tk\">private<\/span> S() {}\n    <span class=\"tk\">static<\/span> S get() {\n        <span class=\"tk\">if<\/span> (i == <span class=\"tk\">null<\/span>) i = <span class=\"tk\">new<\/span> S();\n        <span class=\"tk\">return<\/span> i;\n    }\n    <span class=\"tk\">void<\/span> up() { c++; }\n}\n\n<span class=\"tk\">public<\/span> <span class=\"tk\">class<\/span> Main {\n    <span class=\"tk\">public<\/span> <span class=\"tk\">static<\/span> <span class=\"tk\">void<\/span> main(String[] args) {\n        S a = S.get();\n        S b = S.get();\n        a.up();\n        b.up();\n        S.get().up();\n        System.out.println(a.c + <span class=\"ts\">\" \"<\/span> + (a == b));\n    }\n}<\/code><\/pre>","a":"<p>3 true<\/p>","e":"<p>모두 같은 객체이므로 up이 세 번 누적되고 참조도 같다.<\/p>"},{"s":"<p>다음 Java 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"java\"><code><span class=\"tk\">interface<\/span> F {\n    <span class=\"tk\">int<\/span> ap(<span class=\"tk\">int<\/span> x);\n}\n\n<span class=\"tk\">public<\/span> <span class=\"tk\">class<\/span> Main {\n    <span class=\"tk\">public<\/span> <span class=\"tk\">static<\/span> <span class=\"tk\">void<\/span> main(String[] args) {\n        F a = x -&gt; x + 1;\n        F b = <span class=\"tk\">new<\/span> F() {\n            <span class=\"tk\">public<\/span> <span class=\"tk\">int<\/span> ap(<span class=\"tk\">int<\/span> x) { <span class=\"tk\">return<\/span> x * 2; }\n        };\n        System.out.println(a.ap(b.ap(3)));\n    }\n}<\/code><\/pre>","a":"<p>7<\/p>","e":"<p>b가 3 × 2 = 6을 만들고, a가 1을 더해 7이다.<\/p>"},{"s":"<p>다음 Java 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"java\"><code>enum C { R, G, B }\n\n<span class=\"tk\">public<\/span> <span class=\"tk\">class<\/span> Main {\n    <span class=\"tk\">public<\/span> <span class=\"tk\">static<\/span> <span class=\"tk\">void<\/span> main(String[] args) {\n        StringBuilder s = <span class=\"tk\">new<\/span> StringBuilder(<span class=\"ts\">\"ab\"<\/span>);\n        s.append(C.values().length).insert(0, C.G.ordinal()).reverse();\n        System.out.println(s + <span class=\"ts\">\" \"<\/span> + C.valueOf(<span class=\"ts\">\"B\"<\/span>).name());\n    }\n}<\/code><\/pre>","a":"<p>3ba1 B<\/p>","e":"<p>\"ab\" 뒤에 3을 붙여 ab3, 맨 앞에 G의 순서 1을 넣어 1ab3, 뒤집으면 3ba1이다.<\/p>"},{"s":"<p>다음 Java 프로그램의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"java\"><code><span class=\"tk\">public<\/span> <span class=\"tk\">class<\/span> Main {\n    <span class=\"tk\">public<\/span> <span class=\"tk\">static<\/span> <span class=\"tk\">void<\/span> main(String[] args) {\n        Thread t = <span class=\"tk\">new<\/span> Thread(() -&gt; System.out.print(<span class=\"ts\">\"A\"<\/span>));\n        t.run();\n        System.out.print(<span class=\"ts\">\"B\"<\/span>);\n    }\n}<\/code><\/pre>","a":"<p>AB<\/p>","e":"<p><code>run()<\/code>을 직접 호출했으므로 새 스레드가 생기지 않고 순서대로 실행된다. <code>start()<\/code>였다면 출력 순서를 보장할 수 없다.<\/p>"}]},{"id":"py-list","title":"Python 리스트와 슬라이싱","freq":"Python 22개 중 슬라이싱 7개","concept":"<p>슬라이싱은 <code>a[시작:끝:간격]<\/code>이며 <strong>끝은 포함하지 않는다.<\/strong><\/p><ul><li>음수 인덱스는 뒤에서부터 센다. <code>a[-1]<\/code>은 마지막 값이다.<\/li><li>간격이 음수면 뒤에서 앞으로 간다. <code>a[::-1]<\/code>은 뒤집은 복사본이다.<\/li><\/ul><div class=\"tw\"><table><thead><tr><th>메서드<\/th><th>동작<\/th><\/tr><\/thead><tbody><tr><td><code>append(x)<\/code><\/td><td>x를 한 덩어리로 맨 뒤에 추가<\/td><\/tr><tr><td><code>extend(x)<\/code><\/td><td>x의 원소를 하나씩 추가<\/td><\/tr><tr><td><code>insert(i, x)<\/code><\/td><td>i 위치에 삽입<\/td><\/tr><tr><td><code>pop()<\/code> / <code>pop(i)<\/code><\/td><td>마지막 또는 i 위치 값을 꺼냄<\/td><\/tr><tr><td><code>remove(x)<\/code><\/td><td>첫 번째 x를 값으로 삭제<\/td><\/tr><tr><td><code>reverse()<\/code> / <code>sort()<\/code><\/td><td>원본을 바꾸고 None 반환<\/td><\/tr><\/tbody><\/table><\/div><ul><li><code>b = a<\/code>는 같은 리스트를 공유한다. <code>b = a[:]<\/code>는 복사본이다.<\/li><\/ul>","qs":[{"s":"<p>다음 Python 코드의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"python\"><code>a = [1, 2, 3, 4, 5, 6]\n<span class=\"tk\">print<\/span>(a[1:5:2], a[-2:], a[::-2])<\/code><\/pre>","a":"<p>[2, 4] [5, 6] [6, 4, 2]<\/p>","e":"<p>1번부터 5번 미만을 2칸씩 건너면 2, 4다. 뒤에서 두 개는 5, 6이고, 끝에서부터 2칸씩은 6, 4, 2다.<\/p>"},{"s":"<p>다음 Python 코드의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"python\"><code>a = [1, 2]\na.append([3, 4])\na.extend([5, 6])\n<span class=\"tk\">print<\/span>(len(a), a[2])<\/code><\/pre>","a":"<p>5 [3, 4]<\/p>","e":"<p>append는 리스트 전체를 한 원소로 넣고, extend는 하나씩 넣는다. [1, 2, [3, 4], 5, 6]이다.<\/p>"},{"s":"<p>다음 Python 코드의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"python\"><code>a = [1, 2, 3]\nb = a\nc = a[:]\nb[0] = 9\nc[1] = 8\n<span class=\"tk\">print<\/span>(a, b, c)<\/code><\/pre>","a":"<p>[9, 2, 3] [9, 2, 3] [1, 8, 3]<\/p>","e":"<p>b는 a와 같은 객체다. c는 a[0]이 바뀌기 전에 만든 복사본이므로 처음 값 1을 가져야 한다.<\/p>"},{"s":"<p>다음 Python 코드의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"python\"><code>a = [5, 3, 8]\na.insert(1, 7)\na.pop()\na.remove(5)\na.reverse()\n<span class=\"tk\">print<\/span>(a)<\/code><\/pre>","a":"<p>[3, 7]<\/p>","e":"<p>[5, 7, 3, 8] → [5, 7, 3] → [7, 3] → [3, 7] 순서로 바뀐다.<\/p>"},{"s":"<p>다음 Python 코드의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"python\"><code>m = [[1, 2, 3], [4, 5, 6], [7, 8, 9]]\n<span class=\"tk\">print<\/span>(sum(r[i] <span class=\"tk\">for<\/span> i, r <span class=\"tk\">in<\/span> enumerate(m)), m[1:][0][-1])<\/code><\/pre>","a":"<p>15 6<\/p>","e":"<p>대각선 합은 1 + 5 + 9 = 15다. m[1:]의 첫 행은 [4, 5, 6]이고 마지막 값은 6이다.<\/p>"}]},{"id":"py-collection","title":"Python 문자열·set·dict·컴프리헨션","freq":"문자열·집합·딕셔너리 합쳐 Python 문제의 약 1/3","concept":"<div class=\"tw\"><table><thead><tr><th>자료형<\/th><th>특징<\/th><th>자주 쓰는 연산<\/th><\/tr><\/thead><tbody><tr><td>str<\/td><td>수정 불가<\/td><td><code>split<\/code>, <code>join<\/code>, <code>replace<\/code>, <code>find<\/code>, <code>count<\/code>, <code>upper<\/code><\/td><\/tr><tr><td>set<\/td><td>중복 없음, 순서 없음<\/td><td><code>&amp;<\/code> 교집합, <code>|<\/code> 합집합, <code>-<\/code> 차집합, <code>^<\/code> 대칭차집합<\/td><\/tr><tr><td>dict<\/td><td>키-값<\/td><td><code>d[k]<\/code>, <code>d.get(k, 기본값)<\/code>, <code>keys()<\/code>, <code>items()<\/code><\/td><\/tr><tr><td>tuple<\/td><td>수정 불가<\/td><td>언패킹 <code>a, b = b, a<\/code><\/td><\/tr><\/tbody><\/table><\/div><ul><li><code>find<\/code>는 없으면 -1, <code>index<\/code>는 없으면 오류다.<\/li><li><code>s.replace(a, b, 1)<\/code>은 앞에서 1번만 바꾼다.<\/li><li><code>\"-\".join(리스트)<\/code>는 구분자가 앞에 온다.<\/li><li>컴프리헨션: <code>[식 for x in 범위 if 조건]<\/code>. 중괄호는 set, <code>{k: v ...}<\/code>는 dict다.<\/li><li><code>range(a, b)<\/code>는 b를 포함하지 않는다.<\/li><\/ul>","qs":[{"s":"<p>다음 Python 코드의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"python\"><code>s = <span class=\"ts\">\"information\"<\/span>\n<span class=\"tk\">print<\/span>(s[2:6], s.count(<span class=\"ts\">\"n\"<\/span>), s.find(<span class=\"ts\">\"m\"<\/span>))<\/code><\/pre>","a":"<p>form 2 5<\/p>","e":"<p>2번부터 6번 미만은 form이다. n은 1번과 10번 두 곳에 있고, m은 5번에 있다.<\/p>"},{"s":"<p>다음 Python 코드의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"python\"><code>s = <span class=\"ts\">\"a-b-c\"<\/span>\np = s.split(<span class=\"ts\">\"-\"<\/span>)\n<span class=\"tk\">print<\/span>(<span class=\"ts\">\"+\"<\/span>.join(p[::-1]), s.replace(<span class=\"ts\">\"-\"<\/span>, <span class=\"ts\">\"\"<\/span>, 1))<\/code><\/pre>","a":"<p>c+b+a ab-c<\/p>","e":"<p>뒤집은 리스트를 +로 잇는다. replace는 첫 번째 -만 지운다.<\/p>"},{"s":"<p>다음 Python 코드의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"python\"><code>a = {1, 2, 3, 4}\nb = {3, 4, 5}\n<span class=\"tk\">print<\/span>(sorted(a &amp; b), sorted(a - b), len(a | b), sorted(a ^ b))<\/code><\/pre>","a":"<p>[3, 4] [1, 2] 5 [1, 2, 5]<\/p>","e":"<p>교집합은 3, 4, 차집합은 1, 2, 합집합은 5개, 대칭차집합은 1, 2, 5다.<\/p>"},{"s":"<p>다음 Python 코드의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"python\"><code>d = {<span class=\"ts\">\"a\"<\/span>: 1}\nd[<span class=\"ts\">\"b\"<\/span>] = 2\nd[<span class=\"ts\">\"a\"<\/span>] += 5\n<span class=\"tk\">print<\/span>(d.get(<span class=\"ts\">\"c\"<\/span>, 0) + d[<span class=\"ts\">\"a\"<\/span>], list(d.keys()))<\/code><\/pre>","a":"<p>6 ['a', 'b']<\/p>","e":"<p>c가 없으므로 get은 0을 돌려준다. d[\"a\"]는 6이다.<\/p>"},{"s":"<p>다음 Python 코드의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"python\"><code>r = [x * x <span class=\"tk\">for<\/span> x <span class=\"tk\">in<\/span> range(1, 7) <span class=\"tk\">if<\/span> x % 2 == 0]\nt = {x % 3 <span class=\"tk\">for<\/span> x <span class=\"tk\">in<\/span> r}\n<span class=\"tk\">print<\/span>(r, sorted(t))<\/code><\/pre>","a":"<p>[4, 16, 36] [0, 1]<\/p>","e":"<p>짝수 2, 4, 6의 제곱이다. 3으로 나눈 나머지는 1, 1, 0이고 set이 중복을 없앤다.<\/p>"}]},{"id":"py-func","title":"Python 함수·클래스·재귀","freq":"함수 7개, 클래스 2개 출제","concept":"<ul><li>기본 인자는 <strong>함수를 정의할 때 한 번만<\/strong> 만들어진다. 리스트를 기본값으로 쓰면 호출 사이에 값이 누적된다.<\/li><li><code>lambda x: 식<\/code>은 이름 없는 함수다. <code>map<\/code>은 변환, <code>filter<\/code>는 조건이 참인 값만 남긴다.<\/li><li>클래스 변수는 모든 객체가 공유하며, <code>self.x<\/code>는 객체별 값이다.<\/li><li>Python의 메서드는 항상 실제 객체를 기준으로 찾는다. 부모 메서드 안의 <code>self.g()<\/code>도 자식의 g를 호출한다.<\/li><li>언패킹에서 <code>a, *b = 리스트<\/code>는 첫 값을 a에, 나머지를 리스트로 b에 넣는다.<\/li><li><code>*<\/code> 반복, <code>/<\/code>는 실수 나눗셈, <code>//<\/code>는 몫, <code>**<\/code>는 거듭제곱이다.<\/li><\/ul>","qs":[{"s":"<p>다음 Python 코드의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"python\"><code><span class=\"tk\">def<\/span> f(x, l=[]):\n    l.append(x)\n    <span class=\"tk\">return<\/span> l\n\nf(1)\n<span class=\"tk\">print<\/span>(f(2))<\/code><\/pre>","a":"<p>[1, 2]<\/p>","e":"<p>기본 리스트 l은 두 호출이 함께 쓴다.<\/p>"},{"s":"<p>다음 Python 코드의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"python\"><code>n = [1, 2, 3, 4, 5]\n<span class=\"tk\">print<\/span>(list(map(<span class=\"tk\">lambda<\/span> x: x * 2, filter(<span class=\"tk\">lambda<\/span> x: x % 2, n))))<\/code><\/pre>","a":"<p>[2, 6, 10]<\/p>","e":"<p>홀수 1, 3, 5만 남기고 2배 한다.<\/p>"},{"s":"<p>다음 Python 코드의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"python\"><code><span class=\"tk\">class<\/span> A:\n    c = 0\n\n    <span class=\"tk\">def<\/span> __init__(<span class=\"tk\">self<\/span>, v):\n        <span class=\"tk\">self<\/span>.v = v\n        A.c += 1\n\n    <span class=\"tk\">def<\/span> show(<span class=\"tk\">self<\/span>):\n        <span class=\"tk\">return<\/span> <span class=\"tk\">self<\/span>.v * A.c\n\nx = A(2)\ny = A(3)\n<span class=\"tk\">print<\/span>(x.show() + y.show())<\/code><\/pre>","a":"<p>10<\/p>","e":"<p>객체가 두 개 만들어진 뒤 호출하므로 A.c는 2다. 2 × 2 + 3 × 2 = 10이다.<\/p>"},{"s":"<p>다음 Python 코드의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"python\"><code><span class=\"tk\">class<\/span> P:\n    <span class=\"tk\">def<\/span> f(<span class=\"tk\">self<\/span>):\n        <span class=\"tk\">return<\/span> <span class=\"ts\">\"P\"<\/span> + <span class=\"tk\">self<\/span>.g()\n\n    <span class=\"tk\">def<\/span> g(<span class=\"tk\">self<\/span>):\n        <span class=\"tk\">return<\/span> <span class=\"ts\">\"1\"<\/span>\n\n<span class=\"tk\">class<\/span> C(P):\n    <span class=\"tk\">def<\/span> g(<span class=\"tk\">self<\/span>):\n        <span class=\"tk\">return<\/span> <span class=\"ts\">\"2\"<\/span>\n\n<span class=\"tk\">print<\/span>(C().f())<\/code><\/pre>","a":"<p>P2<\/p>","e":"<p>f는 P의 메서드지만 self는 C 객체이므로 C의 g가 호출된다.<\/p>"},{"s":"<p>다음 Python 코드의 출력 결과를 적으시오.<\/p><pre class=\"code\" data-lang=\"python\"><code><span class=\"tk\">def<\/span> h(n):\n    <span class=\"tk\">return<\/span> n <span class=\"tk\">if<\/span> n &lt; 2 <span class=\"tk\">else<\/span> h(n - 1) + h(n - 2)\n\na, *b = [h(i) <span class=\"tk\">for<\/span> i <span class=\"tk\">in<\/span> range(6)]\n<span class=\"tk\">print<\/span>(a, b)<\/code><\/pre>","a":"<p>0 [1, 1, 2, 3, 5]<\/p>","e":"<p>피보나치 수열 0, 1, 1, 2, 3, 5를 만든 뒤 첫 값과 나머지로 나눈다.<\/p>"}]},{"id":"py-advanced","title":"Python 얕은 복사·dict 순회·재귀·트리","freq":"2026년 1회 얕은 복사, 2회 dict 순회 출제","concept":"<div class=\"tw\"><table><thead><tr><th>복사<\/th><th>바깥 리스트<\/th><th>안쪽 객체<\/th><\/tr><\/thead><tbody><tr><td><code>b = a<\/code><\/td><td>공유<\/td><td>공유<\/td><\/tr><tr><td><code>b = a[:]<\/code>, <code>a.copy()<\/code><\/td><td>새로 만듦<\/td><td>공유 (얕은 복사)<\/td><\/tr><tr><td><code>copy.deepcopy(a)<\/code><\/td><td>새로 만듦<\/td><td>새로 만듦 (깊은 복사)<\/td><\/tr><\/tbody><\/table><\/div><p><code>a[0].append(9)<\/code>는 안쪽 객체를 고치므로 얕은 복사본에도 보이고, <code>a[1] = [5]<\/code>는 바깥 칸을 바꾸므로 보이지 않는다.<\/p><ul><li><code>dict<\/code>는 Python 3.7부터 <strong>넣은 순서<\/strong>대로 순회한다. <code>for k, v in d.items()<\/code>.<\/li><li><code>range(n - 1, -1, -1)<\/code>은 n - 1부터 0까지 거꾸로 간다.<\/li><li>슬라이싱은 범위를 넘어도 오류 없이 있는 부분만 돌려준다.<\/li><li>재귀로 리스트를 만드는 코드는 작은 경우부터 값을 적어 올라간다.<\/li><li>트리 노드 클래스는 먼저 생성자 호출을 보고 트리를 그린다.<\/li><\/ul>","qs":[{"s":"<p>다음 Python 코드의 출력 결과를 적으시오.<\/p><pre
