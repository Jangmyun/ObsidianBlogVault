<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="정보처리기사 필기 유형별 핵심 개념과 직접 작성한 연습문제를 담은 비공식 학습 자료입니다.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>정처기 필기 유형집</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* 레이아웃: 왼쪽 목차와 답안지처럼 줄이 그어진 본문. 정답만 채점 펜 색으로 표시 */
:root{
  --paper:#f3f6f2;--sheet:#fcfdfb;--ink:#1b2a25;--muted:#5b6e66;--line:#cfdad4;
  --accent:#0d6b53;--accent-ink:#f5fbf8;--pen:#c2263a;--pen-bg:#fdf0f1;--code:#e9efeb;
  --tk:#0d5f8c;--ts:#8a4b08;--tc:#71837b;--good:#0d6b53;--bad:#c2263a;
  --serif:"Gowun Batang","Noto Serif KR",serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,"Apple SD Gothic Neo",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111816;--sheet:#172019;--ink:#dfe8e3;--muted:#9bb0a7;--line:#2f3d37;
  --accent:#62c9a8;--accent-ink:#0f1a16;--pen:#ff8d8d;--pen-bg:#2c1b1e;--code:#1f2a25;
  --tk:#7cc4ee;--ts:#e6b676;--tc:#7e9389;--good:#62c9a8;--bad:#ff8d8d;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111816;--sheet:#172019;--ink:#dfe8e3;--muted:#9bb0a7;--line:#2f3d37;
  --accent:#62c9a8;--accent-ink:#0f1a16;--pen:#ff8d8d;--pen-bg:#2c1b1e;--code:#1f2a25;
  --tk:#7cc4ee;--ts:#e6b676;--tc:#7e9389;--good:#62c9a8;--bad:#ff8d8d;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:16px/1.75 var(--sans)}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:292px minmax(0,1fr);min-height:100vh}
nav.toc{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;overflow-y:auto;padding-block:24px 48px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:16px;border-right:1px solid var(--line)}
.brand{display:block;font:700 25px/1.25 var(--serif);color:var(--ink);text-decoration:none}
.sub{font-size:13px;color:var(--muted);margin:4px 0 16px;font-variant-numeric:tabular-nums}
.toplinks{display:flex;gap:14px;font-size:14px;margin-bottom:12px}
.toc h2{font:600 12px/1.4 var(--sans);letter-spacing:.06em;color:var(--muted);margin:20px 0 6px}
.toc ul{list-style:none;margin:0;padding:0}
.toc li a{display:flex;justify-content:space-between;gap:8px;padding:5px 8px;border-radius:4px;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.4}
.toc li a:hover{background:var(--code)}
.toc li a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.toc .n{font:12px var(--mono);opacity:.75;white-space:nowrap}
main{padding-block:40px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.page{max-width:780px;margin:0 auto}
.eyebrow{font-size:13px;color:var(--muted);margin:0}
h1{font:700 clamp(30px,5vw,42px)/1.25 var(--serif);margin:4px 0 8px;text-wrap:balance}
.freq{color:var(--muted);font-size:14px;margin:0 0 28px}
h2.sec{font:700 22px/1.3 var(--serif);margin:40px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.concept p,.q p{margin:0 0 12px}
ul,ol{padding-left:22px;margin:0 0 12px}
li{margin:3px 0}
code{font:.9em var(--mono);background:var(--code);padding:1px 5px;border-radius:3px;overflow-wrap:anywhere}
.tw{overflow-x:auto;margin:0 0 16px}
table{border-collapse:collapse;font-size:15px;line-height:1.5}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
th{background:var(--code);font-weight:600;white-space:nowrap}
.concept table{min-width:60%}
pre.code{margin:0 0 14px;padding:14px 16px;background:var(--code);border-radius:4px;overflow-x:auto;font:14px/1.6 var(--mono);tab-size:4}
pre.code code{background:none;padding:0;font:inherit;overflow-wrap:normal}
.tk{color:var(--tk);font-weight:600}.ts{color:var(--ts)}.tc{color:var(--tc)}
.tb{color:var(--pen);font-weight:600}
.dbs{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:12px}
.dbt{margin:0;min-width:0}.dbt figcaption{font-size:13px;font-weight:600}.dbt .tw{margin:0}
.q{padding:22px 0 26px;border-bottom:1px solid var(--line)}
.qh{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.qno{font:700 19px var(--serif)}
.mark{font-size:13px;font-weight:600}
.mark.o{color:var(--good)}.mark.x{color:var(--bad)}
.q label{display:block;font-size:13px;color:var(--muted);margin-top:12px}
.q textarea{display:block;width:100%;min-height:46px;padding:9px 2px;border:0;border-bottom:1.5px solid var(--ink);background:repeating-linear-gradient(transparent,transparent 31px,var(--line) 32px);font:16px/32px var(--mono);color:var(--ink);resize:vertical;border-radius:0}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
button{font:600 14px var(--sans);min-height:40px;padding:0 16px;border:1px solid var(--ink);border-radius:4px;background:transparent;color:var(--ink);cursor:pointer}
button:hover{background:var(--code)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cta{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;background:var(--accent);color:var(--accent-ink);border-radius:4px;font-weight:600;text-decoration:none}
button.primary:hover{opacity:.9;background:var(--accent)}
button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;min-height:44px;padding:9px 12px;text-align:left;font:400 15.5px/1.55 var(--sans);border:1px solid var(--line);background:var(--sheet)}
.opt .on{font:600 16px/1.5 var(--mono);flex:none}
.opt .ot{min-width:0;overflow-wrap:anywhere}
.opt[aria-checked="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt.right{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good);color:var(--good);font-weight:600}
.opt.wrong{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad);color:var(--bad)}
.ans{margin-top:14px;padding:12px 16px;background:var(--pen-bg);border-left:3px solid var(--pen)}
.ans .lab{font-size:12px;font-weight:700;color:var(--pen);letter-spacing:.04em}
.ans .val{font:600 16px/1.6 var(--sans);overflow-wrap:anywhere;color:var(--pen);margin-bottom:6px}
.ans .val p{margin:0 0 4px}.ans .val pre{background:transparent;padding:0;margin:0;white-space:pre-wrap;color:inherit}
.ans .val pre .tk,.ans .val pre .ts{color:inherit}
.ans .ex p{margin:0;font-size:15px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:24px 0 0}
.bar .sp{flex:1}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:32px}
.pager a{display:block;max-width:48%;text-decoration:none;font-weight:600;font-size:15px;line-height:1.4}
.pager small{display:block;color:var(--muted);font-weight:400}
.hint{color:var(--muted);font-size:14px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin:0 0 8px;padding:0;list-style:none}
.steps b{display:block;font:700 18px var(--serif)}
.steps span{font-size:14px;color:var(--muted);line-height:1.5;display:block}
.dist{display:grid;grid-template-columns:150px minmax(0,1fr) 44px;gap:6px 12px;align-items:center;font-size:15px;margin-bottom:6px;font-variant-numeric:tabular-nums}
.dist i{display:block;height:14px;background:var(--accent)}
.dist span:nth-child(3n){text-align:right}
.menu{display:none}
.wrong a{font-weight:600}
@media (max-width:860px){
  .app{display:block}
  nav.toc{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-block:14px;padding-right:max(16px,env(safe-area-inset-right,0px));padding-left:max(16px,env(safe-area-inset-left,0px))}
  .menu{display:block;margin-top:8px}
  .menu summary{cursor:pointer;font-weight:600;min-height:32px}
  .sub{margin-bottom:4px}
  main{padding-block:24px 64px}
  .steps{grid-template-columns:minmax(0,1fr)}
  .dist{grid-template-columns:92px minmax(0,1fr) 40px}
}
@media (min-width:861px){.menu{display:block}.menu summary{display:none}}
</style>
<style>.toplinks{flex-wrap:wrap;gap:4px 14px}.toplinks a{white-space:nowrap}h1{overflow-wrap:anywhere}</style>
</head>

<script>
const DATA=[{"title":"1과목 소프트웨어 개발","desc":"20문항. 옛 소프트웨어 설계와 소프트웨어 개발이 합쳐진 과목이다. 설계·방법론·구현·테스트를 모두 다룬다.","types":[{"id":"req-eng","title":"요구공학과 요구사항 분류·검토","freq":"2020~2022 기출 8회분에서 요구사항 관련 약 30문항. 기능·비기능 구분과 검토 기법이 반복","concept":"<p>요구공학은 사용자의 요구를 <strong>도출 → 분석 → 명세 → 확인(검증)<\/strong> 순서로 정리하고 관리하는 활동이다.<\/p><div class=\"tw\"><table><thead><tr><th>구분<\/th><th>내용<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td>기능적 요구사항<\/td><td>시스템이 <strong>무엇을<\/strong> 하는가<\/td><td>쇼핑몰은 장바구니와 결제 기능을 제공해야 한다<\/td><\/tr><tr><td>비기능적 요구사항<\/td><td><strong>얼마나 잘<\/strong> 하는가, 제약 조건<\/td><td>응답 시간, 처리량, 가용성, 보안, 사용성, 이식성<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tw\"><table><thead><tr><th>검토 기법<\/th><th>핵심<\/th><\/tr><\/thead><tbody><tr><td>동료 검토 (Peer Review)<\/td><td>작성자가 내용을 설명하고 동료가 결함을 찾음<\/td><\/tr><tr><td>워크스루 (Walkthrough)<\/td><td>검토 자료를 <strong>미리 배포<\/strong>, 짧은 회의, 비공식<\/td><\/tr><tr><td>인스펙션 (Inspection)<\/td><td>작성자 외 전문가가 결함을 찾는 <strong>공식<\/strong> 검토. 계획 → 사전 교육 → 준비 → 회의 → 재작업 → 추적<\/td><\/tr><\/tbody><\/table><\/div><ul><li>요구사항 분석 기법: 분류, 개념 모델링, 할당, 협상, 정형 분석.<\/li><li>도출 기법: 인터뷰, 설문, 브레인스토밍, 프로토타이핑, 유스케이스.<\/li><li>명세 기법: <strong>정형<\/strong>(수학·논리 기호, 모호성이 적지만 작성·이해가 어려움: Z, VDM)과 <strong>비정형<\/strong>(자연어·다이어그램: FSM, ER, 결정 테이블).<\/li><li>요구사항 관리 도구: 변경 추적과 영향 분석을 돕는다. 예: DOORS, Jira(이슈 추적 겸용).<\/li><\/ul>","qs":[{"s":"<p>다음 중 비기능적 요구사항에 해당하는 것은?<\/p>","c":["장바구니에 상품을 담고 삭제할 수 있어야 한다.","회원은 비밀번호를 재설정할 수 있어야 한다.","관리자는 주문 내역을 조회할 수 있어야 한다.","결제 요청의 95%는 2초 안에 응답해야 한다."],"a":3,"e":"<p>응답 시간은 시스템이 얼마나 잘 동작하는지를 말하는 성능 조건이므로 비기능적 요구사항이다. 나머지는 시스템이 제공할 기능을 말한다.<\/p>"},{"s":"<p>요구사항 개발 절차를 순서대로 나열한 것은?<\/p>","c":["도출 → 분석 → 명세 → 확인","분석 → 도출 → 명세 → 확인","도출 → 명세 → 분석 → 확인","명세 → 도출 → 분석 → 확인"],"a":0,"e":"<p>먼저 요구를 끌어내고(도출), 정리·분석한 뒤, 문서로 기술하고(명세), 맞게 썼는지 확인한다.<\/p>"},{"s":"<p>검토 자료를 회의 전에 미리 나눠 주고 짧은 회의로 오류를 일찍 찾아내는 비공식 검토 방식은?<\/p>","c":["감사(Audit)","워크스루","동료 검토","인스펙션"],"a":1,"e":"<p>사전 배포 후 짧은 회의를 여는 비공식 검토는 워크스루다. 인스펙션은 전문가가 절차에 따라 수행하는 공식 검토다.<\/p>"},{"s":"<p>정형 명세 기법에 대한 설명으로 옳은 것은?<\/p>","c":["사용자가 내용을 이해하기 가장 쉬운 명세 방식이다.","자연어를 기반으로 하여 누구나 쉽게 작성할 수 있다.","수학적 기호를 사용하므로 표현이 간결하고 모호성이 적다.","FSM, 결정 테이블처럼 자연어와 도표를 사용하는 방식이다."],"a":2,"e":"<p>정형 명세는 Z, VDM처럼 수학·논리 기호를 사용해 모호성이 적지만 작성과 이해가 어렵다. 자연어 기반은 비정형 명세다.<\/p>"},{"s":"<p>요구사항 분석 활동에 대한 설명으로 가장 거리가 먼 것은?<\/p>","c":["개념 모델을 만들어 문제 영역을 이해한다.","요구사항을 기능·비기능 등으로 분류한다.","프로그램의 소스 코드를 작성하고 단위 테스트를 수행한다.","요구사항의 충돌을 찾아 이해관계자와 협상한다."],"a":2,"e":"<p>코드 작성과 단위 테스트는 구현 단계 활동이다. 분류, 개념 모델링, 할당, 협상은 요구사항 분석 활동이다.<\/p>"}]},{"id":"req-model","title":"구조적 분석 모델과 분석 자동화 도구","freq":"DFD 구성요소, 자료 사전 기호, HIPO, CASE가 반복","concept":"<p>구조적 분석은 <strong>자료의 흐름과 처리<\/strong>를 중심으로 시스템을 모델링한다.<\/p><div class=\"tw\"><table><thead><tr><th>도구<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>DFD (자료 흐름도)<\/td><td>프로세스(원), 자료 흐름(화살표), 자료 저장소(평행선), 단말(사각형)<\/td><\/tr><tr><td>DD (자료 사전)<\/td><td>DFD에 나온 자료를 상세히 정의<\/td><\/tr><tr><td>소단위 명세서 (Mini-Spec)<\/td><td>프로세스의 처리 절차를 기술<\/td><\/tr><tr><td>ERD<\/td><td>자료 간 관계<\/td><\/tr><tr><td>STD (상태 전이도)<\/td><td>사건에 따른 상태 변화<\/td><\/tr><\/tbody><\/table><\/div><p><strong>자료 사전 기호<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>기호<\/th><th>의미<\/th><\/tr><\/thead><tbody><tr><td><code>=<\/code><\/td><td>정의<\/td><\/tr><tr><td><code>+<\/code><\/td><td>연결(and)<\/td><\/tr><tr><td><code>( )<\/code><\/td><td>생략 가능<\/td><\/tr><tr><td><code>[ | ]<\/code><\/td><td>선택(or)<\/td><\/tr><tr><td><code>{ }<\/code><\/td><td>반복<\/td><\/tr><tr><td><code>* *<\/code><\/td><td>주석<\/td><\/tr><\/tbody><\/table><\/div><ul><li>HIPO: 하향식 기능 문서화 도구. <strong>가시적 도표<\/strong>(계층 구조), <strong>총체적 도표<\/strong>(입력·처리·출력), <strong>세부적 도표<\/strong>로 구성.<\/li><li>CASE: 분석·설계·구현·유지보수를 자동화하는 도구. <strong>상위 CASE<\/strong>는 계획·분석·설계, <strong>하위 CASE<\/strong>는 코드 작성·테스트를 지원한다.<\/li><li>분석 자동화 도구 예: SADT(구조적 분석 및 설계 기법), SREM, PSL/PSA, TAGS, EPROS.<\/li><li>모델링 기법 분류: 기능 모델(DFD), 정적 모델(클래스·ERD), 동적 모델(상태·시퀀스).<\/li><\/ul>","qs":[{"s":"<p>자료 흐름도를 그릴 때 쓰지 않는 요소는?<\/p>","c":["클래스(Class)","단말(Terminator)","자료 저장소(Data Store)","프로세스(Process)"],"a":0,"e":"<p>DFD는 프로세스, 자료 흐름, 자료 저장소, 단말로 구성된다. 클래스는 객체지향 모델의 요소다.<\/p>"},{"s":"<p>자료 사전에서 선택(또는)을 의미하는 기호는?<\/p>","c":["{ }","[ | ]","* *","( )"],"a":1,"e":"<p>대괄호와 세로선은 선택이다. 중괄호는 반복, 소괄호는 생략 가능, 별표는 주석이다.<\/p>"},{"s":"<p>HIPO 차트의 종류가 아닌 것은?<\/p>","c":["세부적 도표","총체적 도표","가시적 도표","구현 도표"],"a":3,"e":"<p>HIPO는 가시적·총체적·세부적 도표로 구성된다. 구현 도표라는 분류는 없다.<\/p>"},{"s":"<p>CASE 도구에 대한 설명으로 옳은 것은?<\/p>","c":["CASE는 구현 단계에서만 사용하는 코드 생성기이다.","CASE를 사용하면 표준 준수가 어려워지고 문서화 품질이 떨어진다.","상위 CASE는 계획·분석·설계 단계를 지원하고, 하위 CASE는 코드 작성과 테스트를 지원한다.","하위 CASE는 요구사항 분석을 주로 지원한다."],"a":2,"e":"<p>CASE는 개발 전 과정을 자동화하며, 상위는 분석·설계, 하위는 구현·테스트를 지원한다. 표준화와 문서화 품질에 도움이 된다.<\/p>"},{"s":"<p>모델링 기법의 분류와 표현 도구의 연결로 적절한 것은?<\/p>","c":["동적 모델 - ERD","정적 모델 - 시퀀스 다이어그램","기능 모델 - 클래스 다이어그램","동적 모델 - 상태 전이도"],"a":3,"e":"<p>동적 모델은 시간과 사건에 따른 변화를 표현하므로 상태 전이도, 시퀀스 다이어그램이 해당한다. 클래스 다이어그램과 ERD는 정적 모델, DFD는 기능 모델이다.<\/p>"}]},{"id":"uml-basic","title":"UML 구성 요소와 다이어그램 분류","freq":"UML 약 24문항. 관계 종류, 구조·행위 분류, 스테레오타입이 반복","concept":"<p>UML은 <strong>사물(Things), 관계(Relationships), 다이어그램(Diagram)<\/strong> 세 요소로 구성된다.<\/p><div class=\"tw\"><table><thead><tr><th>관계<\/th><th>의미<\/th><th>표기<\/th><\/tr><\/thead><tbody><tr><td>연관 (Association)<\/td><td>서로 관련됨<\/td><td>실선<\/td><\/tr><tr><td>집합 (Aggregation)<\/td><td>부분이 독립적으로 존재<\/td><td>빈 마름모<\/td><\/tr><tr><td>포함 (Composition)<\/td><td>전체가 사라지면 부분도 사라짐<\/td><td>채운 마름모<\/td><\/tr><tr><td>일반화 (Generalization)<\/td><td>상속, is-a<\/td><td>실선 + 빈 삼각형<\/td><\/tr><tr><td>의존 (Dependency)<\/td><td>짧은 시간 이용<\/td><td>점선 + 화살표<\/td><\/tr><tr><td>실체화 (Realization)<\/td><td>인터페이스 구현<\/td><td>점선 + 빈 삼각형<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tw\"><table><thead><tr><th>구조 다이어그램 (정적)<\/th><th>행위 다이어그램 (동적)<\/th><\/tr><\/thead><tbody><tr><td>클래스, 객체, 컴포넌트, 배치, 복합체 구조, 패키지<\/td><td>유스케이스, 시퀀스, 커뮤니케이션, 상태, 활동, 상호작용 개요, 타이밍<\/td><\/tr><\/tbody><\/table><\/div><ul><li>스테레오타입: 기존 요소에 의미를 덧붙이는 확장 기법. 길러멧 <code>《 》<\/code>(<code>« »<\/code>) 안에 쓴다. 예: <code>《include》<\/code>, <code>《interface》<\/code>.<\/li><li>접근 제어 표기: <code>+<\/code> public, <code>-<\/code> private, <code>#<\/code> protected, <code>~<\/code> package.<\/li><\/ul>","qs":[{"s":"<p>UML의 기본 구성 요소를 바르게 묶은 것은?<\/p>","c":["클래스, 객체, 메시지","액터, 유스케이스, 시스템","사물, 관계, 다이어그램","속성, 연산, 상태"],"a":2,"e":"<p>UML의 3대 구성 요소는 사물, 관계, 다이어그램이다.<\/p>"},{"s":"<p>UML 다이어그램 중 구조(정적) 다이어그램에 해당하는 것은?<\/p>","c":["배치 다이어그램","상태 다이어그램","시퀀스 다이어그램","활동 다이어그램"],"a":0,"e":"<p>배치 다이어그램은 시스템의 물리적 구성을 표현하는 구조 다이어그램이다. 나머지는 행위 다이어그램이다.<\/p>"},{"s":"<p>UML 클래스 표기에서 protected 접근 제어를 나타내는 기호는?<\/p>","c":["+","#","~","-"],"a":1,"e":"<p><code>+<\/code>는 public, <code>-<\/code>는 private, <code>#<\/code>는 protected, <code>~<\/code>는 package다.<\/p>"},{"s":"<p>전체 객체가 사라지면 부분 객체도 함께 사라지는 강한 전체-부분 관계는?<\/p>","c":["집합(Aggregation)","의존(Dependency)","실체화(Realization)","포함(Composition)"],"a":3,"e":"<p>생명 주기를 함께하는 전체-부분 관계는 포함이며 채운 마름모로 표기한다. 집합은 부분이 독립적으로 존재한다.<\/p>"},{"s":"<p>UML에서 기존 요소에 새로운 의미를 부여하는 스테레오타입의 표기 기호는?<\/p>","c":["《 》","(( ))","[[ ]]","{{ }}"],"a":0,"e":"<p>스테레오타입은 길러멧 기호 안에 쓴다. 예로 《include》, 《extend》, 《interface》가 있다.<\/p>"}]},{"id":"uml-diagram","title":"유스케이스·시퀀스·클래스·상태 다이어그램","freq":"유스케이스 관계와 시퀀스 다이어그램 구성요소를 묻는 \"틀린 것 고르기\"가 많음","concept":"<p><strong>유스케이스 다이어그램<\/strong>: 시스템 경계, 액터, 유스케이스, 관계로 구성한다.<\/p><div class=\"tw\"><table><thead><tr><th>관계<\/th><th>의미<\/th><\/tr><\/thead><tbody><tr><td>연관<\/td><td>액터와 유스케이스를 연결<\/td><\/tr><tr><td>포함 <code>《include》<\/code><\/td><td>여러 유스케이스의 공통 기능을 분리. <strong>반드시<\/strong> 함께 수행<\/td><\/tr><tr><td>확장 <code>《extend》<\/code><\/td><td><strong>특정 조건<\/strong>에서만 수행<\/td><\/tr><tr><td>일반화<\/td><td>상위·하위 유스케이스 또는 액터<\/td><\/tr><\/tbody><\/table><\/div><ul><li>액터는 사람뿐 아니라 <strong>외부 시스템<\/strong>도 될 수 있다. 시스템을 직접 사용하면 주 액터, 서비스를 제공하는 외부 시스템이면 부 액터다.<\/li><\/ul><p><strong>시퀀스 다이어그램<\/strong>: 객체 간 메시지를 <strong>시간 순서<\/strong>로 표현한다. 구성은 액터, 객체, 생명선, 실행 상자(활성 상자, Activation), 메시지, 프레임.<\/p><p><strong>커뮤니케이션 다이어그램<\/strong>: 객체 간 메시지를 <strong>연결 관계<\/strong> 중심으로 표현한다.<\/p><p><strong>상태 다이어그램<\/strong>: 하나의 객체가 사건에 따라 상태가 바뀌는 과정을 표현한다.<\/p><p><strong>활동 다이어그램<\/strong>: 처리 흐름(로직)을 조건·분기와 함께 표현한다.<\/p><p><strong>패키지 다이어그램<\/strong>: 요소를 묶은 패키지와 그 의존 관계를 표현한다.<\/p><p><strong>클래스 다이어그램<\/strong>: 클래스의 속성·연산과 클래스 간 관계를 표현한다.<\/p>","qs":[{"s":"<p>유스케이스 다이어그램에서 특정 조건을 만족할 때에만 부가 기능을 수행하는 관계는?<\/p>","c":["포함(include)","연관(association)","확장(extend)","일반화(generalization)"],"a":2,"e":"<p>조건에 따라 수행되면 확장, 항상 수행되면 포함이다.<\/p>"},{"s":"<p>시퀀스 다이어그램의 구성 요소가 아닌 것은?<\/p>","c":["실행 상자(Activation)","시스템 경계","메시지","생명선"],"a":1,"e":"<p>시스템 경계는 유스케이스 다이어그램의 요소다. 시퀀스 다이어그램은 액터, 객체, 생명선, 실행 상자, 메시지, 프레임으로 구성된다.<\/p>"},{"s":"<p>유스케이스 다이어그램에 대한 설명으로 틀린 것은?<\/p>","c":["시스템 경계 안에 유스케이스를 배치한다.","유스케이스는 사용자 관점에서 시스템이 제공하는 기능이다.","포함 관계는 공통 기능을 분리할 때 사용한다.","액터는 시스템을 사용하는 사람만을 의미하며 외부 시스템은 액터가 될 수 없다."],"a":3,"e":"<p>연동되는 외부 시스템도 액터가 될 수 있다.<\/p>"},{"s":"<p>하나의 객체가 사건에 반응하여 상태가 바뀌는 과정을 표현하는 다이어그램은?<\/p>","c":["상태 다이어그램","배치 다이어그램","컴포넌트 다이어그램","클래스 다이어그램"],"a":0,"e":"<p>객체의 상태 변화를 표현하는 것은 상태 다이어그램이다. 나머지는 구조 다이어그램이다.<\/p>"},{"s":"<p>객체 간 메시지를 시간 순서가 아니라 객체 간 연결 관계 중심으로 표현하는 다이어그램은?<\/p>","c":["커뮤니케이션 다이어그램","패키지 다이어그램","시퀀스 다이어그램","활동 다이어그램"],"a":0,"e":"<p>같은 상호작용을 시간 순서로 그리면 시퀀스, 연결 관계 중심으로 그리면 커뮤니케이션 다이어그램이다.<\/p>"}]},{"id":"agile","title":"애자일과 XP·스크럼","freq":"애자일 선언 가치와 XP 실천 항목이 반복","concept":"<p>애자일은 변화에 빠르게 대응하며 <strong>짧은 주기로 반복<\/strong> 개발하는 방식이다.<\/p><p><strong>애자일 선언의 4가지 가치<\/strong> (왼쪽을 더 중시)<\/p><div class=\"tw\"><table><thead><tr><th>더 중시<\/th><th>덜 중시<\/th><\/tr><\/thead><tbody><tr><td>개인과 상호작용<\/td><td>프로세스와 도구<\/td><\/tr><tr><td>동작하는 소프트웨어<\/td><td>포괄적인 문서<\/td><\/tr><tr><td>고객과의 협력<\/td><td>계약 협상<\/td><\/tr><tr><td>변화에 대응<\/td><td>계획을 따름<\/td><\/tr><\/tbody><\/table><\/div><p><strong>XP(eXtreme Programming)<\/strong><\/p><ul><li>5가지 가치: 의사소통, 단순성, 피드백, 용기, 존중.<\/li><li>실천: 짝 프로그래밍, 공동 코드 소유, 지속적 통합, 테스트 주도 개발(TDD), 리팩토링, 소규모 릴리즈, 전체 팀, 계획 게임.<\/li><\/ul><p><strong>스크럼<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>요소<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>제품 책임자 (PO)<\/td><td>백로그 우선순위 결정<\/td><\/tr><tr><td>스크럼 마스터<\/td><td>팀을 돕고 장애물 제거 (지시자가 아님)<\/td><\/tr><tr><td>개발 팀<\/td><td>자율적으로 구성<\/td><\/tr><tr><td>스프린트<\/td><td>보통 2~4주 반복<\/td><\/tr><tr><td>일일 스크럼<\/td><td>매일 약 15분<\/td><\/tr><tr><td>산출물<\/td><td>제품 백로그, 스프린트 백로그, 번다운 차트<\/td><\/tr><\/tbody><\/table><\/div><ul><li>칸반: 작업을 시각화하고 <strong>진행 중 작업(WIP)을 제한<\/strong>한다.<\/li><li>린(Lean): 낭비 제거에 초점을 둔다.<\/li><li>Crystal: 프로젝트 규모와 중요도에 따라 방법을 달리하는 애자일 방법론이다.<\/li><li>번다운(소멸) 차트: 남은 작업량을 시간 축에 표시한다.<\/li><li>XP의 스파이크: 불확실한 기술을 확인하려고 짧게 수행하는 탐색 작업이다.<\/li><li>FDD(Feature Driven Development, 기능 주도 개발·기능 중심 개발): 기능 단위로 개발한다.<\/li><li>애자일이 아닌 것: 폭포수(Waterfall)는 순차적 계획 주도 모델이다.<\/li><\/ul>","qs":[{"s":"<p>애자일 선언에서 더 가치 있게 여기는 항목이 아닌 것은?<\/p>","c":["고객과의 협력","동작하는 소프트웨어","계획을 따르기","개인과 상호작용"],"a":2,"e":"<p>애자일은 계획을 따르기보다 변화에 대응하는 것을 더 중시한다.<\/p>"},{"s":"<p>XP의 핵심 가치가 아닌 것은?<\/p>","c":["의사소통","문서화","용기","피드백"],"a":1,"e":"<p>XP의 가치는 의사소통, 단순성, 피드백, 용기, 존중이다.<\/p>"},{"s":"<p>스크럼에서 제품 백로그의 우선순위를 결정하는 역할은?<\/p>","c":["테스터","개발 팀","스크럼 마스터","제품 책임자"],"a":3,"e":"<p>제품 책임자(PO)가 백로그의 우선순위를 정한다. 스크럼 마스터는 팀이 잘 일하도록 돕는 역할이다.<\/p>"},{"s":"<p>두 명이 한 대의 컴퓨터로 함께 코드를 작성하는 XP 실천 항목은?<\/p>","c":["짝 프로그래밍","소규모 릴리즈","공동 코드 소유","계획 게임"],"a":0,"e":"<p>한 명은 코드를 쓰고 다른 한 명은 검토하며 함께 작업하는 것이 짝 프로그래밍이다.<\/p>"},{"s":"<p>작업 상황을 시각화하고 진행 중인 작업의 양을 제한해 흐름을 관리하는 기법은?<\/p>","c":["칸반","폭포수","정형 기법","나선형"],"a":0,"e":"<p>칸반은 보드로 작업을 시각화하고 WIP를 제한한다.<\/p>"}]},{"id":"ui-design","title":"UI 설계 원칙·지침·도구","freq":"UI 약 9문항. 4대 원칙과 UI 종류, 프로토타입 도구가 반복","concept":"<div class=\"tw\"><table><thead><tr><th>UI 설계 원칙<\/th><th>의미<\/th><\/tr><\/thead><tbody><tr><td>직관성<\/td><td>누구나 쉽게 이해하고 사용<\/td><\/tr><tr><td>유효성<\/td><td>사용자의 목적을 정확히 달성<\/td><\/tr><tr><td>학습성<\/td><td>누구나 쉽게 배우고 익힘<\/td><\/tr><tr><td>유연성<\/td><td>사용자의 요구를 최대한 수용하고 실수를 방지<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tw\"><table><thead><tr><th>UI 종류<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>CLI<\/td><td>명령어 입력<\/td><\/tr><tr><td>GUI<\/td><td>그래픽, 마우스<\/td><\/tr><tr><td>NUI<\/td><td>말·동작 등 <strong>신체<\/strong>를 이용 (멀티 터치, 동작 인식)<\/td><\/tr><tr><td>OUI<\/td><td>모든 사물이 입출력 장치가 되는 인터페이스<\/td><\/tr><tr><td>VUI<\/td><td>음성<\/td><\/tr><\/tbody><\/table><\/div><p><strong>UI 표준과 지침<\/strong><\/p><ul><li>UI 표준: 전체 시스템에 공통으로 적용되는 화면 구성·이동 등의 규약.<\/li><li>UI 지침: UI 요구사항, 구현 제약 사항 등 개발 과정에서 지켜야 할 세부 사항.<\/li><li>UI 지침의 원칙 예: 사용자 중심, 일관성, 단순성, 결과 예측 가능, 가시성, 표준화, 접근성, 명확성, 오류 발생 해결.<\/li><\/ul><p><strong>설계 산출물과 도구<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>도구<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>와이어프레임<\/td><td>페이지 영역 구분, 레이아웃을 선으로 표현 (Figma, PowerPoint 등)<\/td><\/tr><tr><td>목업 (Mockup)<\/td><td>실제 화면처럼 만든 <strong>정적<\/strong> 모형. 기능은 구현하지 않음<\/td><\/tr><tr><td>스토리보드<\/td><td>와이어프레임 + 콘텐츠 설명 + 페이지 이동 흐름 (정책·프로세스 포함)<\/td><\/tr><tr><td>프로토타입<\/td><td>와이어프레임에 <strong>동적 효과<\/strong>를 넣은 모형<\/td><\/tr><tr><td>유스케이스<\/td><td>사용자 측면의 요구사항<\/td><\/tr><\/tbody><\/table><\/div><ul><li>감성공학: 인간의 감성을 제품 설계에 반영하는 기술로, 1류는 감성을 정량 분석해 제품 요소로 변환, 2류는 개인 특성을 고려, 3류는 수학적 모델을 이용한다.<\/li><\/ul>","qs":[{"s":"<p>처음 접하는 사용자도 별도 설명 없이 바로 알아보고 쓸 수 있어야 한다는 UI 설계 원칙은?<\/p>","c":["유연성","직관성","학습성","유효성"],"a":1,"e":"<p>쉬운 이해와 사용은 직관성이다. 유효성은 목적 달성, 학습성은 쉬운 학습, 유연성은 요구 수용과 실수 방지다.<\/p>"},{"s":"<p>사람의 말이나 몸짓처럼 자연스러운 신체 동작으로 기기를 조작하는 UI는?<\/p>","c":["CLI","OUI","GUI","NUI"],"a":3,"e":"<p>NUI(Natural User Interface)는 터치, 제스처, 음성 등 신체를 이용한다.<\/p>"},{"s":"<p>UI 지침의 내용으로 가장 거리가 먼 것은?<\/p>","c":["사용자가 조작의 결과를 예측할 수 있게 한다.","같은 기능은 화면마다 같은 방식으로 동작하게 한다.","오류 메시지는 개발자가 이해할 수 있도록 내부 코드만 표시한다.","누구나 쉽게 쓰도록 조작을 단순하게 한다."],"a":2,"e":"<p>오류 메시지는 사용자가 이해하고 해결할 수 있도록 써야 한다.<\/p>"},{"s":"<p>실제 화면과 유사하게 만들었지만 실제 기능은 구현하지 않은 정적 모형은?<\/p>","c":["목업","스토리보드","프로토타입","유스케이스"],"a":0,"e":"<p>목업은 정적 모형이다. 동적 효과가 있으면 프로토타입이다.<\/p>"},{"s":"<p>인간의 감성을 정량적으로 분석해 제품 설계에 반영하는 분야는?<\/p>","c":["역공학","감성공학","재공학","요구공학"],"a":1,"e":"<p>감성공학은 인간의 감성을 측정해 제품의 설계 요소로 바꾸는 기술이다.<\/p>"}]},{"id":"architecture","title":"소프트웨어 아키텍처와 재사용","freq":"아키텍처 약 17문항. MVC, 파이프 필터, 설계 원리, 재공학이 반복","concept":"<p><strong>설계 원리<\/strong>: 모듈화(기능 분할), 추상화(핵심만 표현), 단계적 분해(Stepwise Refinement), 정보 은닉(내부를 숨김).<\/p><p><strong>추상화 종류<\/strong>: 과정(기능) 추상화, 자료(데이터) 추상화, 제어 추상화.<\/p><div class=\"tw\"><table><thead><tr><th>아키텍처 패턴<\/th><th>특징<\/th><\/tr><\/thead><tbody><tr><td>계층 (Layer)<\/td><td>위 계층이 바로 아래 계층의 서비스를 사용<\/td><\/tr><tr><td>클라이언트-서버<\/td><td>서버는 대기, 클라이언트가 요청<\/td><\/tr><tr><td>파이프-필터<\/td><td>데이터 스트림의 <strong>각 단계를 필터로 캡슐화<\/strong>하고 파이프로 전달<\/td><\/tr><tr><td>MVC<\/td><td>Model(데이터·로직), View(화면), Controller(입력 처리) 분리. <strong>한 모델에 여러 뷰<\/strong> 가능<\/td><\/tr><tr><td>마스터-슬레이브<\/td><td>마스터가 일을 나눠주고 결과를 합침 (장애 허용, 병렬 계산)<\/td><\/tr><tr><td>브로커<\/td><td>분산 환경에서 컴포넌트를 찾아 연결<\/td><\/tr><tr><td>이벤트-버스<\/td><td>이벤트를 채널에 발행하고 구독자가 처리<\/td><\/tr><tr><td>블랙보드<\/td><td>공유 저장소에 모든 컴포넌트가 접근<\/td><\/tr><\/tbody><\/table><\/div><p><strong>재사용 비용과 재공학<\/strong><\/p><ul><li>재사용: 이미 개발된 기능을 그대로 또는 수정해서 사용. 규모 순으로 <strong>함수·객체 → 컴포넌트 → 애플리케이션<\/strong>.<\/li><li>재공학: 기존 시스템을 버리지 않고 분석·재구성한다. 활동은 <strong>분석(Analysis) → 재구성(Restructuring) → 역공학(Reverse Engineering) → 이관(Migration, 이식)<\/strong>.<\/li><li>역공학: 소스 코드에서 설계 정보를 추출한다 (재공학의 일부).<\/li><li>이관(Migration): 다른 환경으로 옮긴다.<\/li><li>품질 속성: 성능, 가용성, 보안성, 변경 용이성 등을 아키텍처 설계에서 고려.<\/li><\/ul>","qs":[{"s":"<p>MVC 패턴에 대한 설명으로 틀린 것은?<\/p>","c":["하나의 모델에는 하나의 뷰만 연결할 수 있다.","뷰는 사용자에게 결과를 표시한다.","컨트롤러는 사용자 입력을 받아 모델과 뷰를 제어한다.","모델은 데이터와 핵심 로직을 담당한다."],"a":0,"e":"<p>MVC는 표현과 로직을 분리하므로 한 모델에 여러 뷰를 둘 수 있다.<\/p>"},{"s":"<p>데이터 스트림 처리의 각 단계를 캡슐화하고 파이프로 데이터를 전달하는 아키텍처 패턴은?<\/p>","c":["브로커","마스터-슬레이브","파이프-필터","클라이언트-서버"],"a":2,"e":"<p>각 단계를 필터로 캡슐화하고 파이프로 잇는 구조는 파이프-필터 패턴이다. UNIX 파이프가 대표적이다.<\/p>"},{"s":"<p>소프트웨어 설계의 기본 원리 중 모듈 내부의 자료와 처리 방식을 외부에서 접근하지 못하도록 숨기는 것은?<\/p>","c":["모듈화","정보 은닉","단계적 분해","재사용"],"a":1,"e":"<p>필요하지 않은 내부 정보를 숨겨 변경의 영향을 줄이는 것이 정보 은닉이다.<\/p>"},{"s":"<p>추상화의 유형이 아닌 것은?<\/p>","c":["자료 추상화","과정 추상화","제어 추상화","인터페이스 추상화"],"a":3,"e":"<p>추상화의 유형은 과정, 자료, 제어 추상화다.<\/p>"},{"s":"<p>소프트웨어 재공학 활동에 해당하지 않는 것은?<\/p>","c":["이관","재구성","신규 개발","분석"],"a":2,"e":"<p>재공학은 기존 시스템을 활용하므로 분석, 재구성, 역공학, 이관으로 이루어진다. 신규 개발은 재공학이 아니다.<\/p>"}]},{"id":"modular","title":"모듈화·결합도·응집도","freq":"결합도·응집도 약 33문항. 순서 문제와 이름 맞히기가 매회 출제","concept":"<p>좋은 설계는 <strong>결합도는 낮추고 응집도는 높인다.<\/strong><\/p><p><strong>결합도<\/strong> (약함 → 강함): 자료 &lt; 스탬프 &lt; 제어 &lt; 외부 &lt; 공통 &lt; 내용<\/p><div class=\"tw\"><table><thead><tr><th>결합도<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>자료<\/td><td>값(자료 요소)만 주고받음<\/td><\/tr><tr><td>스탬프<\/td><td>배열·구조체 같은 자료 구조를 전달<\/td><\/tr><tr><td>제어<\/td><td>다른 모듈의 흐름을 제어하는 플래그·제어 신호 전달<\/td><\/tr><tr><td>외부<\/td><td>외부에서 선언한 데이터를 참조<\/td><\/tr><tr><td>공통<\/td><td>공유되는 공통 데이터 영역 사용<\/td><\/tr><tr><td>내용<\/td><td>다른 모듈의 내부 기능·자료를 직접 참조·수정<\/td><\/tr><\/tbody><\/table><\/div><p><strong>응집도<\/strong> (약함 → 강함): 우연적 &lt; 논리적 &lt; 시간적 &lt; 절차적 &lt; 통신적(교환적) &lt; 순차적 &lt; 기능적<\/p><div class=\"tw\"><table><thead><tr><th>응집도<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>우연적<\/td><td>관련 없는 요소의 모임<\/td><\/tr><tr><td>논리적<\/td><td>유사한 성격의 처리 요소<\/td><\/tr><tr><td>시간적<\/td><td>특정 시기에 함께 처리<\/td><\/tr><tr><td>절차적<\/td><td>순서대로 처리<\/td><\/tr><tr><td>통신적(교환적)<\/td><td>동일한 입력·출력 사용<\/td><\/tr><tr><td>순차적<\/td><td>앞 활동의 <strong>출력이 다음 활동의 입력<\/strong><\/td><\/tr><tr><td>기능적<\/td><td>모든 요소가 단일 기능 수행<\/td><\/tr><\/tbody><\/table><\/div><ul><li><strong>팬인(Fan-In)<\/strong>: 어떤 모듈을 제어하는(호출하는) 상위 모듈 수.<\/li><li><strong>팬아웃(Fan-Out)<\/strong>: 어떤 모듈이 제어하는(호출하는) 하위 모듈 수.<\/li><li>공통 모듈의 원칙: 정확성, 명확성, 완전성, 일관성, 추적성.<\/li><li>N-S 차트: 순차·선택·반복 구조를 도형으로 표현하는 구조적 프로그래밍 도구.<\/li><\/ul>","qs":[{"s":"<p>결합도를 약한 것부터 강한 것 순으로 나열한 것은?<\/p>","c":["내용 → 공통 → 제어 → 스탬프 → 자료","스탬프 → 자료 → 제어 → 내용 → 공통","자료 → 제어 → 스탬프 → 공통 → 내용","자료 → 스탬프 → 제어 → 공통 → 내용"],"a":3,"e":"<p>약한 순서는 자료, 스탬프, 제어, 외부, 공통, 내용이다.<\/p>"},{"s":"<p>응집도가 가장 강한 것은?<\/p>","c":["시간적 응집도","기능적 응집도","순차적 응집도","우연적 응집도"],"a":1,"e":"<p>응집도는 기능적이 가장 강하고 우연적이 가장 약하다.<\/p>"},{"s":"<p>모듈 간에 배열이나 구조체 같은 자료 구조를 인자로 전달하는 결합도는?<\/p>","c":["외부 결합도","공통 결합도","스탬프 결합도","자료 결합도"],"a":2,"e":"<p>자료 구조를 통째로 전달하면 스탬프 결합도다. 단순 값이면 자료 결합도다.<\/p>"},{"s":"<p>모듈 안에서 앞 활동의 출력이 다음 활동의 입력으로 쓰이는 응집도는?<\/p>","c":["순차적 응집도","논리적 응집도","통신적 응집도","절차적 응집도"],"a":0,"e":"<p>출력을 다음 활동의 입력으로 쓰면 순차적 응집도다. 같은 입력·출력을 공유하기만 하면 통신적 응집도다.<\/p>"},{"s":"<p>모듈 M을 호출하는 상위 모듈이 3개이고, M이 호출하는 하위 모듈이 2개일 때 M의 팬인과 팬아웃은?<\/p>","c":["팬인 3, 팬아웃 2","팬인 2, 팬아웃 3","팬인 2, 팬아웃 2","팬인 3, 팬아웃 3"],"a":0,"e":"<p>팬인은 자신을 호출하는 모듈 수, 팬아웃은 자신이 호출하는 모듈 수다.<\/p>"}]},{"id":"oop","title":"객체지향 개념","freq":"객체지향 약 29문항. 캡슐화, 상속, 다형성, 오버로딩·오버라이딩 구분이 반복","concept":"<div class=\"tw\"><table><thead><tr><th>개념<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>객체 (Object)<\/td><td>상태(속성)와 행위(메서드, 메소드)를 가진 실체. 고유 식별성을 가짐<\/td><\/tr><tr><td>클래스 (Class)<\/td><td>공통 속성과 연산을 정의한 틀. <strong>데이터 추상화의 단위<\/strong><\/td><\/tr><tr><td>인스턴스<\/td><td>클래스로 만든 객체<\/td><\/tr><tr><td>메시지<\/td><td>객체에 동작을 요청하는 수단<\/td><\/tr><tr><td>캡슐화<\/td><td>속성과 연산을 하나로 묶음. 재사용 쉬움, 정보 은닉, 결합도 낮춤<\/td><\/tr><tr><td>상속<\/td><td>상위 클래스의 속성·연산을 물려받음<\/td><\/tr><tr><td>다형성<\/td><td>같은 메시지에 객체마다 다르게 응답<\/td><\/tr><tr><td>추상화<\/td><td>공통 특징만 뽑아 표현<\/td><\/tr><tr><td>연관<\/td><td>객체 간의 관계<\/td><\/tr><\/tbody><\/table><\/div><ul><li><strong>오버로딩<\/strong>: 같은 이름, <strong>매개변수가 다른<\/strong> 메서드를 같은 클래스에 정의.<\/li><li><strong>오버라이딩<\/strong>: 상위 클래스의 메서드를 하위 클래스에서 <strong>재정의<\/strong> (시그니처 동일).<\/li><li>추상 클래스: 추상 메서드를 포함할 수 있고 인스턴스를 만들 수 없으며, 하위 클래스가 추상 메서드를 구현한다.<\/li><li>인터페이스: 구현 없이 선언만 모아 둔 규약.<\/li><li>객체는 다른 객체와 구분되는 <strong>고유 식별자<\/strong>를 가지며, 같은 값을 가져도 서로 다른 객체일 수 있다.<\/li><\/ul>","qs":[{"s":"<p>속성과 그 속성을 다루는 연산을 하나로 묶는 객체지향 개념은?<\/p>","c":["다형성","메시지","상속","캡슐화"],"a":3,"e":"<p>데이터와 연산을 하나로 묶어 내부를 숨기는 것이 캡슐화다.<\/p>"},{"s":"<p>객체지향 개념에 대한 설명으로 틀린 것은?<\/p>","c":["서로 다른 두 객체는 속성 값이 같으면 동일한 객체로 취급된다.","인스턴스는 클래스로부터 생성된 객체이다.","클래스는 공통 속성과 연산을 정의한 틀이다.","메시지는 객체에게 동작 수행을 요청하는 수단이다."],"a":0,"e":"<p>객체는 고유 식별자를 가지므로 값이 같아도 서로 다른 객체일 수 있다.<\/p>"},{"s":"<p>상위 클래스에 정의된 메서드를 하위 클래스에서 같은 형식으로 다시 정의하는 것은?<\/p>","c":["오버로딩","캡슐화","오버라이딩","인스턴스화"],"a":2,"e":"<p>시그니처를 같게 재정의하면 오버라이딩, 이름은 같고 매개변수를 달리하면 오버로딩이다.<\/p>"},{"s":"<p>동일한 메시지에 대해 객체별로 서로 다르게 동작하도록 하는 특성은?<\/p>","c":["연관","다형성","단일성","정보 은닉"],"a":1,"e":"<p>같은 메시지에 객체별로 다른 동작을 하는 특성이 다형성이다.<\/p>"},{"s":"<p>추상 클래스에 대한 설명으로 옳은 것은?<\/p>","c":["상속을 받을 수 없다.","모든 메서드의 구현을 반드시 포함해야 한다.","속성을 가질 수 없다.","직접 인스턴스를 생성할 수 없으며 하위 클래스가 추상 메서드를 구현한다."],"a":3,"e":"<p>추상 클래스는 인스턴스화할 수 없고 하위 클래스가 구현을 완성한다.<\/p>"}]},{"id":"oop-design","title":"객체지향 분석 방법론과 설계 원칙","freq":"럼바우 3모델과 SOLID가 자주 출제","concept":"<p><strong>객체지향 분석 방법론<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>방법론<\/th><th>특징<\/th><\/tr><\/thead><tbody><tr><td>럼바우 (Rumbaugh, OMT)<\/td><td><strong>객체 모델링 → 동적 모델링 → 기능 모델링<\/strong> 순서<\/td><\/tr><tr><td>부치 (Booch)<\/td><td>미시적·거시적 개발 프로세스를 모두 사용<\/td><\/tr><tr><td>제이콥슨 (Jacobson)<\/td><td><strong>유스케이스<\/strong> 강조<\/td><\/tr><tr><td>코드와 요든 (Coad-Yourdon)<\/td><td>E-R 다이어그램으로 객체 행위 모델링<\/td><\/tr><tr><td>워프스-브록 (Wirfs-Brock)<\/td><td>분석과 설계 구분 없이 연속 수행<\/td><\/tr><\/tbody><\/table><\/div><p>럼바우 모델의 산출물: 객체 모델(객체 다이어그램, 정보 모델링) · 동적 모델(상태 다이어그램) · 기능 모델(DFD).<\/p><p><strong>SOLID 설계 원칙<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>원칙<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>SRP 단일 책임<\/td><td>클래스는 하나의 책임만<\/td><\/tr><tr><td>OCP 개방-폐쇄<\/td><td>확장에는 열려 있고 수정에는 닫혀 있게<\/td><\/tr><tr><td>LSP 리스코프 치환<\/td><td>하위 타입은 상위 타입을 대체할 수 있어야 함<\/td><\/tr><tr><td>ISP 인터페이스 분리<\/td><td>사용하지 않는 메서드에 의존하지 않게 인터페이스를 작게 분리<\/td><\/tr><tr><td>DIP 의존성 역전<\/td><td>구체 클래스가 아닌 추상화에 의존<\/td><\/tr><\/tbody><\/table><\/div><p>객체지향 분석 활동은 객체·클래스 식별, 구조 정의, 주제 정의, 속성 정의, 서비스 정의로 진행된다.<\/p>","qs":[{"s":"<p>럼바우의 객체 모델링 기법(OMT)의 수행 순서로 옳은 것은?<\/p>","c":["기능 → 동적 → 객체","동적 → 객체 → 기능","객체 → 기능 → 동적","객체 → 동적 → 기능"],"a":3,"e":"<p>럼바우 기법은 객체, 동적, 기능 모델링 순서로 진행한다.<\/p>"},{"s":"<p>럼바우 기법의 세 모델 중 입력 값이 출력으로 변환되는 과정을 DFD로 그리는 것은?<\/p>","c":["기능 모델링","객체 모델링","정보 모델링","동적 모델링"],"a":0,"e":"<p>기능 모델은 DFD를 사용해 자료 흐름 중심으로 표현한다. 동적 모델은 상태 다이어그램을 쓴다.<\/p>"},{"s":"<p>유스케이스를 강조하여 사용하는 객체지향 분석 방법론은?<\/p>","c":["코드-요든 방법","제이콥슨 방법","부치 방법","럼바우 방법"],"a":1,"e":"<p>제이콥슨은 유스케이스를 중심으로 분석한다.<\/p>"},{"s":"<p>기존 코드를 수정하지 않고 기능을 추가할 수 있도록 설계해야 한다는 원칙은?<\/p>","c":["인터페이스 분리 원칙(ISP)","리스코프 치환 원칙(LSP)","개방-폐쇄 원칙(OCP)","단일 책임 원칙(SRP)"],"a":2,"e":"<p>확장에는 열려 있고 수정에는 닫혀 있어야 한다는 원칙이 OCP다.<\/p>"},{"s":"<p>클라이언트가 사용하지 않는 메서드에 의존하지 않도록 인터페이스를 작게 나누어야 한다는 원칙은?<\/p>","c":["인터페이스 분리 원칙(ISP)","개방-폐쇄 원칙(OCP)","의존성 역전 원칙(DIP)","단일 책임 원칙(SRP)"],"a":0,"e":"<p>인터페이스를 역할별로 작게 분리하는 원칙이 ISP다.<\/p>"}]},{"id":"pattern","title":"GoF 디자인 패턴","freq":"디자인 패턴 13문항. 생성·구조·행위 분류를 고르는 형식이 대부분","concept":"<p>GoF 패턴은 총 23개이며 <strong>생성 5, 구조 7, 행위 11<\/strong>이다.<\/p><div class=\"tw\"><table><thead><tr><th>분류<\/th><th>패턴<\/th><\/tr><\/thead><tbody><tr><td>생성 (5)<\/td><td>Abstract Factory, Builder, Factory Method, Prototype, Singleton<\/td><\/tr><tr><td>구조 (7)<\/td><td>Adapter, Bridge, Composite, Decorator, Facade, Flyweight, Proxy<\/td><\/tr><tr><td>행위 (11)<\/td><td>Chain of Responsibility, Command, Interpreter, Iterator, Mediator, Memento, Observer, State, Strategy, Template Method, Visitor<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tw\"><table><thead><tr><th>패턴<\/th><th>한 줄 요약<\/th><\/tr><\/thead><tbody><tr><td>Singleton<\/td><td>인스턴스를 <strong>하나만<\/strong> 생성<\/td><\/tr><tr><td>Factory Method<\/td><td>객체 생성을 <strong>서브클래스에 위임<\/strong><\/td><\/tr><tr><td>Abstract Factory<\/td><td>관련 객체군을 묶어 생성<\/td><\/tr><tr><td>Builder<\/td><td>복잡한 객체를 단계별로 조립<\/td><\/tr><tr><td>Prototype<\/td><td>원본을 복제해 생성<\/td><\/tr><tr><td>Adapter<\/td><td>호환되지 않는 인터페이스를 <strong>변환<\/strong><\/td><\/tr><tr><td>Bridge<\/td><td>기능과 구현을 분리해 독립 확장<\/td><\/tr><tr><td>Composite<\/td><td>개별 객체와 복합 객체를 트리로 동일하게 취급<\/td><\/tr><tr><td>Decorator<\/td><td>객체에 기능을 <strong>동적으로 추가<\/strong><\/td><\/tr><tr><td>Facade<\/td><td>복잡한 서브시스템에 <strong>단순한 창구<\/strong> 제공<\/td><\/tr><tr><td>Flyweight<\/td><td>공유로 메모리 절약<\/td><\/tr><tr><td>Proxy<\/td><td>대리자가 접근을 제어<\/td><\/tr><tr><td>Observer<\/td><td>상태 변화를 <strong>구독자에게 통지<\/strong><\/td><\/tr><tr><td>Strategy<\/td><td>알고리즘을 캡슐화해 <strong>교체<\/strong> 가능<\/td><\/tr><tr><td>Template Method<\/td><td>상위에서 골격, 하위에서 세부 구현<\/td><\/tr><tr><td>State<\/td><td>상태에 따라 동작 변경<\/td><\/tr><tr><td>Command<\/td><td>요청을 객체로 캡슐화<\/td><\/tr><tr><td>Iterator<\/td><td>내부 구조를 드러내지 않고 순회<\/td><\/tr><tr><td>Mediator<\/td><td>객체 간 통신을 중재<\/td><\/tr><tr><td>Memento<\/td><td>이전 상태로 되돌림<\/td><\/tr><tr><td>Visitor<\/td><td>처리 기능을 구조에서 분리<\/td><\/tr><tr><td>Chain of Responsibility<\/td><td>처리할 수 있을 때까지 다음 객체로 전달<\/td><\/tr><tr><td>Interpreter<\/td><td>언어의 문법을 표현하고 해석<\/td><\/tr><\/tbody><\/table><\/div><p>패턴을 쓰면 재사용성과 의사소통이 좋아지지만, 구조가 복잡해질 수 있다. 패턴은 객체지향 설계를 전제로 하며, 절차적 언어에서는 쓰기 어렵다.<\/p>","qs":[{"s":"<p>GoF 디자인 패턴 중 생성 패턴에 해당하는 것은?<\/p>","c":["Decorator","Prototype","Facade","Mediator"],"a":1,"e":"<p>생성 패턴은 Abstract Factory, Builder, Factory Method, Prototype, Singleton이다. Decorator와 Facade는 구조, Mediator는 행위 패턴이다.<\/p>"},{"s":"<p>GoF 디자인 패턴 중 구조 패턴이 아닌 것은?<\/p>","c":["Composite","Adapter","Iterator","Proxy"],"a":2,"e":"<p>Iterator는 행위 패턴이다.<\/p>"},{"s":"<p>어떤 객체의 상태가 바뀌면 이를 구독하는 객체들에게 자동으로 알려 주는 패턴은?<\/p>","c":["Strategy","Command","Bridge","Observer"],"a":3,"e":"<p>상태 변화를 구독자에게 통지하는 패턴은 Observer다.<\/p>"},{"s":"<p>호환되지 않는 인터페이스를 가진 클래스를 변환하여 함께 동작하게 하는 패턴은?<\/p>","c":["Adapter","Memento","Singleton","Flyweight"],"a":0,"e":"<p>인터페이스를 맞춰 주는 변환기 역할이 Adapter다.<\/p>"},{"s":"<p>디자인 패턴에 대한 설명으로 틀린 것은?<\/p>","c":["개발자 간 의사소통을 원활하게 한다.","GoF 패턴은 생성, 구조, 행위로 분류된다.","디자인 패턴을 적용하면 항상 코드가 단순해지고 클래스 수가 줄어든다.","자주 발생하는 설계 문제에 대한 재사용 가능한 해법이다."],"a":2,"e":"<p>패턴은 재사용성을 높이지만 클래스 수가 늘고 구조가 복잡해질 수 있다.<\/p>"}]},{"id":"interface-mid","title":"인터페이스 요구사항·시스템과 미들웨어","freq":"미들웨어 약 20문항. MOM, ORB, WAS, EAI 유형이 반복","concept":"<p><strong>미들웨어<\/strong>는 서로 다른 시스템·프로그램 사이에서 통신을 중개한다. 위치 투명성을 제공해 사용자가 위치를 몰라도 서비스를 쓸 수 있게 한다.<\/p><div class=\"tw\"><table><thead><tr><th>미들웨어<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>DB<\/td><td>DB 제조사와 애플리케이션 사이 연결 (ODBC, JDBC)<\/td><\/tr><tr><td>RPC<\/td><td>원격 프로시저를 로컬처럼 호출<\/td><\/tr><tr><td>MOM<\/td><td><strong>메시지 기반 비동기<\/strong> 통신, 느려도 안정적<\/td><\/tr><tr><td>TP-Monitor<\/td><td>온라인 트랜잭션 처리·감시 (항공 예약 등)<\/td><\/tr><tr><td>ORB<\/td><td>객체 지향 분산 시스템의 요청 처리 (CORBA)<\/td><\/tr><tr><td>WAS<\/td><td><strong>동적 콘텐츠<\/strong> 처리 웹 애플리케이션 서버 (Tomcat, WebLogic, JEUS)<\/td><\/tr><\/tbody><\/table><\/div><p><strong>EAI(기업 애플리케이션 통합) 구축 유형<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>유형<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>Point-to-Point<\/td><td>1:1 직접 연결. 변경·재사용 어려움<\/td><\/tr><tr><td>Hub &amp; Spoke<\/td><td>허브를 통해 연결. 허브 장애 시 전체 영향<\/td><\/tr><tr><td>Message Bus<\/td><td>애플리케이션 사이에 미들웨어 버스를 둠. 확장성이 좋고 대용량 처리 가능<\/td><\/tr><tr><td>Hybrid<\/td><td>그룹 내 Hub &amp; Spoke, 그룹 간 Message Bus<\/td><\/tr><\/tbody><\/table><\/div><ul><li>ESB: 웹 서비스 중심 표준 기반 버스로, 애플리케이션 간 결합도를 약하게 유지한다.<\/li><li>인터페이스 요구사항 검증: 동료 검토, 워크스루, 인스펙션, CASE, 프로토타이핑, 테스트 설계.<\/li><li>인터페이스 시스템 식별: 송신 시스템, 수신 시스템, 연계 서버를 파악한다.<\/li><li>내부·외부 인터페이스: 시스템 내부 모듈 간과 외부 시스템 간의 연계로 구분한다.<\/li><\/ul>","qs":[{"s":"<p>미들웨어에 대한 설명으로 틀린 것은?<\/p>","c":["미들웨어를 사용하면 사용자는 서비스의 위치를 반드시 알아야 한다.","서로 다른 플랫폼 사이의 연동을 돕는다.","트랜잭션 처리나 메시지 전달 기능을 제공한다.","분산 환경에서 애플리케이션 간 통신을 중개한다."],"a":0,"e":"<p>미들웨어는 위치 투명성을 제공한다.<\/p>"},{"s":"<p>비동기 메시지 전달 방식이며, 응답이 다소 느려도 안정적인 처리가 필요한 곳에 쓰는 미들웨어는?<\/p>","c":["TP-Monitor","RPC","ODBC","MOM"],"a":3,"e":"<p>메시지 기반 비동기 통신은 MOM이다. RPC는 원격 프로시저를 호출하는 방식이다.<\/p>"},{"s":"<p>동적 콘텐츠를 처리하는 웹 환경의 미들웨어는?<\/p>","c":["ORB","WAS","IDL","CVS"],"a":1,"e":"<p>WAS는 웹 애플리케이션의 동적 콘텐츠를 처리한다.<\/p>"},{"s":"<p>EAI 구축 유형 중 애플리케이션 사이에 미들웨어 버스를 두어 처리하며 확장성이 좋고 대용량 처리가 가능한 것은?<\/p>","c":["Point-to-Point","Hub &amp; Spoke","Message Bus","Hybrid"],"a":2,"e":"<p>버스를 두는 방식이 Message Bus다. Hub &amp; Spoke는 허브 장애의 영향이 크다.<\/p>"},{"s":"<p>인터페이스 요구사항 검증 방법으로 가장 거리가 먼 것은?<\/p>","c":["동료 검토","워크스루","로드 밸런싱","인스펙션"],"a":2,"e":"<p>동료 검토, 워크스루, 인스펙션 등이 요구사항 검증 방법이다. 로드 밸런싱은 트래픽 분산 기술이다.<\/p>"}]},{"id":"interface-impl","title":"인터페이스 상세 설계·구현·보안","freq":"JSON, AJAX, IPSec, 연계 테스트 도구가 반복","concept":"<p><strong>데이터 명세·통신 기술<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>기술<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>JSON<\/td><td><strong>속성-값 쌍<\/strong>(Attribute-Value Pairs) 형식의 경량 데이터<\/td><\/tr><tr><td>XML<\/td><td>태그로 구조화한 확장 마크업 언어<\/td><\/tr><tr><td>AJAX<\/td><td>페이지 전체를 새로 고치지 않고 <strong>비동기로 일부만<\/strong> 갱신<\/td><\/tr><tr><td>REST<\/td><td>자원을 URI로 표현, HTTP 메서드로 조작<\/td><\/tr><tr><td>SOAP<\/td><td>XML 기반 메시지 교환 프로토콜<\/td><\/tr><tr><td>WSDL<\/td><td>웹 서비스의 명세를 XML로 기술<\/td><\/tr><tr><td>UDDI<\/td><td>웹 서비스 등록·검색 저장소<\/td><\/tr><tr><td>DOM<\/td><td>문서를 트리 구조 객체로 다루는 표준<\/td><\/tr><\/tbody><\/table><\/div><p><strong>인터페이스 오류 처리<\/strong>: 화면에 알림, 오류 로그 작성, 오류 테이블 관리. 사용자에게 쉽게 알리고 재처리할 수 있게 한다.<\/p><p><strong>인터페이스 보안<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>영역<\/th><th>기술<\/th><\/tr><\/thead><tbody><tr><td>네트워크<\/td><td>IPSec, SSL/TLS, S-HTTP<\/td><\/tr><tr><td>애플리케이션<\/td><td>시큐어 코딩<\/td><\/tr><tr><td>데이터베이스<\/td><td>컬럼 암호화<\/td><\/tr><\/tbody><\/table><\/div><p><strong>IPSec<\/strong>: IP 계층 보안. <strong>AH<\/strong>는 무결성·인증, <strong>ESP<\/strong>는 무결성·인증·기밀성을 제공한다. 전송 모드와 터널 모드가 있다.<\/p><p><strong>연계 테스트·구현 도구<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>도구<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>xUnit<\/td><td>다양한 언어의 단위 테스트 프레임워크 (JUnit, CppUnit, HttpUnit)<\/td><\/tr><tr><td>STAF<\/td><td>서비스 호출, 컴포넌트 재사용 기반 자동화<\/td><\/tr><tr><td>FitNesse<\/td><td>웹 기반 테스트 케이스 설계·실행<\/td><\/tr><tr><td>NTAF<\/td><td>STAF와 FitNesse를 통합한 프레임워크<\/td><\/tr><tr><td>Selenium<\/td><td>웹 애플리케이션 테스트<\/td><\/tr><tr><td>watir<\/td><td>Ruby 기반 웹 테스트<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Ant·Maven·Gradle은 빌드 자동화 도구로, 연계 테스트 도구가 아니다.<\/li><\/ul><ul><li>연계 방식: 직접 연계(DB Link, DB Connection, API, JDBC, Hyperlink), 간접 연계(EAI, ESB, Web Service, Socket).<\/li><li>인터페이스 명세서: 송수신 시스템, 데이터 항목, 처리 주기, 오류 처리 등을 정의한다.<\/li><\/ul>","qs":[{"s":"<p>중괄호 안에 <code>\"name\": \"kim\"<\/code> 형태로 값을 적어 서버와 데이터를 주고받는 경량 텍스트 형식은?<\/p>","c":["HTML","UDDI","JSON","SMTP"],"a":2,"e":"<p>속성-값 쌍 형태의 경량 텍스트 형식은 JSON이다.<\/p>"},{"s":"<p>웹 페이지 전체를 다시 불러오지 않고 필요한 일부만 비동기로 갱신하는 기술은?<\/p>","c":["IPSec","WSDL","SOAP","AJAX"],"a":3,"e":"<p>AJAX는 XMLHttpRequest 등을 이용한 비동기 통신 기술이다.<\/p>"},{"s":"<p>IPSec에서 기밀성 제공까지 포함하는 프로토콜은?<\/p>","c":["AH","ESP","IKE","ARP"],"a":1,"e":"<p>AH는 무결성과 인증을 제공하고, ESP는 여기에 암호화를 통한 기밀성까지 제공한다.<\/p>"},{"s":"<p>컴파일과 패키징을 맡는 빌드 도구로, 인터페이스 동작을 검증하는 용도와 거리가 있는 것은?<\/p>","c":["Ant","xUnit","FitNesse","STAF"],"a":0,"e":"<p>Ant는 빌드 자동화 도구다. xUnit, FitNesse, STAF는 테스트·검증 도구다.<\/p>"},{"s":"<p>시스템 간 간접 연계 방식에 해당하는 것은?<\/p>","c":["DB Link","JDBC","EAI","Hyperlink"],"a":2,"e":"<p>EAI, ESB, Web Service, Socket은 중간 솔루션이나 통신 채널을 거치는 간접 연계다. DB Link, JDBC, Hyperlink는 직접 연계다.<\/p>"}]}]},{"title":"1과목 소프트웨어 개발 (방법론·구현·테스트)","desc":"생명주기, 비용 산정, 형상 관리, 패키징, 테스트, 자료구조·알고리즘을 다룬다.","types":[{"id":"lifecycle","title":"소프트웨어 생명주기 모델","freq":"방법론 약 24문항 중 폭포수·나선형·프로토타입 비교가 반복","concept":"<div class=\"tw\"><table><thead><tr><th>모델<\/th><th>특징<\/th><\/tr><\/thead><tbody><tr><td>폭포수 (Waterfall)<\/td><td>단계를 <strong>순차적<\/strong>으로 진행. 이전 단계로 돌아가기 어려움. 산출물 명확<\/td><\/tr><tr><td>프로토타입<\/td><td>견본을 만들어 요구를 확인. 사용자 요구가 모호할 때 적합<\/td><\/tr><tr><td>나선형 (Spiral)<\/td><td><strong>계획 → 위험 분석 → 개발 → 고객 평가<\/strong> 반복. 위험 관리 중심, 대규모 시스템에 적합<\/td><\/tr><tr><td>V 모델<\/td><td>폭포수에 테스트를 대응. 개발 단계마다 검증 단계가 짝을 이룸<\/td><\/tr><tr><td>RAD<\/td><td>매우 짧은 주기, 컴포넌트 재사용·CASE 활용<\/td><\/tr><tr><td>애자일<\/td><td>짧은 주기 반복, 변화에 대응<\/td><\/tr><tr><td>4세대 기법 (4GT)<\/td><td>자동화 도구로 코드 생성<\/td><\/tr><\/tbody><\/table><\/div><ul><li>나선형 모델은 보헴(Boehm)이 제안했다.<\/li><li>폭포수의 순서: 타당성 검토 → 계획 → 요구 분석 → 설계 → 구현 → 테스트 → 유지보수.<\/li><li>유지보수 종류: <strong>수정<\/strong>(오류 수정), <strong>적응<\/strong>(환경 변화), <strong>완전화<\/strong>(기능 개선, 비중 가장 큼), <strong>예방<\/strong>.<\/li><\/ul>","qs":[{"s":"<p>나선형 모델의 수행 활동 순서로 옳은 것은?<\/p>","c":["개발 → 계획 수립 → 위험 분석 → 고객 평가","위험 분석 → 계획 수립 → 고객 평가 → 개발","계획 수립 → 위험 분석 → 개발 → 고객 평가","계획 수립 → 개발 → 위험 분석 → 고객 평가"],"a":2,"e":"<p>나선형 모델은 계획, 위험 분석, 개발, 고객 평가를 반복한다.<\/p>"},{"s":"<p>사용자 요구가 불명확할 때 견본을 만들어 요구를 확인하는 모델은?<\/p>","c":["V 모델","4세대 기법","폭포수 모델","프로토타입 모델"],"a":3,"e":"<p>견본을 통해 요구사항을 검증하는 것이 프로토타입 모델이다.<\/p>"},{"s":"<p>폭포수 모델에 대한 설명으로 옳은 것은?<\/p>","c":["각 단계가 끝나야 다음 단계로 진행하며 단계별 산출물이 명확하다.","위험 분석을 반복하는 것이 핵심이다.","짧은 주기의 반복 개발을 강조한다.","요구사항 변경을 언제든 쉽게 반영할 수 있다."],"a":0,"e":"<p>폭포수는 순차적이고 산출물이 명확하지만 변경 대응이 어렵다. 위험 분석 반복은 나선형, 짧은 반복은 애자일의 특징이다.<\/p>"},{"s":"<p>개발 단계와 테스트 단계를 짝지어 표현한 모델은?<\/p>","c":["RAD 모델","V 모델","칸반 모델","나선형 모델"],"a":1,"e":"<p>V 모델은 왼쪽의 개발 단계와 오른쪽의 테스트 단계를 대응시킨다.<\/p>"},{"s":"<p>소프트웨어 유지보수 중 사용자 요구에 따라 기능을 개선하는 활동으로, 일반적으로 비중이 가장 큰 것은?<\/p>","c":["완전화 유지보수","예방 유지보수","수정 유지보수","적응 유지보수"],"a":0,"e":"<p>기능 개선과 추가는 완전화 유지보수이며 비중이 가장 크다.<\/p>"}]},{"id":"methodology","title":"개발 방법론과 생산성","freq":"구조적·정보공학·CBD 구분이 반복","concept":"<div class=\"tw\"><table><thead><tr><th>방법론<\/th><th>특징<\/th><\/tr><\/thead><tbody><tr><td>구조적<\/td><td><strong>기능 중심<\/strong>, 자료 흐름 분석(DFD), 분할과 정복<\/td><\/tr><tr><td>정보공학<\/td><td><strong>데이터 중심<\/strong>, 정보 시스템 계획, ERD를 사용<\/td><\/tr><tr><td>객체지향<\/td><td>객체 중심, 현실 세계를 객체로 모델링<\/td><\/tr><tr><td>CBD (컴포넌트 기반)<\/td><td>재사용 가능한 <strong>컴포넌트를 조립<\/strong>. 비용 절감, 개발 기간 단축<\/td><\/tr><tr><td>제품 계열 (Product Line)<\/td><td>공통 기능을 재사용, 도메인·애플리케이션 공학<\/td><\/tr><tr><td>애자일<\/td><td>변화 대응<\/td><\/tr><\/tbody><\/table><\/div><ul><li>소프트웨어 공학의 기본 원칙: 현대적 프로그래밍 기술 적용, 지속적 검증, 결과 기록(문서화).<\/li><li>소프트웨어 위기의 원인: 품질·일정·비용 관리 실패, 유지보수 어려움.<\/li><li>소프트웨어 특징: 무형성, 복제 용이, 변경 용이.<\/li><li>생산성에 영향을 주는 요소: 개발자 숙련도, 팀 의사소통, 제품 복잡도, 사용 도구.<\/li><li>위험 관리: 위험 식별 → 분석·평가 → 관리 계획 → 모니터링(위험 징후를 지속 관찰).<\/li><li>정형 기술 검토(FTR) 지침: 제품 검토에 집중, 의제 제한, 논쟁과 반박 제한, 문제 영역을 명확히 표현, 사전 작성 노트, 참가자 수 제한, 시간 제한.<\/li><\/ul>","qs":[{"s":"<p>재사용 가능한 부품을 조립해 소프트웨어를 만드는 방법론은?<\/p>","c":["폭포수 방법론","구조적 방법론","CBD","정보공학 방법론"],"a":2,"e":"<p>컴포넌트를 조립해 개발하는 것이 CBD다.<\/p>"},{"s":"<p>정보공학 방법론의 주요 특징은?<\/p>","c":["컴포넌트 저장소만을 활용한다.","데이터 중심으로 정보 시스템을 계획하고 설계한다.","객체를 조합해 시스템을 구성한다.","기능을 계층적으로 분해하는 데 중심을 둔다."],"a":1,"e":"<p>정보공학은 데이터 중심 방법론이다. 기능 분해는 구조적 방법론의 특징이다.<\/p>"},{"s":"<p>위험 관리 활동 중 위험의 징후를 계속 지켜보는 활동은?<\/p>","c":["위험 전가","위험 식별","위험 회피","위험 모니터링"],"a":3,"e":"<p>징후를 관찰하는 활동이 위험 모니터링이다.<\/p>"},{"s":"<p>정형 기술 검토(FTR) 지침으로 틀린 것은?<\/p>","c":["검토 시간을 제한하지 않고 끝날 때까지 토론한다.","참가자 수를 제한한다.","제품 검토에만 집중한다.","논쟁을 제한한다."],"a":0,"e":"<p>FTR은 참가자 수, 시간, 논쟁을 제한하고 제품 검토에 집중한다.<\/p>"},{"s":"<p>어느 개발팀의 작업 규칙 중 소프트웨어 공학의 원칙에 어긋나는 것은?<\/p>","c":["테스트 결과를 남겨 변경 이력을 추적한다.","단계마다 산출물을 검증한다.","설계 문서를 없애고 담당자의 기억에 의존한다.","검증된 최신 개발 기법을 도입한다."],"a":2,"e":"<p>작업 결과를 기록해 추적할 수 있어야 한다.<\/p>"}]},{"id":"cost","title":"비용 산정 모델","freq":"비용산정 약 15문항. COCOMO 유형과 LOC 계산이 대표 문제","concept":"<div class=\"tw\"><table><thead><tr><th>분류<\/th><th>기법<\/th><\/tr><\/thead><tbody><tr><td>하향식<\/td><td>전문가 판단, 델파이<\/td><\/tr><tr><td>상향식<\/td><td>LOC(원시 코드 라인 수), 개발 단계별 인월수<\/td><\/tr><tr><td>수학적 모델<\/td><td>COCOMO, Putnam, 기능 점수(FP)<\/td><\/tr><\/tbody><\/table><\/div><p><strong>LOC 공식<\/strong><\/p><ul><li>예측 LOC는 낙관치, 기대치, 비관치로 추정한다.<\/li><li>노력(인월) = 예측 LOC ÷ 월별 생산성(1인 1개월 라인 수)<\/li><li>개발 기간(월) = 노력 ÷ 투입 인원<\/li><li>월별 생산성 = 총 LOC ÷ (인원 × 개월)<\/li><\/ul><p><strong>COCOMO<\/strong> (보헴): 원시 코드 규모로 산정한다.<\/p><div class=\"tw\"><table><thead><tr><th>유형<\/th><th>규모<\/th><\/tr><\/thead><tbody><tr><td>조직형 (Organic)<\/td><td>5만 라인 이하, 사무·업무용<\/td><\/tr><tr><td>반분리형 (Semi-detached)<\/td><td>30만 라인 이하, 컴파일러·OS 일부<\/td><\/tr><tr><td>내장형 (Embedded)<\/td><td>30만 라인 이상, 제약이 큰 실시간 시스템<\/td><\/tr><\/tbody><\/table><\/div><ul><li>기본 형태: 노력 = a × (KDSI)^b. 조직형은 a=2.4, b=1.05.<\/li><li>Putnam: <strong>Rayleigh-Norden 곡선<\/strong>으로 인력 분포를 예측한다. SLIM이 자동화 도구.<\/li><li>기능 점수(FP): 기능의 수와 복잡도로 산정. 자동화 도구 ESTIMACS.<\/li><li>일정 기법: PERT(낙관·기대·비관치), CPM(임계 경로), 간트 차트(막대로 일정 표현).<\/li><li>2027 출제기준은 일정 관리 기법(PERT·CPM)을 명시하지 않으므로 이름만 구분해 두면 된다.<\/li><li>비용 결정 요소: 프로젝트 요소(제품 복잡도, 시스템 크기, 요구되는 신뢰도), 자원 요소(인적·하드웨어·소프트웨어 자원), 생산성 요소(개발자 능력, 개발 기간).<\/li><\/ul>","qs":[{"s":"<p>LOC 기법으로 예측한 코드가 36,000라인이다. 개발자 6명이 참여하고 1인당 월 평균 생산성이 300라인일 때 예상 개발 기간은?<\/p>","c":["6개월","10개월","20개월","30개월"],"a":2,"e":"<p>노력은 36,000 ÷ 300 = 120인월이고, 기간은 120 ÷ 6 = 20개월이다.<\/p>"},{"s":"<p>개발자 4명이 8개월 동안 24,000라인을 작성했을 때 인월당 생산성은?<\/p>","c":["750라인","1500라인","3000라인","6000라인"],"a":0,"e":"<p>24,000 ÷ (4 × 8) = 750라인이다.<\/p>"},{"s":"<p>COCOMO 모형의 유형이 아닌 것은?<\/p>","c":["반분리형","순차형","내장형","조직형"],"a":1,"e":"<p>COCOMO의 프로젝트 유형은 조직형, 반분리형, 내장형이다.<\/p>"},{"s":"<p>Putnam 모형의 기반이 되는 곡선은?<\/p>","c":["벨 곡선","로그 곡선","S 곡선","Rayleigh-Norden 곡선"],"a":3,"e":"<p>Putnam 모형은 Rayleigh-Norden 곡선으로 시간에 따른 인력 분포를 예측한다.<\/p>"},{"s":"<p>기능 점수(FP) 모형을 지원하는 자동화 도구는?<\/p>","c":["Jenkins","SLIM","Ant","ESTIMACS"],"a":3,"e":"<p>ESTIMACS는 FP 기반 자동화 도구이고, SLIM은 Putnam 기반 도구다.<\/p>"}]},{"id":"tailoring","title":"방법론 테일러링·개발 표준·프레임워크","freq":"CMMI·SPICE·테일러링 기준이 2027 출제기준에 명시","concept":"<p><strong>테일러링<\/strong>: 표준 방법론을 프로젝트 특성에 맞게 조정하는 일.<\/p><div class=\"tw\"><table><thead><tr><th>기준<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td>내부 기준<\/td><td>목표 환경, 요구사항, 프로젝트 규모, 보유 기술<\/td><\/tr><tr><td>외부 기준<\/td><td>법적 제약, 표준 품질 기준<\/td><\/tr><\/tbody><\/table><\/div><p><strong>개발 표준<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>표준<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>ISO/IEC 12207<\/td><td>소프트웨어 <strong>생명주기 프로세스<\/strong> 표준. 기본·지원·조직 프로세스<\/td><\/tr><tr><td>CMMI<\/td><td>조직의 프로세스 능력 성숙도. <strong>초기 → 관리 → 정의 → 정량적 관리 → 최적화<\/strong><\/td><\/tr><tr><td>SPICE (ISO/IEC 15504)<\/td><td>프로세스 평가. 수행 수준 0~5 (<strong>불완전 → 수행 → 관리 → 확립 → 예측 → 최적화<\/strong>)<\/td><\/tr><tr><td>ISO/IEC 25000 (SQuaRE)<\/td><td>품질 평가 통합 모델<\/td><\/tr><\/tbody><\/table><\/div><p><strong>소프트웨어 개발 프레임워크<\/strong><\/p><ul><li>반제품 형태로 개발을 표준화·자동화한다. 애플리케이션의 흐름을 프레임워크가 제어한다(<strong>제어의 역전, IoC<\/strong>).<\/li><li>특징: 모듈화, 재사용성, 확장성, 제어의 역전.<\/li><li>예: 전자정부 프레임워크, 스프링, Django, Node.js 기반 Express.<\/li><li>라이브러리는 개발자가 호출하지만 프레임워크는 개발자의 코드를 호출한다.<\/li><\/ul>","qs":[{"s":"<p>CMMI 성숙도 단계를 낮은 수준부터 바르게 나열한 것은?<\/p>","c":["관리 → 초기 → 정의 → 최적화 → 정량적 관리","초기 → 관리 → 정의 → 정량적 관리 → 최적화","초기 → 정의 → 관리 → 최적화 → 정량적 관리","초기 → 관리 → 정량적 관리 → 정의 → 최적화"],"a":1,"e":"<p>CMMI는 초기, 관리, 정의, 정량적 관리, 최적화 순서로 성숙한다.<\/p>"},{"s":"<p>소프트웨어 프레임워크의 특징으로 거리가 먼 것은?<\/p>","c":["모듈화를 통해 유지보수를 돕는다.","제어의 역전을 통해 프레임워크가 애플리케이션 코드를 호출한다.","재사용 가능한 코드를 제공한다.","개발자가 라이브러리를 호출하듯 흐름을 모두 직접 제어한다."],"a":3,"e":"<p>프레임워크는 제어의 역전이 특징이다. 흐름을 직접 제어하는 쪽은 라이브러리 사용 방식이다.<\/p>"},{"s":"<p>테일러링을 고려할 때 외부 기준에 해당하는 것은?<\/p>","c":["법적 제약 사항","보유 기술","프로젝트 규모","목표 환경"],"a":0,"e":"<p>법적 제약과 표준 품질 기준은 외부 기준이다.<\/p>"},{"s":"<p>SPICE(ISO/IEC 15504)의 프로세스 수행 능력 수준 중 수준 0에 해당하는 것은?<\/p>","c":["수행","관리","불완전","확립"],"a":2,"e":"<p>수준 0은 불완전, 1은 수행, 2는 관리, 3은 확립, 4는 예측, 5는 최적화다.<\/p>"},{"s":"<p>소프트웨어 생명주기 프로세스 국제 표준은?<\/p>","c":["ISO/IEC 12207","IEEE 802.11","ISO/IEC 27001","ISO 9000"],"a":0,"e":"<p>ISO/IEC 12207은 소프트웨어 생명주기 프로세스 표준이다. 27001은 정보보안 관리체계, 802.11은 무선 LAN 표준이다.<\/p>"}]},{"id":"impl-tools","title":"단위 모듈 구현과 개발·협업 도구","freq":"IDE 기능, 협업 도구, 단위 모듈 테스트가 출제","concept":"<p><strong>단위 모듈 구현<\/strong>: 설계서에 따라 기능을 코드로 작성하며, 단일 기능을 수행하는 작은 단위로 만든다.<\/p><p><strong>IDE (통합 개발 환경)<\/strong>: 코딩·컴파일·디버깅·배포를 하나의 환경에서 수행한다.<\/p><div class=\"tw\"><table><thead><tr><th>기능<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>Coding<\/td><td>프로그래밍 언어로 작성<\/td><\/tr><tr><td>Compile<\/td><td><strong>고급 언어를 기계어로<\/strong> 번역<\/td><\/tr><tr><td>Debugging<\/td><td>오류 수정<\/td><\/tr><tr><td>Deployment<\/td><td>사용자가 쓸 수 있게 배포<\/td><\/tr><\/tbody><\/table><\/div><p>도구 예: Eclipse, Visual Studio, IntelliJ, VS Code.<\/p><p><strong>협업 도구<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>분류<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td>프로젝트·일정 관리<\/td><td>Trello, Jira, Asana<\/td><\/tr><tr><td>정보 공유·문서<\/td><td>Confluence, Notion<\/td><\/tr><tr><td>커뮤니케이션<\/td><td>Slack, Teams<\/td><\/tr><tr><td>코드 저장소<\/td><td>GitHub, GitLab<\/td><\/tr><tr><td>디자인 공유<\/td><td>Figma, Zeplin<\/td><\/tr><\/tbody><\/table><\/div><p><strong>단위 모듈 테스트<\/strong>: 모듈 단독으로 테스트한다. 드라이버와 스텁이 호출·피호출 역할을 대신하며, 화이트박스·블랙박스 기법을 모두 사용한다.<\/p><p><strong>컴파일러와 인터프리터<\/strong>: 컴파일러는 전체를 한 번에 번역하고, 인터프리터는 한 줄씩 해석·실행한다.<\/p><p><strong>통합 구현 관리<\/strong>: 빌드, 저장소, 이슈 추적을 한 환경에서 연결한다.<\/p>","qs":[{"s":"<p>IDE 도구의 기능에 대한 설명으로 틀린 것은?<\/p>","c":["Compile은 저급 언어를 고급 언어로 변환하는 기능이다.","Deployment는 소프트웨어를 최종 사용자에게 전달하는 기능이다.","Coding은 프로그래밍 언어로 프로그램을 작성하는 기능이다.","Debugging은 프로그램의 오류를 찾아 수정하는 기능이다."],"a":0,"e":"<p>Compile은 고급 언어를 기계어로 번역한다.<\/p>"},{"s":"<p>다음 중 IDE 도구로 보기 어려운 것은?<\/p>","c":["Visual Studio","IntelliJ IDEA","Jenkins","Eclipse"],"a":2,"e":"<p>Jenkins는 지속적 통합을 위한 빌드 자동화 도구다.<\/p>"},{"s":"<p>협업 도구 분류가 잘못 연결된 것은?<\/p>","c":["커뮤니케이션 - Slack","정보 공유 - Maven","일정 관리 - Trello","디자인 공유 - Zeplin"],"a":1,"e":"<p>Maven은 빌드 자동화 도구다.<\/p>"},{"s":"<p>단위 모듈 테스트에 대한 설명으로 옳은 것은?<\/p>","c":["소스 코드를 전혀 참고할 수 없다.","여러 모듈을 모두 통합한 뒤에만 수행할 수 있다.","사용자가 실제 환경에서 수행하는 테스트이다.","단독으로 실행되지 않는 모듈은 드라이버와 스텁을 이용해 테스트한다."],"a":3,"e":"<p>단위 테스트는 드라이버와 스텁을 이용해 모듈 단독으로 수행하며 구조 기반 기법도 쓴다.<\/p>"},{"s":"<p>프로그램 전체를 한 번에 번역해 실행 파일을 만드는 언어 번역기는?<\/p>","c":["링커","컴파일러","디버거","인터프리터"],"a":1,"e":"<p>전체를 번역하면 컴파일러, 한 줄씩 실행하면 인터프리터다.<\/p>"}]},{"id":"config","title":"형상 관리와 버전 관리 도구","freq":"형상·빌드 약 12문항. 형상 관리 절차와 Git·SVN 비교가 반복","concept":"<p><strong>형상 관리(SCM)<\/strong>: 개발 과정의 변경 사항을 관리하는 활동이다. 개발 전 단계에 걸쳐 적용한다.<\/p><p><strong>절차<\/strong>: 식별 → 통제 → 감사 → 기록 (버전 제어를 식별 다음에 넣어 설명하는 교재도 있다)<\/p><div class=\"tw\"><table><thead><tr><th>활동<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>형상 식별<\/td><td>관리 대상을 정하고 이름을 붙임<\/td><\/tr><tr><td>버전 제어<\/td><td>버전 관리 도구로 변경 이력 관리<\/td><\/tr><tr><td>형상 통제<\/td><td>변경 요구 검토, <strong>기준선(Baseline)<\/strong> 반영<\/td><\/tr><tr><td>형상 감사<\/td><td>변경이 제대로 됐는지 검토<\/td><\/tr><tr><td>형상 기록<\/td><td>변경 사항을 기록·보고<\/td><\/tr><\/tbody><\/table><\/div><p><strong>버전 관리 도구<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>방식<\/th><th>도구<\/th><th>특징<\/th><\/tr><\/thead><tbody><tr><td>공유 폴더<\/td><td>RCS, SCCS<\/td><td>로컬 파일 복사 방식. RCS는 동시 수정을 잠금으로 방지<\/td><\/tr><tr><td>클라이언트/서버<\/td><td>CVS, SVN<\/td><td>중앙 저장소. 서버 장애 시 협업 불가<\/td><\/tr><tr><td>분산 저장소<\/td><td>Git, Mercurial, Bitkeeper<\/td><td>로컬 저장소에서 커밋, 원격과 동기화<\/td><\/tr><\/tbody><\/table><\/div><p><strong>용어<\/strong>: Repository(저장소), Check-in(반영), Check-out(가져오기), Commit(확정), Update(동기화), Import(처음 등록), Export(버전 정보 제외 추출), Branch(가지), Merge(병합).<\/p><p><strong>Git 명령<\/strong>: <code>add<\/code>(스테이징), <code>commit<\/code>(로컬 저장), <code>push<\/code>(원격 반영), <code>pull<\/code>(가져와 병합), <code>clone<\/code>(복제), <code>branch<\/code>, <code>merge<\/code>.<\/p><ul><li>프로젝트 비용을 줄이는 것 자체는 형상 관리의 직접 목적이 아니고, 변경 통제가 목적이다.<\/li><\/ul>","qs":[{"s":"<p>소프트웨어 형상 관리에 대한 설명으로 옳은 것은?<\/p>","c":["완성 후 운영 단계에서만 수행한다.","소스 코드만 관리 대상이다.","개발 과정에서 발생하는 변경을 식별하고 통제·기록하는 활동이다.","버전 관리 도구와 관계가 없다."],"a":2,"e":"<p>형상 관리는 전체 단계에 걸쳐 산출물 전반의 변경을 관리한다.<\/p>"},{"s":"<p>형상 관리 절차로 옳은 것은?<\/p>","c":["통제 → 식별 → 기록 → 감사","식별 → 감사 → 통제 → 기록","기록 → 식별 → 통제 → 감사","식별 → 통제 → 감사 → 기록"],"a":3,"e":"<p>식별, 통제, 감사, 기록 순서로 수행한다.<\/p>"},{"s":"<p>분산 저장소 방식의 버전 관리 도구는?<\/p>","c":["CVS","Git","SVN","RCS"],"a":1,"e":"<p>Git은 분산 방식이다. CVS와 SVN은 클라이언트/서버 방식이고 RCS는 로컬 방식이다.<\/p>"},{"s":"<p>Git에서 로컬 저장소의 변경 사항을 원격 저장소에 반영하는 명령은?<\/p>","c":["push","add","init","clone"],"a":0,"e":"<p>push는 로컬 커밋을 원격 저장소로 보낸다.<\/p>"},{"s":"<p>동시에 소스를 수정하지 못하도록 잠금을 사용하고 변경 이력을 파일로 관리하는 도구는?<\/p>","c":["RCS","RTS","RPC","RVS"],"a":0,"e":"<p>RCS(Revision Control System)는 잠금으로 동시 수정을 방지한다.<\/p>"}]},{"id":"packaging","title":"제품 패키징·배포·빌드 자동화·매뉴얼","freq":"패키징 약 14문항. 사용자 관점 고려와 빌드 도구 구분이 반복","concept":"<p><strong>애플리케이션 패키징<\/strong>: 개발 완료된 소프트웨어를 사용자에게 배포할 형태로 묶는 일이다. <strong>사용자 중심<\/strong>으로 진행한다.<\/p><ul><li>고려 사항: 사용자 시스템 환경(OS, CPU, 메모리), 직관적 UI, 관리 서비스 형태, 안정적 배포.<\/li><li>작업 순서: 기능 식별 → 모듈화 → 빌드 진행 → 사용자 환경 분석 → 패키징·배포 → 변경·개선 관리.<\/li><li>배포 도구 고려 사항: 암호화, 재패키징 고려, 이기종 연동, 사용자 편의성.<\/li><li>모니터링 도구: 변경 관리(ChangeMiner), 성능 관리(Jennifer, Nmon), 정적 분석(PMD, Cppcheck, Checkstyle), 동적 분석(Avalanche, Valgrind).<\/li><\/ul><p><strong>릴리즈 노트<\/strong>: 현재 시점의 변경 내용을 사용자에게 알리는 문서. 항목은 헤더(문서·제품 이름, 버전, 날짜), 개요, 목적, 이슈 요약, 재현 항목, 수정·개선 내용, 사용자 영향도, SW 지원 영향도, 노트, 면책 조항, 연락처.<\/p><p><strong>빌드 자동화 도구<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>도구<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>Ant<\/td><td>XML, 자바 프로젝트 빌드<\/td><\/tr><tr><td>Maven<\/td><td>POM 기반 의존성 관리<\/td><\/tr><tr><td>Gradle<\/td><td><strong>Groovy<\/strong> 기반, 안드로이드 공식 도구, 실행 결과 캐시 재사용<\/td><\/tr><tr><td>Jenkins<\/td><td>Java 기반 <strong>CI 서버<\/strong>, 웹 UI, 형상 도구와 연동<\/td><\/tr><\/tbody><\/table><\/div><p><strong>매뉴얼<\/strong>: 설치 매뉴얼(설치 과정·환경), 사용자 매뉴얼(사용법). 설치 매뉴얼의 구성에는 목차, 개요, 서문, 기본 사항, 설치 절차, FAQ 등이 있다.<\/p>","qs":[{"s":"<p>제품 소프트웨어 패키징에 대한 설명으로 틀린 것은?<\/p>","c":["사용하기 쉬운 UI를 제공한다.","개발자의 편의를 최우선으로 고려하여 패키징한다.","사용자의 시스템 환경을 고려한다.","기능 단위로 모듈화하여 패키징한다."],"a":1,"e":"<p>패키징은 사용자 중심으로 진행한다.<\/p>"},{"s":"<p>Groovy 기반으로 스크립트를 작성하며 안드로이드 앱 개발에 공식적으로 쓰이는 빌드 도구는?<\/p>","c":["Jira","Ant","SVN","Gradle"],"a":3,"e":"<p>Gradle은 Groovy 기반 DSL을 사용하며 안드로이드 공식 빌드 도구다.<\/p>"},{"s":"<p>Java 기반의 지속적 통합 서버로 웹 인터페이스로 빌드 작업을 관리하는 도구는?<\/p>","c":["Jenkins","Valgrind","Figma","Selenium"],"a":0,"e":"<p>Jenkins는 대표적인 CI 서버다.<\/p>"},{"s":"<p>릴리즈 노트 항목 중 문서 이름, 제품 이름, 버전, 작성일을 적는 항목은?<\/p>","c":["개요","재현 항목","헤더","면책 조항"],"a":2,"e":"<p>헤더에는 문서와 제품의 기본 정보를 적는다.<\/p>"},{"s":"<p>패키징 도구를 도입할 때 함께 검토하지 않아도 되는 항목은?<\/p>","c":["반드시 암호화·보안 기능을 고려한다.","재패키징 가능성을 고려한다.","보안을 위해 이기종 콘텐츠와의 연동을 차단한다.","사용자 편의성을 고려한다."],"a":2,"e":"<p>패키징 도구는 이기종 콘텐츠 및 단말기 간 연동을 고려해야 한다.<\/p>"}]},{"id":"drm","title":"디지털 저작권 관리(DRM)","freq":"DRM 구성요소 이름 맞히기가 반복","concept":"<p>DRM은 디지털 콘텐츠의 <strong>불법 복제와 무단 사용을 막고<\/strong> 유통을 관리하는 기술이다.<\/p><div class=\"tw\"><table><thead><tr><th>구성 요소<\/th><th>역할<\/th><\/tr><\/thead><tbody><tr><td>콘텐츠 제공자 (Contents Provider)<\/td><td>콘텐츠 제공<\/td><\/tr><tr><td>패키저 (Packager)<\/td><td>콘텐츠를 <strong>메타데이터와 함께 암호화된 파일로<\/strong> 묶음<\/td><\/tr><tr><td>콘텐츠 분배자 (Contents Distributor)<\/td><td>암호화된 콘텐츠 유통<\/td><\/tr><tr><td>클리어링 하우스 (Clearing House)<\/td><td><strong>키 관리, 라이선스 발급·정산<\/strong><\/td><\/tr><tr><td>DRM 컨트롤러<\/td><td>콘텐츠 이용 권한을 통제<\/td><\/tr><tr><td>보안 컨테이너<\/td><td>콘텐츠 원본을 안전하게 유통하기 위한 장치<\/td><\/tr><tr><td>콘텐츠 소비자<\/td><td>콘텐츠 구매·이용<\/td><\/tr><\/tbody><\/table><\/div><p><strong>기술 요소<\/strong>: 암호화, 키 관리, 암호화 파일 생성(Packager), 식별 기술(DOI, URI), 저작권 표현(XrML, MPEG-21 REL), 정책 관리, 크랙 방지, 인증(사용자 인증).<\/p><p>워터마킹은 콘텐츠에 저작권 정보를 삽입하는 기술이다. DRM은 키 관리와 유통 통제까지 포함하는 포괄적 체계다.<\/p>","qs":[{"s":"<p>DRM 구성 요소 중 키 관리와 라이선스 발급을 담당하는 것은?<\/p>","c":["콘텐츠 소비자","클리어링 하우스","콘텐츠 제공자","패키저"],"a":1,"e":"<p>클리어링 하우스가 키 관리, 사용 권한 발급, 정산을 담당한다.<\/p>"},{"s":"<p>콘텐츠를 메타데이터와 함께 암호화된 배포 단위로 묶는 구성 요소는?<\/p>","c":["콘텐츠 분배자","DRM 컨트롤러","보안 컨테이너","패키저"],"a":3,"e":"<p>패키저는 콘텐츠와 메타데이터를 암호화된 파일로 묶는다.<\/p>"},{"s":"<p>콘텐츠 이용 권한을 단말에서 통제하는 구성 요소는?<\/p>","c":["콘텐츠 제공자","콘텐츠 분배자","DRM 컨트롤러","패키저"],"a":2,"e":"<p>DRM 컨트롤러가 배포된 콘텐츠의 이용 권한을 통제한다.<\/p>"},{"s":"<p>DRM의 기술 요소로 거리가 먼 것은?<\/p>","c":["로드 밸런싱","암호화","식별 기술","키 관리"],"a":0,"e":"<p>로드 밸런싱은 부하 분산 기술로 DRM 요소가 아니다.<\/p>"},{"s":"<p>DRM에 대한 설명으로 가장 옳은 것은?<\/p>","c":["서버 간 부하를 나누는 기술이다.","코드의 버전을 관리하는 도구이다.","콘텐츠의 불법 복제를 막고 사용 권한을 관리하는 체계이다.","데이터베이스의 무결성을 검증하는 기술이다."],"a":2,"e":"<p>DRM은 디지털 콘텐츠의 사용 권한을 관리한다.<\/p>"}]},{"id":"quality","title":"소프트웨어 품질 특성과 국제 표준","freq":"품질·표준 약 24문항. ISO 25010 부특성 구분이 출제","concept":"<p><strong>ISO/IEC 25010 제품 품질 특성<\/strong> (ISO/IEC 9126의 후속, 2011판 8특성 기준. 2023 개정판은 안전성을 더한 9특성이다)<\/p><div class=\"tw\"><table><thead><tr><th>특성<\/th><th>의미<\/th><th>부특성 예<\/th><\/tr><\/thead><tbody><tr><td>기능 적합성<\/td><td>요구 기능을 제공<\/td><td>완전성, 정확성, 타당성<\/td><\/tr><tr><td>성능 효율성<\/td><td>자원 대비 성능<\/td><td>시간 반응성, 자원 활용성, 용량<\/td><\/tr><tr><td>호환성<\/td><td>다른 제품과 공존·정보 교환<\/td><td>공존성, 상호운용성<\/td><\/tr><tr><td>사용성<\/td><td>쉽게 이해·사용<\/td><td>인식 용이성, 학습성, 운용성, 오류 방지, 접근성<\/td><\/tr><tr><td>신뢰성<\/td><td>정해진 조건에서 <strong>기능을 유지<\/strong><\/td><td>성숙성, 가용성, 결함 허용성, 회복성<\/td><\/tr><tr><td>보안성<\/td><td>정보 보호<\/td><td>기밀성, 무결성, 부인 방지, 책임성, 인증성<\/td><\/tr><tr><td>유지보수성<\/td><td>수정 용이<\/td><td>모듈성, 재사용성, 분석성, 수정 가능성, 시험 가능성<\/td><\/tr><tr><td>이식성<\/td><td>다른 환경으로 옮김<\/td><td>적응성, 설치 용이성, 대체 용이성<\/td><\/tr><\/tbody><\/table><\/div><p><strong>ISO/IEC 9126 특성<\/strong>: 기능성, 신뢰성, 사용성, 효율성, 유지보수성, 이식성(6개).<\/p><p><strong>관련 표준<\/strong>: ISO/IEC 14598(제품 평가), ISO/IEC 12119(패키지 품질 요구·시험), ISO/IEC 25000(SQuaRE, 9126과 14598, 12119를 통합).<\/p><ul><li>정확성(Correctness): 사용자의 요구 기능을 충족시키는 정도.<\/li><li>무결성(Integrity): 허용되지 않은 접근·변경을 통제하는 정도.<\/li><li>사용 용이성: 사용에 필요한 노력을 최소화하고 쉽게 사용할 수 있는 정도.<\/li><\/ul>","qs":[{"s":"<p>ISO/IEC 25010 품질 특성 중 다른 환경으로 쉽게 옮겨 쓸 수 있는 정도를 뜻하는 것은?<\/p>","c":["사용성","보안성","신뢰성","이식성"],"a":3,"e":"<p>환경 이동의 용이함은 이식성이다.<\/p>"},{"s":"<p>ISO/IEC 9126의 품질 특성이 아닌 것은?<\/p>","c":["기밀성","유지보수성","신뢰성","기능성"],"a":0,"e":"<p>9126의 주특성은 기능성, 신뢰성, 사용성, 효율성, 유지보수성, 이식성이다.<\/p>"},{"s":"<p>ISO/IEC 25010에서 신뢰성의 부특성은?<\/p>","c":["적응성","결함 허용성","학습성","시간 반응성"],"a":1,"e":"<p>신뢰성의 부특성은 성숙성, 가용성, 결함 허용성, 회복성이다. 적응성은 이식성, 학습성은 사용성, 시간 반응성은 성능 효율성에 속한다.<\/p>"},{"s":"<p>ISO/IEC 9126, 14598, 12119를 통합한 소프트웨어 품질 평가 통합 모델 표준은?<\/p>","c":["ISO 14001","ISO/IEC 27001","ISO/IEC 25000","ISO/IEC 12207"],"a":2,"e":"<p>SQuaRE라고 부르는 ISO/IEC 25000이 품질 평가를 통합한다.<\/p>"},{"s":"<p>유지보수성에 포함되는 부특성은?<\/p>","c":["부인 방지","접근성","공존성","시험 가능성"],"a":3,"e":"<p>유지보수성의 부특성은 모듈성, 재사용성, 분석성, 수정 가능성, 시험 가능성이다.<\/p>"}]},{"id":"test-basic","title":"테스트 기본 원리·케이스·시나리오","freq":"테스트 약 29문항. 테스트 원리와 오라클 종류가 반복","concept":"<p><strong>테스트 원리<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>원리<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>결함 존재 증명<\/td><td>테스트는 결함이 있음을 보여 줄 뿐 <strong>없음을 증명하지 못함<\/strong><\/td><\/tr><tr><td>완벽한 테스트 불가능<\/td><td>모든 경우를 테스트할 수 없음<\/td><\/tr><tr><td>초기 집중<\/td><td>결함은 일찍 찾을수록 비용이 적음<\/td><\/tr><tr><td>결함 집중 (파레토)<\/td><td>적은 모듈에 결함이 몰림 (80:20)<\/td><\/tr><tr><td>살충제 패러독스<\/td><td>같은 테스트 반복 시 새 결함을 찾지 못함<\/td><\/tr><tr><td>정황 의존<\/td><td>소프트웨어 성격에 맞게 테스트<\/td><\/tr><tr><td>오류-부재의 궤변<\/td><td>결함이 없어도 요구를 못 맞추면 품질이 낮음<\/td><\/tr><\/tbody><\/table><\/div><p><strong>용어<\/strong><\/p><ul><li>테스트 케이스: 입력값, 실행 조건, 예상 결과의 집합.<\/li><li>테스트 시나리오: 테스트 케이스의 <strong>동작 순서<\/strong>를 기술한 문서.<\/li><li>테스트 오라클: 결과의 참·거짓을 판단하는 기준.<\/li><\/ul><div class=\"tw\"><table><thead><tr><th>오라클<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>참 (True)<\/td><td>모든 입력에 대한 기대 결과 제공, 모든 오류 검출<\/td><\/tr><tr><td>샘플링 (Sampling)<\/td><td>일부 입력에 대해서만 기대 결과<\/td><\/tr><tr><td>추정 (Heuristic)<\/td><td>샘플링 + 나머지는 추정<\/td><\/tr><tr><td>일관성 (Consistent)<\/td><td>이전 버전과 결과 비교, 회귀 테스트에 사용<\/td><\/tr><\/tbody><\/table><\/div><ul><li>검증(Verification): <strong>제품을 올바르게<\/strong> 만들었는가 (개발자 관점).<\/li><li>확인(Validation): <strong>올바른 제품을<\/strong> 만들었는가 (사용자 관점).<\/li><li>테스트 지식 체계: 테스트 프로세스, 레벨, 기법, 도구를 체계화한 것.<\/li><\/ul>","qs":[{"s":"<p>테스트의 기본 원리에 대한 설명으로 옳은 것은?<\/p>","c":["테스트는 결함이 있음을 보여 줄 뿐 결함이 없음을 증명할 수는 없다.","같은 테스트를 반복할수록 새로운 결함이 더 잘 발견된다.","모든 입력 조합을 테스트하는 것이 항상 가능하다.","결함은 모든 모듈에 균등하게 분포한다."],"a":0,"e":"<p>결함의 부재는 증명할 수 없다. 완벽한 테스트는 불가능하고, 결함은 일부 모듈에 집중되며, 같은 테스트를 반복하면 살충제 패러독스가 생긴다.<\/p>"},{"s":"<p>동일한 테스트 케이스로 반복 테스트하면 더 이상 새 결함을 찾지 못한다는 원리는?<\/p>","c":["오류-부재의 궤변","살충제 패러독스","브룩스의 법칙","파레토 법칙"],"a":1,"e":"<p>살충제 패러독스를 막으려면 테스트 케이스를 주기적으로 개선해야 한다.<\/p>"},{"s":"<p>테스트 오라클 중 이전 버전과의 결과를 비교하며 회귀 테스트에 주로 쓰이는 것은?<\/p>","c":["샘플링 오라클","추정 오라클","일관성 오라클","참 오라클"],"a":2,"e":"<p>이전 수행 결과와 일관되는지 비교하는 것이 일관성 오라클이다.<\/p>"},{"s":"<p>\"올바른 제품을 만들었는가\"를 사용자 관점에서 평가하는 활동은?<\/p>","c":["디버깅","검증(Verification)","인스펙션","확인(Validation)"],"a":3,"e":"<p>Validation은 사용자 요구를 충족했는지 본다. Verification은 명세대로 만들었는지 본다.<\/p>"},{"s":"<p>테스트 케이스의 구성 요소로 거리가 먼 것은?<\/p>","c":["입력값","실행 조건","예상 결과","프로젝트 비용 산정 결과"],"a":3,"e":"<p>테스트 케이스는 입력값, 실행 조건, 예상 결과로 구성된다.<\/p>"}]},{"id":"test-method","title":"블랙박스·화이트박스 테스트","freq":"테스트 기법 분류와 커버리지 정의를 묻는 문항이 대부분","concept":"<div class=\"tw\"><table><thead><tr><th>분류<\/th><th>기법<\/th><\/tr><\/thead><tbody><tr><td><strong>블랙박스<\/strong> (명세 기반)<\/td><td>동등 분할(동치 분할), 경계값 분석, 원인-효과 그래프, 오류 예측, 비교, 상태 전이, 결정 테이블<\/td><\/tr><tr><td><strong>화이트박스<\/strong> (구조 기반)<\/td><td>기초 경로, 제어 구조(조건·루프·데이터 흐름), 커버리지<\/td><\/tr><\/tbody><\/table><\/div><p><strong>화이트박스의 특징<\/strong>: 소스 코드의 논리 구조를 보고 기초 경로·분기·조건을 체계적으로 시험한다. 프로그램 구조에 따른 테스트 케이스를 만들 수 있다.<\/p><div class=\"tw\"><table><thead><tr><th>커버리지<\/th><th>기준<\/th><\/tr><\/thead><tbody><tr><td>문장<\/td><td>모든 문장 한 번 이상 실행<\/td><\/tr><tr><td>분기(결정)<\/td><td>각 분기의 참·거짓을 한 번 이상<\/td><\/tr><tr><td>조건<\/td><td>개별 조건식의 참·거짓을 한 번 이상<\/td><\/tr><tr><td>조건/결정<\/td><td>조건과 결정을 모두<\/td><\/tr><tr><td>MC/DC<\/td><td>각 조건이 결과에 독립적으로 영향<\/td><\/tr><tr><td>다중 조건<\/td><td>모든 조건의 조합<\/td><\/tr><\/tbody><\/table><\/div><p><strong>McCabe 순환 복잡도<\/strong>: <code>V(G) = E − N + 2<\/code>. E는 간선 수, N은 노드 수. 또는 <code>판단문 수 + 1<\/code>.<\/p><p><strong>예<\/strong>: 점수 범위 0~100이면 경계값은 -1, 0, 100, 101이다.<\/p><p><strong>정적 테스트<\/strong>: 실행하지 않고 코드·문서를 검토 (워크스루, 인스펙션, 정적 분석). <strong>동적 테스트<\/strong>: 실행하여 검증 (블랙박스, 화이트박스).<\/p>","qs":[{"s":"<p>화이트박스 테스트 기법에 해당하는 것은?<\/p>","c":["동등 분할","기초 경로 검사","원인-효과 그래프","경계값 분석"],"a":1,"e":"<p>기초 경로 검사는 코드 구조를 기반으로 한다. 나머지는 블랙박스 기법이다.<\/p>"},{"s":"<p>블랙박스 테스트에 대한 설명으로 옳은 것은?<\/p>","c":["개발자가 코드 수정과 함께 수행해야만 한다.","모든 문장을 실행하는지 코드를 보고 확인한다.","모듈 내부의 제어 구조를 분석한다.","요구 명세를 기준으로 기능이 동작하는지 검사한다."],"a":3,"e":"<p>블랙박스는 내부 구조를 보지 않고 명세로 검사한다.<\/p>"},{"s":"<p>제어 흐름 그래프의 간선이 11개, 노드가 8개일 때 순환 복잡도는?<\/p>","c":["3","4","5","7"],"a":2,"e":"<p>V(G) = E − N + 2 = 11 − 8 + 2 = 5다.<\/p>"},{"s":"<p>입력 조건의 유효 범위가 1 이상 50 이하일 때 경계값 분석의 입력값으로 가장 적절한 것은?<\/p>","c":["0, 1, 50, 51","-50, 0, 100","10, 20, 30, 40","1, 25, 50"],"a":0,"e":"<p>경계값과 그 바로 바깥값을 고른다.<\/p>"},{"s":"<p>결정(분기) 커버리지의 기준으로 옳은 것은?<\/p>","c":["개별 조건식의 모든 조합을 수행한다.","각 분기가 참과 거짓을 한 번 이상 수행하도록 한다.","소스 코드를 전혀 고려하지 않는다.","모든 문장을 최소 한 번만 수행하면 된다."],"a":1,"e":"<p>각 분기의 참·거짓을 모두 수행하면 결정 커버리지다.<\/p>"}]},{"id":"test-level","title":"테스트 레벨·통합·결함관리·자동화 도구","freq":"단위·통합 테스트와 스텁·드라이버가 반복","concept":"<p><strong>테스트 레벨<\/strong>: 단위 → 통합 → 시스템 → 인수<\/p><div class=\"tw\"><table><thead><tr><th>레벨<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>단위<\/td><td>모듈 단독<\/td><\/tr><tr><td>통합<\/td><td>모듈 간 인터페이스<\/td><\/tr><tr><td>시스템<\/td><td>전체 시스템 동작<\/td><\/tr><tr><td>인수<\/td><td>사용자가 요구 충족 여부 확인. <strong>알파<\/strong>(개발 환경, 사용자 + 개발자), <strong>베타<\/strong>(실제 환경, 사용자만)<\/td><\/tr><\/tbody><\/table><\/div><p><strong>통합 테스트<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>방식<\/th><th>내용<\/th><th>필요 도구<\/th><\/tr><\/thead><tbody><tr><td>하향식<\/td><td>상위 → 하위. 주요 제어 모듈부터<\/td><td><strong>스텁<\/strong><\/td><\/tr><tr><td>상향식<\/td><td>하위 → 상위. 클러스터 단위<\/td><td><strong>드라이버<\/strong><\/td><\/tr><tr><td>빅뱅<\/td><td>한 번에 통합<\/td><td><\/td><\/tr><tr><td>샌드위치<\/td><td>상향 + 하향 혼합<\/td><td><\/td><\/tr><\/tbody><\/table><\/div><ul><li>스텁: 하위 모듈을 <strong>대신<\/strong>해 호출받는 임시 모듈.<\/li><li>드라이버: 상위 모듈을 <strong>대신<\/strong>해 호출하는 임시 모듈.<\/li><li>회귀 테스트: 수정 후 <strong>새로운 결함이 생기지 않았는지<\/strong> 재검사.<\/li><\/ul><p><strong>시스템 테스트 유형<\/strong>: 회복, 보안, 강도(Stress), 성능, 구조, 병행.<\/p><p><strong>결함 관리<\/strong>: 결함 관리 도구는 Bugzilla, Mantis, Trac, Jira. 결함 상태는 Open → Assigned → Fixed → Closed 등으로 변한다.<\/p><p><strong>테스트 자동화 도구 유형<\/strong>: 정적 분석, 테스트 실행, 성능 테스트, 테스트 통제. 도구 도입 시 초기 비용과 학습이 필요하고, 도구를 맹신해서는 안 된다.<\/p>","qs":[{"s":"<p>상향식 통합 테스트에서 상위 모듈 역할을 대신하는 임시 프로그램은?<\/p>","c":["오라클","빌드","드라이버","스텁"],"a":2,"e":"<p>상향식 통합에는 드라이버가 필요하다.<\/p>"},{"s":"<p>테스트 레벨의 수행 순서로 옳은 것은?<\/p>","c":["시스템 → 단위 → 통합 → 인수","통합 → 단위 → 시스템 → 인수","단위 → 시스템 → 통합 → 인수","단위 → 통합 → 시스템 → 인수"],"a":3,"e":"<p>단위, 통합, 시스템, 인수 순서로 진행한다.<\/p>"},{"s":"<p>인수 테스트 중 개발자의 장소에서 사용자와 개발자가 함께 수행하는 테스트는?<\/p>","c":["알파 테스트","회귀 테스트","강도 테스트","베타 테스트"],"a":0,"e":"<p>개발 환경에서 함께 수행하면 알파, 실제 환경에서 사용자만 수행하면 베타다.<\/p>"},{"s":"<p>결함 관리 도구로 적절한 것은?<\/p>","c":["Maven","Bugzilla","Figma","Tomcat"],"a":1,"e":"<p>Bugzilla, Mantis, Trac 등이 결함 관리 도구다.<\/p>"},{"s":"<p>수정된 소프트웨어에 새로운 결함이 생기지 않았는지 다시 확인하는 테스트는?<\/p>","c":["구조 테스트","회복 테스트","회귀 테스트","성능 테스트"],"a":2,"e":"<p>변경 후 재검사하는 것이 회귀 테스트다.<\/p>"}]},{"id":"ds-basic","title":"스택·큐·연결 리스트와 수식 표기","freq":"자료구조 약 29문항. 후위 표기 변환과 스택 연산이 매회 출제","concept":"<div class=\"tw\"><table><thead><tr><th>자료구조<\/th><th>특징<\/th><\/tr><\/thead><tbody><tr><td>스택<\/td><td><strong>LIFO<\/strong>. Push, Pop. 서브루틴 호출, 수식 계산, 재귀에 사용<\/td><\/tr><tr><td>큐<\/td><td><strong>FIFO<\/strong>. Front에서 삭제, Rear에서 삽입. 프로세스 스케줄링<\/td><\/tr><tr><td>데크<\/td><td>양쪽에서 삽입·삭제<\/td><\/tr><tr><td>배열<\/td><td>연속 저장, 임의 접근 빠름<\/td><\/tr><tr><td>연결 리스트<\/td><td>포인터로 연결, 삽입·삭제 용이, 접근 느림, 포인터 공간 필요<\/td><\/tr><\/tbody><\/table><\/div><p>선형 구조는 배열, 스택, 큐, 데크, 연결 리스트이고 비선형 구조는 트리, 그래프다.<\/p><p><strong>수식 표기법<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>표기<\/th><th>형태<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td>전위 (Prefix)<\/td><td>연산자가 앞<\/td><td><code>+AB<\/code><\/td><\/tr><tr><td>중위 (Infix)<\/td><td>연산자가 가운데<\/td><td><code>A+B<\/code><\/td><\/tr><tr><td>후위 (Postfix)<\/td><td>연산자가 뒤<\/td><td><code>AB+<\/code><\/td><\/tr><\/tbody><\/table><\/div><p><strong>중위 → 후위 변환<\/strong>: 연산 우선순위에 따라 괄호를 치고 연산자를 해당 괄호 뒤로 옮긴 후 괄호를 지운다.<br><code>A+B*C<\/code> → <code>(A+(B*C))<\/code> → <code>ABC*+<\/code><\/p><p><strong>후위식 계산<\/strong>: 스택에 피연산자를 넣고, 연산자가 오면 두 개를 꺼내 계산한 뒤 결과를 다시 넣는다.<\/p>","qs":[{"s":"<p>중위 표기식 <code>A+B*C-D<\/code>를 후위 표기식으로 변환한 것은?<\/p>","c":["ABCD*+-","AB+C*D-","AB*C+D-","ABC*+D-"],"a":3,"e":"<p>곱셈을 먼저 묶어 BC*, 다음 덧셈으로 ABC*+, 마지막 뺄셈으로 ABC*+D-가 된다.<\/p>"},{"s":"<p>중위 표기식 <code>(A+B)*C<\/code>를 전위 표기식으로 변환한 것은?<\/p>","c":["*+ABC","A+*BC","+A*BC","AB+C*"],"a":0,"e":"<p>괄호 안의 덧셈이 먼저라 +AB가 되고, 곱셈을 앞에 붙여 *+ABC가 된다.<\/p>"},{"s":"<p>후위 표기식 <code>3 4 + 2 *<\/code>의 계산 결과는?<\/p>","c":["10","11","14","24"],"a":2,"e":"<p>3+4=7을 스택에 넣고, 7×2=14다.<\/p>"},{"s":"<p>빈 스택에 A, B, C를 차례로 Push한 뒤 Pop을 두 번 수행하고 D를 Push했다. 스택의 아래부터 위까지의 내용은?<\/p>","c":["A, B, D","B, D","A, D","D, A"],"a":2,"e":"<p>C와 B가 꺼내지고 A가 남은 뒤 D가 들어간다.<\/p>"},{"s":"<p>큐에 대한 설명으로 옳은 것은?<\/p>","c":["한쪽 끝에서 삽입하고 다른 쪽 끝에서 삭제한다.","비선형 자료구조이다.","한쪽 끝에서만 삽입과 삭제가 일어난다.","가장 나중에 들어온 데이터가 먼저 나간다."],"a":0,"e":"<p>큐는 선입선출(FIFO)의 선형 구조다.<\/p>"}]},{"id":"ds-tree","title":"트리·그래프","freq":"트리 순회와 그래프 간선 수 계산이 반복","concept":"<p><strong>트리 용어<\/strong>: 노드, 근(Root), 단말(Leaf), 차수(Degree: 자식 수), 트리의 차수(노드 차수 중 최댓값), 깊이(높이).<\/p><p><strong>이진 트리 순회<\/strong> (루트의 위치로 구분)<\/p><div class=\"tw\"><table><thead><tr><th>순회<\/th><th>순서<\/th><\/tr><\/thead><tbody><tr><td>전위 (Preorder)<\/td><td><strong>루트<\/strong> → 왼쪽 → 오른쪽<\/td><\/tr><tr><td>중위 (Inorder)<\/td><td>왼쪽 → <strong>루트<\/strong> → 오른쪽<\/td><\/tr><tr><td>후위 (Postorder)<\/td><td>왼쪽 → 오른쪽 → <strong>루트<\/strong><\/td><\/tr><\/tbody><\/table><\/div><p><strong>이진 트리 성질<\/strong>(루트의 레벨·깊이를 1로 볼 때): 깊이 k의 포화 이진 트리 노드 수는 <code>2^k − 1<\/code>, 레벨 i의 최대 노드 수는 <code>2^(i−1)<\/code>.<\/p><p><strong>그래프<\/strong>: 간선 수 공식<\/p><ul><li>무방향 완전 그래프: <code>n(n−1)/2<\/code><\/li><li>방향 완전 그래프: <code>n(n−1)<\/code><\/li><\/ul><p><strong>최소 신장 트리<\/strong>: 모든 정점을 최소 비용으로 잇는 트리. Kruskal, Prim.<\/p><p><strong>탐색<\/strong>: DFS(깊이 우선, 스택), BFS(너비 우선, 큐).<\/p><p><strong>해싱<\/strong>: 키를 해시 함수로 변환해 주소를 찾는다. 충돌 해결로 개방 주소법, 체이닝이 있다. 함수로 제산법, 제곱법, 폴딩법, 숫자 분석법 등이 있다.<\/p>","qs":[{"s":"<p>루트가 A, A의 왼쪽 자식이 B, 오른쪽 자식이 C, B의 왼쪽 자식이 D, B의 오른쪽 자식이 E인 이진 트리를 후위 순회한 결과는?<\/p>","c":["D → E → C → B → A","D → E → B → C → A","D → B → E → A → C","A → B → D → E → C"],"a":1,"e":"<p>왼쪽 서브트리(D, E, B), 오른쪽 서브트리(C), 마지막으로 루트 A 순서다.<\/p>"},{"s":"<p>위 조건의 트리 구조(루트 A, 왼쪽 B, 오른쪽 C, B의 자식 D·E)를 중위 순회한 결과는?<\/p>","c":["B → D → E → A → C","D → E → B → C → A","A → B → D → E → C","D → B → E → A → C"],"a":3,"e":"<p>왼쪽, 루트, 오른쪽 순서를 재귀적으로 적용한다.<\/p>"},{"s":"<p>정점이 6개인 무방향 완전 그래프의 간선 수는?<\/p>","c":["12","15","30","36"],"a":1,"e":"<p>n(n−1)/2 = 6 × 5 ÷ 2 = 15다.<\/p>"},{"s":"<p>깊이가 4인 포화 이진 트리의 전체 노드 수는? (루트의 깊이를 1로 한다)<\/p>","c":["8","15","16","31"],"a":1,"e":"<p>노드 수는 2^k − 1 = 2^4 − 1 = 15다.<\/p>"},{"s":"<p>너비 우선 탐색(BFS)을 구현할 때 사용하는 자료구조는?<\/p>","c":["해시 테이블","큐","스택","힙"],"a":1,"e":"<p>BFS는 큐, DFS는 스택(또는 재귀)을 사용한다.<\/p>"}]},{"id":"sort-search","title":"정렬·검색·복잡도","freq":"정렬·복잡도 약 19문항. 패스 결과 계산과 시간복잡도가 반복","concept":"<div class=\"tw\"><table><thead><tr><th>정렬<\/th><th>방법<\/th><th>평균 복잡도<\/th><th>최악<\/th><\/tr><\/thead><tbody><tr><td>선택<\/td><td>최솟값을 찾아 맨 앞과 교환<\/td><td>O(n²)<\/td><td>O(n²)<\/td><\/tr><tr><td>버블<\/td><td>인접한 두 값을 비교·교환, 큰 값이 뒤로<\/td><td>O(n²)<\/td><td>O(n²)<\/td><\/tr><tr><td>삽입<\/td><td>앞의 정렬된 부분에 삽입<\/td><td>O(n²)<\/td><td>O(n²)<\/td><\/tr><tr><td>셸<\/td><td>간격을 두고 삽입 정렬<\/td><td>O(n^1.5)<\/td><td>O(n²)<\/td><\/tr><tr><td>퀵<\/td><td>피벗 기준 분할<\/td><td>O(n log n)<\/td><td>O(n²)<\/td><\/tr><tr><td>힙<\/td><td>힙 구조 이용<\/td><td>O(n log n)<\/td><td>O(n log n)<\/td><\/tr><tr><td>2-way 합병<\/td><td>분할 후 합병<\/td><td>O(n log n)<\/td><td>O(n log n)<\/td><\/tr><\/tbody><\/table><\/div><p><strong>이진 검색<\/strong>: 정렬된 자료에서 가운데 값 <code>M = (F + L) / 2<\/code>와 비교해 범위를 절반씩 줄인다. O(log n).<\/p><p><strong>순차 검색<\/strong>: 처음부터 차례로 비교. O(n), 정렬이 필요 없음.<\/p><p><strong>복잡도 순서<\/strong>: O(1) &lt; O(log n) &lt; O(n) &lt; O(n log n) &lt; O(n²) &lt; O(2ⁿ).<\/p><p><strong>알고리즘 설계 기법<\/strong>: 분할 정복, 동적 계획법, 탐욕법, 백트래킹.<\/p>","qs":[{"s":"<p>자료 <code>8, 4, 6, 1, 3<\/code>에 오름차순 버블 정렬을 적용할 때 첫 번째 패스가 끝난 결과는?<\/p>","c":["4, 1, 3, 6, 8","1, 4, 6, 3, 8","4, 6, 1, 3, 8","3, 4, 6, 1, 8"],"a":2,"e":"<p>인접한 값을 비교해 가장 큰 8이 맨 뒤로 이동한다.<\/p>"},{"s":"<p>자료 <code>8, 3, 4, 9, 7<\/code>을 선택 정렬로 오름차순 정렬할 때 PASS 2의 결과는?<\/p>","c":["3, 4, 8, 7, 9","3, 4, 8, 9, 7","3, 8, 4, 9, 7","3, 4, 7, 9, 8"],"a":1,"e":"<p>1회전에서 3과 8을 교환하고, 2회전에서 4와 8을 교환한다.<\/p>"},{"s":"<p>자료 <code>5, 2, 4, 1<\/code>을 삽입 정렬로 오름차순 정렬할 때 PASS 2의 결과는?<\/p>","c":["2, 5, 4, 1","2, 4, 1, 5","1, 2, 4, 5","2, 4, 5, 1"],"a":3,"e":"<p>PASS 1에서 2를 삽입해 2, 5가 되고, PASS 2에서 4를 삽입해 2, 4, 5가 된다.<\/p>"},{"s":"<p>정렬된 자료 <code>2, 5, 8, 12, 16, 23, 38<\/code>에서 이진 검색으로 23을 찾을 때 비교 횟수는? (가운데는 정수 나눗셈으로 구한다)<\/p>","c":["1","2","3","4"],"a":1,"e":"<p>1회: 가운데 12보다 크므로 뒤쪽. 2회: 16, 23, 38의 가운데 23과 일치한다.<\/p>"},{"s":"<p>평균 시간 복잡도가 O(n log n)인 정렬은?<\/p>","c":["힙 정렬","버블 정렬","선택 정렬","삽입 정렬"],"a":0,"e":"<p>힙, 퀵, 합병 정렬의 평균 복잡도는 O(n log n)이다.<\/p>"}]},{"id":"code-quality","title":"소스코드 품질 분석과 코드 최적화","freq":"리팩토링, 클린 코드, 정적·동적 분석 도구가 반복","concept":"<p><strong>클린 코드 작성 원칙<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>원칙<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>가독성<\/td><td>이해하기 쉬운 이름, 들여쓰기<\/td><\/tr><tr><td>단순성<\/td><td>한 번에 한 가지만 처리<\/td><\/tr><tr><td>의존성 배제<\/td><td>다른 모듈에 미치는 영향 최소화<\/td><\/tr><tr><td>중복성 최소화<\/td><td>중복 코드 제거, 공통으로<\/td><\/tr><tr><td>추상화<\/td><td>상위에는 간략히, 상세는 하위 함수로<\/td><\/tr><\/tbody><\/table><\/div><p><strong>리팩토링<\/strong>: 외부 동작은 그대로 두고 <strong>내부 구조를 개선<\/strong>한다.<\/p><p><strong>나쁜 코드 예<\/strong>: 스파게티 코드(로직이 복잡), 외계인 코드(오래되어 유지보수가 어려운 코드).<\/p><p><strong>소스코드 품질 분석 도구<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>분류<\/th><th>도구<\/th><\/tr><\/thead><tbody><tr><td>정적 분석 (실행 안 함)<\/td><td>PMD, Cppcheck, SonarQube, Checkstyle, Ccm<\/td><\/tr><tr><td>동적 분석 (실행)<\/td><td>Avalanche, Valgrind<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Cobertura는 테스트 실행 중 코드 커버리지를 재는 도구다.<\/li><\/ul><ul><li>코드 인스펙션은 코드를 실행하지 않는 정적 테스트다.<\/li><\/ul><p><strong>코드의 기본 기능과 종류<\/strong><\/p><ul><li>기본 기능: 식별, 분류, 배열. 복잡성·암호화·표준화 등 부가 기능.<\/li><li>순차 코드, 블록 코드, 10진 코드, 그룹 분류 코드, 연상 코드, 표의 숫자 코드, 합성 코드.<\/li><li>코드 오류: 사본 오류(Transcription, 1자 틀림), 전위 오류(Transposition, 인접 자리 뒤바뀜), 이중 전위(Double Transposition), 생략(Omission), 추가(Addition), 임의 오류(Random).<\/li><\/ul><p><strong>코드 최적화<\/strong>: 불필요한 연산 제거, 반복문 안 작업 최소화, 데이터 구조 선택, 불필요한 객체 생성 억제.<\/p>","qs":[{"s":"<p>외부에서 보이는 동작은 바꾸지 않고 코드의 내부 구조를 개선하는 작업은?<\/p>","c":["패키징","디버깅","역공학","리팩토링"],"a":3,"e":"<p>동작을 유지하며 구조를 개선하는 것이 리팩토링이다.<\/p>"},{"s":"<p>정적 분석 도구에 해당하는 것은?<\/p>","c":["PMD","Avalanche","JMeter","Valgrind"],"a":0,"e":"<p>PMD는 실행하지 않고 코드를 분석한다. Valgrind와 Avalanche는 동적 분석 도구이고 JMeter는 성능 테스트 도구다.<\/p>"},{"s":"<p>클린 코드 작성 원칙으로 틀린 것은?<\/p>","c":["이해하기 쉬운 이름을 사용한다.","여러 기능을 하나의 함수에 모아 호출 횟수를 줄인다.","중복된 코드를 제거한다.","다른 모듈에 미치는 영향을 최소화한다."],"a":1,"e":"<p>함수는 한 번에 한 가지 일만 처리해야 한다.<\/p>"},{"s":"<p>코드를 기입하면서 <code>12536<\/code>을 <code>12936<\/code>으로 한 글자 잘못 쓴 오류는?<\/p>","c":["전위 오류","생략 오류","사본 오류","이중 전위 오류"],"a":2,"e":"<p>한 자리를 잘못 기록하면 사본 오류다. 전위 오류는 인접한 두 자리가 바뀐 경우다.<\/p>"},{"s":"<p>오래되어 참조하기 어렵고 유지보수하기 힘든 프로그램을 뜻하는 말은?<\/p>","c":["소스 코드","외계인 코드","클린 코드","바이트 코드"],"a":1,"e":"<p>외계인 코드는 작성자를 찾기 어렵고 문서가 없어 유지보수가 어려운 오래된 코드다.<\/p>"}]}]},{"title":"1과목 심화: 자료구조·알고리즘 고난도","desc":"2025년 1회에 자료구조 문제가 많이 나와 체감 난도가 올랐다는 복원 후기가 있다(블로그 1건 기준, 공식 통계 아님). 계산형을 추가로 연습한다.","types":[{"id":"ds-advanced","title":"힙·AVL·B-Tree·해싱·그래프 탐색 계산","freq":"기출 빈도는 낮지만 기존 정리에 빠지기 쉬운 고난도 유형. AVL, Underflow는 기출 보기에 등장","concept":"<p><strong>힙(Heap)<\/strong>: 완전 이진 트리. 최대 힙은 부모 ≥ 자식, 최소 힙은 부모 ≤ 자식. 배열(1번부터)로 저장하면 노드 i의 부모는 <code>⌊i/2⌋<\/code>, 왼쪽 자식은 <code>2i<\/code>, 오른쪽 자식은 <code>2i+1<\/code>이다.<\/p><p><strong>AVL 트리<\/strong>: 이진 탐색 트리이며 모든 노드의 <strong>균형 인수<\/strong>(왼쪽 높이 − 오른쪽 높이)가 -1, 0, 1이다. 깨지면 LL, RR, LR, RL 회전으로 복구한다.<\/p><div class=\"tw\"><table><thead><tr><th>트리<\/th><th>특징<\/th><\/tr><\/thead><tbody><tr><td>B-Tree<\/td><td>다진 균형 탐색 트리, 모든 리프의 레벨이 같음<\/td><\/tr><tr><td>B+Tree<\/td><td>리프에만 데이터를 두고 리프끼리 연결, 범위 검색에 유리<\/td><\/tr><tr><td>이진 탐색 트리<\/td><td>왼쪽 &lt; 루트 &lt; 오른쪽, 중위 순회하면 오름차순<\/td><\/tr><\/tbody><\/table><\/div><p><strong>해싱 충돌 해결<\/strong><\/p><ul><li>개방 주소법: 충돌 시 다음 빈칸을 찾는다. 선형 조사는 <code>(h + 1) mod m<\/code>.<\/li><li>체이닝: 같은 주소의 키를 연결 리스트로 잇는다.<\/li><\/ul><p><strong>그래프 탐색<\/strong>: DFS는 한 경로를 끝까지 내려간 뒤 되돌아오고, BFS는 가까운 정점부터 방문한다.<\/p><p><strong>2차원 배열 주소(행 우선)<\/strong>: <code>시작 주소 + (행 × 열 개수 + 열) × 원소 크기<\/code>. 행과 열 번호는 0부터 센다.<\/p><p><strong>스택 오류<\/strong>: 가득 찬 스택에 삽입하면 Overflow, 빈 스택에서 삭제하면 Underflow다.<\/p>","qs":[{"s":"<p>1번부터 번호를 매겨 배열에 저장한 힙에서 11번 노드의 부모 노드 번호는?<\/p>","c":["4","5","6","22"],"a":1,"e":"<p>부모는 ⌊11/2⌋ = 5번이다.<\/p>"},{"s":"<p>해시 테이블 크기가 7이고 해시 함수가 <code>key mod 7<\/code>, 충돌 시 선형 조사를 쓴다. 키 19와 26을 차례로 넣을 때 26이 저장되는 주소는?<\/p>","c":["0","4","5","6"],"a":3,"e":"<p>19 mod 7 = 5로 5번에 저장된다. 26 mod 7도 5라 충돌하므로 다음 칸인 6번에 저장된다.<\/p>"},{"s":"<p>간선이 A-B, A-C, B-D, C-E, D-E인 무방향 그래프를 A에서 시작해 깊이 우선 탐색한다. 인접 정점은 알파벳 순서로 방문할 때 방문 순서는?<\/p>","c":["A → C → E → D → B","A → B → D → E → C","A → B → C → D → E","A → B → D → C → E"],"a":1,"e":"<p>A, B, D로 내려간 뒤 D의 다음 정점 E, E의 다음 미방문 정점 C 순서로 간다.<\/p>"},{"s":"<p>같은 그래프를 A에서 시작해 너비 우선 탐색할 때 방문 순서는?<\/p>","c":["A → B → C → D → E","A → C → B → E → D","A → B → D → E → C","A → B → D → C → E"],"a":0,"e":"<p>A의 이웃 B, C를 먼저 방문하고, 이어서 B의 이웃 D, C의 이웃 E를 방문한다.<\/p>"},{"s":"<p><code>A[3][4]<\/code>가 행 우선으로 시작 주소 100에 저장되어 있고 원소 하나가 2바이트일 때 <code>A[2][1]<\/code>의 주소는?<\/p>","c":["109","114","118","126"],"a":2,"e":"<p>100 + (2 × 4 + 1) × 2 = 118이다.<\/p>"}]},{"id":"algo-design","title":"알고리즘 설계 기법과 복잡도 판단","freq":"분할 정복·동적 계획·탐욕 구분과 최악 복잡도가 출제","concept":"<div class=\"tw\"><table><thead><tr><th>기법<\/th><th>내용<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td>분할 정복 (Divide and Conquer)<\/td><td>문제를 나눠 풀고 합침<\/td><td>합병 정렬, 퀵 정렬, 이진 검색<\/td><\/tr><tr><td>동적 계획법 (Dynamic Programming)<\/td><td>부분 문제의 답을 저장해 재사용<\/td><td>피보나치 메모이제이션, 플로이드<\/td><\/tr><tr><td>탐욕법 (Greedy)<\/td><td>매 순간 최선을 선택<\/td><td>크루스칼, 프림, 다익스트라<\/td><\/tr><tr><td>백트래킹<\/td><td>해가 안 되면 되돌아감<\/td><td>N-Queen<\/td><\/tr><\/tbody><\/table><\/div><p><strong>최악 복잡도 주의<\/strong>: 퀵 정렬의 최악은 O(n²)이다. 이미 정렬된 자료에서 끝 값을 피벗으로 고르면 분할이 한쪽으로 치우친다. 합병·힙 정렬은 최악도 O(n log n)이다.<\/p><p><strong>이진 검색의 최대 비교 횟수<\/strong>: <code>⌊log₂ n⌋ + 1<\/code>.<\/p><p><strong>안정 정렬<\/strong>: 같은 값의 상대 순서가 유지된다. 버블, 삽입, 합병이 안정 정렬이고 선택, 퀵, 힙은 불안정 정렬이다.<\/p><p><strong>추가 공간<\/strong>: 합병 정렬은 보조 배열이 필요하다.<\/p><p><strong>알고리즘 조건<\/strong>: 입력, 출력, 명확성, 유한성, 효과성.<\/p>","qs":[{"s":"<p>합병 정렬이 사용하는 알고리즘 설계 기법은?<\/p>","c":["분할 정복","백트래킹","동적 계획법","탐욕법"],"a":0,"e":"<p>자료를 반으로 나눠 정렬한 뒤 합치므로 분할 정복이다.<\/p>"},{"s":"<p>최소 신장 트리를 구하는 크루스칼 알고리즘의 설계 기법은?<\/p>","c":["백트래킹","분할 정복","동적 계획법","탐욕법"],"a":3,"e":"<p>매번 비용이 가장 작은 간선을 고르는 탐욕법이다.<\/p>"},{"s":"<p>정렬 알고리즘 중 최악의 시간 복잡도가 O(n log n)인 것은?<\/p>","c":["버블 정렬","힙 정렬","삽입 정렬","퀵 정렬"],"a":1,"e":"<p>힙 정렬의 최악은 O(n log n)이다. 퀵 정렬은 피벗 선택이 나쁘면 O(n²)이 되고, 버블과 삽입 정렬의 최악도 O(n²)이다.<\/p>"},{"s":"<p>정렬된 자료 1024개에서 이진 검색을 할 때 최대 비교 횟수는?<\/p>","c":["10","11","512","1024"],"a":1,"e":"<p>⌊log₂ 1024⌋ + 1 = 11이다.<\/p>"},{"s":"<p>같은 값을 가진 자료의 상대적 순서가 항상 유지되는 정렬은?<\/p>","c":["퀵 정렬","합병 정렬","힙 정렬","선택 정렬"],"a":1,"e":"<p>합병, 버블, 삽입 정렬이 안정 정렬이다.<\/p>"}]}]},{"title":"1과목 보강: 2024~2026 복원 기출 대조","desc":"2024~2026년 CBT 복원 800문항과 대조해 빠져 있던 주제를 모았다. 복원본이라 실제 시험과 다를 수 있다.","types":[{"id":"design-misc","title":"현행 시스템 분석·상위/하위 설계·협약에 의한 설계","freq":"2024~2026 복원본에 페르소나, 협약(Contract), FEP, 시스템 구성요소가 등장","concept":"<p><strong>현행 시스템 파악 순서<\/strong>: 구성·기능·인터페이스 파악 → 아키텍처·소프트웨어 구성 파악 → 하드웨어·네트워크 구성 파악.<\/p><p><strong>시스템 구성 요소<\/strong>: 입력(Input), 처리(Process), 출력(Output), 제어(Control), 피드백(Feedback).<\/p><p><strong>페르소나<\/strong>: 제품을 사용할 집단의 유형을 대표하도록 만든 <strong>가상의 인물<\/strong>이다. 사용자 요구를 구체화할 때 쓴다.<\/p><div class=\"tw\"><table><thead><tr><th>설계 단계<\/th><th>다루는 것<\/th><\/tr><\/thead><tbody><tr><td>상위 설계 (아키텍처·기본 설계)<\/td><td>시스템 구조, 데이터 구조, 시스템 분할, 인터페이스 정의, UI<\/td><\/tr><tr><td>하위 설계 (모듈·상세 설계)<\/td><td>모듈 내부 로직, 알고리즘, 자료 구조 세부<\/td><\/tr><\/tbody><\/table><\/div><p><strong>협약에 의한 설계 (Design by Contract)<\/strong>: 컴포넌트 사용 전후 조건을 명세한다.<\/p><div class=\"tw\"><table><thead><tr><th>조건<\/th><th>뜻<\/th><\/tr><\/thead><tbody><tr><td>선행 조건 (Precondition)<\/td><td>오퍼레이션 사용 <strong>전에<\/strong> 참이어야 함<\/td><\/tr><tr><td>결과 조건 (Postcondition)<\/td><td>사용 <strong>후에<\/strong> 만족되어야 함<\/td><\/tr><tr><td>불변 조건 (Invariant)<\/td><td>오퍼레이션 실행 내내 항상 만족되어야 함<\/td><\/tr><\/tbody><\/table><\/div><p><strong>연계 기술 보충<\/strong><\/p><ul><li>FEP(Front-End Processor, 전위 처리기): 입력 데이터를 프로세서가 처리하기 전에 <strong>미리 처리<\/strong>해 처리 시간을 줄인다.<\/li><li>소켓(Socket): 포트를 할당하고 클라이언트 요청을 받아 연결하는 통신 기술이다.<\/li><\/ul>","qs":[{"s":"<p>서버 앞단에서 입력 데이터를 먼저 가공해 본 프로세서의 부담을 줄이는 프로그램이나 하드웨어는?<\/p>","c":["UDDI","FEP","DRM","ORB"],"a":1,"e":"<p>FEP는 전위 처리기로, 프로세서가 처리하기 전에 데이터를 미리 처리한다.<\/p>"},{"s":"<p>협약에 의한 설계에서 명세하는 조건에 포함되지 않는 것은?<\/p>","c":["외부 조건","불변 조건","선행 조건","결과 조건"],"a":0,"e":"<p>협약에 의한 설계는 선행 조건, 결과 조건, 불변 조건을 명세한다.<\/p>"},{"s":"<p>상위 설계에서 다루는 내용으로 보기 어려운 것은?<\/p>","
