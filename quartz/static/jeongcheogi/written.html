가드는 반환 주소 앞의 카나리 값 변조를 검사한다.<\/p>"},{"s":"<p>입력 값 검증에 대한 설명으로 옳은 것은?<\/p>","c":["입력 길이는 검사할 필요가 없다.","클라이언트 검증만 믿지 않고 서버 측에서도 검증한다.","블랙리스트 방식이 화이트리스트 방식보다 언제나 안전하다.","클라이언트 측에서만 검증하면 충분하다."],"a":1,"e":"<p>클라이언트 검증은 우회할 수 있으므로 서버 검증이 반드시 필요하다.<\/p>"}]},{"id":"sec-func","title":"보안 기능·에러 처리·세션·코드 오류·캡슐화·API 오용","freq":"2027 출제기준의 SW 개발 보안 영역","concept":"<div class=\"tw\"><table><thead><tr><th>영역<\/th><th>약점 예<\/th><\/tr><\/thead><tbody><tr><td>보안 기능<\/td><td>부적절한 인가, 하드코딩된 비밀번호, 취약한 암호 알고리즘, 민감 정보의 평문 저장<\/td><\/tr><tr><td>에러 처리<\/td><td>오류 메시지를 통한 정보 노출, 오류 상황 대응 부재, 부적절한 예외 처리<\/td><\/tr><tr><td>코드 오류<\/td><td>널 포인터 역참조, 부적절한 자원 해제, 초기화되지 않은 변수 사용<\/td><\/tr><tr><td>캡슐화<\/td><td>잘못된 세션에 의한 정보 노출, 제거되지 않은 디버그 코드, 시스템 데이터 노출<\/td><\/tr><tr><td>API 오용<\/td><td>DNS lookup에 의존한 보안 결정, 취약한 API 사용<\/td><\/tr><\/tbody><\/table><\/div><p><strong>세션 통제<\/strong><\/p><ul><li>세션 ID는 예측이 불가능해야 한다.<\/li><li>로그인 후 세션 ID를 재발급한다.<\/li><li>만료 시간을 설정한다.<\/li><li>쿠키에 <code>HttpOnly<\/code>, <code>Secure<\/code> 속성을 설정한다.<\/li><\/ul><p><strong>비밀번호 저장<\/strong>: 일방향 해시 + <strong>솔트(Salt)<\/strong>. 평문 저장 금지.<\/p><p><strong>권한 관리<\/strong>: 최소 권한 원칙.<\/p><p><strong>에러 처리 대책<\/strong>: 사용자에게는 일반 메시지를 보여 주고 상세 내용은 로그에만 기록한다.<\/p><p><strong>무결성 검증 도구<\/strong>: Tripwire(파일 무결성), md5sum.<\/p><p><strong>TOCTOU<\/strong>: 검사 시점과 사용 시점의 차이로 생기는 경쟁 조건.<\/p>","qs":[{"s":"<p>소스 코드에 비밀번호를 직접 포함하는 것은 어떤 영역의 보안 약점인가?<\/p>","c":["API 오용","보안 기능","캡슐화","시간 및 상태"],"a":1,"e":"<p>하드코딩된 비밀번호는 보안 기능 영역의 약점이다.<\/p>"},{"s":"<p>비밀번호를 저장할 때 해시 전에 임의의 값을 덧붙이는 기법은?<\/p>","c":["스니핑","패딩 오라클","솔트","피싱"],"a":2,"e":"<p>솔트를 붙이면 같은 비밀번호라도 해시가 달라져 사전 공격을 어렵게 한다.<\/p>"},{"s":"<p>에러 처리 영역의 약점에 해당하는 것은?<\/p>","c":["SQL 쿼리를 조립해 실행한다.","경쟁 조건이 발생한다.","세션 쿠키를 암호화한다.","오류 메시지로 시스템 내부 정보를 노출한다."],"a":3,"e":"<p>오류 메시지 정보 노출은 에러 처리 영역의 약점이다.<\/p>"},{"s":"<p>프로그램 배포 전 제거하지 않은 디버그 코드는 어떤 영역의 보안 약점인가?<\/p>","c":["캡슐화","시간 및 상태","입력 데이터 검증","API 오용"],"a":0,"e":"<p>디버그 코드와 잘못된 세션 처리는 캡슐화 영역의 약점이다.<\/p>"},{"s":"<p>세션 보안 설정으로 적절하지 않은 것은?<\/p>","c":["세션 ID를 순차적으로 증가하는 값으로 발급한다.","로그인 성공 후 세션 ID를 재발급한다.","세션에 만료 시간을 둔다.","쿠키에 HttpOnly 속성을 설정한다."],"a":0,"e":"<p>세션 ID는 예측이 불가능해야 한다.<\/p>"}]},{"id":"crypto","title":"암호 알고리즘","freq":"암호 약 17문항. 대칭·비대칭 구분과 해시 함수가 반복","concept":"<div class=\"tw\"><table><thead><tr><th>구분<\/th><th>대칭키(비밀키)<\/th><th>비대칭키(공개키)<\/th><\/tr><\/thead><tbody><tr><td>키<\/td><td>암·복호화 <strong>같은 키<\/strong><\/td><td><strong>공개키와 개인키<\/strong> 쌍<\/td><\/tr><tr><td>속도<\/td><td>빠름<\/td><td>느림<\/td><\/tr><tr><td>키 개수 (n명)<\/td><td><code>n(n−1)/2<\/code><\/td><td><code>2n<\/code><\/td><\/tr><tr><td>예<\/td><td>DES, 3DES, AES, SEED, ARIA, IDEA, RC4<\/td><td>RSA, ECC, ElGamal, Diffie-Hellman<\/td><\/tr><\/tbody><\/table><\/div><p><strong>블록 암호<\/strong>: DES(64비트 블록, 56비트 키), AES(128비트 블록, 128/192/256비트 키), SEED, ARIA.<\/p><p><strong>스트림 암호<\/strong>: RC4(바이트 단위), LFSR(비트 단위). 평문을 비트·바이트 단위로 순차 처리한다.<\/p><p><strong>해시 (일방향)<\/strong>: MD5, SHA-1, SHA-256. 원문으로 되돌릴 수 없다. 임의의 길이를 고정 길이로 변환한다.<\/p><p><strong>알고리즘 대응<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>항목<\/th><th>알고리즘<\/th><\/tr><\/thead><tbody><tr><td>소인수분해 난제<\/td><td>RSA<\/td><\/tr><tr><td>이산대수 난제<\/td><td>Diffie-Hellman, ElGamal<\/td><\/tr><tr><td>타원곡선<\/td><td>ECC<\/td><\/tr><tr><td>국내 개발 블록 암호<\/td><td>SEED, ARIA<\/td><\/tr><\/tbody><\/table><\/div><p><strong>전자서명<\/strong>: 송신자의 <strong>개인키로 서명<\/strong>하고 공개키로 검증한다.<\/p><p><strong>기밀성<\/strong>: 수신자의 <strong>공개키로 암호화<\/strong>하고, 수신자의 개인키로 복호화한다.<\/p><p><strong>PKI<\/strong>: 공개키 기반 구조. 인증기관(CA)이 인증서를 발급한다.<\/p>","qs":[{"s":"<p>대칭키 암호 알고리즘은?<\/p>","c":["AES","ECC","ElGamal","RSA"],"a":0,"e":"<p>AES는 대칭키 블록 암호다. 나머지는 공개키 암호다.<\/p>"},{"s":"<p>RSA의 안전성 근거가 되는 수학적 문제는?<\/p>","c":["이진 검색","소인수분해","정렬","최단 경로"],"a":1,"e":"<p>RSA는 큰 수의 소인수분해가 어렵다는 점에 근거한다.<\/p>"},{"s":"<p>사용자가 6명일 때 대칭키 방식에서 필요한 키의 총 개수는?<\/p>","c":["6","12","15","30"],"a":2,"e":"<p>n(n−1)/2 = 15개다. 공개키 방식이면 2n = 12개다.<\/p>"},{"s":"<p>일방향 해시 함수는?<\/p>","c":["RC4","RSA","AES","SHA-256"],"a":3,"e":"<p>SHA-256은 해시 함수다.<\/p>"},{"s":"<p>전자서명에서 서명자가 사용하는 키는?<\/p>","c":["서명자의 개인키","수신자의 개인키","수신자의 공개키","서명자의 공개키"],"a":0,"e":"<p>개인키로 서명하고 누구나 공개키로 검증한다.<\/p>"}]},{"id":"attack","title":"서비스 공격 유형과 악성코드","freq":"서비스공격 약 14문항. 공격 이름 맞히기가 대부분","concept":"<p><strong>DoS 공격<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>공격<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>Ping of Death<\/td><td>ICMP 패킷을 <strong>크게<\/strong> 보내 조각화 처리 부하<\/td><\/tr><tr><td>Smurf (Smurfing, 스머핑)<\/td><td>출발지를 희생자로 위조, <strong>브로드캐스트<\/strong>로 ICMP 전송<\/td><\/tr><tr><td>SYN Flooding<\/td><td>SYN만 보내 연결 대기 자원을 고갈<\/td><\/tr><tr><td>TearDrop<\/td><td>조각의 <strong>Offset을 조작<\/strong>해 재조립 오류<\/td><\/tr><tr><td>Land<\/td><td>출발지와 목적지 IP를 <strong>같게<\/strong> 설정<\/td><\/tr><tr><td>Bonk / Boink<\/td><td>순서 번호를 조작<\/td><\/tr><\/tbody><\/table><\/div><p><strong>DDoS 도구<\/strong>: Trinoo, TFN, Stacheldraht.<\/p><p><strong>기타 공격<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>공격<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>세션 하이재킹<\/td><td>세션을 탈취<\/td><\/tr><tr><td>ARP 스푸핑<\/td><td>ARP를 위조<\/td><\/tr><tr><td>스니핑<\/td><td>패킷 <strong>도청<\/strong><\/td><\/tr><tr><td>피싱<\/td><td>가짜 사이트로 개인정보 유출<\/td><\/tr><tr><td>파밍<\/td><td>DNS 조작으로 가짜 사이트 유도<\/td><\/tr><tr><td>스미싱<\/td><td>문자 메시지 이용<\/td><\/tr><tr><td>사회공학<\/td><td>사람의 심리를 이용<\/td><\/tr><tr><td>무차별 대입<\/td><td>가능한 모든 값 대입<\/td><\/tr><tr><td>사전 공격<\/td><td>자주 쓰는 단어 대입<\/td><\/tr><tr><td>APT<\/td><td>지능형 지속 공격<\/td><\/tr><tr><td>제로 데이<\/td><td>패치 전 취약점 공격<\/td><\/tr><tr><td>키로거<\/td><td>키 입력 기록<\/td><\/tr><tr><td>랜섬웨어<\/td><td>파일 암호화 후 금전 요구<\/td><\/tr><tr><td>웜<\/td><td><strong>스스로 전파·증식<\/strong><\/td><\/tr><tr><td>트로이 목마<\/td><td>정상 프로그램으로 위장, 자기 복제 없음<\/td><\/tr><tr><td>백도어<\/td><td>인증 없이 들어오는 뒷문<\/td><\/tr><tr><td>바이러스<\/td><td>다른 파일에 기생, 증식<\/td><\/tr><\/tbody><\/table><\/div>","qs":[{"s":"<p>IP 출발지를 희생자로 위조해 네트워크 브로드캐스트 주소로 ICMP를 보내 희생자를 마비시키는 공격은?<\/p>","c":["SYN Flooding","Smurf","TearDrop","Land"],"a":1,"e":"<p>Smurf 공격의 설명이다.<\/p>"},{"s":"<p>패킷의 출발지와 목적지 IP를 같게 하여 공격 대상이 자신에게 응답하게 만드는 공격은?<\/p>","c":["Boink","Ping of Death","Land Attack","Bonk"],"a":2,"e":"<p>출발지와 목적지가 같으면 Land Attack이다.<\/p>"},{"s":"<p>사용자가 파일을 실행하지 않아도 네트워크의 취약한 PC를 찾아 자신을 복제해 퍼지는 악성코드는?<\/p>","c":["애드웨어","키로거","트로이 목마","웜"],"a":3,"e":"<p>웜은 독립적으로 자기 복제와 전파를 한다.<\/p>"},{"s":"<p>패킷의 조각화 재조립 값을 조작해 시스템을 마비시키는 공격은?<\/p>","c":["TearDrop","Ping of Death","Smurf","Land"],"a":0,"e":"<p>TearDrop은 Fragment Offset을 조작한다.<\/p>"},{"s":"<p>네트워크상의 패킷을 몰래 엿보는 공격은?<\/p>","c":["크래킹","스푸핑","스니핑","피싱"],"a":2,"e":"<p>도청은 스니핑, 위조는 스푸핑이다.<\/p>"}]},{"id":"access-control","title":"서버 인증과 접근 통제","freq":"접근통제·인증 약 12문항. DAC·MAC·RBAC와 인증 유형이 반복","concept":"<div class=\"tw\"><table><thead><tr><th>정책<\/th><th>권한 결정<\/th><th>특징<\/th><\/tr><\/thead><tbody><tr><td>DAC (임의적)<\/td><td>데이터 <strong>소유자<\/strong>가 결정<\/td><td>사용자 신분 기반, 유연<\/td><\/tr><tr><td>MAC (강제적)<\/td><td>시스템이 <strong>보안 등급<\/strong>으로 결정<\/td><td>군사용, 엄격<\/td><\/tr><tr><td>RBAC (역할 기반)<\/td><td><strong>직무·역할<\/strong>에 따라 결정<\/td><td>인사 이동에 유연<\/td><\/tr><\/tbody><\/table><\/div><p><strong>접근 통제 모델<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>모델<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>벨-라파듈라 (Bell-LaPadula, BLP)<\/td><td><strong>기밀성<\/strong> 중심. No Read Up, No Write Down<\/td><\/tr><tr><td>비바 (Biba)<\/td><td><strong>무결성<\/strong> 중심. No Read Down, No Write Up<\/td><\/tr><tr><td>클락-윌슨 (Clark-Wilson)<\/td><td>무결성, 상업 환경<\/td><\/tr><tr><td>만리장성 (Chinese Wall)<\/td><td>이해 충돌 방지<\/td><\/tr><\/tbody><\/table><\/div><p><strong>인증 유형<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>유형<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td>지식 (Type 1)<\/td><td>비밀번호, PIN<\/td><\/tr><tr><td>소유 (Type 2)<\/td><td>OTP, 스마트카드<\/td><\/tr><tr><td>존재 (Type 3)<\/td><td>지문, 홍채<\/td><\/tr><tr><td>행위 (Type 4)<\/td><td>서명, 걸음걸이<\/td><\/tr><\/tbody><\/table><\/div><p><strong>AAA<\/strong>: Authentication(인증), Authorization(권한 부여), Accounting(계정 기록).<\/p><p><strong>기타<\/strong>: SSO(한 번 로그인으로 여러 서비스), OAuth(권한 위임), Kerberos(티켓 기반 인증), TCP Wrapper(외부 접속의 인가 여부 점검), 2FA(2가지 요소).<\/p>","qs":[{"s":"<p>인사이동으로 직무가 바뀌면 그 직무에 묶인 권한이 함께 바뀌는 접근 통제는?<\/p>","c":["DAC","RBAC","BLP","MAC"],"a":1,"e":"<p>RBAC는 역할 기반 접근 통제다.<\/p>"},{"s":"<p>데이터의 소유자가 접근 권한을 결정하는 정책은?<\/p>","c":["DAC","AAA","RBAC","MAC"],"a":0,"e":"<p>DAC는 소유자 재량으로 권한을 정한다.<\/p>"},{"s":"<p>벨-라파듈라 모델의 특징으로 옳은 것은?<\/p>","c":["소유자가 임의로 권한을 준다.","무결성을 중시하며 하위 등급 읽기를 금지한다.","역할에 따라서만 권한을 준다.","기밀성을 중시하며 상위 등급 읽기를 금지한다."],"a":3,"e":"<p>BLP는 No Read Up, No Write Down으로 기밀성을 보호한다. 무결성 중심 모델은 비바 모델이다.<\/p>"},{"s":"<p>사용자 인증 유형 중 지문·홍채 같은 생체 정보를 이용하는 것은?<\/p>","c":["지식 기반","행위 기반","존재 기반","소유 기반"],"a":2,"e":"<p>생체 정보는 존재(Something you are) 기반 인증이다.<\/p>"},{"s":"<p>AAA 구성 요소가 아닌 것은?<\/p>","c":["Authorization","Authentication","Accounting","Authoring"],"a":3,"e":"<p>AAA는 인증, 권한 부여, 계정 기록이다.<\/p>"}]},{"id":"sec-arch","title":"보안 아키텍처·프레임워크·위험 관리","freq":"2027 출제기준 항목. ISMS, ISO 27001, BCP","concept":"<p><strong>보안 아키텍처<\/strong>: 조직의 보안 요구를 충족하도록 시스템의 구조와 구성 요소를 설계한 것.<\/p><ul><li>고려: 심층 방어(Defense in Depth), 최소 권한, 보안 영역 분리(DMZ), 단일 실패 지점 제거.<\/li><\/ul><p><strong>보안 프레임워크·표준<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>표준<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>ISO/IEC 27001<\/td><td>정보보안 관리체계 국제 표준<\/td><\/tr><tr><td>ISMS-P<\/td><td>국내 정보보호 및 개인정보보호 관리체계 인증<\/td><\/tr><tr><td>NIST CSF<\/td><td>식별, 보호, 탐지, 대응, 복구 (CSF 2.0에서 거버넌스 추가, 총 6개 기능)<\/td><\/tr><tr><td>CC (ISO/IEC 15408)<\/td><td>정보보호 제품 평가 공통 기준<\/td><\/tr><tr><td>TCSEC<\/td><td>미국 국방부 평가 기준 (오렌지북)<\/td><\/tr><\/tbody><\/table><\/div><p><strong>위험 관리<\/strong><\/p><ul><li>위험 = 자산 × 위협 × 취약점.<\/li><li>대응 전략: 수용, 감소, 회피, 전가.<\/li><\/ul><p><strong>업무 연속성<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>용어<\/th><th>뜻<\/th><\/tr><\/thead><tbody><tr><td>BCP<\/td><td>업무 연속성 계획<\/td><\/tr><tr><td>DRP<\/td><td>재해 복구 계획<\/td><\/tr><tr><td>BIA<\/td><td>업무 영향 분석<\/td><\/tr><tr><td>RTO<\/td><td>복구 목표 시간<\/td><\/tr><tr><td>RPO<\/td><td>복구 목표 시점<\/td><\/tr><\/tbody><\/table><\/div><p><strong>재해 복구 센터<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>유형<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>Mirror<\/td><td>실시간 동기화<\/td><\/tr><tr><td>Hot<\/td><td>수시간 내 복구<\/td><\/tr><tr><td>Warm<\/td><td>일부 장비 구비, 수일~수주 내 복구<\/td><\/tr><tr><td>Cold<\/td><td>장소만 확보, 복구가 가장 오래 걸림<\/td><\/tr><\/tbody><\/table><\/div><p><strong>물리적 위협<\/strong>: 화재, 홍수, 하드웨어 파손. 방화벽 설정 오류 같은 기술적 위협과 구분한다.<\/p>","qs":[{"s":"<p>정보보안 관리체계의 국제 표준은?<\/p>","c":["ISO 9001","ISO/IEC 12207","ISO/IEC 25010","ISO/IEC 27001"],"a":3,"e":"<p>ISO/IEC 27001이 ISMS 국제 표준이다.<\/p>"},{"s":"<p>위험에 대한 대응 전략이 아닌 것은?<\/p>","c":["전가","재생","회피","수용"],"a":1,"e":"<p>대응 전략은 수용, 감소, 회피, 전가다.<\/p>"},{"s":"<p>재해 복구 센터 중 장소만 확보하고 복구에 수주가 걸리는 유형은?<\/p>","c":["Cold Site","Hot Site","Mirror Site","Warm Site"],"a":0,"e":"<p>Cold Site는 복구까지 시간이 가장 오래 걸린다.<\/p>"},{"s":"<p>재해 발생 시 데이터 손실을 허용할 수 있는 시점을 뜻하는 용어는?<\/p>","c":["BCP","RTO","RPO","BIA"],"a":2,"e":"<p>RPO는 복구 목표 시점이다.<\/p>"},{"s":"<p>물리적 위협에 해당하지 않는 것은?<\/p>","c":["침수","서버 도난","화재","방화벽 정책 설정 오류"],"a":3,"e":"<p>방화벽 설정 오류는 기술적 위협이다.<\/p>"}]},{"id":"log-solution","title":"로그 분석·보안 솔루션·취약점 분석","freq":"2027 출제기준 항목. 리눅스 로그 파일과 솔루션 약어","concept":"<p><strong>보안 솔루션<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>솔루션<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>방화벽<\/td><td>정책에 따라 트래픽 허용·차단<\/td><\/tr><tr><td>IDS<\/td><td>침입 <strong>탐지<\/strong><\/td><\/tr><tr><td>IPS<\/td><td>침입 <strong>차단<\/strong><\/td><\/tr><tr><td>WAF<\/td><td>웹 애플리케이션 방화벽<\/td><\/tr><tr><td>VPN<\/td><td>공용망에 가상 전용 터널<\/td><\/tr><tr><td>NAC<\/td><td>네트워크 접속 단말 통제<\/td><\/tr><tr><td>DLP<\/td><td>내부 정보 유출 방지<\/td><\/tr><tr><td>SIEM<\/td><td>다양한 로그를 통합 분석<\/td><\/tr><tr><td>ESM<\/td><td>보안 장비 통합 관리<\/td><\/tr><\/tbody><\/table><\/div><p><strong>IDS 탐지 방식<\/strong>: <strong>오용 탐지<\/strong>(Misuse, 시그니처 기반, 알려진 공격), <strong>이상 탐지<\/strong>(Anomaly, 평소와 다른 행동).<\/p><p><strong>리눅스 로그 파일<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>파일<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td><code>wtmp<\/code><\/td><td>로그인·로그아웃 기록 (<code>last<\/code> 명령)<\/td><\/tr><tr><td><code>utmp<\/code><\/td><td>현재 로그인 사용자 (<code>who<\/code>)<\/td><\/tr><tr><td><code>btmp<\/code><\/td><td>로그인 실패 기록 (<code>lastb<\/code>)<\/td><\/tr><tr><td><code>lastlog<\/code><\/td><td>마지막 로그인<\/td><\/tr><tr><td><code>/var/log/secure<\/code><\/td><td>인증 기록<\/td><\/tr><tr><td><code>syslog<\/code><\/td><td>시스템 기록<\/td><\/tr><\/tbody><\/table><\/div><p><strong>취약점 분석 절차<\/strong>: 자산 조사 → 진단 대상 선정 → 진단 수행 → 결과 분석 → 조치.<\/p><p><strong>도구<\/strong>: Tripwire(파일 무결성), Nmap(포트 스캔), Wireshark(패킷 분석), Nessus(취약점 스캐너).<\/p><p><strong>서버 접근 통제<\/strong>: 불필요 포트 차단, 관리자 IP 제한, TCP Wrapper 사용.<\/p>","qs":[{"s":"<p>알려진 공격 패턴(시그니처)과 비교하여 침입을 탐지하는 방식은?<\/p>","c":["오용 탐지","이상 탐지","능동 복구","통합 인증"],"a":0,"e":"<p>시그니처 기반은 오용 탐지다. 평소와 다른 행위를 찾으면 이상 탐지다.<\/p>"},{"s":"<p>리눅스에서 로그인 실패 기록을 담는 파일은?<\/p>","c":["wtmp","btmp","lastlog","utmp"],"a":1,"e":"<p>btmp는 실패 기록, wtmp는 전체 로그인 기록, utmp는 현재 로그인 사용자 기록이다.<\/p>"},{"s":"<p>다양한 장비의 보안 로그를 통합 수집·분석하는 솔루션은?<\/p>","c":["NAC","WAF","SIEM","VPN"],"a":2,"e":"<p>SIEM은 로그를 통합 수집해 분석한다.<\/p>"},{"s":"<p>파일 무결성을 검사하여 변조 여부를 탐지하는 도구는?<\/p>","c":["Wireshark","Nessus","Nmap","Tripwire"],"a":3,"e":"<p>Tripwire는 파일의 해시를 비교해 변경을 탐지한다.<\/p>"},{"s":"<p>내부 정보가 외부로 유출되는 것을 차단하는 솔루션은?<\/p>","c":["SSO","IDS","NAT","DLP"],"a":3,"e":"<p>DLP(Data Loss Prevention)는 내부 정보 유출을 막는다.<\/p>"}]}]},{"title":"4과목 심화: 신기술 용어·보안 사례 보강","desc":"2020~2022 기출 보기에 나왔지만 기본 유형에 빠진 약어를 모았다. CBT 전환 뒤 문제는 공개되지 않아 최신 용어는 수시로 확인한다.","types":[{"id":"newtech-infra","title":"신기술 용어 1: 인프라·통신","freq":"기출 보기의 낯선 약어. 뜻과 약어를 짝지어 외운다","concept":"<div class=\"tw\"><table><thead><tr><th>용어<\/th><th>뜻<\/th><\/tr><\/thead><tbody><tr><td>SDDC<\/td><td>컴퓨팅, 네트워크, 스토리지 등 <strong>데이터센터 전체를 소프트웨어로<\/strong> 정의<\/td><\/tr><tr><td>SDS<\/td><td>스토리지를 소프트웨어로 가상화해 관리<\/td><\/tr><tr><td>Wi-SUN<\/td><td>스마트 그리드 등 <strong>장거리 저전력<\/strong> 무선 통신 표준<\/td><\/tr><tr><td>Li-Fi<\/td><td>LED 빛을 이용한 무선 통신<\/td><\/tr><tr><td>QKD<\/td><td><strong>양자 키 분배<\/strong>. 양자 특성으로 도청을 감지<\/td><\/tr><tr><td>Beacon<\/td><td>블루투스 기반 근거리 위치 신호 장치<\/td><\/tr><tr><td>MEMS<\/td><td>초소형 기계·전자 시스템<\/td><\/tr><tr><td>Memristor (멤리스터)<\/td><td>전류 흐름에 따라 저항이 변하고 그 값을 <strong>기억하는 소자<\/strong><\/td><\/tr><tr><td>GRID<\/td><td>분산된 컴퓨팅 자원을 하나처럼 사용<\/td><\/tr><tr><td>P2P<\/td><td>중앙 서버 없이 단말끼리 직접 통신<\/td><\/tr><tr><td>HACMP<\/td><td>AIX 환경의 고가용성 클러스터 솔루션<\/td><\/tr><tr><td>HSM<\/td><td>암호 키를 안전하게 보관하는 하드웨어 보안 모듈<\/td><\/tr><\/tbody><\/table><\/div>","qs":[{"s":"<p>컴퓨팅, 네트워크, 스토리지 등 데이터센터의 모든 자원을 가상화하여 소프트웨어로 제어하는 것은?<\/p>","c":["SDS","SDN","SDDC","NFV"],"a":2,"e":"<p>SDDC(Software Defined Data Center)의 설명이다.<\/p>"},{"s":"<p>스마트 그리드 등에 쓰이는 장거리 저전력 무선 통신 표준은?<\/p>","c":["Wi-SUN","Li-Fi","NFS","Beacon"],"a":0,"e":"<p>Wi-SUN은 넓은 지역의 저전력 통신에 쓰인다. Li-Fi는 빛, Beacon은 근거리 위치 신호다.<\/p>"},{"s":"<p>양자 역학적 특성을 이용해 도청을 감지하면서 암호 키를 나누는 기술은?<\/p>","c":["DRM","QoS","FTP","QKD"],"a":3,"e":"<p>QKD(Quantum Key Distribution)는 양자 키 분배 기술이다.<\/p>"},{"s":"<p>전류의 흐름에 따라 저항 값이 변하고 그 상태를 기억하는 소자는?<\/p>","c":["MEMS","멤리스터","비컨","QKD"],"a":1,"e":"<p>멤리스터는 메모리(Memory)와 저항기(Resistor)의 합성어다.<\/p>"},{"s":"<p>LED 조명의 빛을 이용해 데이터를 전송하는 무선 통신 기술은?<\/p>","c":["LoRa","Wi-SUN","Li-Fi","Zigbee"],"a":2,"e":"<p>Li-Fi는 가시광선을 이용한 통신이다.<\/p>"}]},{"id":"newtech-service","title":"신기술 용어 2: 서비스·도구·데이터","freq":"서비스 이름과 도구를 고르는 문항","concept":"<div class=\"tw\"><table><thead><tr><th>용어<\/th><th>뜻<\/th><\/tr><\/thead><tbody><tr><td>BaaS<\/td><td><strong>블록체인<\/strong> 개발·운영 환경을 클라우드로 제공 (Backend as a Service의 약자로도 쓰이므로 문맥으로 구분)<\/td><\/tr><tr><td>OTT<\/td><td>인터넷으로 영상 등 콘텐츠를 제공<\/td><\/tr><tr><td>PaaS-TA<\/td><td>한국지능정보사회진흥원이 주도한 국내 <strong>개방형 클라우드 플랫폼<\/strong><\/td><\/tr><tr><td>Scrapy<\/td><td>Python 기반 <strong>웹 크롤링<\/strong> 프레임워크<\/td><\/tr><tr><td>Foursquare<\/td><td>위치 기반 소셜 서비스<\/td><\/tr><tr><td>KDD<\/td><td>데이터베이스에서 지식을 발견하는 과정<\/td><\/tr><tr><td>YAML<\/td><td>사람이 읽기 쉬운 데이터 직렬화 형식, 설정 파일에 사용<\/td><\/tr><tr><td>CWE<\/td><td>소프트웨어 약점 유형 목록<\/td><\/tr><tr><td>GPL<\/td><td>소스 공개 의무가 있는 대표적 오픈소스 라이선스<\/td><\/tr><tr><td>PDCA<\/td><td>Plan, Do, Check, Act 관리 순환<\/td><\/tr><tr><td>PIMS<\/td><td>개인정보 관리 체계(현재 ISMS-P로 통합)<\/td><\/tr><tr><td>OTP<\/td><td>일회용 비밀번호<\/td><\/tr><\/tbody><\/table><\/div>","qs":[{"s":"<p>노드를 직접 구축하지 않고 클라우드에서 블록체인 앱 개발 환경을 빌려 쓰는 서비스 모델은?<\/p>","c":["BaaS","YAML","OTT","PIMS"],"a":0,"e":"<p>BaaS(Blockchain as a Service)의 설명이다.<\/p>"},{"s":"<p>웹 페이지에서 데이터를 자동으로 모으는 스파이더를 Python으로 작성할 때 쓰는 프레임워크는?<\/p>","c":["Express","Gradle","Scrapy","Spring"],"a":2,"e":"<p>Scrapy는 웹 데이터 수집을 위한 Python 프레임워크다.<\/p>"},{"s":"<p>국내에서 주도하여 개발한 개방형 클라우드 플랫폼은?<\/p>","c":["Docker","Kubernetes","Hadoop","PaaS-TA"],"a":3,"e":"<p>PaaS-TA는 국내 주도로 개발된 개방형 클라우드 플랫폼이다.<\/p>"},{"s":"<p>사람이 읽기 쉬운 형식으로 설정 파일에 많이 쓰이는 데이터 직렬화 언어는?<\/p>","c":["KDD","YAML","PDCA","CWE"],"a":1,"e":"<p>YAML은 들여쓰기로 구조를 표현한다.<\/p>"},{"s":"<p>Plan, Do, Check, Act의 순환으로 관리 체계를 개선하는 모델은?<\/p>","c":["PDCA","HSM","CIDR","OTP"],"a":0,"e":"<p>PDCA는 품질·보안 관리에서 쓰는 순환 모델이다.<\/p>"}]},{"id":"attack-extra","title":"보안 사례 보강: 블루투스 공격·침입 탐지·허니팟","freq":"기출 보기에 나온 이름. 공격과 탐지 방법을 함께 정리","concept":"<p><strong>블루투스 공격<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>공격<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>블루버그 (BlueBug)<\/td><td>블루투스 연결 취약점으로 장비를 <strong>원격 제어<\/strong><\/td><\/tr><tr><td>블루스나프 (BlueSnarf)<\/td><td>장비의 <strong>파일에 무단 접근<\/strong><\/td><\/tr><tr><td>블루프린팅 (BluePrinting)<\/td><td>공격 대상 블루투스 <strong>장비를 탐색<\/strong><\/td><\/tr><tr><td>블루재킹 (BlueJacking)<\/td><td><strong>스팸 메시지<\/strong>를 익명으로 전송<\/td><\/tr><\/tbody><\/table><\/div><p><strong>기타 이름<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>용어<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>Stuxnet<\/td><td>산업 제어 시스템을 노린 악성코드<\/td><\/tr><tr><td>Honeypot<\/td><td>공격자를 유인해 행동을 분석하는 <strong>미끼 시스템<\/strong><\/td><\/tr><tr><td>Qshing<\/td><td><strong>QR코드<\/strong>를 이용한 피싱<\/td><\/tr><tr><td>Evil Twin<\/td><td>정상 AP로 위장한 가짜 무선 AP<\/td><\/tr><tr><td>Rootkit<\/td><td>침입 사실을 숨기며 관리자 권한을 유지하는 도구<\/td><\/tr><\/tbody><\/table><\/div><p><strong>침입 탐지 시스템 배치<\/strong>: <strong>HIDS<\/strong>는 호스트의 로그와 행위를 감시하고, <strong>NIDS<\/strong>는 네트워크 트래픽을 감시한다. <strong>DMZ<\/strong>는 외부 공개 서버를 두는 완충 구역이다.<\/p><p><strong>세션 하이재킹 탐지<\/strong>: 비동기화 상태 탐지, ACK Storm 탐지, 패킷 유실과 재전송 증가 탐지, 예상치 못한 접속의 리셋 탐지.<\/p><p><strong>백도어 탐지<\/strong>: 현재 동작 중인 프로세스와 <strong>열린 포트<\/strong> 확인, SetUID 파일 검사, 무결성 검사, 로그 분석.<\/p><p><strong>SetUID<\/strong>: 실행 시 파일 소유자의 권한으로 동작하는 UNIX 권한으로, 악용되면 권한 상승으로 이어진다.<\/p>","qs":[{"s":"<p>공격 대상이 될 블루투스 장비를 찾아내는 공격은?<\/p>","c":["블루프린팅","블루스나프","블루재킹","블루버그"],"a":0,"e":"<p>블루프린팅은 장비를 탐색하는 활동이다. 블루재킹은 스팸 전송이다.<\/p>"},{"s":"<p>공격자를 유인해 공격 행위를 기록·분석하기 위해 일부러 노출한 시스템은?<\/p>","c":["Evil Twin","DMZ","Honeypot","Rootkit"],"a":2,"e":"<p>허니팟은 미끼 역할을 하는 시스템이다.<\/p>"},{"s":"<p>네트워크 트래픽을 감시하는 침입 탐지 시스템은?<\/p>","c":["HSM","NIDS","NFS","HIDS"],"a":1,"e":"<p>NIDS는 네트워크, HIDS는 호스트를 감시한다.<\/p>"},{"s":"<p>QR코드를 이용해 악성 사이트로 유도하는 공격은?<\/p>","c":["Evil Twin","Smishing","Pharming","Qshing"],"a":3,"e":"<p>QR코드와 피싱을 합친 말이 큐싱(Qshing)이다.<\/p>"},{"s":"<p>백도어의 존재를 확인하는 방법으로 가장 거리가 먼 것은?<\/p>","c":["로그를 분석한다.","닫혀 있는 포트 목록만 확인한다.","SetUID 파일을 검사한다.","파일의 무결성을 검사한다."],"a":1,"e":"<p>백도어 탐지는 동작 중인 프로세스와 열린 포트를 확인한다.<\/p>"}]}]},{"title":"4과목 보강: 2024~2026 복원 기출 대조","desc":"최근 복원본과 오답노트 글에서 빠져 있던 암호·공격·신기술 용어를 모았다.","types":[{"id":"crypto-hard","title":"블록 암호 운영 모드·해시 종류·무선 보안","freq":"2024~2026 복원본에 CBC·ECB·CFB, SNEFRU, WPA·TKIP이 등장","concept":"<p><strong>블록 암호 운영 모드<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>모드<\/th><th>특징<\/th><\/tr><\/thead><tbody><tr><td>ECB<\/td><td>블록마다 <strong>독립<\/strong> 암호화. 같은 평문 블록은 같은 암호문이 됨<\/td><\/tr><tr><td>CBC<\/td><td>앞 <strong>암호문 블록과 XOR<\/strong> 후 암호화, IV 사용<\/td><\/tr><tr><td>CFB<\/td><td>블록 암호를 <strong>스트림 암호처럼<\/strong> 사용, 앞 암호문을 암호화해 평문과 XOR<\/td><\/tr><tr><td>OFB<\/td><td>암호 출력을 다시 암호화해 스트림 생성<\/td><\/tr><tr><td>CTR<\/td><td>카운터를 암호화해 평문과 XOR<\/td><\/tr><\/tbody><\/table><\/div><p><strong>해시 알고리즘<\/strong>: MD4, MD5, SHA 계열, SNEFRU, HAVAL, N-Hash(수험서에 따라 N-NASH로 표기). IDEA, SEED, ARIA는 블록 암호다.<\/p><p><strong>공개키 난제 정리<\/strong>: RSA는 소인수분해, ElGamal과 Diffie-Hellman은 이산대수, ECC는 <strong>타원곡선 위의 이산대수<\/strong>에 근거한다.<\/p><p><strong>무선 LAN 보안<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>규격<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>WEP<\/td><td>초기 규격, RC4 사용, 취약<\/td><\/tr><tr><td>WPA<\/td><td>WEP 보완, 초기 규격에서 <strong>TKIP<\/strong> 사용<\/td><\/tr><tr><td>WPA2<\/td><td>AES 기반 CCMP<\/td><\/tr><tr><td>WPA3<\/td><td>더 강화된 인증과 암호화<\/td><\/tr><\/tbody><\/table><\/div>","qs":[{"s":"<p>같은 평문 블록이 항상 같은 암호문 블록이 되어 패턴이 드러나는 운영 모드는?<\/p>","c":["OFB","ECB","CBC","CFB"],"a":1,"e":"<p>ECB는 블록마다 독립적으로 암호화해 패턴이 노출될 수 있다.<\/p>"},{"s":"<p>이전 암호문 블록을 현재 평문과 XOR한 뒤 암호화하는 운영 모드는?<\/p>","c":["ECB","OFB","CTR","CBC"],"a":3,"e":"<p>CBC는 앞 암호문 블록과 체인처럼 연결되며, 첫 블록에는 초기화 벡터를 쓴다.<\/p>"},{"s":"<p>다음 중 해시 알고리즘에 해당하는 것은?<\/p>","c":["HAVAL","IDEA","ARIA","SEED"],"a":0,"e":"<p>HAVAL은 해시 함수다. IDEA, SEED, ARIA는 블록 암호다.<\/p>"},{"s":"<p>패킷별로 키를 바꾸는 TKIP를 채택해 WEP의 대안으로 먼저 나온 규격은?<\/p>","c":["WEP","WPA","WPA3","IPSec"],"a":1,"e":"<p>WPA는 WEP를 대체하며 TKIP를 사용했다.<\/p>"},{"s":"<p>같은 안전성을 RSA보다 짧은 키로 얻을 수 있어 모바일 기기에 널리 쓰이는 공개키 암호는?<\/p>","c":["RSA","Diffie-Hellman","ElGamal","ECC"],"a":3,"e":"<p>ECC는 짧은 키로도 높은 안전성을 제공한다. RSA는 소인수분해에 근거한다.<\/p>"}]},{"id":"attack-2","title":"공격·보안 개념 보강: 스위치 재밍·오픈 리다이렉트·제로 트러스트","freq":"2024~2026 복원본에 처음 보이는 공격 이름과 보안 개념","concept":"<div class=\"tw\"><table><thead><tr><th>용어<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>Switch Jamming (MAC Flooding)<\/td><td>위조 MAC 주소를 계속 보내 <strong>스위치의 주소 테이블을 넘치게<\/strong> 해 허브처럼 동작시키는 스니핑 기법<\/td><\/tr><tr><td>Open Redirect<\/td><td>입력값을 기반으로 이동하는 기능을 악용해 <strong>공격자의 도메인으로 유도<\/strong><\/td><\/tr><tr><td>키로거 (Key Logger)<\/td><td>키보드 입력을 몰래 기록<\/td><\/tr><tr><td>Spear Phishing<\/td><td>특정 대상을 겨냥한 맞춤형 피싱<\/td><\/tr><tr><td>Ping Flood<\/td><td>대량의 Ping으로 자원 고갈<\/td><\/tr><tr><td>Rogue Ware<\/td><td>가짜 백신처럼 속여 금전을 요구<\/td><\/tr><tr><td>Zero Trust<\/td><td><strong>아무것도 신뢰하지 않고 항상 검증<\/strong>하는 보안 모델<\/td><\/tr><tr><td>DPI<\/td><td>패킷 내용까지 깊이 검사해 트래픽을 분류·차단<\/td><\/tr><tr><td>SATAN<\/td><td>네트워크 취약점 분석 도구<\/td><\/tr><tr><td>스카우터, 제니퍼<\/td><td>인터페이스·애플리케이션 성능 감시 도구<\/td><\/tr><\/tbody><\/table><\/div><p><strong>Something you have (소유 기반)<\/strong>: OTP, 스마트카드, 보안 토큰. 지문은 존재 기반이다.<\/p><p><strong>위치 기반 인증<\/strong>: GPS, IP 주소처럼 위치 정보를 이용한다.<\/p>","qs":[{"s":"<p>위조한 MAC 주소를 대량으로 보내 스위치 주소 테이블을 가득 채운 뒤 패킷을 엿보는 기법은?<\/p>","c":["SQL Injection","Switch Jamming","Ping Flood","TearDrop"],"a":1,"e":"<p>주소 테이블이 넘치면 스위치가 허브처럼 동작해 스니핑이 가능해진다.<\/p>"},{"s":"<p>\"절대 믿지 말고 항상 검증한다\"를 원칙으로 하는 보안 모델은?<\/p>","c":["벨-라파듈라","비바 모델","제로 트러스트","심층 방어"],"a":2,"e":"<p>제로 트러스트는 내부와 외부를 가리지 않고 모든 접근을 검증한다.<\/p>"},{"s":"<p>입력값으로 이동 주소를 정하는 기능을 악용해 사용자를 공격자의 사이트로 보내는 취약점은?<\/p>","c":["Path Traversal","Key Logger","Buffer Overflow","Open Redirect"],"a":3,"e":"<p>검증 없는 재요청 기능을 악용하는 취약점이 Open Redirect다.<\/p>"},{"s":"<p>패킷의 내용까지 분석하여 유해 트래픽을 차단하고 서비스 품질을 관리하는 기술은?<\/p>","c":["DPI","DNS","DHCP","FTP"],"a":0,"e":"<p>DPI(Deep Packet Inspection)는 페이로드까지 검사한다.<\/p>"},{"s":"<p>소유 기반 인증 수단으로 볼 수 없는 것은?<\/p>","c":["스마트카드","지문","보안 카드","OTP 토큰"],"a":1,"e":"<p>지문은 존재 기반 인증이다.<\/p>"}]},{"id":"newtech-3","title":"신기술 용어 3: 최근 복원본과 정리 글의 추가 약어","freq":"2024~2026 복원본과 5과목 정리 글에 나온 용어","concept":"<div class=\"tw\"><table><thead><tr><th>용어<\/th><th>뜻<\/th><\/tr><\/thead><tbody><tr><td>메타버스<\/td><td>소설 스노우 크래시에서 유래한 3차원 가상 세계<\/td><\/tr><tr><td>AR / VR<\/td><td>증강현실 / 가상현실<\/td><\/tr><tr><td>NFT<\/td><td>대체 불가능한 토큰<\/td><\/tr><tr><td>NDN<\/td><td>주소 대신 <strong>콘텐츠 이름<\/strong>으로 데이터 전달<\/td><\/tr><tr><td>NGN<\/td><td>유선망 기반 차세대 통신망<\/td><\/tr><tr><td>SON<\/td><td>스스로 망을 구성·최적화<\/td><\/tr><tr><td>WBAN<\/td><td>웨어러블·체내 센서의 무선 신체 영역 네트워크<\/td><\/tr><tr><td>UWB<\/td><td>짧은 거리에서 저전력으로 대용량 전송<\/td><\/tr><tr><td>M2M<\/td><td>기계끼리 통신<\/td><\/tr><tr><td>AllJoyn<\/td><td>기기 간 상호작용을 돕는 <strong>오픈 소스 IoT 프레임워크<\/strong><\/td><\/tr><tr><td>MEC<\/td><td>네트워크 가장자리에서 처리하는 모바일 엣지 컴퓨팅<\/td><\/tr><tr><td>NOMA<\/td><td>같은 자원을 전력 차이로 나눠 쓰는 비직교 다중 접속<\/td><\/tr><tr><td>CEP<\/td><td>대량 이벤트에서 의미 있는 패턴을 실시간 처리<\/td><\/tr><tr><td>트러스트존<\/td><td>일반 영역과 보안 영역을 하드웨어로 분리<\/td><\/tr><tr><td>신 클라이언트<\/td><td>최소 기능 단말, 처리는 서버에서<\/td><\/tr><tr><td>디지털 아카이빙<\/td><td>디지털 자료의 장기 보존<\/td><\/tr><tr><td>데이터 다이어트<\/td><td>삭제 없이 압축·중복 제거·재분류<\/td><\/tr><tr><td>브로드 데이터<\/td><td>다양한 채널의 소비자 상호작용 데이터<\/td><\/tr><tr><td>Tajo<\/td><td>하둡 기반 분산 데이터 웨어하우스<\/td><\/tr><\/tbody><\/table><\/div><p><strong>DAS 직접 연결 인터페이스<\/strong>: SATA, SAS, SCSI, USB. iSCSI(IP 네트워크 이용)와 Fibre Channel(주로 SAN에서 사용)은 직접 연결 인터페이스로 보기 어렵다.<\/p>","qs":[{"s":"<p>주소가 아니라 콘텐츠의 이름으로 데이터를 찾아 전달하는 네트워크 구조는?<\/p>","c":["VLAN","NDN","SON","NGN"],"a":1,"e":"<p>NDN(Named Data Networking)의 설명이다.<\/p>"},{"s":"<p>스마트 전구와 스피커가 제조사와 무관하게 서로를 발견해 통신하게 해 주는 IoT용 오픈소스 프레임워크는?<\/p>","c":["Tajo","MEC","AllJoyn","NOMA"],"a":2,"e":"<p>AllJoyn은 기기 간 통신을 쉽게 해 주는 IoT 프레임워크다.<\/p>"},{"s":"<p>DAS의 직접 연결 인터페이스로 보기 어려운 것은?<\/p>","c":["iSCSI","SAS","SCSI","SATA"],"a":0,"e":"<p>iSCSI는 IP 네트워크를 이용하므로 직접 연결 방식이 아니다.<\/p>"},{"s":"<p>하드웨어 수준에서 일반 실행 영역과 보안 영역을 분리하는 기술은?<\/p>","c":["데이터 다이어트","디지털 아카이빙","브로드 데이터","트러스트존"],"a":3,"e":"<p>트러스트존은 프로세서를 두 영역으로 분리한다.<\/p>"},{"s":"<p>대량으로 발생하는 이벤트 중에서 의미 있는 패턴을 실시간으로 찾아내는 처리 기술은?<\/p>","c":["CEP","UWB","NFT","M2M"],"a":0,"e":"<p>CEP(Complex Event Processing)는 복잡 이벤트 처리 기술이다.<\/p>"}]}]}];

  <p class="hint">디스크 스케줄링과 PERT·CPM은 2027 출제기준에 이름이 없지만 기출과 복원본에 나와 짧게 다룹니다.</p>
  <h2 class="sec">문제와 정답에 대해</h2>
  <p>개인이 만든 비공식 학습 자료입니다. 한국산업인력공단, 큐넷과 관련이 없으며 기출 원문을 싣지 않습니다.</p><p>문제는 기출의 형식과 난도를 참고해 직접 작성했습니다. 복원 기출과 문장 단위로 대조해 비슷한 문제는 다시 썼지만, 표준 용어와 짧은 표현은 겹칠 수 있습니다. 코드, SQL, 계산 문제의 정답은 실제로 실행해 확인했고, 용어 문제는 별도 검수를 거쳤습니다. 2027년 시험은 아직 시행 전이므로 출제 경향이 달라질 수 있습니다.</p><p><strong>참고 자료</strong>: <a href="https://www.q-net.or.kr/crf005.do?id=crf00503&jmCd=1320" target="_blank" rel="noopener">큐넷 정보처리기사 출제기준</a>, <a href="https://www.moducbt.com/" target="_blank" rel="noopener">모두CBT</a>, <a href="https://www.sqldpass.com/past-exams" target="_blank" rel="noopener">sqldpass</a>의 복원 기출과 공개 해설을 유형 분류에만 참고했습니다.</p>`;
}
function wrong(){
  const items=[];TYPES.forEach(t=>t.qs.forEach((q,i)=>{if(marks[t.id+'#'+i]==='x')items.push([t,i])}));
  return `<p class="eyebrow">틀림으로 표시한 문제</p><h1>오답 노트</h1>`+(items.length?`<ul class="wrong">${items.map(([t,i])=>`<li><a href="#${t.id}">${t.title}</a> 문제 ${i+1}</li>`).join('')}</ul>`:`<p>아직 틀림으로 표시한 문제가 없습니다. 문제를 풀고 정답을 확인한 뒤 틀림을 누르면 여기에 모입니다.</p>`);
}
let onlyWrong=false;
const picks={};
function chapter(t){
  const idx=TYPES.indexOf(t),prev=TYPES[idx-1],next=TYPES[idx+1];
  const qs=t.qs.map((q,i)=>{
    const k=t.id+'#'+i,m=marks[k];
    if(onlyWrong&&m!=='x')return'';
    const st=picks[k];
    return `<article class="q" data-k="${k}" data-a="${q.a}"><div class="qh"><span class="qno">문제 ${i+1}</span><span class="mark ${m||''}">${m==='o'?'맞음':m==='x'?'틀림':''}</span></div>${q.s}
    <div class="opts" role="radiogroup" aria-label="문제 ${i+1} 보기">${q.c.map((c,n)=>`<button class="opt" role="radio" data-act="pick" data-n="${n}" aria-checked="${st===n}"><span class="on">${'①②③④'[n]}</span><span class="ot">${c}</span></button>`).join('')}</div>
    <div class="btns"><button class="primary" data-act="show">정답 확인</button></div>
    <div class="ans" hidden><div class="lab">정답</div><div class="val">${'①②③④'[q.a]} ${q.c[q.a]}</div><div class="ex">${q.e}</div></div></article>`}).join('')||'<p class="hint" style="margin-top:16px">이 유형에는 틀림으로 표시한 문제가 없습니다.</p>';
  return `<p class="eyebrow">${t.part} · 유형 ${idx+1}/${TYPES.length}</p><h1>${t.title}</h1><p class="freq">기출: ${t.freq}</p>
  <h2 class="sec">핵심 개념</h2><section class="concept">${t.concept}</section>
  <h2 class="sec" id="qs">문제 ${t.qs.length}개</h2><p class="hint">보기를 고른 뒤 정답을 확인하면 자동으로 채점됩니다.</p>
  <div class="bar"><button id="fw" aria-pressed="${onlyWrong}">틀린 문제만 보기</button></div>${qs}
  <div class="pager">${prev?`<a href="#${prev.id}"><small>이전 유형</small>${prev.title}</a>`:'<span></span>'}${next?`<a href="#${next.id}" style="text-align:right"><small>다음 유형</small>${next.title}</a>`:'<span></span>'}</div>`;
}
function route(reset){
  const id=(location.hash||'#home').slice(1),page=document.getElementById('page');
  if(reset)onlyWrong=false;
  if(id==='wrong')page.innerHTML=wrong();
  else if(byId[id])page.innerHTML=chapter(byId[id]);
  else page.innerHTML=home();
  renderToc(id);
  if(reset){window.scrollTo(0,0);if(innerWidth<=860)document.getElementById('menu').open=false}
}
document.getElementById('page').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='fw'){onlyWrong=!onlyWrong;route(false);return}
  const q=b.closest('.q');if(!q)return;
  const a=b.dataset.act,ans=q.querySelector('.ans'),k=q.dataset.k,ok=+q.dataset.a;
  if(a==='pick'){
    picks[k]=+b.dataset.n;
    q.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-checked',x===b));
    return;
  }
  if(a==='show'){
    if(ans.hidden&&picks[k]===undefined){
      if(!q.querySelector('.need')){const p=document.createElement('p');p.className='hint need';p.textContent='보기를 먼저 고르세요.';b.parentNode.after(p)}
      return;
    }
    q.querySelector('.need')?.remove();
    ans.hidden=!ans.hidden;b.textContent=ans.hidden?'정답 확인':'정답 숨기기';
    q.querySelectorAll('.opt').forEach((x,n)=>x.classList.toggle('right',!ans.hidden&&n===ok));
    q.querySelectorAll('.opt').forEach((x,n)=>x.classList.toggle('wrong',!ans.hidden&&n===picks[k]&&n!==ok));
    if(!ans.hidden){
      marks[k]=picks[k]===ok?'o':'x';save();
      const m=q.querySelector('.mark');m.className='mark '+marks[k];m.textContent=marks[k]==='o'?'맞음':'틀림';
      renderToc(location.hash.slice(1));
    }
  }
});
window.addEventListener('hashchange',()=>route(true));
route(false);
</script>
