\n            <span class=\"tk\">if<\/span> (v &gt; 4) s += v;\n        }\n        System.out.print(s);\n    }\n}<\/code><\/pre>","c":["6","12","14","20"],"a":2,"e":"<p>4보다 큰 6과 8을 더해 14다.<\/p>"},{"s":"<p>다음 Java 프로그램의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"java\"><code><span class=\"tk\">public<\/span> <span class=\"tk\">class<\/span> Main {\n    <span class=\"tk\">public<\/span> <span class=\"tk\">static<\/span> <span class=\"tk\">void<\/span> main(String[] args) {\n        System.out.print(1 + 2 + <span class=\"ts\">\"x\"<\/span> + 1 + 2);\n    }\n}<\/code><\/pre>","c":["3x3","3x12","12x12","12x3"],"a":1,"e":"<p>왼쪽부터 계산해 1 + 2 = 3, 문자열이 나온 뒤에는 이어 붙인다.<\/p>"},{"s":"<p>다음 Java 프로그램의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"java\"><code><span class=\"tk\">public<\/span> <span class=\"tk\">class<\/span> Main {\n    <span class=\"tk\">public<\/span> <span class=\"tk\">static<\/span> <span class=\"tk\">void<\/span> main(String[] args) {\n        String s = <span class=\"ts\">\"Engineer\"<\/span>;\n        System.out.print(s.substring(2, 5));\n    }\n}<\/code><\/pre>","c":["ngi","ngin","gin","gine"],"a":2,"e":"<p>인덱스 2 이상 5 미만의 문자인 g, i, n이다.<\/p>"},{"s":"<p>다음 Java 프로그램의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"java\"><code><span class=\"tk\">public<\/span> <span class=\"tk\">class<\/span> Main {\n    <span class=\"tk\">public<\/span> <span class=\"tk\">static<\/span> <span class=\"tk\">void<\/span> main(String[] args) {\n        <span class=\"tk\">int<\/span> x = 10;\n        x += x++ + ++x;\n        System.out.print(x);\n    }\n}<\/code><\/pre>","c":["30","31","32","33"],"a":2,"e":"<p>왼쪽 x의 값 10을 먼저 읽는다. <code>x++<\/code>는 10, 이후 x는 11, <code>++x<\/code>로 12가 된다. 10 + (10 + 12) = 32다.<\/p>"},{"s":"<p>Java에서 두 문자열의 내용이 같은지 비교할 때 쓰는 메서드는?<\/p>","c":["length()","trim()","equals()","concat()"],"a":2,"e":"<p><code>equals()<\/code>가 값을 비교하며, <code>==<\/code>는 참조를 비교한다.<\/p>"}]},{"id":"java-oop","title":"Java 클래스·상속·예외","freq":"오버라이딩, static, 생성자 호출 순서가 반복","concept":"<ul><li>하위 클래스 객체를 상위 타입으로 참조해도 <strong>오버라이딩된 메서드는 실제 객체의 것이 실행<\/strong>된다.<\/li><li><code>static<\/code> 멤버는 객체마다가 아니라 <strong>클래스에 하나<\/strong> 존재한다.<\/li><li>생성자 호출 순서: <strong>상위 → 하위<\/strong>. <code>super()<\/code>로 상위 생성자를 호출한다.<\/li><li><code>this<\/code>는 현재 객체.<\/li><li>접근 제어자: <code>public<\/code> &gt; <code>protected<\/code> &gt; (default) &gt; <code>private<\/code>.<\/li><li>추상 클래스 <code>abstract<\/code>, 인터페이스 <code>interface<\/code>/<code>implements<\/code>, 상속 <code>extends<\/code>.<\/li><li>자바는 클래스의 <strong>단일 상속<\/strong>만 허용하고, 인터페이스는 여러 개 구현할 수 있다.<\/li><\/ul><p><strong>예외 처리<\/strong><\/p><pre class=\"code\" data-lang=\"\"><code>try { 실행 } catch (예외 e) { 처리 } finally { 항상 실행 }<\/code><\/pre><ul><li><code>finally<\/code>는 예외 발생 여부와 무관하게 수행된다.<\/li><li>예외: <code>ArithmeticException<\/code>(0으로 나눔), <code>NullPointerException<\/code>, <code>ArrayIndexOutOfBoundsException<\/code>, <code>NumberFormatException<\/code>.<\/li><\/ul>","qs":[{"s":"<p>다음 Java 프로그램의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"java\"><code><span class=\"tk\">class<\/span> A {\n    <span class=\"tk\">int<\/span> f() { <span class=\"tk\">return<\/span> 1; }\n}\n<span class=\"tk\">class<\/span> B <span class=\"tk\">extends<\/span> A {\n    @Override <span class=\"tk\">int<\/span> f() { <span class=\"tk\">return<\/span> 2; }\n}\n<span class=\"tk\">public<\/span> <span class=\"tk\">class<\/span> Main {\n    <span class=\"tk\">public<\/span> <span class=\"tk\">static<\/span> <span class=\"tk\">void<\/span> main(String[] args) {\n        A x = <span class=\"tk\">new<\/span> B();\n        System.out.print(x.f());\n    }\n}<\/code><\/pre>","c":["0","1","2","3"],"a":2,"e":"<p>실제 객체가 B이므로 오버라이딩된 메서드가 실행된다.<\/p>"},{"s":"<p>다음 Java 프로그램의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"java\"><code><span class=\"tk\">class<\/span> C {\n    <span class=\"tk\">static<\/span> <span class=\"tk\">int<\/span> n = 0;\n    C() { n++; }\n}\n<span class=\"tk\">public<\/span> <span class=\"tk\">class<\/span> Main {\n    <span class=\"tk\">public<\/span> <span class=\"tk\">static<\/span> <span class=\"tk\">void<\/span> main(String[] args) {\n        <span class=\"tk\">new<\/span> C(); <span class=\"tk\">new<\/span> C(); <span class=\"tk\">new<\/span> C();\n        System.out.print(C.n);\n    }\n}<\/code><\/pre>","c":["0","1","2","3"],"a":3,"e":"<p>static 변수는 공유되므로 생성자 호출마다 증가해 3이 된다.<\/p>"},{"s":"<p>다음 Java 프로그램의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"java\"><code><span class=\"tk\">class<\/span> P {\n    P() { System.out.print(<span class=\"ts\">\"A\"<\/span>); }\n}\n<span class=\"tk\">class<\/span> Q <span class=\"tk\">extends<\/span> P {\n    Q() { System.out.print(<span class=\"ts\">\"B\"<\/span>); }\n}\n<span class=\"tk\">public<\/span> <span class=\"tk\">class<\/span> Main {\n    <span class=\"tk\">public<\/span> <span class=\"tk\">static<\/span> <span class=\"tk\">void<\/span> main(String[] args) {\n        <span class=\"tk\">new<\/span> Q();\n    }\n}<\/code><\/pre>","c":["B","A","BA","AB"],"a":3,"e":"<p>하위 생성자는 먼저 상위 생성자를 호출하므로 A 다음 B가 출력된다.<\/p>"},{"s":"<p>다음 Java 프로그램의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"java\"><code><span class=\"tk\">public<\/span> <span class=\"tk\">class<\/span> Main {\n    <span class=\"tk\">public<\/span> <span class=\"tk\">static<\/span> <span class=\"tk\">void<\/span> main(String[] args) {\n        <span class=\"tk\">try<\/span> {\n            <span class=\"tk\">int<\/span> a = 5 / 0;\n            System.out.print(<span class=\"ts\">\"X\"<\/span> + a);\n        } <span class=\"tk\">catch<\/span> (ArithmeticException e) {\n            System.out.print(<span class=\"ts\">\"Y\"<\/span>);\n        } <span class=\"tk\">finally<\/span> {\n            System.out.print(<span class=\"ts\">\"Z\"<\/span>);\n        }\n    }\n}<\/code><\/pre>","c":["XZ","Z","YZ","XYZ"],"a":2,"e":"<p>0으로 나누면 catch가 실행되고, finally는 항상 실행된다.<\/p>"},{"s":"<p>Java에서 인터페이스를 구현할 때 사용하는 키워드는?<\/p>","c":["extends","abstract","implements","instanceof"],"a":2,"e":"<p>인터페이스 구현은 implements, 클래스 상속은 extends다.<\/p>"}]},{"id":"python","title":"Python 문법 출력","freq":"Python 약 11문항. 슬라이싱, 자료형, 조건문 elif가 반복","concept":"<p><strong>슬라이싱<\/strong> <code>s[시작:끝:간격]<\/code>: 끝 인덱스는 포함하지 않는다.<\/p><div class=\"tw\"><table><thead><tr><th>식<\/th><th><code>s = \"ABCDEF\"<\/code>의 결과<\/th><\/tr><\/thead><tbody><tr><td><code>s[1:4]<\/code><\/td><td><code>BCD<\/code><\/td><\/tr><tr><td><code>s[:2]<\/code><\/td><td><code>AB<\/code><\/td><\/tr><tr><td><code>s[-2:]<\/code><\/td><td><code>EF<\/code><\/td><\/tr><tr><td><code>s[::2]<\/code><\/td><td><code>ACE<\/code><\/td><\/tr><tr><td><code>s[::-1]<\/code><\/td><td><code>FEDCBA<\/code><\/td><\/tr><\/tbody><\/table><\/div><p><strong>자료형<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>타입<\/th><th>형태<\/th><th>특징<\/th><\/tr><\/thead><tbody><tr><td>list<\/td><td><code>[1, 2]<\/code><\/td><td>시퀀스, <strong>변경 가능<\/strong><\/td><\/tr><tr><td>tuple<\/td><td><code>(1, 2)<\/code><\/td><td>시퀀스, <strong>변경 불가<\/strong><\/td><\/tr><tr><td>dict<\/td><td><code>{'a': 1}<\/code><\/td><td>키-값<\/td><\/tr><tr><td>set<\/td><td><code>{1, 2}<\/code><\/td><td>중복 없음<\/td><\/tr><\/tbody><\/table><\/div><p><strong>연산<\/strong>: <code>/<\/code>는 실수 나눗셈, <code>//<\/code>는 몫, <code>**<\/code>는 거듭제곱, <code>%<\/code>는 나머지.<\/p><p><strong>리스트 메서드<\/strong>: <code>append<\/code>(맨 뒤 추가), <code>extend<\/code>, <code>insert<\/code>, <code>pop<\/code>, <code>remove<\/code>, <code>sort<\/code>, <code>reverse<\/code>.<\/p><p><strong>제어문<\/strong>: <code>if<\/code>, <code>elif<\/code>, <code>else<\/code>. <code>for x in range(시작, 끝, 간격)<\/code>은 끝을 포함하지 않는다.<\/p><p><strong>함수<\/strong>: <code>def f(x):<\/code>, 클래스 안에 정의한 인스턴스 메서드의 첫 인자는 <code>self<\/code>.<\/p><p><strong>참조<\/strong>: <code>b = a<\/code>는 복사가 아니라 같은 리스트를 가리키게 한다.<\/p><p><strong>문자열<\/strong>: <code>split()<\/code>, <code>join()<\/code>, <code>upper()<\/code>, <code>replace()<\/code>. <code>'a' * 3<\/code>은 <code>aaa<\/code>.<\/p><p><strong>print<\/strong>: <code>print(a, b, sep=',', end='')<\/code>.<\/p>","qs":[{"s":"<p>다음 Python 코드의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"python\"><code>s = <span class=\"ts\">\"PYTHON\"<\/span>\n<span class=\"tk\">print<\/span>(s[1:4] + s[-1])<\/code><\/pre>","c":["YTN","PYTN","YTHN","YTHO"],"a":2,"e":"<p><code>s[1:4]<\/code>는 YTH, <code>s[-1]<\/code>은 N이다.<\/p>"},{"s":"<p>다음 Python 코드의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"python\"><code>a = [1, 2, 3]\nb = a\nb.append(4)\n<span class=\"tk\">print<\/span>(len(a))<\/code><\/pre>","c":["1","3","4","7"],"a":2,"e":"<p><code>b<\/code>와 <code>a<\/code>는 같은 리스트를 가리킨다.<\/p>"},{"s":"<p>다음 Python 코드의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"python\"><code>x = 0\n<span class=\"tk\">for<\/span> i <span class=\"tk\">in<\/span> range(1, 8, 2):\n    x += i\n<span class=\"tk\">print<\/span>(x)<\/code><\/pre>","c":["9","12","16","28"],"a":2,"e":"<p>1, 3, 5, 7을 더해 16이다.<\/p>"},{"s":"<p>Python에서 조건문 <code>if<\/code> 다음에 또 다른 조건을 검사할 때 사용하는 키워드는?<\/p>","c":["elif","else if","elsif","either"],"a":0,"e":"<p>Python은 <code>elif<\/code>를 사용한다.<\/p>"},{"s":"<p>다음 Python 코드의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"python\"><code><span class=\"tk\">print<\/span>(7 // 2, 7 % 2, 2 ** 3)<\/code><\/pre>","c":["3.5 1 6","3 1 6","4 1 8","3 1 8"],"a":3,"e":"<p><code>//<\/code>는 몫, <code>%<\/code>는 나머지, <code>**<\/code>는 거듭제곱이다.<\/p>"}]},{"id":"data-type","title":"데이터 타입·변수·연산자·식별자","freq":"언어 일반 약 11문항. 명명 규칙과 자료형이 출제","concept":"<p><strong>변수 이름 규칙<\/strong>: 영문자·숫자·밑줄을 쓴다. 숫자로 시작할 수 없다. 예약어를 쓸 수 없다. 공백 불가.<\/p><p><strong>명명 표기법<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>표기법<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td>헝가리안<\/td><td><code>strName<\/code>, <code>iCount<\/code> (자료형 접두어)<\/td><\/tr><tr><td>카멜<\/td><td><code>userName<\/code><\/td><\/tr><tr><td>파스칼<\/td><td><code>UserName<\/code><\/td><\/tr><tr><td>스네이크<\/td><td><code>user_name<\/code><\/td><\/tr><\/tbody><\/table><\/div><p><strong>C의 예약어 예<\/strong>: <code>int<\/code>, <code>for<\/code>, <code>while<\/code>, <code>return<\/code>, <code>const<\/code>, <code>static<\/code>, <code>sizeof<\/code>, <code>void<\/code>.<\/p><p><strong>기억 클래스<\/strong>: <code>auto<\/code>(자동), <code>register<\/code>(레지스터), <code>static<\/code>(정적), <code>extern<\/code>(외부).<\/p><p><strong>자료형<\/strong>: 정수, 실수, 문자, 논리. C에서 <code>int<\/code>는 보통 4바이트, <code>char<\/code>는 1바이트, <code>double<\/code>은 8바이트.<\/p><p><strong>사용자 정의 자료형<\/strong>: 구조체(struct), 공용체(union), 열거형(enum).<\/p><p><strong>자료구조 기본 유형<\/strong>: 배열은 같은 자료형을 연속 저장, 연결 리스트는 포인터로 연결.<\/p><p><strong>형 변환<\/strong>: 묵시적(자동), 명시적(캐스팅).<\/p><p><strong>연산자 분류<\/strong>: 산술, 관계, 논리, 비트, 대입, 조건.<\/p><p><strong>10진수 → 2진수<\/strong>: 2로 나눈 나머지를 거꾸로 읽는다.<\/p>","qs":[{"s":"<p>C 언어에서 변수 이름으로 사용할 수 있는 것은?<\/p>","c":["2count","for","_count2","user name"],"a":2,"e":"<p>숫자로 시작할 수 없고 공백과 예약어는 쓸 수 없다.<\/p>"},{"s":"<p>식별자 앞에 자료형을 나타내는 접두어를 붙이는 표기법은?<\/p>","c":["헝가리안 표기법","스네이크 표기법","파스칼 표기법","카멜 표기법"],"a":0,"e":"<p>자료형 접두어를 붙이면 헝가리안 표기법이다.<\/p>"},{"s":"<p>C 언어에서 서로 다른 자료형의 변수를 하나로 묶어 정의하는 사용자 정의 자료형은?<\/p>","c":["매크로","배열","실수형","구조체"],"a":3,"e":"<p>구조체는 서로 다른 자료형을 묶는다. 배열은 같은 자료형의 묶음이다.<\/p>"},{"s":"<p>10진수 13을 2진수로 나타낸 것은?<\/p>","c":["1001","1011","1101","1110"],"a":2,"e":"<p>13 = 8 + 4 + 1이므로 1101이다.<\/p>"},{"s":"<p>C 언어의 기억 클래스가 아닌 것은?<\/p>","c":["private","extern","register","auto"],"a":0,"e":"<p>C의 기억 클래스는 auto, register, static, extern이다. private는 Java·C++의 접근 제어자다.<\/p>"}]},{"id":"lang-type","title":"프로그래밍 언어의 특성","freq":"절차적·객체지향·스크립트·선언형 구분이 2027 출제기준에 명시","concept":"<div class=\"tw\"><table><thead><tr><th>분류<\/th><th>특징<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td>절차적<\/td><td>순차적 명령과 프로시저<\/td><td>C, ALGOL, COBOL, FORTRAN, BASIC<\/td><\/tr><tr><td>객체지향<\/td><td>객체 중심, 상속·다형성<\/td><td>Java, C++, Smalltalk, C#, Python<\/td><\/tr><tr><td>스크립트<\/td><td>인터프리터로 실행, 컴파일 없이 소스 수정<\/td><td>JavaScript, Python, PHP, Perl, Bash<\/td><\/tr><tr><td>선언형 (함수·논리·특수목적)<\/td><td><strong>무엇을<\/strong> 원하는지 기술<\/td><td>Haskell, LISP(함수형), Prolog(논리형), SQL, HTML<\/td><\/tr><\/tbody><\/table><\/div><p><strong>스크립트 언어<\/strong><\/p><ul><li>서버 측: PHP, JSP, ASP, Python.<\/li><li>클라이언트 측: JavaScript.<\/li><li>장점: 빠른 수정. 단점: 실행 속도가 느림.<\/li><\/ul><p><strong>컴파일러 언어 vs 인터프리터 언어<\/strong>: C, C++, Java(바이트코드 컴파일 후 JVM 실행)는 컴파일 방식이고 Python, JavaScript는 인터프리터 방식이다.<\/p><p><strong>언어 번역 과정<\/strong>: 소스 코드 → 컴파일 → 목적 코드 → 링크 → 실행 파일 → 로드.<\/p><p><strong>객체지향 언어의 특징<\/strong>: 캡슐화, 상속, 다형성, 추상화, 정보 은닉.<\/p>","qs":[{"s":"<p>다음 중 선언형 언어에 해당하는 것은?<\/p>","c":["C","ALGOL","SQL","FORTRAN"],"a":2,"e":"<p>SQL은 결과만 선언하는 선언형 언어다. 나머지는 절차적 언어다.<\/p>"},{"s":"<p>서버 측 스크립트 언어로 볼 수 없는 것은?<\/p>","c":["PHP","C","JSP","ASP"],"a":1,"e":"<p>C는 컴파일 언어다.<\/p>"},{"s":"<p>논리형 언어에 해당하는 것은?<\/p>","c":["COBOL","Java","JavaScript","Prolog"],"a":3,"e":"<p>Prolog는 논리 프로그래밍 언어다.<\/p>"},{"s":"<p>객체지향 언어로만 묶인 것은?<\/p>","c":["Java, C++, Smalltalk","HTML, SQL, Prolog","C, COBOL, ALGOL","FORTRAN, BASIC, LISP"],"a":0,"e":"<p>Java, C++, Smalltalk는 대표적인 객체지향 언어다.<\/p>"},{"s":"<p>스크립트 언어의 특징으로 옳은 것은?<\/p>","c":["변수를 사용할 수 없다.","일반적으로 컴파일 언어보다 실행 속도가 빠르다.","별도의 컴파일 과정 없이 소스를 인터프리터로 실행한다.","항상 기계어로 컴파일한 뒤에만 실행된다."],"a":2,"e":"<p>스크립트 언어는 인터프리터 방식이라 수정이 빠르지만 실행은 느린 편이다.<\/p>"}]},{"id":"library","title":"라이브러리·입출력·예외 처리·프로토타입","freq":"표준 라이브러리 이름과 예외 처리 개념이 출제","concept":"<p><strong>라이브러리<\/strong>: 자주 쓰는 함수나 클래스를 모아 놓은 것이다. 표준 라이브러리와 외부 라이브러리로 나뉜다.<\/p><p><strong>C 표준 헤더<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>헤더<\/th><th>기능<\/th><\/tr><\/thead><tbody><tr><td><code>stdio.h<\/code><\/td><td>입출력 (printf, scanf, fopen)<\/td><\/tr><tr><td><code>stdlib.h<\/code><\/td><td>동적 메모리(malloc, free), 변환(atoi), 난수(rand)<\/td><\/tr><tr><td><code>string.h<\/code><\/td><td>문자열<\/td><\/tr><tr><td><code>math.h<\/code><\/td><td>수학 (sqrt, pow)<\/td><\/tr><tr><td><code>time.h<\/code><\/td><td>시간<\/td><\/tr><\/tbody><\/table><\/div><p><strong>Java 패키지<\/strong>: <code>java.lang<\/code>(기본, 자동 import), <code>java.util<\/code>(컬렉션), <code>java.io<\/code>(입출력), <code>java.net<\/code>(네트워크), <code>java.awt<\/code>(GUI).<\/p><p><strong>Python 라이브러리 설치<\/strong>: <code>pip<\/code>. 수치 계산 numpy, 데이터 처리 pandas.<\/p><p><strong>파일 입출력 (C)<\/strong>: <code>fopen<\/code>, <code>fclose<\/code>, <code>fprintf<\/code>, <code>fscanf<\/code>.<\/p><p><strong>입출력 스트림<\/strong>: <code>stdin<\/code>, <code>stdout<\/code>, <code>stderr<\/code>.<\/p><p><strong>예외 처리<\/strong>: 오류 발생 시 프로그램이 끝나지 않게 처리한다. C는 표준 예외 처리가 없고 오류 코드로 처리하며, Java와 Python은 try 구문을 쓴다.<\/p><p><strong>Python<\/strong>: <code>try: ... except 예외: ... finally: ...<\/code>.<\/p><p><strong>프로토타입<\/strong>: 함수를 사용하기 전에 <strong>이름·매개변수·반환형을 미리 선언<\/strong>하는 것이다. 예: <code>int add(int, int);<\/code><\/p>","qs":[{"s":"<p>C 언어에서 동적 메모리 할당 함수 malloc이 선언된 헤더는?<\/p>","c":["string.h","math.h","stdlib.h","stdio.h"],"a":2,"e":"<p>malloc과 free는 stdlib.h에 있다.<\/p>"},{"s":"<p>Java에서 별도의 import 없이 자동으로 사용 가능한 패키지는?<\/p>","c":["java.lang","java.net","java.util","java.io"],"a":0,"e":"<p>java.lang은 자동으로 import된다.<\/p>"},{"s":"<p>C 언어에서 함수의 프로토타입 선언에 해당하는 것은?<\/p>","c":["function add(int, int) {};","add = int(a, b);","#define add(int, int)","int add(int a, int b);"],"a":3,"e":"<p>반환형, 함수 이름, 매개변수 목록을 세미콜론으로 끝내 선언한다.<\/p>"},{"s":"<p>Python의 예외 처리 구문으로 옳은 것은?<\/p>","c":["try - catch","try - except","begin - rescue","if - throw"],"a":1,"e":"<p>Python은 try와 except를 사용한다.<\/p>"},{"s":"<p>다음 Python 코드의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"python\"><code>try:\n    x = int(<span class=\"ts\">\"a\"<\/span>)\n    <span class=\"tk\">print<\/span>(<span class=\"ts\">\"A\"<\/span>)\nexcept ValueError:\n    <span class=\"tk\">print<\/span>(<span class=\"ts\">\"B\"<\/span>)\nfinally:\n    <span class=\"tk\">print<\/span>(<span class=\"ts\">\"C\"<\/span>)<\/code><\/pre><p>(줄바꿈은 공백으로 표시)<\/p>","c":["A C","C","A B C","B C"],"a":3,"e":"<p>정수 변환에서 ValueError가 발생해 B를 출력하고, finally의 C를 출력한다.<\/p>"}]},{"id":"server-dev","title":"서버 개발환경·프레임워크·API·배치 프로그램","freq":"개발환경 약 10문항. 프레임워크, 배치 스케줄러, API 보안","concept":"<p><strong>서버 개발 프레임워크<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>프레임워크<\/th><th>언어<\/th><\/tr><\/thead><tbody><tr><td>Spring<\/td><td>Java<\/td><\/tr><tr><td>Node.js (Express)<\/td><td>JavaScript<\/td><\/tr><tr><td>Django, Flask<\/td><td>Python<\/td><\/tr><tr><td>Codeigniter<\/td><td>PHP<\/td><\/tr><tr><td>Ruby on Rails<\/td><td>Ruby<\/td><\/tr><\/tbody><\/table><\/div><p><strong>DTO·VO·DAO<\/strong>: DTO는 계층 간 전송 객체, VO는 값 객체, DAO는 DB 접근 객체.<\/p><p><strong>API<\/strong>: 프로그램이 다른 기능을 사용하도록 제공되는 규약이다. REST API는 HTTP 메서드와 URI로 자원을 다룬다.<\/p><div class=\"tw\"><table><thead><tr><th>메서드<\/th><th>의미<\/th><\/tr><\/thead><tbody><tr><td>GET<\/td><td>조회<\/td><\/tr><tr><td>POST<\/td><td>생성<\/td><\/tr><tr><td>PUT<\/td><td>수정<\/td><\/tr><tr><td>DELETE<\/td><td>삭제<\/td><\/tr><\/tbody><\/table><\/div><p><strong>배치 프로그램<\/strong>: 사용자 개입 없이 대량 데이터를 <strong>일괄 처리<\/strong>한다.<\/p><ul><li>필수 요소: 대용량 데이터, 자동화, 견고성, 안정성·신뢰성, 성능.<\/li><li>스케줄러: <strong>Spring Batch<\/strong>, <strong>Quartz<\/strong>, cron.<\/li><li>cron 형식: <code>분 시 일 월 요일 명령<\/code>.<\/li><\/ul><p><strong>서버 보안 취약성<\/strong>: 서버 측 검증 누락, 하드코딩된 비밀번호, 인증 없는 API, 민감 정보 로그 출력.<\/p><p><strong>개발환경 구성<\/strong>: 하드웨어(서버 사양), 소프트웨어(OS, 미들웨어, 빌드 도구).<\/p>","qs":[{"s":"<p>Python으로 작성된 서버 개발 프레임워크는?<\/p>","c":["Django","Express","Codeigniter","Spring"],"a":0,"e":"<p>Django와 Flask가 Python 프레임워크다.<\/p>"},{"s":"<p>야간 정산 배치 프로그램을 설계할 때 갖출 필요가 없는 특성은?<\/p>","c":["정해진 시각의 자동 실행","많은 건수의 일괄 처리","화면에서 입력을 받아 즉시 응답","오류 시 복구 가능한 안정성"],"a":2,"e":"<p>배치는 사용자 개입 없이 일괄 처리하므로 실시간 입력 처리와 거리가 멀다.<\/p>"},{"s":"<p>Java 기반의 대표적인 배치 작업 스케줄러는?<\/p>","c":["Git","Maven","JUnit","Quartz"],"a":3,"e":"<p>Quartz는 작업 스케줄링 라이브러리이다.<\/p>"},{"s":"<p>REST API에서 자원의 조회에 사용하는 HTTP 메서드는?<\/p>","c":["POST","GET","PUT","DELETE"],"a":1,"e":"<p>조회는 GET을 사용한다.<\/p>"},{"s":"<p>계층 간에 데이터를 전달하기 위해 사용하는 객체는?<\/p>","c":["SDK","DTO","URI","DBMS"],"a":1,"e":"<p>DTO(Data Transfer Object)는 계층 간 데이터 전달용 객체다.<\/p>"}]},{"id":"os-kinds","title":"운영체제 종류·기능·환경변수","freq":"운영체제 목적과 UNIX·Windows 특성이 출제","concept":"<p><strong>운영체제의 성능 기준<\/strong>: 처리 능력, 응답 시간(반환 시간), 사용 가능도, 신뢰도.<\/p><div class=\"tw\"><table><thead><tr><th>운영체제<\/th><th>특징<\/th><\/tr><\/thead><tbody><tr><td>Windows<\/td><td>GUI, 선점형 멀티태스킹, Plug &amp; Play, OLE<\/td><\/tr><tr><td>UNIX<\/td><td><strong>C 언어로 작성<\/strong>, 이식성 높음, 다중 사용자·다중 작업, 트리 구조 파일 시스템<\/td><\/tr><tr><td>Linux<\/td><td>오픈 소스 UNIX 호환<\/td><\/tr><tr><td>Android<\/td><td>Linux 커널 기반 모바일<\/td><\/tr><tr><td>iOS<\/td><td>애플 모바일<\/td><\/tr><\/tbody><\/table><\/div><p><strong>UNIX 구성<\/strong><\/p><ul><li>커널: 하드웨어 보호, 프로세스·메모리 관리.<\/li><li>쉘: 명령어 해석기.<\/li><li>유틸리티.<\/li><\/ul><p><strong>다중 사용자 (Multi-User)<\/strong>: 여러 사용자가 동시에 사용. <strong>다중 작업 (Multi-Tasking)<\/strong>: 여러 작업을 동시에 실행.<\/p><p><strong>환경 변수<\/strong>: 운영체제가 사용하는 동적인 값이다. 쉘에서 <code>set<\/code>, <code>env<\/code>, <code>export<\/code>로 확인·설정한다.<\/p><div class=\"tw\"><table><thead><tr><th>변수 (UNIX)<\/th><th>의미<\/th><\/tr><\/thead><tbody><tr><td><code>$PATH<\/code><\/td><td>명령 검색 경로<\/td><\/tr><tr><td><code>$HOME<\/code><\/td><td>홈 디렉터리<\/td><\/tr><tr><td><code>$USER<\/code><\/td><td>사용자 이름<\/td><\/tr><tr><td><code>$SHELL<\/code><\/td><td>쉘<\/td><\/tr><\/tbody><\/table><\/div><p>Windows는 <code>%PATH%<\/code>처럼 쓰고 <code>set<\/code> 명령으로 확인한다.<\/p><p><strong>운영체제의 관리 대상<\/strong>: 프로세스, 메모리, 파일, 입출력 장치.<\/p>","qs":[{"s":"<p>UNIX의 특징으로 틀린 것은?<\/p>","c":["대부분 C 언어로 작성되어 이식성이 높다.","단일 사용자만 지원하는 운영체제이다.","트리 구조의 파일 시스템을 갖는다.","다중 작업을 지원한다."],"a":1,"e":"<p>UNIX는 다중 사용자, 다중 작업 운영체제다.<\/p>"},{"s":"<p>UNIX에서 명령어를 해석하여 커널에 전달하는 구성 요소는?<\/p>","c":["드라이버","커널","유틸리티","쉘"],"a":3,"e":"<p>쉘은 명령어 해석기다.<\/p>"},{"s":"<p>운영체제 평가 기준이 아닌 것은?<\/p>","c":["신뢰도","응답 시간","정보 은닉","처리 능력"],"a":2,"e":"<p>운영체제의 성능 평가 기준은 처리 능력, 응답 시간, 사용 가능도, 신뢰도다.<\/p>"},{"s":"<p>UNIX 계열에서 실행 파일을 찾는 경로를 담고 있는 환경 변수는?<\/p>","c":["$PATH","$USER","$PWD","$HOME"],"a":0,"e":"<p>PATH는 실행 파일 검색 경로다.<\/p>"},{"s":"<p>Windows에서 현재 환경 변수를 표시하는 명령은?<\/p>","c":["env","pwd","set","grep"],"a":2,"e":"<p>Windows에서 <code>set<\/code>은 환경 변수를 표시한다.<\/p>"}]},{"id":"memory","title":"기억장치 관리: 배치·페이징·세그먼테이션","freq":"메모리·페이지 약 12문항. 배치 전략과 내부·외부 단편화가 반복","concept":"<p><strong>배치 전략<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>전략<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>First Fit<\/td><td>처음 만난 들어갈 수 있는 공간<\/td><\/tr><tr><td>Best Fit<\/td><td>단편화가 <strong>가장 적게<\/strong> 남는 공간 (빈 공간이 가장 작음)<\/td><\/tr><tr><td>Worst Fit<\/td><td>단편화가 <strong>가장 많이<\/strong> 남는 공간<\/td><\/tr><\/tbody><\/table><\/div><p><strong>단편화<\/strong><\/p><ul><li>내부 단편화: 분할된 영역이 프로세스보다 커서 남는 공간. 페이징에서 발생.<\/li><li>외부 단편화: 프로세스보다 작아 못 쓰는 공간. 세그먼테이션에서 발생.<\/li><\/ul><p><strong>단편화 해결<\/strong>: 통합(Coalescing), 압축(Compaction).<\/p><p><strong>가상 기억장치<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>기법<\/th><th>특징<\/th><\/tr><\/thead><tbody><tr><td>페이징<\/td><td>고정 크기로 분할, 내부 단편화<\/td><\/tr><tr><td>세그먼테이션<\/td><td>논리 단위 가변 크기, 외부 단편화<\/td><\/tr><\/tbody><\/table><\/div><p><strong>세그먼트 주소 변환<\/strong>: 물리 주소 = 세그먼트 시작 주소 + 오프셋.<\/p><p><strong>페이지 크기<\/strong>: 작으면 내부 단편화 감소, 페이지 테이블 증가. 크면 입출력 시간 단축.<\/p><p><strong>구역성(지역성, Locality)<\/strong>: 시간 구역성(최근 참조), 공간 구역성(인접 참조).<\/p><p><strong>워킹 셋<\/strong>: 프로세스가 일정 시간 자주 참조하는 페이지 집합.<\/p><p><strong>스래싱(Thrashing, 스레싱)<\/strong>: 페이지 교체가 너무 잦아 CPU 이용률이 떨어지는 현상. 다중 프로그래밍 정도가 너무 높을 때 발생한다.<\/p><p><strong>TLB<\/strong>: 페이지 테이블의 캐시 기억장치.<\/p>","qs":[{"s":"<p>빈 블록 크기가 차례로 <code>30K, 12K, 50K, 20K<\/code>이고 17K를 요청할 때, Best Fit으로 배치되는 블록의 순번은?<\/p>","c":["1번째","2번째","3번째","4번째"],"a":3,"e":"<p>17K 이상인 블록 중 가장 작은 20K를 선택한다.<\/p>"},{"s":"<p>빈 블록 크기가 차례로 <code>30K, 12K, 50K, 20K<\/code>이고 17K를 요청할 때, Worst Fit으로 배치되는 블록의 순번은?<\/p>","c":["1번째","2번째","3번째","4번째"],"a":2,"e":"<p>가장 큰 50K를 선택한다.<\/p>"},{"s":"<p>페이지 교체가 너무 자주 일어나 CPU 이용률이 떨어지는 현상은?<\/p>","c":["워킹 셋","버퍼링","스래싱","구역성"],"a":2,"e":"<p>스래싱의 정의다.<\/p>"},{"s":"<p>세그먼트 2의 시작 주소가 2200이고 오프셋이 176일 때 물리 주소는?<\/p>","c":["2024","2176","2276","2376"],"a":3,"e":"<p>시작 주소에 오프셋을 더해 2376이다.<\/p>"},{"s":"<p>페이징 기법에 대한 설명으로 옳은 것은?<\/p>","c":["페이지 크기가 클수록 페이지 테이블이 커진다.","고정 크기 단위로 나누며 내부 단편화가 발생할 수 있다.","논리적 의미 단위로 프로그램을 나눈다.","가변 크기 단위로 나누며 외부 단편화가 발생한다."],"a":1,"e":"<p>페이징은 고정 크기이고 내부 단편화가 있다. 가변 크기와 외부 단편화는 세그먼테이션의 특징이다. 페이지 크기가 작을수록 페이지 테이블이 커진다.<\/p>"}]},{"id":"page-replace","title":"페이지 교체 알고리즘","freq":"페이지 부재 횟수 계산 문항이 대표. 2027 메모리 관리 범위","concept":"<div class=\"tw\"><table><thead><tr><th>알고리즘<\/th><th>교체 대상<\/th><\/tr><\/thead><tbody><tr><td>OPT<\/td><td>앞으로 <strong>가장 오래 쓰이지 않을<\/strong> 페이지<\/td><\/tr><tr><td>FIFO<\/td><td>가장 <strong>먼저<\/strong> 들어온 페이지<\/td><\/tr><tr><td>LRU<\/td><td>가장 <strong>오래 전에 사용<\/strong>한 페이지<\/td><\/tr><tr><td>LFU<\/td><td>사용 <strong>빈도가 가장 적은<\/strong> 페이지<\/td><\/tr><tr><td>NUR<\/td><td>최근 사용되지 않은 페이지 (참조·변형 비트)<\/td><\/tr><tr><td>SCR<\/td><td>FIFO의 개선 (2차 기회)<\/td><\/tr><\/tbody><\/table><\/div><p><strong>푸는 법<\/strong>: 프레임 표를 그리고, 참조 페이지가 없으면 부재(Fault)를 센다. 프레임이 빈 초기 적재도 부재에 포함한다.<\/p><p><strong>Belady의 모순<\/strong>: 대표적으로 FIFO에서 프레임을 늘렸는데 부재가 증가하는 현상. LRU·OPT에서는 일어나지 않는다.<\/p><p><strong>페이지 부재율<\/strong>: 부재 횟수 ÷ 전체 참조 횟수.<\/p>","qs":[{"s":"<p>3개의 프레임이 비어 있고 참조열이 <code>1, 2, 3, 2, 4, 1, 5<\/code>일 때 FIFO의 페이지 부재 횟수는?<\/p>","c":["4회","5회","6회","7회"],"a":2,"e":"<p>1, 2, 3 적재(3회). 2는 적중. 4는 1을 교체, 1은 2를 교체, 5는 3을 교체해 총 6회다.<\/p>"},{"s":"<p>3개의 프레임이 비어 있고 참조열이 <code>1, 2, 3, 1, 4, 2, 1<\/code>일 때 LRU의 페이지 부재 횟수는?<\/p>","c":["4회","5회","6회","7회"],"a":1,"e":"<p>1, 2, 3 적재 후 1 적중. 4는 가장 오래된 2를 교체, 2는 3을 교체, 1은 적중이라 5회다.<\/p>"},{"s":"<p>4개의 프레임이 비어 있고 참조열이 <code>1, 2, 3, 1, 2, 4, 1, 5<\/code>일 때 FIFO의 페이지 부재 횟수는?<\/p>","c":["4회","5회","6회","7회"],"a":1,"e":"<p>1, 2, 3, 4의 적재로 4회, 5에서 1을 교체해 총 5회다. 1과 2의 재참조는 적중이다.<\/p>"},{"s":"<p>프레임을 늘렸는데 페이지 부재가 오히려 늘어나는 Belady의 모순의 대표적인 예로 꼽히는 알고리즘은?<\/p>","c":["FIFO","LFU","OPT","LRU"],"a":0,"e":"<p>Belady의 모순은 FIFO에서 나타난다.<\/p>"},{"s":"<p>앞으로 가장 오랫동안 사용하지 않을 페이지를 교체하는 이론적으로 최적인 알고리즘은?<\/p>","c":["SCR","OPT","NUR","LRU"],"a":1,"e":"<p>OPT는 부재 횟수가 가장 적지만 미래를 알 수 없어 구현하기 어렵다.<\/p>"}]},{"id":"scheduling","title":"프로세스 스케줄링","freq":"스케줄링 약 6문항. 평균 대기 시간과 HRN 우선순위 계산이 반복","concept":"<div class=\"tw\"><table><thead><tr><th>분류<\/th><th>기법<\/th><\/tr><\/thead><tbody><tr><td>비선점<\/td><td>FCFS(FIFO), SJF, HRN, 우선순위, 기한부<\/td><\/tr><tr><td>선점<\/td><td>RR, SRT, MLQ, MLFQ<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tw\"><table><thead><tr><th>기법<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>FCFS<\/td><td>도착 순서<\/td><\/tr><tr><td>SJF<\/td><td>실행 시간이 <strong>가장 짧은<\/strong> 작업 먼저<\/td><\/tr><tr><td>HRN<\/td><td><code>(대기 시간 + 서비스 시간) ÷ 서비스 시간<\/code>이 <strong>큰<\/strong> 작업 먼저<\/td><\/tr><tr><td>RR<\/td><td>시간 할당량(Time Slice)만큼 돌아가며 실행<\/td><\/tr><tr><td>SRT<\/td><td>남은 시간이 가장 짧은 작업 먼저 (선점)<\/td><\/tr><tr><td>MLQ<\/td><td>여러 큐로 분류, 큐 사이 이동 없음<\/td><\/tr><tr><td>MLFQ<\/td><td>큐 사이 이동 가능<\/td><\/tr><\/tbody><\/table><\/div><p><strong>대기 시간<\/strong> = 시작 시각 − 도착 시각(비선점 기준).<br><strong>반환 시간<\/strong> = 종료 시각 − 도착 시각 = 대기 시간 + 실행 시간.<\/p><p><strong>SJF의 단점<\/strong>: 긴 작업이 계속 밀리는 <strong>기아(Starvation)<\/strong>. 해결: <strong>에이징(Aging)<\/strong>.<\/p><p><strong>HRN<\/strong>은 SJF의 기아 문제를 보완한다.<\/p>","qs":[{"s":"<p>다음 작업을 FCFS로 처리할 때 평균 대기 시간은?<\/p><div class=\"tw\"><table><thead><tr><th>작업<\/th><th>도착 시간<\/th><th>실행 시간<\/th><\/tr><\/thead><tbody><tr><td>A<\/td><td>0<\/td><td>6<\/td><\/tr><tr><td>B<\/td><td>1<\/td><td>3<\/td><\/tr><tr><td>C<\/td><td>2<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div>","c":["3","4","5","6"],"a":1,"e":"<p>A는 0, B는 5, C는 7을 기다린다. 12 ÷ 3 = 4다.<\/p>"},{"s":"<p>다음 작업을 비선점 SJF로 처리할 때 평균 대기 시간은?<\/p><div class=\"tw\"><table><thead><tr><th>작업<\/th><th>도착 시간<\/th><th>실행 시간<\/th><\/tr><\/thead><tbody><tr><td>A<\/td><td>0<\/td><td>6<\/td><\/tr><tr><td>B<\/td><td>1<\/td><td>3<\/td><\/tr><tr><td>C<\/td><td>2<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div>","c":["2","3.33","4","5"],"a":1,"e":"<p>A(0~6) 다음 C(6~7), B(7~10) 순서다. 대기 시간은 A 0, C 4, B 6이고 평균은 10 ÷ 3 = 약 3.33이다.<\/p>"},{"s":"<p>대기 시간 20, 서비스 시간 5인 작업의 HRN 우선순위 값은?<\/p>","c":["4","5","25","100"],"a":1,"e":"<p>(20 + 5) ÷ 5 = 5다.<\/p>"},{"s":"<p>비선점 스케줄링 기법은?<\/p>","c":["MLFQ","RR","SRT","HRN"],"a":3,"e":"<p>HRN, FCFS, SJF는 비선점이다. RR, SRT, MLFQ는 선점이다.<\/p>"},{"s":"<p>오래 기다린 프로세스의 우선순위를 높여 기아 현상을 막는 기법은?<\/p>","c":["스왑핑","에이징","폴링","페이징"],"a":1,"e":"<p>에이징은 대기 시간에 따라 우선순위를 올린다.<\/p>"}]},{"id":"process","title":"프로세스·스레드·교착 상태","freq":"프로세스·교착 약 20문항. 상태 전이와 교착 4조건이 반복","concept":"<p><strong>프로세스 상태<\/strong>: 생성, 준비, 실행, 대기, 종료 (전이는 아래 표)<\/p><div class=\"tw\"><table><thead><tr><th>전이<\/th><th>의미<\/th><\/tr><\/thead><tbody><tr><td>Dispatch<\/td><td>준비 → 실행<\/td><\/tr><tr><td>Timer Run Out<\/td><td>실행 → 준비<\/td><\/tr><tr><td>Block<\/td><td>실행 → 대기<\/td><\/tr><tr><td>Wake Up<\/td><td>대기 → 준비<\/td><\/tr><\/tbody><\/table><\/div><p><strong>PCB<\/strong>: 프로세스 ID, 상태, 레지스터, 스케줄링 정보, 메모리 정보 등을 저장한다.<\/p><p><strong>스레드<\/strong>: 프로세스 내 실행 단위이며 자원을 공유한다. 문맥 교환 비용이 적다.<\/p><ul><li>사용자 수준 스레드: 커널 개입 없이 <strong>빠르게 전환<\/strong>.<\/li><li>커널 수준 스레드: 한 스레드가 대기해도 다른 스레드가 실행 가능.<\/li><\/ul><p><strong>문맥 교환<\/strong>: 실행 중인 프로세스의 상태를 저장하고 다른 프로세스 상태를 복구한다.<\/p><p><strong>교착 상태 4조건<\/strong>: 상호 배제, 점유와 대기, 비선점, 환형 대기. 하나만 깨면 교착이 일어나지 않는다.<\/p><div class=\"tw\"><table><thead><tr><th>해결<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>예방<\/td><td>4조건 중 하나 제거<\/td><\/tr><tr><td>회피<\/td><td>은행원 알고리즘<\/td><\/tr><tr><td>발견<\/td><td>교착 탐지<\/td><\/tr><tr><td>복구<\/td><td>프로세스 종료·자원 선점<\/td><\/tr><\/tbody><\/table><\/div><p><strong>상호 배제 기법<\/strong>: 세마포어(P, V 연산), 모니터, 데커(Dekker) 알고리즘.<\/p>","qs":[{"s":"<p>프로세스가 준비 상태에서 CPU를 할당받아 실행 상태로 바뀌는 전이는?<\/p>","c":["Timer Run Out","Block","Dispatch","Wake Up"],"a":2,"e":"<p>Dispatch는 준비에서 실행으로의 전이다.<\/p>"},{"s":"<p>교착 상태의 필요 조건이 아닌 것은?<\/p>","c":["상호 배제","선점","환형 대기","점유와 대기"],"a":1,"e":"<p>필요 조건은 상호 배제, 점유와 대기, 비선점, 환형 대기다.<\/p>"},{"s":"<p>교착 상태 회피 기법으로 유명한 알고리즘은?<\/p>","c":["은행원 알고리즘","버블 정렬","FIFO 알고리즘","Prim 알고리즘"],"a":0,"e":"<p>은행원 알고리즘은 안전 상태를 유지하며 자원을 할당한다.<\/p>"},{"s":"<p>사용자 수준 스레드의 장점으로 옳은 것은?<\/p>","c":["한 스레드가 입출력으로 대기해도 같은 프로세스의 다른 스레드가 언제나 실행된다.","여러 프로세서에 자동으로 분산된다.","운영체제가 개별 스레드를 직접 스케줄링한다.","커널 개입 없이 스레드 전환이 빠르다."],"a":3,"e":"<p>사용자 수준 스레드는 전환이 빠르지만 대기 시 전체 프로세스가 멈출 수 있다.<\/p>"},{"s":"<p>세마포어의 연산에 해당하는 것은?<\/p>","c":["P와 V","send와 ack","push와 pop","get과 set"],"a":0,"e":"<p>세마포어는 P(대기)와 V(신호) 연산을 사용한다.<\/p>"}]},{"id":"shell","title":"UNIX 명령어와 쉘 스크립트","freq":"쉘·UNIX 약 14문항. 명령어 이름과 chmod가 반복","concept":"<div class=\"tw\"><table><thead><tr><th>명령<\/th><th>기능<\/th><\/tr><\/thead><tbody><tr><td><code>ls<\/code><\/td><td>목록<\/td><\/tr><tr><td><code>cd<\/code> / <code>pwd<\/code><\/td><td>이동 / 현재 경로<\/td><\/tr><tr><td><code>cp<\/code> / <code>mv<\/code> / <code>rm<\/code><\/td><td>복사 / 이동·이름 변경 / 삭제<\/td><\/tr><tr><td><code>mkdir<\/code> / <code>rmdir<\/code><\/td><td>디렉터리 생성 / 삭제<\/td><\/tr><tr><td><code>cat<\/code><\/td><td>내용 출력<\/td><\/tr><tr><td><code>chmod<\/code><\/td><td>권한 변경<\/td><\/tr><tr><td><code>chown<\/code><\/td><td>소유자 변경<\/td><\/tr><tr><td><code>grep<\/code><\/td><td>문자열 패턴 검색<\/td><\/tr><tr><td><code>ps<\/code> / <code>kill<\/code><\/td><td>프로세스 확인 / 종료<\/td><\/tr><tr><td><code>fork<\/code><\/td><td>프로세스 복제 (시스템 호출)<\/td><\/tr><\/tbody><\/table><\/div><p><strong>권한<\/strong>: <code>r=4, w=2, x=1<\/code>을 더해 소유자·그룹·기타 순서. <code>chmod 754 파일<\/code> → <code>rwxr-xr--<\/code>.<\/p><p><strong>umask<\/strong>: 기본 권한에서 뺄 값. 파일 기본값 666, 디렉터리 777에서 umask를 뺀다.<\/p><p><strong>쉘 스크립트<\/strong><\/p><pre class=\"code\" data-lang=\"\"><code>for i in 1 2 3; do echo $i; done\nif [ $a -gt 1 ]; then ...; fi<\/code><\/pre><p><strong>비교<\/strong>: <code>-eq<\/code>, <code>-ne<\/code>, <code>-gt<\/code>, <code>-lt<\/code>, <code>-ge<\/code>, <code>-le<\/code>.<\/p><p><strong>특수 변수<\/strong>: <code>$0<\/code>(스크립트 이름), <code>$1<\/code>(첫 인자), <code>$#<\/code>(인자 수), <code>$?<\/code>(직전 종료 코드).<\/p><p><strong>Windows<\/strong>: <code>dir<\/code>(목록), <code>copy<\/code>, <code>move<\/code>, <code>del<\/code>, <code>cls<\/code>(화면 지움), <code>attrib<\/code>(속성), <code>ver<\/code>(버전).<\/p>","qs":[{"s":"<p>권한 <code>rwxr-x--x<\/code>를 8진수로 나타내면?<\/p>","c":["651","741","751","754"],"a":2,"e":"<p>rwx는 7, r-x는 5, --x는 1이다.<\/p>"},{"s":"<p>UNIX에서 파일의 권한을 변경하는 명령어는?<\/p>","c":["cat","ps","chmod","chown"],"a":2,"e":"<p>권한 변경은 chmod, 소유자 변경은 chown이다.<\/p>"},{"s":"<p>다음 쉘 스크립트의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"bash\"><code>s=0\n<span class=\"tk\">for<\/span> i <span class=\"tk\">in<\/span> 1 2 3 4; <span class=\"tk\">do<\/span>\n  <span class=\"tk\">if<\/span> [ $i -gt 2 ]; <span class=\"tk\">then<\/span>\n    s=$((s+i))\n  <span class=\"tk\">fi<\/span>\n<span class=\"tk\">done<\/span>\n<span class=\"tk\">echo<\/span> $s<\/code><\/pre>","c":["3","4","7","10"],"a":2,"e":"<p>3과 4만 더해 7이다.<\/p>"},{"s":"<p>UNIX에서 현재 실행 중인 프로세스 목록을 확인하는 명령은?<\/p>","c":["ps","kill","ls","mv"],"a":0,"e":"<p>ps는 프로세스 상태를 표시한다.<\/p>"},{"s":"<p>umask가 022일 때 새로 만든 일반 파일의 기본 권한은? (파일의 기본값은 666이다)<\/p>","c":["622","644","666","755"],"a":1,"e":"<p>666에서 022를 빼면 644다.<\/p>"}]},{"id":"osi","title":"OSI 7계층과 네트워크 장비","freq":"OSI 약 12문항. 계층 기능과 장비 대응이 반복","concept":"<div class=\"tw\"><table><thead><tr><th>계층<\/th><th>이름<\/th><th>기능<\/th><th>장비·프로토콜<\/th><\/tr><\/thead><tbody><tr><td>7<\/td><td>응용<\/td><td>사용자 서비스<\/td><td>HTTP, FTP, SMTP, DNS, TELNET<\/td><\/tr><tr><td>6<\/td><td>표현<\/td><td>코드 변환, 암호화, 압축<\/td><td>JPEG, MPEG<\/td><\/tr><tr><td>5<\/td><td>세션<\/td><td>대화 제어, 동기화<\/td><td>NetBIOS, RPC<\/td><\/tr><tr><td>4<\/td><td>전송<\/td><td>종단 간 신뢰성, 흐름 제어<\/td><td>TCP, UDP<\/td><\/tr><tr><td>3<\/td><td>네트워크<\/td><td><strong>라우팅<\/strong>, 경로 선택<\/td><td>IP, ICMP, 라우터<\/td><\/tr><tr><td>2<\/td><td>데이터 링크<\/td><td>인접 노드 전송, 오류 제어<\/td><td>스위치, 브리지, MAC, HDLC<\/td><\/tr><tr><td>1<\/td><td>물리<\/td><td>비트 전송<\/td><td>리피터, 허브<\/td><\/tr><\/tbody><\/table><\/div><p><strong>HDLC 프레임 / 오류 제어 ARQ<\/strong>: Stop-and-Wait, Go-Back-N, Selective-Repeat, Adaptive ARQ.<\/p><p><strong>데이터 단위<\/strong>: 물리-비트, 링크-프레임, 네트워크-패킷, 전송-세그먼트, 상위-메시지(데이터).<\/p><p><strong>전송 매체 접근<\/strong>: CSMA/CD(유선 충돌 감지), CSMA/CA(무선 충돌 회피).<\/p><p><strong>라우팅 프로토콜<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>프로토콜<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>RIP<\/td><td>거리 벡터, 벨만-포드, <strong>홉 수 15<\/strong> 제한<\/td><\/tr><tr><td>OSPF<\/td><td>링크 상태, 다익스트라, 대규모<\/td><\/tr><tr><td>BGP<\/td><td>AS 간 경로<\/td><\/tr><\/tbody><\/table><\/div><p>IGP는 AS 내부(RIP, OSPF), EGP는 AS 간(BGP)이다.<\/p>","qs":[{"s":"<p>OSI 계층 중 경로 설정(라우팅)을 담당하는 계층은?<\/p>","c":["전송 계층","표현 계층","네트워크 계층","데이터 링크 계층"],"a":2,"e":"<p>라우팅은 네트워크 계층이 담당한다.<\/p>"},{"s":"<p>코드 변환, 암호화, 압축을 담당하는 계층은?<\/p>","c":["세션 계층","응용 계층","물리 계층","표현 계층"],"a":3,"e":"<p>표현 계층의 기능이다.<\/p>"},{"s":"<p>데이터 링크 계층의 장비는?<\/p>","c":["스위치","리피터","게이트웨이","라우터"],"a":0,"e":"<p>스위치와 브리지는 데이터 링크 계층에서 동작한다.<\/p>"},{"s":"<p>오류 제어 ARQ 방식이 아닌 것은?<\/p>","c":["Go-Back-N ARQ","Token Ring ARQ","Stop-and-Wait ARQ","Selective-Repeat ARQ"],"a":1,"e":"<p>Token Ring은 LAN 접근 제어 방식이다.<\/p>"},{"s":"<p>사내 망에 RIP를 적용할 때의 특징으로 잘못 설명한 것은?<\/p>","c":["최대 홉 수는 15이다.","최단 경로 계산에 다익스트라 알고리즘을 사용한다.","거리 벡터 방식이다.","홉 수를 메트릭으로 사용한다."],"a":1,"e":"<p>RIP는 벨만-포드 알고리즘을 사용한다. 다익스트라는 OSPF가 사용한다.<\/p>"}]},{"id":"ip-subnet","title":"IP와 서브넷","freq":"IP·서브넷 약 11문항. 호스트 수와 네트워크 주소 계산이 반복","concept":"<div class=\"tw\"><table><thead><tr><th>클래스<\/th><th>첫 옥텟<\/th><th>기본 마스크<\/th><\/tr><\/thead><tbody><tr><td>A<\/td><td>1~126<\/td><td>/8<\/td><\/tr><tr><td>B<\/td><td>128~191<\/td><td>/16<\/td><\/tr><tr><td>C<\/td><td>192~223<\/td><td>/24<\/td><\/tr><tr><td>D<\/td><td>224~239<\/td><td>멀티캐스트<\/td><\/tr><tr><td>E<\/td><td>240~255<\/td><td>연구용<\/td><\/tr><\/tbody><\/table><\/div><p><strong>계산 공식<\/strong><\/p><ul><li>서브넷 마스크 <code>/n<\/code>: 앞의 n비트가 1.<\/li><li>호스트 수 = <code>2^(32−n) − 2<\/code> (네트워크·브로드캐스트 주소 제외).<\/li><li>블록 크기 = <code>256 − 마스크 마지막 옥텟 값<\/code>.<\/li><\/ul><div class=\"tw\"><table><thead><tr><th>프리픽스<\/th><th>마스크<\/th><th>블록 크기<\/th><th>사용 가능 호스트<\/th><\/tr><\/thead><tbody><tr><td>/24<\/td><td>255.255.255.0<\/td><td>256<\/td><td>254<\/td><\/tr><tr><td>/25<\/td><td>255.255.255.128<\/td><td>128<\/td><td>126<\/td><\/tr><tr><td>/26<\/td><td>255.255.255.192<\/td><td>64<\/td><td>62<\/td><\/tr><tr><td>/27<\/td><td>255.255.255.224<\/td><td>32<\/td><td>30<\/td><\/tr><tr><td>/28<\/td><td>255.255.255.240<\/td><td>16<\/td><td>14<\/td><\/tr><\/tbody><\/table><\/div><p><strong>네트워크 주소<\/strong>: 블록 크기의 배수 중 해당 값 이하의 최댓값. <strong>브로드캐스트<\/strong>는 다음 네트워크 주소 − 1.<\/p><p><strong>IPv4<\/strong>: 32비트. <strong>IPv6<\/strong>: 128비트, 16비트씩 8개 블록을 16진수로 표기, 패킷 크기 제한 완화, 자동 구성, 보안(IPsec) 기본 지원.<\/p><p><strong>IPv6 주소 종류<\/strong>: 유니캐스트, 멀티캐스트, 애니캐스트 (브로드캐스트 없음).<\/p><p><strong>IPv4 헤더<\/strong>: Version, Header Length, Packet Length, TTL 등.<\/p><p><strong>사설 IP<\/strong>: 10.x, 172.16~31.x, 192.168.x. <strong>NAT<\/strong>는 사설 IP를 공인 IP로 변환한다.<\/p>","qs":[{"s":"<p>서브넷 마스크가 /26일 때 하나의 서브넷에서 사용 가능한 호스트 수는?<\/p>","c":["30","62","64","126"],"a":1,"e":"<p>2^6 − 2 = 62다.<\/p>"},{"s":"<p><code>192.168.10.130/27<\/code>이 속한 서브넷의 네트워크 주소는?<\/p>","c":["192.168.10.128","192.168.10.130","192.168.10.96","192.168.10.0"],"a":0,"e":"<p>/27의 블록 크기는 32이고, 130보다 작거나 같은 32의 배수는 128이다.<\/p>"},{"s":"<p><code>/28<\/code>의 서브넷 마스크는?<\/p>","c":["255.255.255.248","255.255.255.192","255.255.255.224","255.255.255.240"],"a":3,"e":"<p>마지막 옥텟의 앞 4비트가 1이므로 240이다.<\/p>"},{"s":"<p>IPv6 주소의 길이는?<\/p>","c":["32비트","64비트","128비트","256비트"],"a":2,"e":"<p>IPv6는 128비트, IPv4는 32비트다.<\/p>"},{"s":"<p>IPv6에 대한 설명으로 틀린 것은?<\/p>","c":["주소 길이가 128비트이다.","IPsec을 기본으로 지원하도록 설계되었다.","브로드캐스트 주소가 기본으로 정의되어 있다.","자동 구성 기능을 지원한다."],"a":2,"e":"<p>IPv6에는 브로드캐스트가 없고 유니캐스트, 멀티캐스트, 애니캐스트가 있다.<\/p>"}]},{"id":"tcp-udp","title":"TCP·UDP와 응용 프로토콜","freq":"프로토콜 약 21문항. TCP와 UDP 비교, ARP·ICMP 구분이 반복","concept":"<div class=\"tw\"><table><thead><tr><th>특징<\/th><th>TCP<\/th><th>UDP<\/th><\/tr><\/thead><tbody><tr><td>연결<\/td><td>연결형<\/td><td>비연결형<\/td><\/tr><tr><td>신뢰성<\/td><td>신뢰성 있음 (확인 응답·재전송)<\/td><td>없음<\/td><\/tr><tr><td>순서 보장<\/td><td>보장<\/td><td>보장 안 함<\/td><\/tr><tr><td>흐름 제어<\/td><td>있음 (슬라이딩 윈도우)<\/td><td>없음<\/td><\/tr><tr><td>속도<\/td><td>상대적으로 느림<\/td><td>빠름<\/td><\/tr><tr><td>헤더<\/td><td>20~60바이트<\/td><td>8바이트<\/td><\/tr><tr><td>용도<\/td><td>웹, 메일, 파일<\/td><td>스트리밍, DNS 조회<\/td><\/tr><\/tbody><\/table><\/div><p><strong>3-Way Handshake<\/strong>: SYN → SYN+ACK → ACK.<\/p><p><strong>IP의 특징<\/strong>: 비연결형, Best Effort, 패킷의 분할·병합, 헤더 체크섬.<\/p><div class=\"tw\"><table><thead><tr><th>프로토콜<\/th><th>기능<\/th><\/tr><\/thead><tbody><tr><td>ARP<\/td><td>IP → <strong>MAC<\/strong><\/td><\/tr><tr><td>RARP<\/td><td>MAC → IP<\/td><\/tr><tr><td>ICMP<\/td><td>오류 메시지·진단 (ping)<\/td><\/tr><tr><td>IGMP<\/td><td>멀티캐스트 그룹 관리<\/td><\/tr><tr><td>DHCP<\/td><td>IP 자동 할당<\/td><\/tr><tr><td>DNS<\/td><td>도메인 → IP<\/td><\/tr><\/tbody><\/table><\/div><p><strong>포트 번호<\/strong>: HTTP 80, HTTPS 443, FTP 21, SSH 22, TELNET 23, SMTP 25, DNS 53.<\/p><p><strong>TCP 혼잡 제어<\/strong>: 슬로 스타트, 혼잡 회피.<\/p><p><strong>TCP/IP 4계층<\/strong>: 네트워크 인터페이스, 인터넷, 전송, 응용.<\/p>","qs":[{"s":"<p>UDP의 특징으로 틀린 것은?<\/p>","c":["연결을 설정하여 데이터의 순서와 전달을 보장한다.","실시간 전송에 많이 쓰인다.","TCP보다 헤더가 단순하다.","비연결형 서비스를 제공한다."],"a":0,"e":"<p>연결 설정과 순서·전달 보장은 TCP의 특징이다.<\/p>"},{"s":"<p>TCP에서 슬라이딩 윈도우로 수행하는 기능은?<\/p>","c":["이름 해석","경로 선택","흐름 제어","주소 변환"],"a":2,"e":"<p>슬라이딩 윈도우는 흐름 제어에 쓰인다.<\/p>"},{"s":"<p>같은 LAN에서 목적지 IP는 알지만 프레임에 적을 하드웨어 주소를 모를 때 쓰는 프로토콜은?<\/p>","c":["DNS","ARP","ICMP","RARP"],"a":1,"e":"<p>ARP는 IP에서 MAC을, RARP는 MAC에서 IP를 구한다.<\/p>"},{"s":"<p>IP의 특징에 해당하지 않는 것은?<\/p>","c":["Best Effort 방식이다.","패킷의 분할과 병합을 수행한다.","비연결형 서비스를 제공한다.","데이터 체크섬으로 페이로드 전체의 오류를 검사한다."],"a":3,"e":"<p>IPv4 헤더 체크섬은 헤더만 검사하며, 데이터 전체를 검사하지 않는다.<\/p>"},{"s":"<p>HTTPS의 기본 포트 번호는?<\/p>","c":["21","25","80","443"],"a":3,"e":"<p>HTTPS는 443, HTTP는 80, SMTP는 25, FTP는 21이다.<\/p>"}]},{"id":"webdb-env","title":"기본 개발환경: 웹 서버·DB 서버·패키지","freq":"2027 출제기준 \"기본 개발환경 구축\" 항목","concept":"<div class=\"tw\"><table><thead><tr><th>서버<\/th><th>역할<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td>웹 서버<\/td><td>정적 콘텐츠(HTML, 이미지) 제공<\/td><td>Apache HTTP Server, Nginx, IIS<\/td><\/tr><tr><td>WAS<\/td><td>동적 콘텐츠, 비즈니스 로직<\/td><td>Tomcat, WebLogic, WebSphere, JEUS<\/td><\/tr><tr><td>DB 서버<\/td><td>데이터 저장·처리<\/td><td>Oracle, MySQL, PostgreSQL, MariaDB, MS-SQL<\/td><\/tr><tr><td>파일 서버<\/td><td>파일 저장<\/td><td>NAS<\/td><\/tr><tr><td>로드 밸런서<\/td><td>트래픽 분산<\/td><td>L4 스위치, HAProxy<\/td><\/tr><\/tbody><\/table><\/div><p><strong>웹 서버의 기능<\/strong>: HTTP/HTTPS 지원, 통신 기록(Logging), 정적 파일 관리, 대역폭 제한, 가상 호스팅, 인증.<\/p><p><strong>패키지 관리<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>환경<\/th><th>도구<\/th><\/tr><\/thead><tbody><tr><td>Ubuntu·Debian<\/td><td><code>apt<\/code><\/td><\/tr><tr><td>RedHat·CentOS<\/td><td><code>yum<\/code>, <code>dnf<\/code>, <code>rpm<\/code><\/td><\/tr><tr><td>macOS<\/td><td><code>brew<\/code><\/td><\/tr><tr><td>Node.js<\/td><td><code>npm<\/code>, <code>yarn<\/code><\/td><\/tr><tr><td>Python<\/td><td><code>pip<\/code><\/td><\/tr><tr><td>Java<\/td><td>Maven, Gradle<\/td><\/tr><\/tbody><\/table><\/div><p><strong>서버 사양 고려 사항<\/strong>: CPU, 메모리, 디스크 용량, 네트워크 대역폭, 동시 접속자 수.<\/p><p><strong>웹 서비스 구성<\/strong>: 3-Tier 구조는 Web → WAS → DB로 나눈다.<\/p>","qs":[{"s":"<p>동적 콘텐츠를 처리하는 WAS 제품은?<\/p>","c":["MySQL","Git","Tomcat","Nginx"],"a":2,"e":"<p>Tomcat은 대표적인 WAS다. Nginx는 웹 서버, MySQL은 DB 서버다.<\/p>"},{"s":"<p>Ubuntu 리눅스의 패키지 관리 명령은?<\/p>","c":["apt","yum","brew","pip"],"a":0,"e":"<p>Debian 계열은 apt를 쓴다. yum은 RedHat 계열이다.<\/p>"},{"s":"<p>웹 서버의 주요 기능으로 거리가 먼 것은?<\/p>","c":["HTTP 요청 처리","접근 기록(Log)","정적 파일 제공","SQL 쿼리 최적화"],"a":3,"e":"<p>SQL 최적화는 DB 서버의 영역이다.<\/p>"},{"s":"<p>Node.js의 패키지 관리 도구는?<\/p>","c":["Maven","npm","apt","yum"],"a":1,"e":"<p>npm은 Node.js 생태계의 패키지 관리자다.<\/p>"},{"s":"<p>일반적인 3-Tier 웹 구조의 흐름으로 옳은 것은?<\/p>","c":["DB 서버 → 웹 서버 → WAS","WAS → DB 서버 → 웹 서버","웹 서버 → WAS → DB 서버","DB 서버 → WAS → 웹 서버"],"a":2,"e":"<p>요청은 웹 서버, WAS, DB 서버 순서로 전달된다.<\/p>"}]}]},{"title":"3과목 심화: 코드 고난도·디스크·네트워크 보강","desc":"다른 유형의 기초 위에 꼬아 내는 코드 문제와 기출에 나온 추가 범위를 모았다.","types":[{"id":"c-hard","title":"C 고난도: 이중 포인터·구조체 배열·함수 포인터·static","freq":"필기 C 코드 약 28문항 중 추적이 긴 유형","concept":"<div class=\"tw\"><table><thead><tr><th>문법<\/th><th>해석<\/th><\/tr><\/thead><tbody><tr><td><code>int **q = &amp;p;<\/code><\/td><td><code>*q<\/code>는 p, <code>**q<\/code>는 p가 가리키는 값<\/td><\/tr><tr><td><code>struct s *p = t; p++;<\/code><\/td><td>p는 t[1]을 가리킴<\/td><\/tr><tr><td><code>(p + 1)-&gt;b<\/code><\/td><td>p 다음 구조체의 b<\/td><\/tr><tr><td><code>int (*f)(int, int) = add;<\/code><\/td><td>함수 포인터. <code>f(2, 3)<\/code>은 add 호출<\/td><\/tr><tr><td><code>static int n = 0;<\/code> (함수 안)<\/td><td>처음 한 번만 초기화되고 값이 유지됨<\/td><\/tr><\/tbody><\/table><\/div><p><strong>재귀에서 출력 위치<\/strong>: 재귀 호출 <strong>뒤<\/strong>의 출력은 가장 깊은 호출부터 나오므로 순서가 뒤집힌다.<\/p>","qs":[{"s":"<p>다음 C 프로그램의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">int<\/span> x = 3;\n    <span class=\"tk\">int<\/span> *p = &amp;x;\n    <span class=\"tk\">int<\/span> **q = &amp;p;\n    **q += 2;\n    printf(<span class=\"ts\">\"%d\"<\/span>, x + *p);\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","c":["5","6","8","10"],"a":3,"e":"<p><code>**q<\/code>는 x이므로 x는 5가 되고, <code>*p<\/code>도 5이므로 합은 10이다.<\/p>"},{"s":"<p>다음 C 프로그램의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n<span class=\"tk\">struct<\/span> s { <span class=\"tk\">int<\/span> a; <span class=\"tk\">int<\/span> b; };\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">struct<\/span> s t[3] = {{1, 2}, {3, 4}, {5, 6}};\n    <span class=\"tk\">struct<\/span> s *p = t;\n    p++;\n    printf(<span class=\"ts\">\"%d\"<\/span>, p-&gt;a + (p + 1)-&gt;b);\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","c":["7","8","9","10"],"a":2,"e":"<p>p는 t[1]을 가리키므로 p-&gt;a는 3, (p+1)-&gt;b는 t[2].b인 6이다.<\/p>"},{"s":"<p>다음 C 프로그램의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n<span class=\"tk\">int<\/span> add(<span class=\"tk\">int<\/span> a, <span class=\"tk\">int<\/span> b) { <span class=\"tk\">return<\/span> a + b; }\n<span class=\"tk\">int<\/span> mul(<span class=\"tk\">int<\/span> a, <span class=\"tk\">int<\/span> b) { <span class=\"tk\">return<\/span> a * b; }\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">int<\/span> (*f)(<span class=\"tk\">int<\/span>, <span class=\"tk\">int<\/span>) = add;\n    <span class=\"tk\">int<\/span> r = f(2, 3);\n    f = mul;\n    r += f(2, 3);\n    printf(<span class=\"ts\">\"%d\"<\/span>, r);\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","c":["5","10","11","12"],"a":2,"e":"<p>add(2, 3) = 5, mul(2, 3) = 6이므로 합은 11이다.<\/p>"},{"s":"<p>다음 C 프로그램의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n<span class=\"tk\">int<\/span> f(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">static<\/span> <span class=\"tk\">int<\/span> n = 0;\n    n += 2;\n    <span class=\"tk\">return<\/span> n;\n}\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    f();\n    f();\n    printf(<span class=\"ts\">\"%d\"<\/span>, f());\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","c":["0","2","4","6"],"a":3,"e":"<p>static 변수는 값이 유지되어 호출마다 2, 4, 6이 된다.<\/p>"},{"s":"<p>다음 C 프로그램의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n<span class=\"tk\">void<\/span> p(<span class=\"tk\">int<\/span> n) {\n    <span class=\"tk\">if<\/span> (n == 0) <span class=\"tk\">return<\/span>;\n    p(n / 2);\n    printf(<span class=\"ts\">\"%d\"<\/span>, n % 2);\n}\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    p(6);\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","c":["011","100","101","110"],"a":3,"e":"<p>호출이 끝난 뒤 출력하므로 나머지가 역순으로 나와 6의 2진수 110이 된다.<\/p>"}]},{"id":"java-hard","title":"Java 고난도: 바인딩·필드 가림·super 체인·문자열 비교","freq":"오버로딩과 오버라이딩을 섞는 유형이 까다로움","concept":"<div class=\"tw\"><table><thead><tr><th>규칙<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>오버로딩 선택<\/td><td><strong>컴파일 시점<\/strong>에 참조 변수의 타입으로 시그니처를 정한다<\/td><\/tr><tr><td>오버라이딩 실행<\/td><td><strong>실행 시점<\/strong>에 실제 객체의 메서드가 실행된다<\/td><\/tr><tr><td>필드<\/td><td>오버라이딩되지 않는다. <strong>참조 변수의 타입<\/strong>을 따른다<\/td><\/tr><tr><td><code>super.메서드()<\/code><\/td><td>바로 위 클래스의 구현 호출<\/td><\/tr><tr><td><code>==<\/code> / <code>equals<\/code><\/td><td>참조 비교 / 내용 비교<\/td><\/tr><\/tbody><\/table><\/div><p><code>new String(\"hi\")<\/code>는 항상 새 객체를 만들어 리터럴과 <code>==<\/code>로 비교하면 거짓이다.<\/p>","qs":[{"s":"<p>다음 Java 프로그램의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"java\"><code><span class=\"tk\">class<\/span> P {\n    String m(P x) { <span class=\"tk\">return<\/span> <span class=\"ts\">\"1\"<\/span>; }\n}\n<span class=\"tk\">class<\/span> C <span class=\"tk\">extends<\/span> P {\n    @Override String m(P x) { <span class=\"tk\">return<\/span> <span class=\"ts\">\"2\"<\/span>; }\n    String m(C x) { <span class=\"tk\">return<\/span> <span class=\"ts\">\"3\"<\/span>; }\n}\n<span class=\"tk\">public<\/span> <span class=\"tk\">class<\/span> Main {\n    <span class=\"tk\">public<\/span> <span class=\"tk\">static<\/span> <span class=\"tk\">void<\/span> main(String[] args) {\n        P a = <span class=\"tk\">new<\/span> C();\n        System.out.print(a.m(<span class=\"tk\">new<\/span> C()));\n    }\n}<\/code><\/pre>","c":["1","2","3","12"],"a":1,"e":"<p>참조 타입 P에는 m(P)만 있어 그 시그니처가 선택되고, 실행은 C의 오버라이딩 메서드가 맡는다.<\/p>"},{"s":"<p>다음 Java 프로그램의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"java\"><code><span class=\"tk\">class<\/span> A { <span class=\"tk\">int<\/span> x = 1; }\n<span class=\"tk\">class<\/span> B <span class=\"tk\">extends<\/span> A { <span class=\"tk\">int<\/span> x = 2; }\n<span class=\"tk\">public<\/span> <span class=\"tk\">class<\/span> Main {\n    <span class=\"tk\">public<\/span> <span class=\"tk\">static<\/span> <span class=\"tk\">void<\/span> main(String[] args) {\n        A o = <span class=\"tk\">new<\/span> B();\n        System.out.print(o.x);\n    }\n}<\/code><\/pre>","c":["0","1","2","3"],"a":1,"e":"<p>필드는 참조 변수의 타입을 따르므로 A의 x가 사용된다.<\/p>"},{"s":"<p>다음 Java 프로그램의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"java\"><code><span class=\"tk\">class<\/span> A { String s() { <span class=\"tk\">return<\/span> <span class=\"ts\">\"A\"<\/span>; } }\n<span class=\"tk\">class<\/span> B <span class=\"tk\">extends<\/span> A { @Override String s() { <span class=\"tk\">return<\/span> <span class=\"tk\">super<\/span>.s() + <span class=\"ts\">\"B\"<\/span>; } }\n<span class=\"tk\">class<\/span> C <span class=\"tk\">extends<\/span> B { @Override String s() { <span class=\"tk\">return<\/span> <span class=\"tk\">super<\/span>.s() + <span class=\"ts\">\"C\"<\/span>; } }\n<span class=\"tk\">public<\/span> <span class=\"tk\">class<\/span> Main {\n    <span class=\"tk\">public<\/span> <span class=\"tk\">static<\/span> <span class=\"tk\">void<\/span> main(String[] args) {\n        System.out.print(<span class=\"tk\">new<\/span> C().s());\n    }\n}<\/code><\/pre>","c":["AC","ABC","C","CBA"],"a":1,"e":"<p>super 호출을 따라 A까지 올라간 뒤 B, C가 차례로 붙는다.<\/p>"},{"s":"<p>다음 Java 프로그램의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"java\"><code><span class=\"tk\">public<\/span> <span class=\"tk\">class<\/span> Main {\n    <span class=\"tk\">static<\/span> <span class=\"tk\">int<\/span> f(<span class=\"tk\">int<\/span> n) {\n        <span class=\"tk\">return<\/span> n &lt; 2 ? n : f(n - 1) + f(n - 2);\n    }\n    <span class=\"tk\">public<\/span> <span class=\"tk\">static<\/span> <span class=\"tk\">void<\/span> main(String[] args) {\n        System.out.print(f(6));\n    }\n}<\/code><\/pre>","c":["5","6","8","13"],"a":2,"e":"<p>피보나치 수열 0, 1, 1, 2, 3, 5, 8에서 f(6)은 8이다.<\/p>"},{"s":"<p>다음 Java 프로그램의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"java\"><code><span class=\"tk\">public<\/span> <span class=\"tk\">class<\/span> Main {\n    <span class=\"tk\">public<\/span> <span class=\"tk\">static<\/span> <span class=\"tk\">void<\/span> main(String[] args) {\n        String a = <span class=\"ts\">\"hi\"<\/span>;\n        String b = <span class=\"tk\">new<\/span> String(<span class=\"ts\">\"hi\"<\/span>);\n        System.out.print((a == b) + <span class=\"ts\">\" \"<\/span> + a.equals(b));\n    }\n}<\/code><\/pre>","c":["false true","true false","false false","true true"],"a":0,"e":"<p>서로 다른 객체이므로 <code>==<\/code>는 거짓이고, 내용은 같으므로 equals는 참이다.<\/p>"}]},{"id":"python-hard","title":"Python 고난도: 컴프리헨션·dict·set·클래스·재귀","freq":"Python 약 11문항. 복합 연산 추적","concept":"<div class=\"tw\"><table><thead><tr><th>문법<\/th><th>예<\/th><th>결과<\/th><\/tr><\/thead><tbody><tr><td>리스트 컴프리헨션<\/td><td><code>[x*2 for x in range(3)]<\/code><\/td><td><code>[0, 2, 4]<\/code><\/td><\/tr><tr><td>조건 포함<\/td><td><code>[x for x in range(5) if x%2]<\/code><\/td><td><code>[1, 3]<\/code><\/td><\/tr><tr><td>dict 순회<\/td><td><code>d.keys()<\/code>, <code>d.values()<\/code>, <code>d.items()<\/code><\/td><td><\/td><\/tr><tr><td>교집합·합집합·차집합<\/td><td><code>a &amp; b<\/code>, <code>a | b<\/code>, <code>a - b<\/code><\/td><td><\/td><\/tr><tr><td>클래스 변수<\/td><td><code>A.n<\/code><\/td><td>모든 인스턴스가 공유<\/td><\/tr><\/tbody><\/table><\/div><p>문자열 슬라이싱과 재귀를 합친 문제는 호출을 한 단계씩 적어 추적한다.<\/p>","qs":[{"s":"<p>다음 Python 코드의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"python\"><code><span class=\"tk\">print<\/span>([x * x <span class=\"tk\">for<\/span> x <span class=\"tk\">in<\/span> range(5) <span class=\"tk\">if<\/span> x % 2 == 1])<\/code><\/pre>","c":["[1, 4, 9, 16]","[1, 9]","[0, 4, 16]","[1, 3]"],"a":1,"e":"<p>홀수 1과 3만 남아 제곱하면 1과 9다.<\/p>"},{"s":"<p>다음 Python 코드의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"python\"><code>d = {<span class=\"ts\">'a'<\/span>: 1}\nd[<span class=\"ts\">'b'<\/span>] = 2\nd[<span class=\"ts\">'a'<\/span>] += 3\n<span class=\"tk\">print<\/span>(sum(d.values()))<\/code><\/pre>","c":["3","4","5","6"],"a":3,"e":"<p>값은 a가 4, b가 2이므로 합은 6이다.<\/p>"},{"s":"<p>다음 Python 코드의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"python\"><code>a = {1, 2, 3}\nb = {2, 3, 4}\n<span class=\"tk\">print<\/span>(len(a &amp; b), len(a | b), len(a - b))<\/code><\/pre>","c":["2 4 1","2 6 1","1 4 2","3 4 0"],"a":0,"e":"<p>교집합 {2, 3}, 합집합 {1, 2, 3, 4}, 차집합 {1}이다.<\/p>"},{"s":"<p>다음 Python 코드의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"python\"><code><span class=\"tk\">class<\/span> A:\n    n = 0\n    <span class=\"tk\">def<\/span> __init__(<span class=\"tk\">self<\/span>):\n        A.n += 1\nA()\nA()\n<span class=\"tk\">print<\/span>(A.n)<\/code><\/pre>","c":["0","1","2","3"],"a":2,"e":"<p>클래스 변수는 공유되며 생성자가 두 번 호출되어 2가 된다.<\/p>"},{"s":"<p>다음 Python 코드의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"python\"><code><span class=\"tk\">def<\/span> f(s):\n    <span class=\"tk\">return<\/span> s <span class=\"tk\">if<\/span> len(s) &lt;= 1 <span class=\"tk\">else<\/span> f(s[1:]) + s[0]\n<span class=\"tk\">print<\/span>(f(<span class=\"ts\">\"abc\"<\/span>))<\/code><\/pre>","c":["cba","acb","bca","abc"],"a":0,"e":"<p>첫 글자를 뒤로 보내며 재귀하므로 문자열이 뒤집힌다.<\/p>"}]},{"id":"disk-file","title":"디스크 스케줄링","freq":"2020~2022 기출에 SSTF 등이 등장. 2027 출제기준에는 이름이 없어 우선순위는 낮음","concept":"<div class=\"tw\"><table><thead><tr><th>기법<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>FCFS<\/td><td>요청이 도착한 순서대로<\/td><\/tr><tr><td>SSTF<\/td><td>현재 헤드에서 <strong>가장 가까운<\/strong> 요청 먼저<\/td><\/tr><tr><td>SCAN<\/td><td>한 방향으로 끝까지 가며 처리하고 반대로 돌아옴 (엘리베이터)<\/td><\/tr><tr><td>C-SCAN<\/td><td>한 방향으로만 처리하고 처음으로 돌아가 다시 처리<\/td><\/tr><tr><td>LOOK<\/td><td>SCAN과 같지만 마지막 요청까지만 이동<\/td><\/tr><\/tbody><\/table><\/div><p><strong>이동 거리<\/strong>는 인접한 두 위치의 차이를 모두 더한다. SSTF는 가운데 요청이 유리해 바깥쪽 요청이 <strong>기아<\/strong>를 겪을 수 있다.<\/p>","qs":[{"s":"<p>헤드가 50에 있고 요청이 <code>82, 170, 43, 140<\/code>일 때 FCFS의 총 이동 거리는?<\/p>","c":["217","242","287","344"],"a":3,"e":"<p>32 + 88 + 127 + 97 = 344다.<\/p>"},{"s":"<p>헤드가 50에 있고 요청이 <code>82, 170, 43, 140<\/code>일 때 SSTF의 총 이동 거리는?<\/p>","c":["127","134","170","344"],"a":1,"e":"<p>43(7), 82(39), 140(58), 170(30)의 순서로 합은 134다.<\/p>"},{"s":"<p>헤드가 50에 있고 요청이 <code>82, 170, 43, 140<\/code>일 때 SSTF로 가장 먼저 처리되는 요청은?<\/p>","c":["43","82","140","170"],"a":0,"e":"<p>거리가 7로 가장 가까운 43을 먼저 처리한다.<\/p>"},{"s":"<p>헤드가 한 방향으로 끝까지 이동하며 요청을 처리하고 방향을 바꾸는 기법은?<\/p>","c":["SCAN","FCFS","SSTF","RR"],"a":0,"e":"<p>엘리베이터처럼 움직이는 기법이 SCAN이다.<\/p>"},{"s":"<p>SSTF 스케줄링의 문제점으로 가장 적절한 것은?<\/p>","c":["헤드가 움직이지 않는다.","처리량이 FCFS보다 항상 낮다.","가운데 요청이 우선되어 바깥쪽 요청이 오래 기다릴 수 있다.","항상 요청이 도착한 순서대로만 처리한다."],"a":2,"e":"<p>가까운 요청이 계속 들어오면 먼 요청은 기아 상태가 될 수 있다.<\/p>"}]},{"id":"net-extra","title":"네트워크 보강: CIDR·VLSM·SSH·STP·SNMP","freq":"기출 보기에 나왔지만 기본 유형에 없는 프로토콜과 주소 기법","concept":"<div class=\"tw\"><table><thead><tr><th>용어<\/th><th>뜻<\/th><\/tr><\/thead><tbody><tr><td>CIDR<\/td><td>클래스 구분 없이 <code>/n<\/code> 프리픽스로 주소를 표기<\/td><\/tr><tr><td>FLSM<\/td><td>고정 길이 서브넷 마스크, 모든 서브넷이 같은 크기<\/td><\/tr><tr><td>VLSM<\/td><td>가변 길이 서브넷 마스크, 서브넷마다 크기 다름<\/td><\/tr><tr><td>SSH<\/td><td>암호화된 원격 접속, 기본 <strong>TCP 22번<\/strong> 포트, 키 인증 지원<\/td><\/tr><tr><td>TELNET<\/td><td>평문 원격 접속, 23번 포트<\/td><\/tr><tr><td>SNMP<\/td><td>네트워크 장비 관리, UDP 사용<\/td><\/tr><tr><td>STP<\/td><td>스위치 루프를 막는 스패닝 트리 프로토콜<\/td><\/tr><tr><td>PPP<\/td><td>점대점 직렬 링크용 데이터 링크 프로토콜<\/td><\/tr><tr><td>EIGRP<\/td><td>시스코의 하이브리드 내부 라우팅 프로토콜<\/td><\/tr><tr><td>NFS<\/td><td>네트워크로 파일 시스템 공유<\/td><\/tr><tr><td>OSPF<\/td><td>링크 상태, 다익스트라, 빠른 수렴<\/td><\/tr><tr><td>QoS<\/td><td>트래픽의 서비스 품질 보장<\/td><\/tr><\/tbody><\/table><\/div><p><strong>CIDR 주소 수<\/strong> = <code>2^(32 − n)<\/code>. <strong>FLSM으로 나누기<\/strong>: 2^k개의 서브넷을 만들면 프리픽스가 k만큼 길어진다.<\/p>","qs":[{"s":"<p>원격 접속 내용을 암호화하여 전달하는 SSH의 기본 TCP 포트 번호는?<\/p>","c":["22","23","25","53"],"a":0,"e":"<p>SSH는 22번, TELNET은 23번을 쓴다.<\/p>"},{"s":"<p><code>192.168.0.0/22<\/code> 블록의 전체 IP 주소 개수는?<\/p>","c":["256","512","1024","2048"],"a":2,"e":"<p>2^(32 − 22) = 1024개다.<\/p>"},{"s":"<p><code>/24<\/code> 네트워크를 FLSM으로 똑같이 4개로 나눌 때 서브넷마다 사용 가능한 호스트 수는?<\/p>","c":["30","62","64","126"],"a":1,"e":"<p>4개로 나누면 2비트가 늘어 /26이 되고 2^6 − 2 = 62다.<\/p>"},{"s":"<p>스위치 사이의 루프를 방지하는 프로토콜은?<\/p>","c":["STP","DHCP","SMTP","FTP"],"a":0,"e":"<p>STP(Spanning Tree Protocol)가 스위치 루프를 막는다.<\/p>"},{"s":"<p>OSPF에 대한 설명으로 옳은 것은?<\/p>","c":["거리 벡터 방식이며 최대 15홉으로 제한된다.","벨만-포드 알고리즘을 사용한다.","링크 상태 방식이며 최단 경로 계산에 다익스트라 알고리즘을 사용한다.","AS 사이의 경로를 교환하는 외부 라우팅 프로토콜이다."],"a":2,"e":"<p>최대 15홉과 벨만-포드는 RIP의 특징이고, AS 간 경로 교환은 BGP의 역할이다.<\/p>"}]}]},{"title":"3과목 보강: 2024~2026 복원 기출과 고난도 풀이 글 대조","desc":"최근 복원본과 코드 함정 정리 글에서 빠져 있던 주제를 모았다.","types":[{"id":"lang-trap","title":"문법 함정: 서식 문자·자료형 크기·break·예외","freq":"2024~2026 복원본에 서식 문자, 정수 크기, break 동작, Java 예외 설명이 반복","concept":"<p><strong>C 자료형 크기(일반 64비트 환경)<\/strong>: char 1, short 2, int 4, long 4 또는 8, long long 8, float 4, double 8바이트.<\/p><p><strong>printf 서식<\/strong>: <code>%d<\/code> 정수, <code>%c<\/code> 문자, <code>%s<\/code> 문자열, <code>%f<\/code> 실수, <code>%.2f<\/code> 소수 둘째 자리, <code>%x<\/code> 16진수, <code>%o<\/code> 8진수.<\/p><p><strong>연산자 우선순위<\/strong>: 단항 연산자(<code>!<\/code>, <code>++<\/code>, <code>~<\/code>)가 이항 연산자보다 높다. 산술 → 시프트 → 관계 → 비트 → 논리 → 조건 → 대입 순이다.<\/p><p><strong>break<\/strong><\/p><ul><li><code>switch<\/code>와 반복문 안에서만 쓴다. <code>if<\/code> 문 자체를 빠져나오는 문장이 아니다.<\/li><li>중첩 반복문에서는 <strong>가장 가까운<\/strong> 반복문만 끝낸다.<\/li><\/ul><p><strong>무한 반복<\/strong>: <code>for(;;)<\/code>, <code>for(;1;)<\/code>, <code>while(1)<\/code>처럼 조건이 항상 참이면 무한 반복이다.<\/p><p><strong>Java 출력<\/strong>: <code>System.out.print<\/code>, <code>println<\/code>, <code>printf<\/code>가 표준 메서드다.<\/p><p><strong>Java 예외<\/strong><\/p><ul><li>예외는 <strong>실행 중<\/strong> 발생하는 오류 상황이다.<\/li><li>문법 오류는 컴파일 오류이며 예외 처리로 해결할 수 없다.<\/li><li><code>Error<\/code>는 복구가 어려운 시스템 수준 문제, <code>Exception<\/code>은 프로그램에서 처리할 수 있는 문제다.<\/li><\/ul><p><strong>Java 생성자·소멸<\/strong>: 생성자 이름은 클래스 이름과 같다. Java에는 소멸자가 없고 <code>finalize<\/code>는 과거에 비슷한 역할로 설명되었다.<\/p>","qs":[{"s":"<p>다음 C 프로그램이 <code>B 3.5<\/code>를 출력하도록 빈칸 ㉠에 들어갈 서식 문자는?<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    printf(<span class=\"ts\">\"㉠\"<\/span>, <span class=\"ts\">'B'<\/span>, 3.5);\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","c":["%d %.1f","%c %.1f","%c %.2f","%x %.1f"],"a":1,"e":"<p>문자는 <code>%c<\/code>, 소수 첫째 자리까지의 실수는 <code>%.1f<\/code>다.<\/p>"},{"s":"<p>일반적인 64비트 환경의 C 언어에서 자료형과 크기의 연결이 잘못된 것은?<\/p>","c":["int - 4바이트","char - 1바이트","double - 8바이트","long long - 4바이트"],"a":3,"e":"<p>long long은 8바이트다.<\/p>"},{"s":"<p>다음 중 무한 반복이 되지 않는 C 코드는?<\/p>","c":["for (;;) {}","for (; 1;) {}","for (int i = 0; i &lt; 10; i++) {}","while (1) {}"],"a":2,"e":"<p>종료 조건 <code>i &lt; 10<\/code>이 있어 10회 반복 후 끝난다.<\/p>"},{"s":"<p>C 언어 break 문에 대한 설명으로 틀린 것은?<\/p>","c":["if 문을 빠져나오기 위해 if 문 안에서 단독으로 사용한다.","switch 문을 빠져나올 때 사용한다.","반복문을 즉시 끝낸다.","중첩 반복문에서는 가장 가까운 반복문만 끝낸다."],"a":0,"e":"<p>break는 switch와 반복문에서만 동작한다. 반복문 밖의 if 문에서 단독으로 쓰면 컴파일 오류다.<\/p>"},{"s":"<p>Java의 예외에 대한 설명으로 틀린 것은?<\/p>","c":["정수를 0으로 나누면 ArithmeticException이 발생한다.","예외는 프로그램 실행 중 발생하는 오류 상황이다.","finally 블록은 예외 여부와 관계없이 실행된다.","컴파일 시점의 문법 오류는 try-catch로 처리하는 예외이다."],"a":3,"e":"<p>문법 오류는 컴파일 단계에서 드러나며 예외 처리 대상이 아니다.<\/p>"}]},{"id":"code-trap","title":"코드 함정: 환형 큐·값 전달·static 메서드·split·f-string","freq":"고난도 코드 정리 글의 함정을 필기 형식으로 옮긴 유형","concept":"<p><strong>환형 큐<\/strong>: <code>rear = (rear + 1) % 크기<\/code>로 끝에서 처음으로 돌아간다. front도 같은 방식으로 움직인다.<\/p><p><strong>값 전달<\/strong>: C에서 값으로 넘긴 매개변수를 바꿔도 호출한 쪽 변수는 바뀌지 않는다.<\/p><p><strong>static 메서드<\/strong>: 오버라이딩되지 않고 <strong>숨겨진다(hiding)<\/strong>. 참조 변수의 타입으로 호출 대상이 정해진다.<\/p><p><strong>Java split<\/strong>: 가운데 빈 문자열은 남고, <strong>맨 뒤의 빈 문자열은 제거<\/strong>된다. <code>\"a,,b,,\".split(\",\")<\/code>의 길이는 3이다.<\/p><p><strong>Python<\/strong><\/p><ul><li>딕셔너리 컴프리헨션: <code>{k: len(k) for k in 목록}<\/code>.<\/li><li>f-string: <code>f\"{값}\"<\/code>로 값을 문자열에 넣는다.<\/li><li><code>split()<\/code>은 공백 기준으로 나누고 연속 공백을 하나로 본다.<\/li><\/ul>","qs":[{"s":"<p>다음 C 프로그램의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">int<\/span> q[4], front = 0, rear = 0, v;\n    <span class=\"tk\">for<\/span> (v = 1; v &lt;= 3; v++) { rear = (rear + 1) % 4; q[rear] = v; }\n    front = (front + 1) % 4;\n    rear = (rear + 1) % 4;\n    q[rear] = 4;\n    printf(<span class=\"ts\">\"%d %d\"<\/span>, front, rear);\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","c":["1 4","1 0","0 3","1 3"],"a":1,"e":"<p>세 번 삽입하면 rear는 3이다. 삭제로 front는 1이 되고, 네 번째 삽입에서 rear는 (3 + 1) % 4 = 0이 된다.<\/p>"},{"s":"<p>다음 C 프로그램의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n<span class=\"tk\">void<\/span> swap(<span class=\"tk\">int<\/span> a, <span class=\"tk\">int<\/span> b) {\n    <span class=\"tk\">int<\/span> t = a;\n    a = b;\n    b = t;\n    (<span class=\"tk\">void<\/span>)a;\n    (<span class=\"tk\">void<\/span>)b;\n}\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">int<\/span> x = 1, y = 2;\n    swap(x, y);\n    printf(<span class=\"ts\">\"%d %d\"<\/span>, x, y);\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","c":["1 1","2 2","2 1","1 2"],"a":3,"e":"<p>값으로 복사해 넘겼으므로 main의 x, y는 바뀌지 않는다.<\/p>"},{"s":"<p>다음 Java 프로그램의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"java\"><code><span class=\"tk\">class<\/span> A { <span class=\"tk\">static<\/span> String f() { <span class=\"tk\">return<\/span> <span class=\"ts\">\"A\"<\/span>; } }\n<span class=\"tk\">class<\/span> B <span class=\"tk\">extends<\/span> A { <span class=\"tk\">static<\/span> String f() { <span class=\"tk\">return<\/span> <span class=\"ts\">\"B\"<\/span>; } }\n<span class=\"tk\">public<\/span> <span class=\"tk\">class<\/span> Main {\n    <span class=\"tk\">public<\/span> <span class=\"tk\">static<\/span> <span class=\"tk\">void<\/span> main(String[] args) {\n        A a = <span class=\"tk\">new<\/span> B();\n        System.out.print(a.f());\n    }\n}<\/code><\/pre>","c":["A","AB","BA","B"],"a":0,"e":"<p>static 메서드는 오버라이딩되지 않고 참조 변수의 타입 A를 따른다.<\/p>"},{"s":"<p>다음 Java 프로그램의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"java\"><code><span class=\"tk\">public<\/span> <span class=\"tk\">class<\/span> Main {\n    <span class=\"tk\">public<\/span> <span class=\"tk\">static<\/span> <span class=\"tk\">void<\/span> main(String[] args) {\n        System.out.print(<span class=\"ts\">\"a,b,,c,,\"<\/span>.split(<span class=\"ts\">\",\"<\/span>).length);\n    }\n}<\/code><\/pre>","c":["3","4","5","6"],"a":1,"e":"<p>가운데 빈 문자열은 남아 a, b, 빈 문자열, c의 4개이고 맨 뒤 빈 문자열은 제거된다.<\/p>"},{"s":"<p>다음 Python 코드의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"python\"><code>d = {k: len(k) <span class=\"tk\">for<\/span> k <span class=\"tk\">in<\/span> [<span class=\"ts\">\"ab\"<\/span>, <span class=\"ts\">\"c\"<\/span>]}\n<span class=\"tk\">print<\/span>(f<span class=\"ts\">\"{d['ab']}-{d['c']}\"<\/span>)<\/code><\/pre>","c":["2-1","ab-c","1-2","2-2"],"a":0,"e":"<p>각 키의 길이를 값으로 저장하므로 ab는 2, c는 1이다.<\/p>"}]},{"id":"os-misc","title":"커널·인터럽트·파일 시스템·cron","freq":"2024~2026 복원본에 FCB, uname이 등장하고 오답노트 글에 인터럽트와 FAT·NTFS, cron이 반복","concept":"<p><strong>커널 구조<\/strong>: 모놀리식 커널은 대부분의 기능을 커널 안에 두고, 마이크로 커널은 최소 기능만 두고 나머지를 사용자 영역 서버로 분리한다.<\/p><p><strong>인터럽트<\/strong>: 실행 중 예외나 입출력 완료 같은 사건이 생기면 CPU가 현재 작업을 잠시 중단하고 처리 루틴을 수행하게 하는 신호다.<\/p><p><strong>FCB (File Control Block)<\/strong>: <strong>파일 디스크립터<\/strong>라고도 하며, 파일에 접근할 때 필요한 관리 정보를 저장한다.<\/p><p><strong>파일 시스템<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>시스템<\/th><th>특징<\/th><\/tr><\/thead><tbody><tr><td>FAT32<\/td><td>단순한 구조, 단일 파일 최대 4GB<\/td><\/tr><tr><td>NTFS<\/td><td>대용량, 저널링, 사용자별 권한·암호화<\/td><\/tr><tr><td>ext4<\/td><td>리눅스 저널링 파일 시스템<\/td><\/tr><\/tbody><\/table><\/div><p><strong>리눅스 명령 보충<\/strong>: <code>uname<\/code>(시스템·커널 정보), <code>df<\/code>(디스크 사용량), <code>top<\/code>(프로세스 모니터링), <code>whoami<\/code>(현재 사용자).<\/p><p><strong>cron 표현식<\/strong><\/p><ul><li>UNIX cron은 5개 필드: 분, 시, 일, 월, 요일.<\/li><li>Quartz cron은 <strong>초<\/strong>부터 시작: 초, 분, 시, 일, 월, 요일, (연도).<\/li><\/ul>","qs":[{"s":"<p>파일의 이름, 위치, 크기 등 파일 접근에 필요한 관리 정보를 저장한 블록은?<\/p>","c":["TLB","DMA","FCB","PCB"],"a":2,"e":"<p>FCB는 파일 관리 블록이다. PCB는 프로세스 정보를, TLB는 페이지 변환 정보를 저장한다.<\/p>"},{"s":"<p>실행 중 특정 사건이 발생했을 때 CPU가 현재 작업을 멈추고 해당 처리 루틴을 수행하게 하는 신호는?<\/p>","c":["스풀링","인터럽트","페이징","폴링"],"a":1,"e":"<p>사건 발생을 CPU에 알려 처리 루틴을 수행하게 하는 신호가 인터럽트다.<\/p>"},{"s":"<p><code>-r<\/code> 옵션을 주면 실행 중인 커널 릴리스를 보여 주는 리눅스 명령은?<\/p>","c":["df","whoami","chmod","uname"],"a":3,"e":"<p><code>uname -a<\/code>로 커널과 시스템 정보를 볼 수 있다.<\/p>"},{"s":"<p>사용자별 권한 설정과 저널링을 지원하는 Windows 파일 시스템은?<\/p>","c":["NTFS","ISO 9660","FAT32","FAT16"],"a":0,"e":"<p>NTFS는 대용량, 저널링, 권한 관리를 지원한다.<\/p>"},{"s":"<p>Quartz cron 표현식의 첫 번째 필드가 뜻하는 것은?<\/p>","c":["분","초","시","요일"],"a":1,"e":"<p>Quartz cron은 초, 분, 시, 일, 월, 요일 순서다. UNIX cron은 분부터 시작한다.<\/p>"}]},{"id":"net-link","title":"다중화·토폴로지·PDU·헤더 필드·IPv6 전환","freq":"2024~2026 복원본에 FDM, PDU, 체크섬, 토폴로지가 등장하고 오답노트 글에 IPv6 전환이 반복","concept":"<p><strong>토폴로지<\/strong>: 버스(공용 회선 하나), 스타(중앙 허브), 링(원형), 트리(계층), 메시(모든 노드 연결). 완전 메시의 회선 수는 <code>n(n−1)/2<\/code>다.<\/p><p><strong>다중화<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>방식<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>FDM<\/td><td><strong>주파수<\/strong> 대역을 나눔, 동시 사용<\/td><\/tr><tr><td>TDM<\/td><td><strong>시간<\/strong>을 나눔. 동기식(STDM)과 비동기식(ATDM)<\/td><\/tr><tr><td>CDM<\/td><td>고유 <strong>코드<\/strong>로 구분<\/td><\/tr><tr><td>WDM<\/td><td>광섬유의 <strong>파장<\/strong>을 나눔<\/td><\/tr><\/tbody><\/table><\/div><p><strong>PDU (계층별 데이터 단위)<\/strong>: 응용·표현·세션은 데이터(메시지), 전송은 세그먼트, 네트워크는 패킷, 데이터 링크는 프레임, 물리는 비트.<\/p><p><strong>헤더 필드<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>프로토콜<\/th><th>필드<\/th><\/tr><\/thead><tbody><tr><td>IPv4<\/td><td>Version, Header Length, Total Length, TTL, Protocol, Checksum, 주소<\/td><\/tr><tr><td>TCP<\/td><td>Source/Destination Port, Sequence, Acknowledgement, Window, Checksum, Urgent Pointer<\/td><\/tr><\/tbody><\/table><\/div><p>체크섬은 오류 검출에 쓴다.<\/p><p><strong>IPv4 → IPv6 전환 기술<\/strong>: 듀얼 스택, 터널링, 주소 변환.<\/p><p><strong>ALOHA<\/strong>: 무선에서 단말이 임의로 전송하고 충돌 시 재전송하는 초기 다중 접속 방식이다.<\/p><p><strong>리피터<\/strong>는 물리 계층에서 신호를 증폭한다. 경로 선택은 라우터의 일이다.<\/p><p><strong>포트 보충<\/strong>: RPC 135, NTP 123, SNMP 161, POP3 110, IMAP 143.<\/p>","qs":[{"s":"<p>FM 라디오처럼 서로 다른 주파수로 채널을 구분해 동시에 전송하는 다중화는?<\/p>","c":["TDM","ATDM","CDM","FDM"],"a":3,"e":"<p>주파수를 나누면 FDM, 시간을 나누면 TDM, 코드로 구분하면 CDM이다.<\/p>"},{"s":"<p>노드 5개를 완전 메시로 연결할 때 필요한 회선 수는?<\/p>","c":["5","10","20","25"],"a":1,"e":"<p>n(n−1)/2 = 5 × 4 ÷ 2 = 10이다.<\/p>"},{"s":"<p>계층과 PDU의 짝 중 틀린 것은?<\/p>","c":["4계층 - 세그먼트","7계층 - 비트","2계층 - 프레임","3계층 - 패킷"],"a":1,"e":"<p>비트는 물리 계층의 단위다.<\/p>"},{"s":"<p>IPv4에서 IPv6로 전환하는 기술로 볼 수 없는 것은?<\/p>","c":["CSMA/CD","터널링","주소 변환","듀얼 스택"],"a":0,"e":"<p>CSMA/CD는 유선 LAN의 매체 접근 제어 방식이다.<\/p>"},{"s":"<p>리피터에 대한 설명으로 옳은 것은?<\/p>","c":["MAC 주소를 보고 프레임을 선택적으로 전달한다.","서로 다른 프로토콜의 망을 응용 계층에서 변환한다.","물리 계층에서 약해진 신호를 증폭하거나 재생한다.","네트워크 계층에서 최적 경로를 고른다."],"a":2,"e":"<p>리피터는 물리 계층 장비다. 경로 선택은 라우터, MAC 기반 전달은 스위치, 프로토콜 변환은 게이트웨이의 일이다.<\/p>"}]},{"id":"subnet-hard","title":"FLSM n번째 서브넷의 m번째 주소 계산","freq":"2024~2026 복원본에 거의 매회 나오는 계산형. subnet-zero 적용 여부에 주의","concept":"<p><strong>풀이 순서<\/strong><\/p><ol><li>필요한 서브넷 수 k에 대해 <code>2^b ≥ k<\/code>인 최소 b를 구한다. subnet-zero 미적용이면 첫 블록을 쓰지 못하므로 <code>2^b − 1 ≥ k<\/code>로 구한다. 호스트 수가 조건이면 <code>2^h − 2 ≥ 호스트 수<\/code>인 최소 h를 구한다.<\/li><li>새 프리픽스를 정하고 블록 크기 <code>2^(32 − 새 프리픽스)<\/code>를 구한다.<\/li><li><strong>subnet-zero 적용<\/strong>이면 첫 서브넷은 시작 주소부터, <strong>미적용<\/strong>이면 시작 주소 다음 블록부터 센다.<\/li><li>n번째 서브넷의 네트워크 주소를 구하고, m번째 사용 가능 IP는 <code>네트워크 주소 + m<\/code>이다. 마지막 주소는 브로드캐스트다.<\/li><\/ol><p><strong>예<\/strong>: <code>192.0.2.0/24<\/code>를 4개로 나누면 /26이고 블록 크기는 64다. subnet-zero 적용 시 3번째 서브넷은 <code>192.0.2.128<\/code>이다.<\/p><p><strong>클래스 범위<\/strong>: A 1~126, B 128~191, C 192~223, D 224~239.<\/p><p><strong>프리픽스와 마스크<\/strong>: <code>/21<\/code>은 <code>255.255.248.0<\/code>, <code>/22<\/code>는 <code>255.255.252.0<\/code>, <code>/23<\/code>은 <code>255.255.254.0<\/code>이다.<\/p>","qs":[{"s":"<p><code>172.16.8.0/24<\/code>를 FLSM으로 4개로 나누고 subnet-zero를 적용할 때 3번째 서브넷의 5번째 사용 가능 IP는?<\/p>","c":["172.16.8.69","172.16.8.128","172.16.8.197","172.16.8.133"],"a":3,"e":"<p>/26이고 블록은 64다. 3번째 서브넷은 .128이므로 5번째 IP는 .133이다.<\/p>"},{"s":"<p><code>10.4.2.0/24<\/code>를 FLSM으로 6개로 나누고 subnet-zero를 적용하지 않을 때 2번째 서브넷의 1번째 사용 가능 IP는?<\/p>","c":["10.4.2.33","10.4.2.65","10.4.2.97","10.4.2.64"],"a":1,"e":"<p>6개에는 3비트가 필요해 /27이고 블록은 32다. subnet-zero 미적용이면 .32가 1번째, .64가 2번째이므로 첫 IP는 .65다.<\/p>"},{"s":"<p><code>10.8.4.0/22<\/code>를 서브넷마다 호스트 28개가 들어가도록 FLSM으로 나누고 subnet-zero를 적용할 때 5번째 서브넷의 브로드캐스트 주소는?<\/p>","c":["10.8.4.128","10.8.4.191","10.8.4.159","10.8.4.127"],"a":2,"e":"<p>2^5 − 2 = 30 ≥ 28이므로 /27이다. 5번째 서브넷은 .128이고 브로드캐스트는 .159다.<\/p>"},{"s":"<p>다음 중 C 클래스에 속하는 IP 주소는?<\/p>","c":["198.51.100.7","10.1.1.1","172.20.0.1","224.0.0.5"],"a":0,"e":"<p>첫 옥텟이 192~223이면 C 클래스다.<\/p>"},{"s":"<p>서브넷 마스크 <code>255.255.248.0<\/code>을 프리픽스로 나타낸 것은?<\/p>","c":["/20","/22","/21","/24"],"a":2,"e":"<p>248은 2진수로 11111000이므로 8 + 8 + 5 = 21비트다.<\/p>"}]}]},{"title":"4과목 정보시스템 구축관리","desc":"20문항. 사실상 IT 신기술 트렌드와 보안 과목이다. 낯선 약어가 매회 나오므로 뜻과 짝을 함께 외운다.","types":[{"id":"trend-network","title":"네트워크 신기술과 장비","freq":"네트워크 신기술·장비 약 10문항. 약어 설명을 고르는 형식이 대부분","concept":"<p><strong>네트워크 장비<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>장비<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>라우터<\/td><td>네트워크 계층, 최적 경로 선택<\/td><\/tr><tr><td>백본 스위치<\/td><td>네트워크의 중심, 대용량 스위칭<\/td><\/tr><tr><td>L2 / L3 / L4 / L7 스위치<\/td><td>MAC 기반 / IP 기반 / 포트 기반 로드 밸런싱 / 애플리케이션 기반<\/td><\/tr><tr><td>게이트웨이<\/td><td>서로 다른 프로토콜의 망을 연결<\/td><\/tr><\/tbody><\/table><\/div><p><strong>망 구성<\/strong>: 스타, 버스, 링, 메시, 트리. 메시는 모든 노드가 서로 연결되어 안정적이다.<\/p><p><strong>신기술<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>용어<\/th><th>뜻<\/th><\/tr><\/thead><tbody><tr><td>SDN<\/td><td><strong>소프트웨어로<\/strong> 네트워크를 제어 (제어부와 데이터부 분리)<\/td><\/tr><tr><td>NFV<\/td><td>네트워크 기능을 <strong>가상화<\/strong><\/td><\/tr><tr><td>메시 네트워크<\/td><td>기기들이 그물처럼 연결, 재난·대규모 접속에 활용<\/td><\/tr><tr><td>애드혹 네트워크<\/td><td>기지국 없이 <strong>단말끼리<\/strong> 구성 (재난·군사)<\/td><\/tr><tr><td>피코넷<\/td><td>블루투스로 구성하는 소규모 망 (UWB 활용)<\/td><\/tr><tr><td>WDM<\/td><td>파장 분할 다중화 (광섬유)<\/td><\/tr><tr><td>Zing<\/td><td>10cm 이내 <strong>근접 초고속<\/strong> 데이터 전송<\/td><\/tr><tr><td>NFC<\/td><td>13.56MHz 근거리 무선 통신<\/td><\/tr><tr><td>BLE<\/td><td>저전력 블루투스<\/td><\/tr><tr><td>Zigbee<\/td><td>저속·저전력 메시, 센서망<\/td><\/tr><tr><td>LoRa / NB-IoT<\/td><td>저전력 장거리 통신(LPWAN)<\/td><\/tr><tr><td>MQTT<\/td><td>발행-구독 기반의 경량 메시지 프로토콜<\/td><\/tr><tr><td>C-V2X<\/td><td>차량과 사물 간 이동통신<\/td><\/tr><tr><td>VLAN<\/td><td>물리적 배치와 무관하게 논리적으로 망을 분리<\/td><\/tr><tr><td>N-Screen<\/td><td>여러 기기에서 끊김 없이 콘텐츠 이용<\/td><\/tr><tr><td>BcN<\/td><td>음성·데이터·방송을 통합한 광대역 통합망<\/td><\/tr><\/tbody><\/table><\/div>","qs":[{"s":"<p>네트워크 장치의 제어부와 데이터 전달부를 분리하여 소프트웨어로 네트워크를 제어하는 기술은?<\/p>","c":["BLE","WDM","SDN","NFC"],"a":2,"e":"<p>SDN(Software Defined Network)의 설명이다.<\/p>"},{"s":"<p>기지국 없이 단말끼리 자율적으로 망을 구성해 재난 현장 등에서 활용하는 네트워크는?<\/p>","c":["스타 네트워크","애드혹 네트워크","백본 네트워크","링 네트워크"],"a":1,"e":"<p>애드혹 네트워크는 고정 기반 시설 없이 단말끼리 구성한다.<\/p>"},{"s":"<p>10cm 이내 거리에서 초고속으로 데이터를 전송하는 근접 통신 기술은?<\/p>","c":["Zing","SDN","WDM","LoRa"],"a":0,"e":"<p>Zing은 키오스크 등에 대면 데이터를 빠르게 받는 초근접 통신이다.<\/p>"},{"s":"<p>광섬유에서 여러 파장의 빛을 이용하여 동시에 데이터를 전송하는 기술은?<\/p>","c":["NAT","MQTT","VLAN","WDM"],"a":3,"e":"<p>WDM은 파장 분할 다중화다.<\/p>"},{"s":"<p>IoT 환경에서 많이 쓰는 발행-구독(Pub/Sub) 기반의 경량 메시지 프로토콜은?<\/p>","c":["SMTP","BGP","MQTT","FTP"],"a":2,"e":"<p>MQTT는 저전력 환경의 경량 메시징 프로토콜이다.<\/p>"}]},{"id":"trend-sw","title":"SW 개발 트렌드","freq":"클라우드·AI·블록체인·SOA 등 신기술 약어가 반복","concept":"<div class=\"tw\"><table><thead><tr><th>용어<\/th><th>뜻<\/th><\/tr><\/thead><tbody><tr><td>클라우드 IaaS<\/td><td>인프라(서버, 스토리지) 제공<\/td><\/tr><tr><td>클라우드 PaaS<\/td><td>개발 플랫폼 제공<\/td><\/tr><tr><td>클라우드 SaaS<\/td><td>소프트웨어 제공<\/td><\/tr><tr><td>SOA<\/td><td>서비스 단위로 구성 (서비스 지향 아키텍처)<\/td><\/tr><tr><td>MSA<\/td><td>작은 독립 서비스로 구성 (마이크로서비스)<\/td><\/tr><tr><td>매시업 (Mashup)<\/td><td>여러 서비스·데이터를 결합해 새 서비스<\/td><\/tr><tr><td>디지털 트윈<\/td><td>현실의 사물을 <strong>가상 세계에 동일하게<\/strong> 구현<\/td><\/tr><tr><td>블록체인<\/td><td>분산 원장, 위·변조 어려움<\/td><\/tr><tr><td>스마트 그리드<\/td><td>IT와 전력망 융합<\/td><\/tr><tr><td>메타버스<\/td><td>3차원 가상 세계<\/td><\/tr><tr><td>머신러닝<\/td><td>데이터에서 규칙 학습<\/td><\/tr><tr><td>딥러닝<\/td><td>심층 신경망<\/td><\/tr><tr><td>텐서플로<\/td><td>구글의 머신러닝 라이브러리<\/td><\/tr><tr><td>온톨로지<\/td><td>개념과 관계를 정형화한 지식 표현<\/td><\/tr><tr><td>시맨틱 웹<\/td><td>컴퓨터가 의미를 이해하는 웹<\/td><\/tr><tr><td>Docker<\/td><td>컨테이너 기반 가상화<\/td><\/tr><tr><td>Kubernetes<\/td><td>컨테이너 오케스트레이션<\/td><\/tr><tr><td>서버리스<\/td><td>서버 관리 없이 함수 단위 실행<\/td><\/tr><tr><td>RPA<\/td><td>반복 업무를 소프트웨어 로봇으로 자동화<\/td><\/tr><tr><td>그레이웨어<\/td><td>악의는 없지만 사용자에게 불편을 주는 프로그램<\/td><\/tr><\/tbody><\/table><\/div><p><strong>SW 개발 보안 정책<\/strong>: 개발 단계부터 보안을 내재화한다. 공공 정보화 사업에서는 SW 보안 약점 제거가 의무화되어 있다(행정안전부 가이드).<\/p>","qs":[{"s":"<p>현실의 사물을 가상 세계에 똑같이 구현해 시뮬레이션하는 기술은?<\/p>","c":["디지털 트윈","매시업","그레이웨어","텐서플로"],"a":0,"e":"<p>디지털 트윈의 설명이다.<\/p>"},{"s":"<p>클라우드 서비스 중 애플리케이션을 개발할 플랫폼을 제공하는 것은?<\/p>","c":["DaaS","PaaS","IaaS","SaaS"],"a":1,"e":"<p>PaaS는 플랫폼, IaaS는 인프라, SaaS는 소프트웨어를 제공한다.<\/p>"},{"s":"<p>애플리케이션을 작고 독립적인 서비스 단위로 구성하는 아키텍처는?<\/p>","c":["모놀리식 아키텍처","MVC","MSA","SOA"],"a":2,"e":"<p>MSA는 마이크로서비스 아키텍처다.<\/p>"},{"s":"<p>여러 웹 서비스의 데이터나 기능을 결합해 새로운 서비스를 만드는 것은?<\/p>","c":["시맨틱 웹","온톨로지","디지털 트윈","매시업"],"a":3,"e":"<p>매시업은 여러 소스를 결합한다.<\/p>"},{"s":"<p>컨테이너를 자동으로 배포·확장·관리하는 오케스트레이션 도구는?<\/p>","c":["Docker","서버리스","Kubernetes","RPA"],"a":2,"e":"<p>Kubernetes는 컨테이너 오케스트레이션 플랫폼이다.<\/p>"}]},{"id":"trend-hw","title":"서버 장비 운영과 고가용성","freq":"2027 출제기준 항목. NAS·DAS·SAN, Secure OS, 고가용성","concept":"<div class=\"tw\"><table><thead><tr><th>스토리지<\/th><th>특징<\/th><\/tr><\/thead><tbody><tr><td>DAS<\/td><td>서버에 직접 연결, 확장·공유 어려움<\/td><\/tr><tr><td>NAS<\/td><td>LAN을 통해 <strong>파일 단위<\/strong> 공유, 파일 서버<\/td><\/tr><tr><td>SAN<\/td><td>전용 망(광채널)으로 <strong>블록 단위<\/strong> 공유, 고속, 비용 높음<\/td><\/tr><\/tbody><\/table><\/div><p><strong>Secure OS<\/strong>: 기존 운영체제에 보안 기능(강제적 접근 통제, 재사용 방지 등)을 내장한 <strong>보안 운영체제<\/strong>. 해킹으로부터 시스템을 보호하며, <strong>커널 수준<\/strong>에서 접근을 통제한다.<\/p><ul><li>보안 기능: 사용자 식별·인증, 접근 통제, 객체 재사용 방지, 안전한 경로, 감사 기록.<\/li><\/ul><p><strong>고가용성(HA)<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>구성<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>Hot Standby<\/td><td>운영 서버 장애 시 대기 서버가 업무를 인계받음<\/td><\/tr><tr><td>상호 인수<\/td><td>두 서버가 각자 업무를 하며 서로 인계<\/td><\/tr><tr><td>동시 접근 (Active-Active)<\/td><td>여러 서버가 동시에 처리<\/td><\/tr><\/tbody><\/table><\/div><ul><li>가용성 = MTBF ÷ (MTBF + MTTR). MTBF는 평균 고장 간격, MTTR은 평균 수리 시간.<\/li><\/ul><p><strong>서버 장비·가상화<\/strong>: 가상화 하이퍼바이저(Type 1은 하드웨어 위, Type 2는 OS 위), 컨테이너, 블레이드 서버, HSM(하드웨어 보안 모듈, 암호 키 안전 보관).<\/p><p><strong>서버 트렌드<\/strong>: 가상화, 클라우드 HSM, 서버 통합, 컴포저블 인프라.<\/p>","qs":[{"s":"<p>네트워크를 통해 파일 단위로 저장 공간을 공유하는 스토리지는?<\/p>","c":["DAS","NAS","HSM","RAID 0"],"a":1,"e":"<p>NAS는 LAN으로 연결되어 파일 단위로 공유한다.<\/p>"},{"s":"<p>MTBF가 90시간, MTTR이 10시간일 때 가용성은?<\/p>","c":["10%","80%","90%","100%"],"a":2,"e":"<p>90 ÷ (90 + 10) = 0.9다.<\/p>"},{"s":"<p>Secure OS에 대한 설명으로 옳은 것은?<\/p>","c":["오직 사용자 편의성만 높이는 운영체제이다.","데이터베이스 쿼리를 최적화하는 도구이다.","커널에 보안 기능을 포함해 시스템 접근을 강제로 통제한다.","네트워크 전송 속도를 높이는 장치이다."],"a":2,"e":"<p>Secure OS는 보안 커널 기반으로 접근을 통제한다.<\/p>"},{"s":"<p>전용 광채널 네트워크로 서버와 스토리지를 연결해 블록 단위로 접근하는 방식은?<\/p>","c":["DAS","NAS","RAID 5","SAN"],"a":3,"e":"<p>SAN은 전용 네트워크로 블록 단위 공유를 제공한다.<\/p>"},{"s":"<p>하이퍼바이저 중 OS 없이 하드웨어 위에서 직접 동작하는 유형은?<\/p>","c":["Type 3","Type 1","Type 2","Hosted"],"a":1,"e":"<p>Type 1은 베어메탈 방식, Type 2는 호스트 OS 위에서 동작한다.<\/p>"}]},{"id":"trend-db","title":"DB 기술 트렌드와 표준화","freq":"빅데이터·NoSQL·OLAP·데이터마이닝 등","concept":"<div class=\"tw\"><table><thead><tr><th>용어<\/th><th>뜻<\/th><\/tr><\/thead><tbody><tr><td>빅데이터<\/td><td>대량의 정형·비정형 데이터. 3V: Volume, Velocity, Variety<\/td><\/tr><tr><td>Hadoop<\/td><td>대용량 데이터 분산 처리 <strong>오픈소스<\/strong> 프레임워크<\/td><\/tr><tr><td>HDFS<\/td><td>하둡 분산 파일 시스템<\/td><\/tr><tr><td>MapReduce<\/td><td>분산 처리 프로그래밍 모델<\/td><\/tr><tr><td>Sqoop<\/td><td>하둡과 관계형 DB 간 데이터 전송<\/td><\/tr><tr><td>NoSQL<\/td><td>스키마가 유연한 비관계형 DB. <strong>BASE<\/strong> 특성 (Key-Value, Column, Document, Graph)<\/td><\/tr><tr><td>데이터 마이닝<\/td><td>대량 데이터에서 <strong>규칙·패턴 발견<\/strong><\/td><\/tr><tr><td>OLTP<\/td><td>온라인 <strong>트랜잭션<\/strong> 처리<\/td><\/tr><tr><td>OLAP<\/td><td>온라인 <strong>분석<\/strong> 처리. Roll-up, Drill-down, Slicing, Dicing<\/td><\/tr><tr><td>데이터 웨어하우스<\/td><td>의사 결정 지원을 위한 통합 DB<\/td><\/tr><tr><td>데이터 마트<\/td><td>특정 부서용 소규모 웨어하우스<\/td><\/tr><tr><td>메타데이터<\/td><td>데이터에 대한 데이터<\/td><\/tr><tr><td>LOD<\/td><td>공개 데이터를 URI로 연결한 <strong>연계 공개 데이터<\/strong><\/td><\/tr><\/tbody><\/table><\/div><p><strong>NoSQL의 BASE<\/strong>: Basically Available, Soft-state, Eventually Consistent.<\/p><p><strong>CAP 이론<\/strong>: Consistency, Availability, Partition tolerance 중 세 가지를 동시에 완전히 만족할 수 없다.<\/p><p><strong>DB 표준화<\/strong>: 데이터 이름·형식·규칙을 표준화한다. 구성 요소로 표준 단어, 표준 도메인, 표준 용어, 표준 코드가 있다.<\/p><p><strong>DB 관리 기능<\/strong>: 정의, 조작, 제어. DBA는 스키마 정의, 권한·보안·백업·성능을 담당한다.<\/p>","qs":[{"s":"<p>대량의 데이터에서 숨겨진 규칙이나 패턴을 찾아내는 기술은?<\/p>","c":["데이터 마이닝","스니핑","인덱싱","데이터 마트"],"a":0,"e":"<p>데이터 마이닝의 정의다.<\/p>"},{"s":"<p>NoSQL의 특성을 나타내는 용어는?<\/p>","c":["ACID","CIA","BASE","OSI"],"a":2,"e":"<p>NoSQL은 BASE 특성을 따른다. ACID는 전통적 트랜잭션의 특성이다.<\/p>"},{"s":"<p>OLAP 연산으로 거리가 먼 것은?<\/p>","c":["Roll-up","Slicing","Drill-down","Rollback"],"a":3,"e":"<p>Rollback은 트랜잭션 취소 연산이다.<\/p>"},{"s":"<p>RDBMS의 테이블을 HDFS로 가져오거나 분석 결과를 다시 RDBMS로 내보낼 때 쓰는 도구는?<\/p>","c":["Docker","Sqoop","HDFS","Tomcat"],"a":1,"e":"<p>Sqoop은 SQL과 하둡을 연결한다.<\/p>"},{"s":"<p>DB 표준화의 구성 요소로 거리가 먼 것은?<\/p>","c":["표준 용어","표준 단어","표준 도메인","표준 트랜잭션 로그"],"a":3,"e":"<p>표준화의 대상은 단어, 도메인, 용어, 코드 등이다.<\/p>"}]},{"id":"secure-sdlc","title":"Secure SDLC와 보안 요소","freq":"2027 출제기준 항목. 방법론 이름과 CIA 3요소가 반복","concept":"<p><strong>Secure SDLC<\/strong>: 개발 생명주기 전반에 보안을 넣는다.<\/p><div class=\"tw\"><table><thead><tr><th>방법론<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>CLASP<\/td><td>활동 중심, 기존 프로세스에 적용 (OWASP)<\/td><\/tr><tr><td>SDL<\/td><td>마이크로소프트의 보안 개발 생명주기<\/td><\/tr><tr><td>Seven Touchpoints<\/td><td>소프트웨어 보안 모범 사례 7가지를 생명주기에 통합<\/td><\/tr><\/tbody><\/table><\/div><p><strong>보안 3요소 (CIA)<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>요소<\/th><th>의미<\/th><\/tr><\/thead><tbody><tr><td>기밀성<\/td><td>인가된 사용자만 접근<\/td><\/tr><tr><td>무결성<\/td><td>인가된 사용자만 수정<\/td><\/tr><tr><td>가용성<\/td><td>필요할 때 사용 가능<\/td><\/tr><\/tbody><\/table><\/div><p>부가 요소: 인증성, 부인 방지.<\/p><p><strong>SW 개발 보안 7영역 (행정안전부 가이드 기준)<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>영역<\/th><th>예<\/th><\/tr><\/thead><tbody><tr><td>입력 데이터 검증 및 표현<\/td><td>SQL 삽입, XSS, 경로 조작<\/td><\/tr><tr><td>보안 기능<\/td><td>인증, 접근 제어, 암호<\/td><\/tr><tr><td>시간 및 상태<\/td><td>경쟁 조건, 무한 루프<\/td><\/tr><tr><td>에러 처리<\/td><td>오류 메시지 정보 노출<\/td><\/tr><tr><td>코드 오류<\/td><td>널 포인터, 자원 해제 안 함<\/td><\/tr><tr><td>캡슐화<\/td><td>잘못된 세션, 디버그 코드<\/td><\/tr><tr><td>API 오용<\/td><td>위험한 API<\/td><\/tr><\/tbody><\/table><\/div><p><strong>세션 통제<\/strong>: 세션 ID 추측 방지, 만료 시간 설정.<\/p><p><strong>개발 단계별 활동<\/strong>: 요구 분석(보안 요구 정의) → 설계(위협 모델링) → 구현(시큐어 코딩) → 테스트(취약점 점검) → 유지보수.<\/p>","qs":[{"s":"<p>권한 없는 직원이 성적 데이터를 고칠 수 없게 통제하는 것은 어떤 보안 속성을 지키기 위한 것인가?<\/p>","c":["무결성","인증","가용성","기밀성"],"a":0,"e":"<p>무결성은 허가된 방법으로만 데이터가 변경됨을 보장한다.<\/p>"},{"s":"<p>Secure SDLC 방법론 중 마이크로소프트가 만든 것은?<\/p>","c":["Seven Touchpoints","SDL","OWASP Top 10","CLASP"],"a":1,"e":"<p>SDL은 Security Development Lifecycle의 약자다.<\/p>"},{"s":"<p>SW 개발 보안 7영역이 아닌 것은?<\/p>","c":["UI 디자인","입력 데이터 검증 및 표현","에러 처리","API 오용"],"a":0,"e":"<p>UI 디자인은 7영역에 포함되지 않는다.<\/p>"},{"s":"<p>보안 약점 중 공유 자원에 대한 경쟁 조건과 가장 관련이 깊은 영역은?<\/p>","c":["에러 처리","API 오용","시간 및 상태","입력 데이터 검증 및 표현"],"a":2,"e":"<p>경쟁 조건은 시간 및 상태 영역의 약점이다.<\/p>"},{"s":"<p>Secure SDLC에서 설계 단계에 수행하기에 가장 적절한 활동은?<\/p>","c":["보안 요구 정의","취약점 점검","위협 모델링","시큐어 코딩"],"a":2,"e":"<p>설계 단계에서 위협을 식별하고 대응을 설계한다.<\/p>"}]},{"id":"input-valid","title":"입력 데이터 검증과 보안 약점","freq":"입력검증 문항. SQL 삽입·XSS·CSRF 구분이 핵심","concept":"<div class=\"tw\"><table><thead><tr><th>약점<\/th><th>내용<\/th><th>대책<\/th><\/tr><\/thead><tbody><tr><td>SQL 삽입 (SQL Injection)<\/td><td>입력에 SQL을 끼워 넣어 DB 조작<\/td><td>파라미터 바인딩, 입력 검증<\/td><\/tr><tr><td>XSS<\/td><td>악성 <strong>스크립트를 웹 페이지에 삽입<\/strong>해 사용자 브라우저에서 실행<\/td><td>출력 인코딩, 입력 필터링<\/td><\/tr><tr><td>CSRF<\/td><td>사용자의 인증 상태를 악용해 <strong>원치 않는 요청을 전송<\/strong><\/td><td>토큰 검증, 재인증<\/td><\/tr><tr><td>경로 조작<\/td><td>파일 경로를 조작<\/td><td>경로 검증<\/td><\/tr><tr><td>운영체제 명령어 삽입<\/td><td>입력에 시스템 명령 포함<\/td><td>명령 실행 금지, 화이트리스트<\/td><\/tr><tr><td>버퍼 오버플로<\/td><td>할당 범위 초과해 기억 공간 침범<\/td><td>경계 검사, 안전한 함수<\/td><\/tr><tr><td>포맷 스트링<\/td><td>형식 문자열 조작<\/td><td>사용자 입력을 형식 문자열로 사용하지 않기<\/td><\/tr><tr><td>자원 삽입<\/td><td>외부 입력으로 자원 지정<\/td><td>검증<\/td><\/tr><\/tbody><\/table><\/div><p><strong>XSS 유형<\/strong>: Stored(저장), Reflected(반사), DOM.<\/p><p><strong>버퍼 오버플로 방지<\/strong>: 스택 가드(카나리 값 검사), ASLR, 스택 쉴드.<\/p><p><strong>입력 데이터 검증 원칙<\/strong>: 서버 측에서 검증한다. 화이트리스트 방식이 블랙리스트보다 안전하다.<\/p>","qs":[{"s":"<p>웹 페이지에 악성 스크립트를 삽입하여 다른 사용자의 브라우저에서 실행되게 하는 공격은?<\/p>","c":["ARP 스푸핑","CSRF","XSS","SQL 삽입"],"a":2,"e":"<p>XSS의 설명이다.<\/p>"},{"s":"<p>사용자의 인증 상태를 악용해 사용자의 의지와 무관한 요청을 서버에 보내게 하는 공격은?<\/p>","c":["Smurf","CSRF","SQL 삽입","XSS"],"a":1,"e":"<p>CSRF(사이트 간 요청 위조)의 설명이다.<\/p>"},{"s":"<p>SQL 삽입 공격을 방지하는 방법으로 가장 적절한 것은?<\/p>","c":["쿼리 오류 메시지를 사용자에게 상세히 노출한다.","입력 값을 SQL 문자열에 그대로 이어 붙인다.","DB 계정에 모든 권한을 부여한다.","사용자 입력을 바인딩 변수로 처리한다."],"a":3,"e":"<p>파라미터 바인딩을 사용하면 입력이 SQL 코드로 해석되지 않는다.<\/p>"},{"s":"<p>스택에서 카나리 값을 검사해 버퍼 오버플로를 탐지하는 기법은?<\/p>","c":["스택 가드","세션 고정","트로이 목마","패킷 필터링"],"a":0,"e":"<p>스택
