c":["시스템 분할","인터페이스 정의","모듈 내부의 처리 로직","시스템의 전체 구조"],"a":2,"e":"<p>모듈 내부 로직과 세부 알고리즘은 하위 설계에서 다룬다.<\/p>"},{"s":"<p>시스템을 구성하는 기본 요소로 볼 수 없는 것은?<\/p>","c":["피드백","제어","입력","유지보수"],"a":3,"e":"<p>시스템의 구성 요소는 입력, 처리, 출력, 제어, 피드백이다.<\/p>"},{"s":"<p>서비스 기획에서 대표 사용자 유형을 나타내도록 설정한 가상의 인물을 뜻하는 용어는?<\/p>","c":["액터","스테레오타입","프로토타입","페르소나"],"a":3,"e":"<p>페르소나는 사용자 유형을 대표하는 가상의 인물이다. 액터는 시스템과 상호작용하는 외부 존재다.<\/p>"}]},{"id":"ui-element","title":"UI 입력 요소와 터치 제스처","freq":"2024~2026 복원본에 Radio·Check·Combo 구분과 터치 제스처가 반복","concept":"<div class=\"tw\"><table><thead><tr><th>요소<\/th><th>용도<\/th><\/tr><\/thead><tbody><tr><td>라디오 버튼<\/td><td>여러 항목 중 <strong>하나만<\/strong> 선택 (성별 등)<\/td><\/tr><tr><td>체크 박스<\/td><td>여러 항목을 <strong>복수 선택<\/strong><\/td><\/tr><tr><td>콤보 박스<\/td><td>목록을 펼쳐 선택, 입력도 가능<\/td><\/tr><tr><td>리스트 박스<\/td><td>목록에서 선택<\/td><\/tr><tr><td>텍스트 박스<\/td><td>문자 입력<\/td><\/tr><tr><td>명령 버튼<\/td><td>명령을 실행 (값 선택용이 아님)<\/td><\/tr><\/tbody><\/table><\/div><p><strong>터치 제스처<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>제스처<\/th><th>동작<\/th><\/tr><\/thead><tbody><tr><td>Tap<\/td><td>짧게 한 번 누름<\/td><\/tr><tr><td>Double Tap<\/td><td>두 번 연속 누름<\/td><\/tr><tr><td>Press (Long Press)<\/td><td>길게 누름<\/td><\/tr><tr><td>Drag<\/td><td>누른 채 이동<\/td><\/tr><tr><td>Pan<\/td><td>화면을 누른 채 이동해 시점을 이동<\/td><\/tr><tr><td>Flick<\/td><td>빠르게 쓸어 넘김<\/td><\/tr><tr><td>Swipe<\/td><td>화면을 손가락으로 쓸어 넘김<\/td><\/tr><tr><td>Pinch<\/td><td>두 손가락을 모으거나 벌려 확대·축소<\/td><\/tr><\/tbody><\/table><\/div><p>Click, Double Click, Right Click, Rollover는 마우스 조작이다.<\/p>","qs":[{"s":"<p>여러 항목 가운데 하나만 고르게 할 때 가장 적합한 UI 요소는?<\/p>","c":["체크 박스","텍스트 박스","명령 버튼","라디오 버튼"],"a":3,"e":"<p>하나만 고르면 라디오 버튼, 여러 개를 고르면 체크 박스를 쓴다.<\/p>"},{"s":"<p>관심 분야를 여러 개 고를 수 있게 하려 할 때 가장 적합한 UI 요소는?<\/p>","c":["명령 버튼","라디오 버튼","체크 박스","레이블"],"a":2,"e":"<p>복수 선택에는 체크 박스가 적합하다.<\/p>"},{"s":"<p>모바일 터치 제스처로 분류하기 어려운 것은?<\/p>","c":["Flick","Right Click","Pinch","Press"],"a":1,"e":"<p>Right Click은 마우스 조작이다.<\/p>"},{"s":"<p>두 손가락의 간격을 넓히거나 좁혀 화면을 확대·축소하는 제스처는?<\/p>","c":["Pinch","Drag","Double Tap","Tap"],"a":0,"e":"<p>두 손가락을 모으거나 벌리는 동작이 Pinch다.<\/p>"},{"s":"<p>화면을 빠르게 튕기듯 쓸어 넘기는 제스처는?<\/p>","c":["Flick","Press","Pinch","Double Tap"],"a":0,"e":"<p>빠르게 쓸어 넘기는 동작은 Flick이다.<\/p>"}]},{"id":"test-hard","title":"테스트 심화: 오류 용어·하네스·자동 생성·커버리지 계산","freq":"2024~2026 복원본에 테스트 하네스, 자동 생성, 커버리지 비율 계산이 등장","concept":"<div class=\"tw\"><table><thead><tr><th>용어<\/th><th>뜻<\/th><\/tr><\/thead><tbody><tr><td>오류 (Error)<\/td><td>결함의 원인이 되는 <strong>사람의 실수<\/strong><\/td><\/tr><tr><td>결함 (Defect, Fault)<\/td><td>오류로 생긴 제품 안의 문제<\/td><\/tr><tr><td>실패 (Failure)<\/td><td>결함이 실행되어 기대와 다르게 동작<\/td><\/tr><\/tbody><\/table><\/div><p><strong>테스트 하네스 구성 요소<\/strong>: 테스트 드라이버, 테스트 스텁, 테스트 슈트(케이스의 묶음), 테스트 케이스, 테스트 스크립트, 목 오브젝트(Mock Object).<\/p><p><strong>테스트 케이스 자동 생성 도구의 방법<\/strong>: 자료 흐름도, 기능 테스트, 입력 도메인 분석, 랜덤 테스트.<\/p><p><strong>하향식 통합의 순서<\/strong>: 깊이 우선은 한 가지를 끝까지 통합한 뒤 다음 가지로, 너비 우선은 같은 레벨을 먼저 통합한다.<\/p><p><strong>페어와이즈 (Pairwise)<\/strong>: 테스트 데이터의 모든 값 쌍이 최소 한 번씩 조합되도록 한다.<\/p><p><strong>커버리지 비율<\/strong> = 수행된 항목 수 ÷ 전체 항목 수 × 100. <code>if<\/code> 문 하나는 참·거짓 두 분기를 만든다.<\/p><p><strong>정적 분석 도구<\/strong>: 코드를 실행하지 않고 코딩 규칙 위반과 잠재 결함을 찾는다. 실제 입력에 의한 결과 확인은 동적 테스트의 일이다.<\/p>","qs":[{"s":"<p>소프트웨어 테스트 용어 중 개발자의 착오처럼 사람이 저지른 실수를 뜻하는 것은?<\/p>","c":["결함(Defect)","오류(Error)","테스트 오라클(Oracle)","실패(Failure)"],"a":1,"e":"<p>사람의 실수가 오류이고, 그 결과 제품 속에 생긴 것이 결함, 실행 시 드러나면 실패다.<\/p>"},{"s":"<p>테스트 하네스를 이루는 요소로 볼 수 없는 것은?<\/p>","c":["테스트 슈트","테스트 드라이버","목 오브젝트","캐시 메모리"],"a":3,"e":"<p>테스트 하네스는 드라이버, 스텁, 슈트, 케이스, 스크립트, 목 오브젝트로 구성된다.<\/p>"},{"s":"<p>입력 데이터를 자동으로 만들어 주는 테스트 도구의 동작 원리로 볼 수 없는 것은?<\/p>","c":["스텁과 드라이버","입력 도메인 분석","랜덤 테스트","자료 흐름도"],"a":0,"e":"<p>스텁과 드라이버는 미완성 모듈을 대신하는 테스트 하네스 구성 요소로, 테스트 데이터를 찾는 방법이 아니다.<\/p>"},{"s":"<p>어떤 함수에 독립된 <code>if<\/code> 문이 2개 있다. 수행한 테스트가 전체 분기 중 3개를 지났다면 분기 커버리지는?<\/p>","c":["25%","50%","75%","100%"],"a":2,"e":"<p><code>if<\/code> 2개는 분기 4개를 만들므로 3 ÷ 4 = 75%다.<\/p>"},{"s":"<p>M1이 M2, M3을 호출하고 M2가 M4, M5를 호출한다. 깊이 우선 하향식 통합 순서는? (같은 레벨은 번호 순서로 한다)<\/p>","c":["M1 → M3 → M2 → M4 → M5","M4 → M5 → M2 → M3 → M1","M1 → M2 → M3 → M4 → M5","M1 → M2 → M4 → M5 → M3"],"a":3,"e":"<p>M2 가지를 끝까지 통합한 뒤 M3로 넘어간다. 너비 우선이면 M1, M2, M3, M4, M5 순서다.<\/p>"}]},{"id":"ds-hard2","title":"자료구조 심화: 스택 출력 판정·해시 함수·트리 차수","freq":"스택 순서 판정과 해시 함수 종류를 고르는 문항이 2024~2026 복원본에 반복","concept":"<p><strong>스택 출력 순서 판정<\/strong>: 입력 순서대로 Push하다가 임의 시점에 Pop한다. 어떤 값이 나왔다면, 그 값보다 <strong>먼저 들어가 아직 남은 값들은 역순으로만<\/strong> 나올 수 있다.<\/p><p>예: A, B, C, D 입력에서 <code>C, A, ...<\/code>는 불가능하다. C가 나올 때 스택에 A, B가 남고, B가 A보다 먼저 나와야 하기 때문이다.<\/p><p><strong>스택 활용<\/strong>: 함수 호출, 재귀, 수식 계산, 후위 변환, 되돌리기. 선입선출 작업 대기열은 큐의 활용이다.<\/p><p><strong>해시 함수의 종류<\/strong>: 제산법, 제곱법, 폴딩법, 기수 변환법, 대수적 코딩법, 숫자 분석법, 무작위법. 선형 조사(탐사)와 체이닝은 해시 함수가 아니라 <strong>충돌 해결 기법<\/strong>이다.<\/p><p><strong>트리 용어<\/strong>: 노드의 차수는 자식 수, 트리의 차수는 노드 차수의 <strong>최댓값<\/strong>이다. 차수가 0이면 단말 노드다.<\/p><p><strong>블록 탐색<\/strong>: 데이터를 블록으로 나누고 인덱스로 블록을 찾은 뒤 그 안을 탐색한다. <strong>보간 탐색<\/strong>은 키 값의 위치를 비례식으로 추정한다.<\/p>","qs":[{"s":"<p>1, 2, 3, 4를 순서대로 스택에 넣으면서 중간중간 꺼낼 때 나올 수 없는 순서는?<\/p>","c":["3, 4, 2, 1","1, 3, 2, 4","4, 3, 2, 1","4, 1, 2, 3"],"a":3,"e":"<p>4가 먼저 나오면 1, 2, 3이 스택에 쌓여 있으므로 다음 값은 3이어야 한다.<\/p>"},{"s":"<p>P, Q, R, S를 입력 순서로 Push, Pop, Push, Push, Pop, Push, Pop, Pop 할 때의 출력 순서는?<\/p>","c":["P, Q, R, S","P, S, R, Q","P, R, S, Q","Q, P, S, R"],"a":2,"e":"<p>P가 바로 나가고, Q와 R을 넣어 R을 꺼낸다. S를 넣어 S를 꺼내고 마지막에 Q를 꺼낸다.<\/p>"},{"s":"<p>해시 함수의 종류로 볼 수 없는 것은?<\/p>","c":["체이닝","폴딩법","제산법","제곱법"],"a":0,"e":"<p>체이닝은 충돌을 처리하는 기법이다.<\/p>"},{"s":"<p>노드별 자식 수가 A 3개, B 2개, C 0개, D 1개이고 나머지 노드는 단말일 때 트리의 차수는?<\/p>","c":["1","2","3","6"],"a":2,"e":"<p>트리의 차수는 노드 차수 중 최댓값이다.<\/p>"},{"s":"<p>자료를 일정한 묶음으로 나누어 인덱스로 묶음을 찾고 그 안을 살펴보는 탐색은?<\/p>","c":["블록 탐색","보간 탐색","깊이 우선 탐색","순차 탐색"],"a":0,"e":"<p>인덱스로 블록을 찾고 블록 내부를 탐색하는 방식이 블록 탐색이다.<\/p>"}]},{"id":"schedule-cpm","title":"일정 계산과 팀 구성: CPM·PERT·브룩스 법칙","freq":"2027 출제기준에 이름은 없지만 2025·2026 복원본에 CPM 계산과 브룩스 법칙이 등장","concept":"<p><strong>CPM<\/strong>: 작업 네트워크에서 시작부터 끝까지 <strong>가장 긴 경로가 임계 경로<\/strong>이고, 그 길이가 프로젝트의 최소 완료 기간이다.<\/p><p><strong>PERT<\/strong>: 작업 기간의 불확실성을 3점 추정으로 계산한다. <code>기대 기간 = (낙관치 + 4 × 중간치(최빈치) + 비관치) ÷ 6<\/code>. 문제에 따라 중간치를 기대치로 쓰기도 한다.<\/p><p><strong>간트 차트<\/strong>: 작업 일정을 수평 막대로 표시한다. 막대 길이가 작업 기간이다.<\/p><p><strong>브룩스의 법칙<\/strong>: 지연 중인 프로젝트에 인력을 추가 투입하면 의사소통 비용이 늘어 <strong>더 지연<\/strong>된다.<\/p><p><strong>팀 구성<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>형태<\/th><th>특징<\/th><\/tr><\/thead><tbody><tr><td>책임 프로그래머 팀 (치프 프로그래머 팀, Chief Programmer Team)<\/td><td>책임 프로그래머가 중심, 소규모·단기 프로젝트<\/td><\/tr><tr><td>민주주의식 팀<\/td><td>동등한 팀원, 의사 결정 공유<\/td><\/tr><tr><td>계층형 팀<\/td><td>관리자·고급·초급 계층<\/td><\/tr><\/tbody><\/table><\/div><p><strong>이 유형의 작업 예시<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>작업<\/th><th>기간(일)<\/th><th>선행 작업<\/th><\/tr><\/thead><tbody><tr><td>A<\/td><td>3<\/td><td>없음<\/td><\/tr><tr><td>B<\/td><td>4<\/td><td>A<\/td><\/tr><tr><td>C<\/td><td>2<\/td><td>A<\/td><\/tr><tr><td>D<\/td><td>5<\/td><td>B, C<\/td><\/tr><\/tbody><\/table><\/div>","qs":[{"s":"<p>위 작업 예시의 프로젝트 최소 완료 기간은?<\/p>","c":["14일","9일","12일","10일"],"a":2,"e":"<p>가장 긴 경로는 A, B, D로 3 + 4 + 5 = 12일이다.<\/p>"},{"s":"<p>위 작업 예시의 임계 경로는?<\/p>","c":["B → C → D","A → B → D","A → C → D","A → B → C → D"],"a":1,"e":"<p>A, B, D 경로가 12일로 가장 길다.<\/p>"},{"s":"<p>어떤 작업의 낙관치가 4일, 중간치(최빈치)가 6일, 비관치가 14일일 때 PERT 기대 기간은?<\/p>","c":["8일","24일","6일","7일"],"a":3,"e":"<p>(4 + 4 × 6 + 14) ÷ 6 = 7일이다.<\/p>"},{"s":"<p>일정이 늦어진 프로젝트 후반에 인원을 늘리면 오히려 더 지연된다는 경험 법칙은?<\/p>","c":["브룩스의 법칙","무어의 법칙","파레토의 법칙","살충제 패러독스"],"a":0,"e":"<p>브룩스의 법칙이다. 파레토의 법칙은 결함 집중 원리의 근거로 쓰이는 80:20 경험 법칙이다.<\/p>"},{"s":"<p>책임 프로그래머 팀에 대한 설명으로 옳은 것은?<\/p>","c":["모든 팀원이 동등하게 의사 결정을 공유한다.","관리자, 고급, 초급의 여러 계층으로 나뉜다.","책임 프로그래머를 중심으로 의사 결정이 이루어진다.","형상 통제 위원회를 뜻하는 다른 이름이다."],"a":2,"e":"<p>책임 프로그래머 팀은 한 사람이 중심이 되는 구조다. 동등한 의사 결정은 민주주의식 팀의 특징이다.<\/p>"}]},{"id":"quality-reuse","title":"품질 부특성·재사용 방식·비용 산정 보충","freq":"품질 부특성과 LOC 3점 추정, 합성 중심 재사용이 2024~2026 복원본에 등장","concept":"<p><strong>ISO/IEC 9126 주특성과 부특성<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>주특성<\/th><th>부특성<\/th><\/tr><\/thead><tbody><tr><td>기능성<\/td><td>적합성, 정확성, 상호 운용성, 보안성, 준수성<\/td><\/tr><tr><td>신뢰성<\/td><td>성숙성, 결함 허용성, 회복성, 준수성<\/td><\/tr><tr><td>사용성<\/td><td>이해성, 학습성, 운용성, 친밀성, 준수성<\/td><\/tr><tr><td>효율성<\/td><td>시간 효율성, 자원 활용성, 준수성<\/td><\/tr><tr><td>유지보수성<\/td><td>분석성, 변경성, 안정성, 시험성, 준수성<\/td><\/tr><tr><td>이식성<\/td><td>적응성, 설치성, 공존성, 대체성, 준수성<\/td><\/tr><\/tbody><\/table><\/div><p><strong>재사용 방식<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>방식<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>합성 중심 (블록 구성)<\/td><td>전자 칩처럼 <strong>부품을 조립<\/strong><\/td><\/tr><tr><td>생성 중심 (패턴 구성)<\/td><td>추상화된 형태로 쓰인 명세로 <strong>패턴을 구성<\/strong><\/td><\/tr><\/tbody><\/table><\/div><p><strong>LOC 예측치<\/strong>: 낙관치, 기대치, 비관치를 사용한다. 추정 LOC = (낙관치 + 4 × 기대치 + 비관치) ÷ 6.<\/p><p><strong>하향식 비용 산정<\/strong>: 전문가 감정(조직 내 경험 많은 전문가에게 비용 산정을 의뢰. 수험서는 보통 두 명 이상으로 설명하며, 빠르지만 주관적), 델파이(여러 전문가의 의견을 <strong>조정자<\/strong>가 종합).<\/p><p>SWOT은 경영 전략 분석 기법이라 비용 산정 모델이 아니다.<\/p><p><strong>CASE의 원천 기술<\/strong>: 구조적 기법, 프로토타이핑, 자동 프로그래밍, 정보 저장소, 분산 처리.<\/p>","qs":[{"s":"<p>ISO/IEC 9126에서 기능성의 부특성이 아닌 것은?<\/p>","c":["회복성","보안성","적합성","상호 운용성"],"a":0,"e":"<p>회복성은 신뢰성의 부특성이다.<\/p>"},{"s":"<p>기성 모듈을 가져와 연결만으로 새 제품을 구성하는 블록 조립식 재사용의 유형은?<\/p>","c":["합성 중심","생성 중심","분리 중심","구조 중심"],"a":0,"e":"<p>부품을 조립하면 합성 중심, 패턴을 구성하면 생성 중심이다.<\/p>"},{"s":"<p>LOC 기법의 추정에 쓰는 값이 아닌 것은?<\/p>","c":["낙관치","측정치","기대치","비관치"],"a":1,"e":"<p>LOC 기법은 낙관치, 기대치, 비관치로 추정한다.<\/p>"},{"s":"<p>비용 산정 기법 중 전문가 감정의 편향을 줄이기 위해 조정자가 여러 전문가의 의견을 종합하는 기법은?<\/p>","c":["LOC 기법","COCOMO 모형","Putnam 모형","델파이 기법"],"a":3,"e":"<p>델파이 기법은 조정자를 두어 여러 전문가의 판단을 종합한다.<\/p>"},{"s":"<p>소프트웨어 비용 산정 방법으로 사용하지 않는 것은?<\/p>","c":["SWOT 분석","기능 점수","COCOMO","전문가 감정"],"a":0,"e":"<p>SWOT은 강점, 약점, 기회, 위협을 분석하는 경영 전략 기법이다.<\/p>"}]}]},{"title":"2과목 데이터베이스 구축","desc":"20문항. SQL, 논리·물리 설계, 정규화, 트랜잭션, 데이터 전환을 다룬다.","types":[{"id":"sql-ddl","title":"DDL: CREATE·ALTER·DROP","freq":"DDL 약 7문항. 제약 조건과 CASCADE·RESTRICT 옵션이 반복","concept":"<p>SQL은 <strong>DDL(정의), DML(조작), DCL(제어)<\/strong>로 나뉜다.<\/p><div class=\"tw\"><table><thead><tr><th>명령<\/th><th>기능<\/th><\/tr><\/thead><tbody><tr><td><code>CREATE<\/code><\/td><td>테이블, 뷰, 인덱스, 스키마, 도메인 생성<\/td><\/tr><tr><td><code>ALTER<\/code><\/td><td>테이블 구조 변경 (ADD, MODIFY, DROP)<\/td><\/tr><tr><td><code>DROP<\/code><\/td><td>객체 삭제<\/td><\/tr><tr><td><code>TRUNCATE<\/code><\/td><td>테이블의 모든 행을 빠르게 삭제<\/td><\/tr><\/tbody><\/table><\/div><p><strong>CREATE TABLE 제약 조건<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>제약<\/th><th>의미<\/th><\/tr><\/thead><tbody><tr><td><code>PRIMARY KEY<\/code><\/td><td>기본키<\/td><\/tr><tr><td><code>FOREIGN KEY ... REFERENCES<\/code><\/td><td>외래키<\/td><\/tr><tr><td><code>UNIQUE<\/code><\/td><td>중복 불가<\/td><\/tr><tr><td><code>NOT NULL<\/code><\/td><td>NULL 불가<\/td><\/tr><tr><td><code>CHECK<\/code><\/td><td>값의 조건<\/td><\/tr><tr><td><code>DEFAULT<\/code><\/td><td>기본값<\/td><\/tr><\/tbody><\/table><\/div><p><strong>참조 옵션<\/strong><\/p><ul><li><code>ON DELETE CASCADE<\/code>: 참조 테이블의 튜플을 지우면 참조하는 튜플도 삭제.<\/li><li><code>ON DELETE SET NULL<\/code>: 참조하는 값을 NULL로 변경.<\/li><li><code>ON DELETE RESTRICT<\/code>: 참조 중이면 삭제를 제한.<\/li><\/ul><p><strong>DROP 옵션<\/strong>: <code>CASCADE<\/code>는 참조하는 객체까지 함께 삭제, <code>RESTRICT<\/code>는 참조 중이면 삭제 취소.<\/p><ul><li>테이블은 <code>DROP TABLE<\/code>, 행은 <code>DELETE<\/code>. DELETE는 DML, DROP·TRUNCATE는 DDL이다.<\/li><\/ul>","qs":[{"s":"<p>SQL 명령어의 분류가 나머지와 다른 것은?<\/p>","c":["UPDATE","ALTER","CREATE","DROP"],"a":0,"e":"<p>UPDATE는 DML이고 나머지는 DDL이다.<\/p>"},{"s":"<p>테이블을 삭제할 때 해당 테이블을 참조하는 객체까지 함께 삭제하는 옵션은?<\/p>","c":["UNIQUE","DISTINCT","RESTRICT","CASCADE"],"a":3,"e":"<p>CASCADE는 참조 객체까지 삭제하고, RESTRICT는 참조 중이면 삭제를 취소한다.<\/p>"},{"s":"<p>테이블 [학생]에 <code>주소<\/code> 열을 추가하는 SQL문으로 옳은 것은?<\/p>","c":["UPDATE TABLE 학생 ADD 주소 VARCHAR(50);","ALTER TABLE 학생 ADD 주소 VARCHAR(50);","INSERT INTO 학생 ADD 주소 VARCHAR(50);","CREATE TABLE 학생 ADD 주소 VARCHAR(50);"],"a":1,"e":"<p>테이블 구조 변경은 ALTER TABLE을 사용한다.<\/p>"},{"s":"<p>속성 값의 범위 조건을 지정하기 위해 사용하는 제약 조건은?<\/p>","c":["UNIQUE","FOREIGN KEY","CHECK","PRIMARY KEY"],"a":2,"e":"<p>값의 범위 조건은 CHECK로 지정한다.<\/p>"},{"s":"<p>부서 테이블의 튜플이 삭제될 때 이를 참조하는 사원 튜플도 함께 삭제되도록 하는 옵션은?<\/p>","c":["ON DELETE SET NULL","ON DELETE CASCADE","ON DELETE RESTRICT","ON UPDATE NO ACTION"],"a":1,"e":"<p>ON DELETE CASCADE는 참조 튜플을 함께 삭제한다.<\/p>"}]},{"id":"sql-dml","title":"DML과 DCL·TCL","freq":"DML·DCL 구분, GRANT/REVOKE 구문, COMMIT/ROLLBACK이 반복","concept":"<div class=\"tw\"><table><thead><tr><th>분류<\/th><th>명령<\/th><\/tr><\/thead><tbody><tr><td>DML<\/td><td>SELECT, INSERT, UPDATE, DELETE<\/td><\/tr><tr><td>DCL<\/td><td>GRANT, REVOKE (기출은 COMMIT, ROLLBACK도 DCL로 분류)<\/td><\/tr><tr><td>TCL<\/td><td>COMMIT, ROLLBACK, SAVEPOINT<\/td><\/tr><\/tbody><\/table><\/div><p><strong>형식<\/strong><\/p><pre class=\"code\" data-lang=\"\"><code>INSERT INTO 테이블(속성) VALUES (값);\nUPDATE 테이블 SET 속성 = 값 WHERE 조건;\nDELETE FROM 테이블 WHERE 조건;\nSELECT 속성 FROM 테이블 WHERE 조건;<\/code><\/pre><p><strong>권한<\/strong><\/p><pre class=\"code\" data-lang=\"\"><code>GRANT 권한 ON 객체 TO 사용자 [WITH GRANT OPTION];\nREVOKE [GRANT OPTION FOR] 권한 ON 객체 FROM 사용자 [CASCADE];<\/code><\/pre><ul><li><code>WITH GRANT OPTION<\/code>: 받은 권한을 다른 사용자에게 부여할 수 있음.<\/li><li><code>GRANT CREATE TABLE TO PARK;<\/code> 처럼 시스템 권한은 <code>ON<\/code>을 쓰지 않는다.<\/li><li><code>COMMIT<\/code>: 변경 확정. <code>ROLLBACK<\/code>: 변경 취소. <code>SAVEPOINT<\/code>: 되돌릴 지점 지정.<\/li><\/ul>","qs":[{"s":"<p>사용자 <code>KIM<\/code>에게 [학생] 테이블의 조회 권한을 부여하는 SQL문은?<\/p>","c":["GRANT SELECT ON 학생 TO KIM;","REVOKE SELECT ON 학생 TO KIM;","ALLOW SELECT ON 학생 FOR KIM;","GRANT SELECT TO 학생 ON KIM;"],"a":0,"e":"<p>GRANT 권한 ON 객체 TO 사용자 형식이다.<\/p>"},{"s":"<p>GRANT 문 끝에 붙이면 권한을 받은 사용자가 또 다른 사용자에게 넘겨줄 수 있게 되는 절은?<\/p>","c":["CASCADE","DISTINCT","WITH GRANT OPTION","WITH CHECK OPTION"],"a":2,"e":"<p>WITH GRANT OPTION을 지정하면 권한을 재부여할 수 있다.<\/p>"},{"s":"<p>다음 SQL문을 실행한 뒤 [상품] 테이블의 재고 합계는?<\/p><div class=\"tw\"><table><thead><tr><th>코드<\/th><th>재고<\/th><\/tr><\/thead><tbody><tr><td>A<\/td><td>10<\/td><\/tr><tr><td>B<\/td><td>20<\/td><\/tr><tr><td>C<\/td><td>30<\/td><\/tr><\/tbody><\/table><\/div><div class=\"dbs\"><figure class=\"dbt\"><figcaption>[상품]<\/figcaption><div class=\"tw\"><table><thead><tr><th>코드<\/th><th>재고<\/th><\/tr><\/thead><tbody><tr><td>A<\/td><td>10<\/td><\/tr><tr><td>B<\/td><td>20<\/td><\/tr><tr><td>C<\/td><td>30<\/td><\/tr><\/tbody><\/table><\/div><\/figure><\/div><pre class=\"code\" data-lang=\"sql\"><code><span class=\"tk\">UPDATE<\/span> 상품 <span class=\"tk\">SET<\/span> 재고 = 재고 + 5 <span class=\"tk\">WHERE<\/span> 재고 &gt;= 20;\n<span class=\"tk\">SELECT<\/span> <span class=\"tk\">SUM<\/span>(재고) <span class=\"tk\">FROM<\/span> 상품;<\/code><\/pre>","c":["60","65","70","75"],"a":2,"e":"<p>B와 C만 5씩 늘어 10 + 25 + 35 = 70이다.<\/p>"},{"s":"<p>트랜잭션의 변경을 취소하고 이전 상태로 되돌리는 명령어는?<\/p>","c":["SELECT","COMMIT","GRANT","ROLLBACK"],"a":3,"e":"<p>ROLLBACK은 변경 사항을 취소한다.<\/p>"},{"s":"<p>다음 SQL문을 실행한 뒤 [회원] 테이블에 남는 행의 수는?<\/p><div class=\"tw\"><table><thead><tr><th>번호<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>골드<\/td><\/tr><tr><td>2<\/td><td>실버<\/td><\/tr><tr><td>3<\/td><td>실버<\/td><\/tr><tr><td>4<\/td><td>브론즈<\/td><\/tr><\/tbody><\/table><\/div><div class=\"dbs\"><figure class=\"dbt\"><figcaption>[회원]<\/figcaption><div class=\"tw\"><table><thead><tr><th>번호<\/th><th>등급<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>골드<\/td><\/tr><tr><td>2<\/td><td>실버<\/td><\/tr><tr><td>3<\/td><td>실버<\/td><\/tr><tr><td>4<\/td><td>브론즈<\/td><\/tr><\/tbody><\/table><\/div><\/figure><\/div><pre class=\"code\" data-lang=\"sql\"><code><span class=\"tk\">DELETE<\/span> <span class=\"tk\">FROM<\/span> 회원 <span class=\"tk\">WHERE<\/span> 등급 = <span class=\"ts\">'실버'<\/span>;\n<span class=\"tk\">SELECT<\/span> <span class=\"tk\">COUNT<\/span>(*) <span class=\"tk\">FROM<\/span> 회원;<\/code><\/pre>","c":["1","2","3","4"],"a":1,"e":"<p>실버 등급 2행이 삭제되어 2행이 남는다.<\/p>"}]},{"id":"sql-select","title":"SELECT 조건 조회","freq":"SQL 약 35문항으로 DB 과목 최다. 조건식, LIKE, ORDER BY, DISTINCT가 반복","concept":"<pre class=\"code\" data-lang=\"\"><code>SELECT [DISTINCT] 속성\nFROM 테이블\nWHERE 조건\nGROUP BY 속성 HAVING 조건\nORDER BY 속성 [ASC|DESC];<\/code><\/pre><div class=\"tw\"><table><thead><tr><th>문법<\/th><th>의미<\/th><\/tr><\/thead><tbody><tr><td><code>LIKE 'A%'<\/code><\/td><td>A로 시작 (% 는 0글자 이상)<\/td><\/tr><tr><td><code>LIKE '_A%'<\/code><\/td><td>두 번째 글자가 A (_ 는 정확히 1글자)<\/td><\/tr><tr><td><code>IN (a, b)<\/code><\/td><td>목록 중 하나<\/td><\/tr><tr><td><code>BETWEEN a AND b<\/code><\/td><td>a 이상 b 이하<\/td><\/tr><tr><td><code>IS NULL<\/code><\/td><td>NULL 판별 (<code>= NULL<\/code>은 쓰지 않음)<\/td><\/tr><tr><td><code>DISTINCT<\/code><\/td><td>중복 제거<\/td><\/tr><tr><td><code>ORDER BY 속성 DESC<\/code><\/td><td>내림차순<\/td><\/tr><\/tbody><\/table><\/div><p><strong>실행 순서<\/strong>: FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY<\/p><p><strong>예시 테이블 [사원]<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>이름<\/th><th>부서<\/th><th>급여<\/th><\/tr><\/thead><tbody><tr><td>김<\/td><td>영업<\/td><td>300<\/td><\/tr><tr><td>이<\/td><td>개발<\/td><td>500<\/td><\/tr><tr><td>박<\/td><td>개발<\/td><td>400<\/td><\/tr><tr><td>최<\/td><td>영업<\/td><td>200<\/td><\/tr><tr><td>정<\/td><td>인사<\/td><td>350<\/td><\/tr><\/tbody><\/table><\/div>","qs":[{"s":"<p>위 개념의 [사원] 테이블에 다음 SQL문을 실행한 결과는?<\/p><div class=\"dbs\"><figure class=\"dbt\"><figcaption>[사원]<\/figcaption><div class=\"tw\"><table><thead><tr><th>이름<\/th><th>부서<\/th><th>급여<\/th><\/tr><\/thead><tbody><tr><td>김<\/td><td>영업<\/td><td>300<\/td><\/tr><tr><td>이<\/td><td>개발<\/td><td>500<\/td><\/tr><tr><td>박<\/td><td>개발<\/td><td>400<\/td><\/tr><tr><td>최<\/td><td>영업<\/td><td>200<\/td><\/tr><tr><td>정<\/td><td>인사<\/td><td>350<\/td><\/tr><\/tbody><\/table><\/div><\/figure><\/div><pre class=\"code\" data-lang=\"sql\"><code><span class=\"tk\">SELECT<\/span> <span class=\"tk\">COUNT<\/span>(*) <span class=\"tk\">FROM<\/span> 사원 <span c s=\"dbt\"><figcaption>[판매]<\/figcaption><div class=\"tw\"><table><thead><tr><th>지점<\/th><th>제품<\/th><th>수량<\/th><\/tr><\/thead><tbody><tr><td>강남<\/td><td>A<\/td><td>10<\/td><\/tr><tr><td>강남<\/td><td>B<\/td><td>30<\/td><\/tr><tr><td>강북<\/td><td>A<\/td><td>20<\/td><\/tr><tr><td>강북<\/td><td>B<\/td><td>5<\/td><\/tr><tr><td>서초<\/td><td>A<\/td><td>40<\/td><\/tr><\/tbody><\/table><\/div><\/figure><\/div>","c":["SELECT 지점, MAX(수량) FROM 판매 GROUP BY 지점 ORDER BY 지점;","SELECT 지점, SUM(수량) FROM 판매 GROUP BY 제품 ORDER BY 지점;","SELECT 지점, COUNT(수량) FROM 판매 GROUP BY 지점 ORDER BY 지점;","SELECT 지점, SUM(수량) FROM 판매 GROUP BY 지점 ORDER BY 지점;"],"a":3,"e":"<p>지점별로 묶고 SUM으로 합계를 구한다. COUNT는 행 수, MAX는 최댓값이다.<\/p>"}]},{"id":"sql-join","title":"조인·서브쿼리·집합 연산","freq":"2027 고급 SQL 항목. 조인 결과 행 수와 집합 연산 차이가 출제","concept":"<div class=\"tw\"><table><thead><tr><th>조인<\/th><th>의미<\/th><\/tr><\/thead><tbody><tr><td><code>INNER JOIN<\/code><\/td><td>양쪽 조건 일치<\/td><\/tr><tr><td><code>LEFT OUTER JOIN<\/code><\/td><td>왼쪽은 전부, 오른쪽 일치만<\/td><\/tr><tr><td><code>RIGHT OUTER JOIN<\/code><\/td><td>오른쪽은 전부<\/td><\/tr><tr><td><code>FULL OUTER JOIN<\/code><\/td><td>양쪽 전부<\/td><\/tr><tr><td><code>CROSS JOIN<\/code><\/td><td>모든 조합 (m × n)<\/td><\/tr><tr><td>자연 조인<\/td><td>같은 이름의 속성으로 조인<\/td><\/tr><tr><td>등가 조인<\/td><td><code>=<\/code> 조건<\/td><\/tr><\/tbody><\/table><\/div><p><strong>서브쿼리<\/strong><\/p><ul><li><code>IN<\/code>: 결과 집합에 속함. <code>EXISTS<\/code>: 결과가 존재.<\/li><li><code>ANY<\/code>/<code>ALL<\/code>: 다중 결과와 비교.<\/li><li>단일 값 서브쿼리는 <code>=<\/code> 비교 가능.<\/li><\/ul><p><strong>집합 연산자<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>연산자<\/th><th>의미<\/th><\/tr><\/thead><tbody><tr><td><code>UNION<\/code><\/td><td>합집합, 중복 제거<\/td><\/tr><tr><td><code>UNION ALL<\/code><\/td><td>합집합, 중복 유지<\/td><\/tr><tr><td><code>INTERSECT<\/code><\/td><td>교집합<\/td><\/tr><tr><td><code>EXCEPT<\/code> (<code>MINUS<\/code>)<\/td><td>차집합<\/td><\/tr><\/tbody><\/table><\/div><p><strong>예시 테이블<\/strong> [학생](학번, 이름, 학과코드)와 [학과](코드, 학과명)<\/p><p>학생: (1, 김, A), (2, 이, B), (3, 박, Z)<br>학과: (A, 컴공), (B, 전자), (C, 기계)<\/p>","qs":[{"s":"<p>위 개념의 테이블로 다음 SQL문을 실행했을 때 출력되는 값은?<\/p><div class=\"dbs\"><figure class=\"dbt\"><figcaption>[학생]<\/figcaption><div class=\"tw\"><table><thead><tr><th>학번<\/th><th>이름<\/th><th>학과코드<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>김<\/td><td>A<\/td><\/tr><tr><td>2<\/td><td>이<\/td><td>B<\/td><\/tr><tr><td>3<\/td><td>박<\/td><td>Z<\/td><\/tr><\/tbody><\/table><\/div><\/figure><figure class=\"dbt\"><figcaption>[학과]<\/figcaption><div class=\"tw\"><table><thead><tr><th>코드<\/th><th>학과명<\/th><\/tr><\/thead><tbody><tr><td>A<\/td><td>컴공<\/td><\/tr><tr><td>B<\/td><td>전자<\/td><\/tr><tr><td>C<\/td><td>기계<\/td><\/tr><\/tbody><\/table><\/div><\/figure><\/div><pre class=\"code\" data-lang=\"sql\"><code><span class=\"tk\">SELECT<\/span> <span class=\"tk\">COUNT<\/span>(*) <span class=\"tk\">FROM<\/span> 학생 <span class=\"tk\">INNER<\/span> <span class=\"tk\">JOIN<\/span> 학과 <span class=\"tk\">ON<\/span> 학생.학과코드 = 학과.코드;<\/code><\/pre>","c":["2","3","6","9"],"a":0,"e":"<p>일치하는 행은 김과 이 두 명이다. 박의 Z는 학과에 없다.<\/p>"},{"s":"<p>같은 테이블로 다음 SQL문을 실행했을 때 출력되는 값은?<\/p><div class=\"dbs\"><figure class=\"dbt\"><figcaption>[학생]<\/figcaption><div class=\"tw\"><table><thead><tr><th>학번<\/th><th>이름<\/th><th>학과코드<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>김<\/td><td>A<\/td><\/tr><tr><td>2<\/td><td>이<\/td><td>B<\/td><\/tr><tr><td>3<\/td><td>박<\/td><td>Z<\/td><\/tr><\/tbody><\/table><\/div><\/figure><figure class=\"dbt\"><figcaption>[학과]<\/figcaption><div class=\"tw\"><table><thead><tr><th>코드<\/th><th>학과명<\/th><\/tr><\/thead><tbody><tr><td>A<\/td><td>컴공<\/td><\/tr><tr><td>B<\/td><td>전자<\/td><\/tr><tr><td>C<\/td><td>기계<\/td><\/tr><\/tbody><\/table><\/div><\/figure><\/div><pre class=\"code\" data-lang=\"sql\"><code><span class=\"tk\">SELECT<\/span> <span class=\"tk\">COUNT<\/span>(*) <span class=\"tk\">FROM<\/span> 학생 <span class=\"tk\">LEFT<\/span> <span class=\"tk\">OUTER<\/span> <span class=\"tk\">JOIN<\/span> 학과 <span class=\"tk\">ON<\/span> 학생.학과코드 = 학과.코드;<\/code><\/pre>","c":["2","3","4","6"],"a":1,"e":"<p>왼쪽 테이블의 3행이 모두 나온다.<\/p>"},{"s":"<p>튜플이 4개인 릴레이션 R과 튜플이 5개인 릴레이션 S를 CROSS JOIN한 결과의 튜플 수는?<\/p>","c":["4","5","9","20"],"a":3,"e":"<p>모든 조합이므로 4 × 5 = 20이다.<\/p>"},{"s":"<p>다음 SQL문을 실행했을 때 출력되는 값은?<\/p><p>T1(v): 1, 2, 3 / T2(v): 2, 3, 4<\/p><div class=\"dbs\"><figure class=\"dbt\"><figcaption>[T1]<\/figcaption><div class=\"tw\"><table><thead><tr><th>v<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><\/tr><tr><td>2<\/td><\/tr><tr><td>3<\/td><\/tr><\/tbody><\/table><\/div><\/figure><figure class=\"dbt\"><figcaption>[T2]<\/figcaption><div class=\"tw\"><table><thead><tr><th>v<\/th><\/tr><\/thead><tbody><tr><td>2<\/td><\/tr><tr><td>3<\/td><\/tr><tr><td>4<\/td><\/tr><\/tbody><\/table><\/div><\/figure><\/div><pre class=\"code\" data-lang=\"sql\"><code><span class=\"tk\">SELECT<\/span> <span class=\"tk\">COUNT<\/span>(*) <span class=\"tk\">FROM<\/span> (<span class=\"tk\">SELECT<\/span> v <span class=\"tk\">FROM<\/span> T1 <span class=\"tk\">UNION<\/span> <span class=\"tk\">SELECT<\/span> v <span class=\"tk\">FROM<\/span> T2);<\/code><\/pre>","c":["2","3","4","6"],"a":2,"e":"<p>UNION은 중복을 제거하므로 1, 2, 3, 4의 4행이다. UNION ALL이면 6행이다.<\/p>"},{"s":"<p>다음 SQL문의 실행 결과는? (행 구분은 /로 표시)<\/p><p>[사원](이름, 부서코드) : (김, 10), (이, 20), (박, 30)<br>[부서](코드, 지역) : (10, 서울), (20, 부산)<\/p><div class=\"dbs\"><figure class=\"dbt\"><figcaption>[사원]<\/figcaption><div class=\"tw\"><table><thead><tr><th>이름<\/th><th>부서코드<\/th><\/tr><\/thead><tbody><tr><td>김<\/td><td>10<\/td><\/tr><tr><td>이<\/td><td>20<\/td><\/tr><tr><td>박<\/td><td>30<\/td><\/tr><\/tbody><\/table><\/div><\/figure><figure class=\"dbt\"><figcaption>[부서]<\/figcaption><div class=\"tw\"><table><thead><tr><th>코드<\/th><th>지역<\/th><\/tr><\/thead><tbody><tr><td>10<\/td><td>서울<\/td><\/tr><tr><td>20<\/td><td>부산<\/td><\/tr><\/tbody><\/table><\/div><\/figure><\/div><pre class=\"code\" data-lang=\"sql\"><code><span class=\"tk\">SELECT<\/span> 이름 <span class=\"tk\">FROM<\/span> 사원 <span class=\"tk\">WHERE<\/span> 부서코드 <span class=\"tk\">IN<\/span> (<span class=\"tk\">SELECT<\/span> 코드 <span class=\"tk\">FROM<\/span> 부서 <span class=\"tk\">WHERE<\/span> 지역 = <span class=\"ts\">'부산'<\/span>);<\/code><\/pre>","c":["박","이","김 / 이","김"],"a":1,"e":"<p>서브쿼리 결과는 20이고, 부서코드가 20인 사원은 이다.<\/p>"}]},{"id":"sql-window","title":"윈도우 함수·그룹 함수","freq":"2027 출제기준에 명시된 항목. RANK 종류와 ROLLUP·CUBE 차이가 핵심","concept":"<p><strong>윈도우 함수<\/strong>: <code>함수() OVER (PARTITION BY 속성 ORDER BY 속성)<\/code><\/p><div class=\"tw\"><table><thead><tr><th>함수<\/th><th>동점 처리<\/th><th>예 (값 90, 90, 80)<\/th><\/tr><\/thead><tbody><tr><td><code>RANK()<\/code><\/td><td>공동 순위 다음은 건너뜀<\/td><td>1, 1, 3<\/td><\/tr><tr><td><code>DENSE_RANK()<\/code><\/td><td>공동 순위 다음은 이어짐<\/td><td>1, 1, 2<\/td><\/tr><tr><td><code>ROW_NUMBER()<\/code><\/td><td>고유 번호<\/td><td>1, 2, 3<\/td><\/tr><\/tbody><\/table><\/div><p>행 순서 함수: <code>LAG<\/code>(이전 행), <code>LEAD<\/code>(다음 행), <code>FIRST_VALUE<\/code>, <code>LAST_VALUE<\/code>.<br>집계 윈도우: <code>SUM() OVER (...)<\/code>로 누적·소계를 구한다.<\/p><p><strong>그룹 함수 (GROUP BY의 확장)<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>함수<\/th><th>결과<\/th><\/tr><\/thead><tbody><tr><td><code>ROLLUP(A, B)<\/code><\/td><td>(A,B), (A), 전체 — 소계·총합 <strong>계층적<\/strong><\/td><\/tr><tr><td><code>CUBE(A, B)<\/code><\/td><td>(A,B), (A), (B), 전체 — <strong>모든 조합<\/strong><\/td><\/tr><tr><td><code>GROUPING SETS<\/code><\/td><td>지정한 조합만<\/td><\/tr><\/tbody><\/table><\/div><ul><li>ROLLUP의 그룹 수는 n+1, CUBE의 그룹 수는 2ⁿ이다.<\/li><\/ul>","qs":[{"s":"<p>다음 SQL문에서 80점 학생의 순위는?<\/p><p>[성적]: 김 90, 이 90, 박 80<\/p><div class=\"dbs\"><figure class=\"dbt\"><figcaption>[성적]<\/figcaption><div class=\"tw\"><table><thead><tr><th>이름<\/th><th>점수<\/th><\/tr><\/thead><tbody><tr><td>김<\/td><td>90<\/td><\/tr><tr><td>이<\/td><td>90<\/td><\/tr><tr><td>박<\/td><td>80<\/td><\/tr><\/tbody><\/table><\/div><\/figure><\/div><pre class=\"code\" data-lang=\"sql\"><code><span class=\"tk\">SELECT<\/span> 순위 <span class=\"tk\">FROM<\/span> (<span class=\"tk\">SELECT<\/span> 이름, <span class=\"tk\">RANK<\/span>() <span class=\"tk\">OVER<\/span> (<span class=\"tk\">ORDER<\/span> <span class=\"tk\">BY<\/span> 점수 <span class=\"tk\">DESC<\/span>) <span class=\"tk\">AS<\/span> 순위 <span class=\"tk\">FROM<\/span> 성적) <span class=\"tk\">WHERE<\/span> 이름 = <span class=\"ts\">'박'<\/span>;<\/code><\/pre>","c":["1","2","3","4"],"a":2,"e":"<p>RANK는 공동 1위 2명 뒤에 3위가 온다.<\/p>"},{"s":"<p>같은 데이터에 DENSE_RANK를 적용했을 때 80점 학생의 순위는?<\/p><div class=\"dbs\"><figure class=\"dbt\"><figcaption>[성적]<\/figcaption><div class=\"tw\"><table><thead><tr><th>이름<\/th><th>점수<\/th><\/tr><\/thead><tbody><tr><td>김<\/td><td>90<\/td><\/tr><tr><td>이<\/td><td>90<\/td><\/tr><tr><td>박<\/td><td>80<\/td><\/tr><\/tbody><\/table><\/div><\/figure><\/div><pre class=\"code\" data-lang=\"sql\"><code><span class=\"tk\">SELECT<\/span> 순위 <span class=\"tk\">FROM<\/span> (<span class=\"tk\">SELECT<\/span> 이름, <span class=\"tk\">DENSE_RANK<\/span>() <span class=\"tk\">OVER<\/span> (<span class=\"tk\">ORDER<\/span> <span class=\"tk\">BY<\/span> 점수 <span class=\"tk\">DESC<\/span>) <span class=\"tk\">AS<\/span> 순위 <span class=\"tk\">FROM<\/span> 성적) <span class=\"tk\">WHERE<\/span> 이름 = <span class=\"ts\">'박'<\/span>;<\/code><\/pre>","c":["1","2","3","4"],"a":1,"e":"<p>DENSE_RANK는 순위를 건너뛰지 않으므로 2위다.<\/p>"},{"s":"<p>동일한 값이 있어도 고유한 순번을 매기는 윈도우 함수는?<\/p>","c":["GROUPING","ROW_NUMBER","RANK","DENSE_RANK"],"a":1,"e":"<p>ROW_NUMBER는 항상 고유 번호를 부여한다.<\/p>"},{"s":"<p>GROUP BY ROLLUP(A, B)가 만드는 그룹으로 옳은 것은?<\/p>","c":["(A,B), (B), 전체","(A,B), (A), (B), 전체","(A,B), (A), 전체","(A), (B)"],"a":2,"e":"<p>ROLLUP은 오른쪽부터 차례로 줄여 계층적 소계를 만든다. 모든 조합은 CUBE다.<\/p>"},{"s":"<p>GROUP BY CUBE(A, B, C)가 만드는 그룹의 수는?<\/p>","c":["3","4","6","8"],"a":3,"e":"<p>CUBE의 그룹 수는 2ⁿ이다.<\/p>"}]},{"id":"sql-proc","title":"절차형 SQL: 프로시저·함수·트리거","freq":"2027 출제기준 항목. 트리거·이벤트 구분과 오류 처리","concept":"<div class=\"tw\"><table><thead><tr><th>객체<\/th><th>특징<\/th><\/tr><\/thead><tbody><tr><td>프로시저 (Procedure)<\/td><td>일련의 작업을 저장, <code>CALL<\/code>/<code>EXECUTE<\/code>로 호출, 반환값 없어도 됨<\/td><\/tr><tr><td>사용자 정의 함수 (UDF)<\/td><td><strong>반드시 값을 반환<\/strong>, SQL문 안에서 호출<\/td><\/tr><tr><td>트리거 (Trigger)<\/td><td>삽입·수정·삭제 등 <strong>이벤트 발생 시 자동 실행<\/strong>, 직접 호출 불가<\/td><\/tr><tr><td>이벤트 (Event)<\/td><td>정해진 <strong>시간·주기<\/strong>에 실행하는 스케줄 작업<\/td><\/tr><\/tbody><\/table><\/div><p><strong>절차형 SQL 기본 구성<\/strong>: DECLARE(선언) → BEGIN → 실행 → (EXCEPTION 처리) → END<\/p><p><strong>트리거 형식 요소<\/strong>: <code>BEFORE<\/code>/<code>AFTER<\/code>, <code>INSERT<\/code>/<code>UPDATE<\/code>/<code>DELETE<\/code>, <code>FOR EACH ROW<\/code>, <code>NEW<\/code>/<code>OLD<\/code>(변경 후·전 값).<\/p><p><strong>오류 처리<\/strong>: <code>EXCEPTION WHEN 조건 THEN 처리<\/code>로 작성한다. 오류 발생 시 로그 기록, ROLLBACK 등의 처리를 한다.<\/p><p><strong>제어문<\/strong>: IF, CASE, LOOP, WHILE. 커서(CURSOR)는 쿼리 결과를 한 행씩 처리한다.<\/p>","qs":[{"s":"<p>데이터 삽입·수정·삭제 등의 사건이 일어날 때 자동으로 실행되는 절차형 SQL은?<\/p>","c":["함수","뷰","트리거","커서"],"a":2,"e":"<p>트리거는 이벤트에 의해 자동으로 실행된다.<\/p>"},{"s":"<p>사용자 정의 함수의 특징으로 옳은 것은?<\/p>","c":["값을 반환할 수 없다.","데이터베이스에 저장되지 않는다.","트리거만 호출할 수 있다.","처리 결과 값을 반환하며 SQL문 안에서 호출할 수 있다."],"a":3,"e":"<p>사용자 정의 함수는 반드시 값을 반환한다.<\/p>"},{"s":"<p>트리거 안에서 변경되기 전의 데이터를 가리키는 키워드는?<\/p>","c":["PREV","OLD","THIS","NEW"],"a":1,"e":"<p>변경 전은 OLD, 변경 후는 NEW다.<\/p>"},{"s":"<p>정해진 시간이나 주기에 맞춰 SQL 작업을 자동 실행하는 데이터베이스 객체는?<\/p>","c":["이벤트","시퀀스","인덱스","시노님"],"a":0,"e":"<p>이벤트는 스케줄에 따라 동작한다. 트리거는 데이터 변경에 반응한다.<\/p>"},{"s":"<p>절차형 SQL에서 쿼리의 결과를 한 행씩 순차적으로 처리하기 위해 사용하는 것은?<\/p>","c":["커서","스키마","뷰","도메인"],"a":0,"e":"<p>커서는 결과 집합을 한 행씩 접근하게 해 준다.<\/p>"}]},{"id":"rel-model","title":"관계 데이터 모델 용어","freq":"관계모델 약 16문항. 튜플·속성·도메인·차수·기수 용어와 릴레이션 특성이 반복","concept":"<div class=\"tw\"><table><thead><tr><th>용어<\/th><th>의미<\/th><\/tr><\/thead><tbody><tr><td>릴레이션<\/td><td>표<\/td><\/tr><tr><td>튜플<\/td><td>행<\/td><\/tr><tr><td>속성 (Attribute)<\/td><td>열<\/td><\/tr><tr><td>도메인<\/td><td>속성이 가질 수 있는 <strong>값의 집합<\/strong><\/td><\/tr><tr><td>차수 (Degree)<\/td><td><strong>속성의 수<\/strong><\/td><\/tr><tr><td>기수 (Cardinality, 카디널리티)<\/td><td><strong>튜플의 수<\/strong><\/td><\/tr><\/tbody><\/table><\/div><p><strong>릴레이션의 특징<\/strong><\/p><ul><li>튜플은 서로 다르다 (중복 불가).<\/li><li>튜플 사이에 순서가 없다.<\/li><li>속성 값은 <strong>원자값<\/strong>이다 (더 쪼갤 수 없음).<\/li><li>속성 이름은 유일하며, 속성의 순서는 중요하지 않다.<\/li><\/ul><p><strong>데이터 모델 3요소<\/strong>: 구조(Structure), 연산(Operation), 제약 조건(Constraint).<\/p><p><strong>스키마 3계층<\/strong>: 외부 스키마(사용자 뷰), 개념 스키마(전체 구조·제약), 내부 스키마(물리 저장).<\/p><p><strong>DBMS 필수 기능<\/strong>: 정의, 조작, 제어. 독립성: 논리적·물리적 데이터 독립성.<\/p>","qs":[{"s":"<p>속성 5개, 튜플 8개인 릴레이션의 차수와 기수는?<\/p>","c":["차수 5, 기수 8","차수 5, 기수 5","차수 8, 기수 5","차수 8, 기수 8"],"a":0,"e":"<p>차수는 속성 수, 기수는 튜플 수다.<\/p>"},{"s":"<p>릴레이션의 특징으로 틀린 것은?<\/p>","c":["모든 튜플은 서로 다르다.","속성 이름은 릴레이션 내에서 유일하다.","튜플 사이에는 삽입된 순서대로 의미 있는 순서가 있다.","각 속성 값은 원자값이다."],"a":2,"e":"<p>튜플 사이에는 순서가 없다.<\/p>"},{"s":"<p>하나의 속성이 가질 수 있는 값의 범위를 뜻하는 말은?<\/p>","c":["튜플","도메인","인스턴스","카디널리티"],"a":1,"e":"<p>속성이 취할 수 있는 값의 집합이 도메인이다.<\/p>"},{"s":"<p>데이터 모델의 구성 요소가 아닌 것은?<\/p>","c":["제약 조건","연산","구조","출력 구조"],"a":3,"e":"<p>구성 요소는 구조, 연산, 제약 조건이다. 출력 구조는 해당하지 않는다.<\/p>"},{"s":"<p>데이터베이스 3계층 스키마 중 데이터베이스 전체의 논리적 구조와 제약 조건을 정의한 것은?<\/p>","c":["서브 스키마","개념 스키마","내부 스키마","외부 스키마"],"a":1,"e":"<p>조직 전체 관점의 논리 구조는 개념 스키마다.<\/p>"}]},{"id":"rel-algebra","title":"관계대수와 관계해석","freq":"관계대수 약 8문항. 기호 구분과 절차적·비절차적 구분","concept":"<p><strong>관계대수<\/strong>는 원하는 결과를 얻는 방법을 기술하는 <strong>절차적<\/strong> 언어이고, <strong>관계해석<\/strong>은 원하는 결과를 정의하는 <strong>비절차적<\/strong> 언어이며 수학의 프레디킷 해석에 기반한다.<\/p><div class=\"tw\"><table><thead><tr><th>순수 관계 연산<\/th><th>기호<\/th><th>의미<\/th><\/tr><\/thead><tbody><tr><td>Select<\/td><td>σ<\/td><td>조건에 맞는 <strong>행<\/strong><\/td><\/tr><tr><td>Project<\/td><td>π<\/td><td>지정한 <strong>열<\/strong><\/td><\/tr><tr><td>Join<\/td><td>⋈<\/td><td>공통 속성으로 결합<\/td><\/tr><tr><td>Division<\/td><td>÷<\/td><td>S의 값을 모두 가진 R의 튜플<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tw\"><table><thead><tr><th>일반 집합 연산<\/th><th>기호<\/th><\/tr><\/thead><tbody><tr><td>합집합<\/td><td>∪<\/td><\/tr><tr><td>교집합<\/td><td>∩<\/td><\/tr><tr><td>차집합<\/td><td>−<\/td><\/tr><tr><td>교차곱<\/td><td>×<\/td><\/tr><\/tbody><\/table><\/div><p><strong>관계해석 기호<\/strong>: ∀(모든 것에 대해), ∃(어떤 것에 대해, 존재), ∈(원소), ∧(AND), ∨(OR), ¬(NOT).<\/p><p><strong>카티션 프로덕트<\/strong>: 차수는 두 릴레이션의 <strong>차수 합<\/strong>, 기수는 <strong>기수 곱<\/strong>.<\/p>","qs":[{"s":"<p>관계대수에서 특정 조건을 만족하는 행을 골라내는 연산의 기호는?<\/p>","c":["π","÷","⋈","σ"],"a":3,"e":"<p>σ는 행을 선택하고 π는 열을 추출한다.<\/p>"},{"s":"<p><code>π 이름 (직원)<\/code>에 쓰인 관계대수 연산은?<\/p>","c":["Project","Select","Division","Union"],"a":0,"e":"<p>Project(π)가 열을 추출한다.<\/p>"},{"s":"<p>관계해석에 대한 설명으로 옳은 것은?<\/p>","c":["결과를 얻는 절차를 순서대로 기술한다.","SQL과 무관한 물리 저장 방식이다.","원하는 정보가 무엇인지 정의하는 비절차적 언어이다.","관계대수와 표현 능력이 전혀 다르다."],"a":2,"e":"<p>관계해석은 비절차적이고, 관계대수는 절차적이다. 둘의 표현 능력은 동등하다.<\/p>"},{"s":"<p>릴레이션 R의 차수가 3, 기수가 4이고 S의 차수가 2, 기수가 5일 때 R × S의 차수와 기수는?<\/p>","c":["차수 5, 기수 9","차수 5, 기수 20","차수 6, 기수 9","차수 6, 기수 20"],"a":1,"e":"<p>교차곱의 차수는 3 + 2 = 5, 기수는 4 × 5 = 20이다.<\/p>"},{"s":"<p>관계해석에서 \"존재한다\"를 뜻하는 정량자 기호는?<\/p>","c":["∈","∃","∀","¬"],"a":1,"e":"<p>∃는 존재 정량자, ∀는 전칭 정량자다.<\/p>"}]},{"id":"catalog-view","title":"시스템 카탈로그와 뷰","freq":"뷰 약 9문항·카탈로그 약 5문항. 뷰의 제약과 카탈로그 특징이 반복","concept":"<p><strong>시스템 카탈로그(데이터 사전)<\/strong>: 데이터베이스 객체의 정보를 담은 시스템 테이블이다.<\/p><ul><li>저장 내용은 <strong>메타데이터<\/strong>(데이터에 대한 데이터)이다.<\/li><li>사용자도 SQL로 <strong>조회할 수 있다.<\/strong> 다만 INSERT·UPDATE·DELETE로 직접 수정할 수 없다.<\/li><li>데이터 정의어 실행 시 DBMS가 자동으로 갱신한다.<\/li><\/ul><p><strong>뷰(View)<\/strong>: 하나 이상의 기본 테이블로 만든 <strong>가상 테이블<\/strong>이다.<\/p><div class=\"tw\"><table><thead><tr><th>장점<\/th><th>단점<\/th><\/tr><\/thead><tbody><tr><td>논리적 데이터 독립성 제공<\/td><td>독립적인 인덱스를 가질 수 없음<\/td><\/tr><tr><td>사용자의 데이터 관리를 간단히<\/td><td>ALTER로 정의를 변경할 수 없음 (삭제 후 재생성)<\/td><\/tr><tr><td>접근 제어를 통한 보안<\/td><td>일부 뷰는 삽입·수정·삭제에 제약이 있음<\/td><\/tr><\/tbody><\/table><\/div><ul><li>뷰를 정의한 기본 테이블이 삭제되면 뷰도 사용할 수 없다.<\/li><li>뷰로 다른 뷰를 정의할 수 있다.<\/li><li><code>CREATE VIEW 뷰이름 AS SELECT ...;<\/code><\/li><li><code>WITH CHECK OPTION<\/code>: 뷰의 조건에 맞지 않는 변경을 막는다.<\/li><\/ul>","qs":[{"s":"<p>시스템 카탈로그에 대한 설명으로 틀린 것은?<\/p>","c":["사용자가 INSERT로 카탈로그 내용을 직접 수정한다.","데이터베이스 객체의 정보를 저장한다.","사용자도 SELECT로 조회할 수 있다.","DBMS가 스스로 생성하고 유지한다."],"a":0,"e":"<p>카탈로그는 DBMS가 자동으로 관리하며 사용자가 직접 갱신하지 않는다.<\/p>"},{"s":"<p>시스템 카탈로그에 저장되는 데이터를 뜻하는 용어는?<\/p>","c":["로그 데이터","메타데이터","백업 데이터","원시 데이터"],"a":1,"e":"<p>데이터에 대한 데이터를 메타데이터라고 한다.<\/p>"},{"s":"<p>뷰에 대한 설명으로 틀린 것은?<\/p>","c":["접근 제어로 보안을 제공할 수 있다.","뷰는 다른 뷰를 기반으로 만들 수 있다.","가상 테이블이다.","ALTER VIEW로 뷰의 정의를 자유롭게 변경한다."],"a":3,"e":"<p>표준에서 뷰는 ALTER로 변경하지 않고 삭제 후 다시 만든다.<\/p>"},{"s":"<p>뷰의 장점이 아닌 것은?<\/p>","c":["논리적 데이터 독립성을 제공한다.","접근 제어로 보안을 제공한다.","독립적인 인덱스를 자유롭게 생성할 수 있다.","사용자의 데이터 관리를 간단하게 한다."],"a":2,"e":"<p>뷰는 독립적인 인덱스를 가질 수 없다.<\/p>"},{"s":"<p>다음 SQL문을 실행한 결과는?<\/p><p>[상품](코드, 가격): (A, 100), (B, 300), (C, 500)<\/p><div class=\"dbs\"><figure class=\"dbt\"><figcaption>[상품]<\/figcaption><div class=\"tw\"><table><thead><tr><th>코드<\/th><th>가격<\/th><\/tr><\/thead><tbody><tr><td>A<\/td><td>100<\/td><\/tr><tr><td>B<\/td><td>300<\/td><\/tr><tr><td>C<\/td><td>500<\/td><\/tr><\/tbody><\/table><\/div><\/figure><\/div><pre class=\"code\" data-lang=\"sql\"><code><span class=\"tk\">CREATE<\/span> <span class=\"tk\">VIEW<\/span> 고가 <span class=\"tk\">AS<\/span> <span class=\"tk\">SELECT<\/span> 코드, 가격 <span class=\"tk\">FROM<\/span> 상품 <span class=\"tk\">WHERE<\/span> 가격 &gt;= 300;\n<span class=\"tk\">SELECT<\/span> <span class=\"tk\">COUNT<\/span>(*) <span class=\"tk\">FROM<\/span> 고가;<\/code><\/pre>","c":["0","1","2","3"],"a":2,"e":"<p>뷰의 조건을 만족하는 B와 C의 2행이다.<\/p>"}]},{"id":"index","title":"인덱스와 SQL 튜닝","freq":"인덱스 특성과 튜닝 방법이 출제","concept":"<p><strong>인덱스<\/strong>: 키값과 데이터의 위치를 저장해 <strong>조회 속도를 높인다.<\/strong> 변경이 잦으면 유지 비용이 든다.<\/p><div class=\"tw\"><table><thead><tr><th>구분<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>클러스터드<\/td><td>실제 데이터가 키 순서로 정렬. 테이블당 1개<\/td><\/tr><tr><td>넌클러스터드<\/td><td>별도 구조에 키와 위치 저장, 여러 개 가능<\/td><\/tr><tr><td>B-Tree<\/td><td>일반적인 트리 구조 인덱스<\/td><\/tr><tr><td>비트맵<\/td><td>값의 종류가 적은 컬럼에 유리<\/td><\/tr><tr><td>해시<\/td><td>동등 비교<\/td><\/tr><tr><td>함수 기반<\/td><td>계산식 결과로 인덱스<\/td><\/tr><\/tbody><\/table><\/div><ul><li>기본키에는 일반적으로 인덱스가 자동 생성된다.<\/li><li>인덱스는 <code>CREATE INDEX 이름 ON 테이블(속성);<\/code>으로 만들고 <code>DROP INDEX<\/code>로 삭제한다.<\/li><li>소량 데이터나 변경이 잦은 컬럼, 값의 종류가 적어 대부분의 행이 조건에 걸리는 컬럼에는 효과가 적다.<\/li><\/ul><p><strong>SQL 튜닝<\/strong>: 쿼리 성능 개선.<\/p><ul><li>실행 계획(Execution Plan)을 확인한다.<\/li><li>인덱스 컬럼을 변형(함수·계산)하면 인덱스를 사용하지 못할 수 있다.<\/li><li>힌트(Hint)로 옵티마이저의 실행 계획을 유도한다.<\/li><li>옵티마이저 유형: 규칙 기반(RBO), 비용 기반(CBO).<\/li><\/ul>","qs":[{"s":"<p>인덱스에 대한 설명으로 틀린 것은?<\/p>","c":["키값과 데이터 위치를 저장한다.","데이터 변경이 잦을수록 인덱스의 성능상 이점만 커진다.","조회 속도를 높이기 위한 구조이다.","기본키에는 대개 자동으로 생성된다."],"a":1,"e":"<p>변경이 잦으면 인덱스 재구성 비용이 늘어난다.<\/p>"},{"s":"<p>인덱스를 생성하는 SQL 명령어는?<\/p>","c":["CREATE INDEX","ALTER INDEX ADD","MAKE INDEX","INSERT INDEX"],"a":0,"e":"<p><code>CREATE INDEX<\/code>로 인덱스를 만든다.<\/p>"},{"s":"<p>실제 데이터가 키값의 순서대로 정렬되어 저장되며 테이블당 하나만 만들 수 있는 인덱스는?<\/p>","c":["비트맵 인덱스","넌클러스터드 인덱스","해시 인덱스","클러스터드 인덱스"],"a":3,"e":"<p>클러스터드 인덱스는 물리적 정렬 순서를 결정하므로 하나만 가능하다.<\/p>"},{"s":"<p>옵티마이저 유형 중 통계 정보를 기반으로 예상 비용이 가장 적은 실행 계획을 선택하는 것은?<\/p>","c":["RBO","실행 계획","CBO","Hint"],"a":2,"e":"<p>CBO는 비용 기반, RBO는 규칙 기반이다.<\/p>"},{"s":"<p>SQL 튜닝을 위해 쿼리의 처리 방식을 확인하는 정보는?<\/p>","c":["릴리즈 노트","ER 다이어그램","실행 계획","형상 기록"],"a":2,"e":"<p>실행 계획으로 인덱스 사용 여부와 조인 방식을 확인한다.<\/p>"}]},{"id":"er-model","title":"데이터 모델링과 E-R 모델","freq":"E-R·모델링 약 24문항. 설계 단계와 E-R 기호가 반복","concept":"<p><strong>DB 설계 순서<\/strong>: 요구 분석 → <strong>개념적<\/strong> 설계 → <strong>논리적<\/strong> 설계 → <strong>물리적<\/strong> 설계 → 구현<\/p><div class=\"tw\"><table><thead><tr><th>단계<\/th><th>할 일<\/th><th>산출물<\/th><\/tr><\/thead><tbody><tr><td>개념적<\/td><td>DBMS에 독립적인 개념 모델, 트랜잭션 <strong>모델링<\/strong><\/td><td>E-R 다이어그램<\/td><\/tr><tr><td>논리적<\/td><td>특정 DBMS 모델로 변환, 정규화, 트랜잭션 <strong>인터페이스<\/strong> 설계<\/td><td>논리 스키마<\/td><\/tr><tr><td>물리적<\/td><td>저장 구조, 레코드 양식, 접근 경로, 인덱스<\/td><td>물리 스키마<\/td><\/tr><\/tbody><\/table><\/div><p><strong>E-R 다이어그램 표기<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>기호<\/th><th>의미<\/th><\/tr><\/thead><tbody><tr><td>사각형<\/td><td>개체<\/td><\/tr><tr><td>마름모<\/td><td>관계<\/td><\/tr><tr><td>타원<\/td><td>속성<\/td><\/tr><tr><td>이중 타원<\/td><td>다중값 속성<\/td><\/tr><tr><td>밑줄 타원<\/td><td>기본키 속성<\/td><\/tr><tr><td>선<\/td><td>연결<\/td><\/tr><\/tbody><\/table><\/div><ul><li>관계 유형: 1:1, 1:N, N:M.<\/li><li>물리 설계에서 고려: 응답 시간, 저장 공간, 트랜잭션 처리량, 데이터 타입, 값의 분포, 접근 빈도.<\/li><li>개념적 설계에서 트랜잭션 인터페이스를 설계하지는 않는다.<\/li><li>논리 모델 품질 검증: 정확성, 완전성, 준거성, 최신성, 일관성, 활용성.<\/li><\/ul><p><strong>E-R 외의 데이터 모델 표기법<\/strong>: IDEF1X, 정보공학(까마귀 발) 표기.<\/p>","qs":[{"s":"<p>데이터베이스 설계 순서로 옳은 것은?<\/p>","c":["요구 분석 → 물리적 설계 → 논리적 설계 → 개념적 설계","개념적 설계 → 요구 분석 → 논리적 설계 → 물리적 설계","요구 분석 → 개념적 설계 → 논리적 설계 → 물리적 설계","요구 분석 → 논리적 설계 → 개념적 설계 → 물리적 설계"],"a":2,"e":"<p>개념, 논리, 물리 순서로 구체화한다.<\/p>"},{"s":"<p>E-R 다이어그램에서 관계를 나타내는 도형은?<\/p>","c":["마름모","이중 타원","사각형","타원"],"a":0,"e":"<p>관계는 마름모, 개체는 사각형, 속성은 타원이다.<\/p>"},{"s":"<p>개념적 설계 단계에 대한 설명으로 옳은 것은?<\/p>","c":["트랜잭션 인터페이스를 작성한다.","특정 DBMS에 독립적인 개념 스키마를 만들고 E-R 다이어그램을 산출한다.","특정 DBMS의 저장 구조를 결정한다.","레코드 양식과 접근 경로를 설계한다."],"a":1,"e":"<p>저장 구조와 접근 경로는 물리적 설계, 트랜잭션 인터페이스는 논리적 설계의 일이다.<\/p>"},{"s":"<p>테이블의 저장 구조와 인덱스를 정하는 단계에서 참고하지 않아도 되는 자료는?<\/p>","c":["데이터 값의 분포","데이터 타입","접근 빈도","사용자 인터뷰 질문지 작성"],"a":3,"e":"<p>사용자 인터뷰는 요구 분석 단계 활동이다.<\/p>"},{"s":"<p>학생과 과목의 수강 관계에서 학생 한 명이 여러 과목을 듣고 한 과목을 여러 학생이 들을 때의 관계 유형은?<\/p>","c":["N:M","1:N","N:1","1:1"],"a":0,"e":"<p>양쪽이 다수이므로 N:M 관계다.<\/p>"}]},{"id":"normalize","title":"정규화와 이상 현상","freq":"정규화 약 20문항. 정규형 판정 조건이 매회 출제","concept":"<p><strong>이상(Anomaly)<\/strong>: 삽입 이상, 삭제 이상, 갱신 이상.<\/p><p><strong>정규화 목적<\/strong>: 중복을 줄이고 이상을 예방한다. 정규화할수록 테이블은 분해된다.<\/p><div class=\"tw\"><table><thead><tr><th>정규형<\/th><th>조건<\/th><\/tr><\/thead><tbody><tr><td>1NF<\/td><td>도메인이 <strong>원자값<\/strong><\/td><\/tr><tr><td>2NF<\/td><td><strong>부분 함수 종속 제거<\/strong> (완전 함수 종속)<\/td><\/tr><tr><td>3NF<\/td><td><strong>이행적 함수 종속 제거<\/strong><\/td><\/tr><tr><td>BCNF<\/td><td><strong>모든 결정자가 후보키<\/strong><\/td><\/tr><tr><td>4NF<\/td><td><strong>다치 종속 제거<\/strong><\/td><\/tr><tr><td>5NF<\/td><td><strong>조인 종속<\/strong> 제거<\/td><\/tr><\/tbody><\/table><\/div><p>외우기: 도 → 부 → 이 → 결 → 다 → 조<\/p><p><strong>함수 종속(함수적 종속)<\/strong>: X의 값이 Y의 값을 결정하면 <code>X → Y<\/code>.<\/p><div class=\"tw\"><table><thead><tr><th>종속<\/th><th>의미<\/th><\/tr><\/thead><tbody><tr><td>완전 함수 종속<\/td><td>복합키 <strong>전체<\/strong>에 종속<\/td><\/tr><tr><td>부분 함수 종속<\/td><td>복합키 <strong>일부<\/strong>에 종속<\/td><\/tr><tr><td>이행적 함수 종속<\/td><td><code>A → B<\/code>, <code>B → C<\/code>이면 <code>A → C<\/code><\/td><\/tr><\/tbody><\/table><\/div><p><strong>암스트롱 공리<\/strong>: 반사, 증가, 이행 / 분해, 결합, 유사 이행.<\/p><p><strong>예<\/strong>: 수강(학번, 과목코드, 성적, 학생명)에서 기본키가 (학번, 과목코드)이고 학번 → 학생명이면 부분 함수 종속이다.<\/p>","qs":[{"s":"<p>한 칸에 전화번호 두 개가 들어 있는 테이블을 고쳐 칸마다 값이 하나만 있게 만들면 만족하는 정규형은?<\/p>","c":["제2정규형","BCNF","제1정규형","제3정규형"],"a":2,"e":"<p>1NF의 조건은 원자값이다.<\/p>"},{"s":"<p>제2정규형에서 제3정규형으로 변환할 때 제거하는 종속은?<\/p>","c":["이행적 함수 종속","부분 함수 종속","조인 종속","다치 종속"],"a":0,"e":"<p>3NF는 이행적 함수 종속을 제거한다.<\/p>"},{"s":"<p>(A, B) → C와 C → B가 성립하는 릴레이션을 분해해 결정자를 전부 후보키로 만들면 도달하는 정규형은?<\/p>","c":["제2정규형","BCNF","제3정규형","제1정규형"],"a":1,"e":"<p>결정자가 모두 후보키이면 BCNF다.<\/p>"},{"s":"<p>릴레이션 R(학번, 과목코드, 학생명, 성적)의 기본키가 (학번, 과목코드)이고 학번 → 학생명일 때 만족하지 못하는 정규형 중 가장 낮은 것은?<\/p>","c":["제4정규형","제5정규형","제1정규형","제2정규형"],"a":3,"e":"<p>학생명이 복합키의 일부인 학번에 종속되는 부분 함수 종속이므로 2NF를 위반한다.<\/p>"},{"s":"<p>A가 B를 결정하고 B가 C를 결정하므로 A가 C를 결정한다고 유도할 때 쓴 Armstrong 규칙은?<\/p>","c":["분해 규칙","결합 규칙","이행 규칙","반사 규칙"],"a":2,"e":"<p>이행 규칙이다.<\/p>"}]},{"id":"denormal","title":"반정규화와 데이터 표준화","freq":"반정규화 기법과 물리 모델 품질 항목","concept":"<p><strong>반정규화<\/strong>: 성능을 위해 정규화된 설계를 <strong>의도적으로 통합·중복·분리<\/strong>한다. 데이터 일관성과 무결성이 떨어질 수 있다.<\/p><div class=\"tw\"><table><thead><tr><th>방법<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>테이블 통합<\/td><td>1:1, 1:N 관계 테이블 통합<\/td><\/tr><tr><td>테이블 분할<\/td><td><strong>수평 분할<\/strong>(행), <strong>수직 분할<\/strong>(열)<\/td><\/tr><tr><td>중복 테이블 추가<\/td><td>집계 테이블, 진행 테이블, 특정 부분만 포함<\/td><\/tr><tr><td>컬럼 중복<\/td><td>조인 감소를 위해 컬럼을 복제<\/td><\/tr><tr><td>중복 관계 추가<\/td><td>경로 단축<\/td><\/tr><\/tbody><\/table><\/div><ul><li>수행 순서: 대상 조사 → 다른 방법 검토(인덱스, 뷰, 파티션) → 반정규화 수행.<\/li><\/ul><p><strong>물리 데이터 모델 품질 기준<\/strong>: 정확성, 완전성, 준거성, 최신성, 일관성, 활용성.<\/p><div class=\"tw\"><table><thead><tr><th>기준<\/th><th>의미<\/th><\/tr><\/thead><tbody><tr><td>정확성<\/td><td>요구사항과 일치<\/td><\/tr><tr><td>완전성<\/td><td>필요한 내용 누락 없음<\/td><\/tr><tr><td>준거성<\/td><td>표준·규정 준수<\/td><\/tr><tr><td>최신성<\/td><td>현행 시스템을 반영<\/td><\/tr><tr><td>일관성<\/td><td>서로 충돌 없음<\/td><\/tr><tr><td>활용성<\/td><td>사용자 이해·활용 가능<\/td><\/tr><\/tbody><\/table><\/div><p><strong>키 종류<\/strong>: 슈퍼키, 후보키, 기본키, 대체키, 외래키.<\/p><p><strong>칼럼 속성<\/strong>: 자료형, 길이, NULL 여부, 기본값. CHAR(고정길이), VARCHAR(가변길이).<\/p>","qs":[{"s":"<p>반정규화에 대한 설명으로 옳은 것은?<\/p>","c":["저장 공간을 항상 줄인다.","정규형을 더 높이는 과정이다.","성능 향상을 위해 의도적으로 정규화 원칙을 위배하는 것이다.","반드시 데이터 무결성을 강화한다."],"a":2,"e":"<p>반정규화는 성능을 위해 중복을 허용하며 일관성을 해칠 수 있다.<\/p>"},{"s":"<p>반정규화 기법 중 자주 함께 쓰이지 않는 열을 별도 테이블로 나누는 것은?<\/p>","c":["테이블 통합","수직 분할","수평 분할","집계 테이블 추가"],"a":1,"e":"<p>열을 기준으로 나누면 수직 분할, 행을 기준으로 나누면 수평 분할이다.<\/p>"},{"s":"<p>반정규화에 앞서 검토할 수 있는 다른 방법으로 거리가 먼 것은?<\/p>","c":["릴레이션 삭제","인덱스 활용","파티셔닝","뷰 활용"],"a":0,"e":"<p>먼저 인덱스, 뷰, 파티션, 애플리케이션 수정으로 해결 가능한지 검토한다.<\/p>"},{"s":"<p>물리 데이터 모델 품질 기준 중 표준 규정을 지켰는지 평가하는 항목은?<\/p>","c":["정확성","최신성","활용성","준거성"],"a":3,"e":"<p>준거성은 데이터 표준과 규정의 준수 여부다.<\/p>"},{"s":"<p>고정 길이 문자열 자료형은?<\/p>","c":["CLOB","TEXT","VARCHAR","CHAR"],"a":3,"e":"<p>CHAR는 고정 길이, VARCHAR는 가변 길이다.<\/p>"}]},{"id":"integrity","title":"무결성과 키","freq":"무결성·키 약 18문항. 개체·참조 무결성과 후보키 조건이 반복","concept":"<div class=\"tw\"><table><thead><tr><th>무결성<\/th><th>규칙<\/th><\/tr><\/thead><tbody><tr><td>개체 무결성<\/td><td>기본키는 <strong>NULL 불가, 중복 불가<\/strong><\/td><\/tr><tr><td>참조 무결성<\/td><td>외래키는 참조 릴레이션의 기본키 값이거나 NULL<\/td><\/tr><tr><td>도메인 무결성<\/td><td>속성 값은 정의된 도메인에 속함<\/td><\/tr><tr><td>사용자 정의 무결성<\/td><td>업무 규칙에 맞음<\/td><\/tr><tr><td>키 무결성<\/td><td>릴레이션에 같은 키 값을 가진 튜플이 허용되지 않음<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tw\"><table><thead><tr><th>키<\/th><th>의미<\/th><\/tr><\/thead><tbody><tr><td>슈퍼키<\/td><td><strong>유일성<\/strong>만 만족<\/td><\/tr><tr><td>후보키<\/td><td><strong>유일성 + 최소성<\/strong><\/td><\/tr><tr><td>기본키<\/td><td>후보키 중 선택 (NULL 불가)<\/td><\/tr><tr><td>대체키<\/td><td>후보키 중 기본키가 아닌 것<\/td><\/tr><tr><td>외래키<\/td><td>다른 릴레이션의 기본키를 참조<\/td><\/tr><\/tbody><\/table><\/div><ul><li>유일성: 튜플을 유일하게 구분.<\/li><li>최소성: 키의 구성 속성이 꼭 필요한 최소.<\/li><li>외래키 값은 NULL이 허용될 수 있고 중복될 수 있다.<\/li><\/ul>","qs":[{"s":"<p>유일성과 최소성을 모두 만족하는 키는?<\/p>","c":["외래키","후보키","슈퍼키","복합 속성"],"a":1,"e":"<p>후보키는 유일성과 최소성을 모두 만족한다. 슈퍼키는 유일성만 만족한다.<\/p>"},{"s":"<p>학번이 기본키인 테이블에 학번이 비어 있는 행을 넣을 수 없게 하는 규칙은?<\/p>","c":["참조 무결성","도메인 무결성","사용자 정의 무결성","개체 무결성"],"a":3,"e":"<p>기본키의 NULL과 중복을 금지하는 것이 개체 무결성이다.<\/p>"},{"s":"<p>외래키의 값은 참조하는 릴레이션의 기본키 값이거나 NULL이어야 한다는 규칙은?<\/p>","c":["도메인 무결성","키 무결성","참조 무결성","개체 무결성"],"a":2,"e":"<p>참조 무결성의 정의다.<\/p>"},{"s":"<p>속성 값이 정의된 범위 안에 있어야 한다는 규칙은?<\/p>","c":["도메인 무결성","동시성 제어","참조 무결성","개체 무결성"],"a":0,"e":"<p>값의 범위를 지키는 것이 도메인 무결성이다.<\/p>"},{"s":"<p>후보키 중 기본키로 선택되지 않은 나머지 키는?<\/p>","c":["슈퍼키","외래키","복합키 인덱스","대체키"],"a":3,"e":"<p>기본키가 아닌 후보키를 대체키라고 한다.<\/p>"}]},{"id":"transaction","title":"트랜잭션 특성과 상태","freq":"트랜잭션 약 22문항. ACID와 상태 전이가 매회 출제","concept":"<div class=\"tw\"><table><thead><tr><th>ACID<\/th><th>의미<\/th><\/tr><\/thead><tbody><tr><td>Atomicity 원자성<\/td><td>전부 수행되거나 전혀 수행되지 않음 (All or Nothing)<\/td><\/tr><tr><td>Consistency 일관성<\/td><td>실행 전후 데이터베이스의 일관성 유지<\/td><\/tr><tr><td>Isolation 독립성(격리성)<\/td><td>트랜잭션끼리 간섭하지 않음<\/td><\/tr><tr><td>Durability 영속성(지속성)<\/td><td>완료된 결과는 영구 반영<\/td><\/tr><\/tbody><\/table><\/div><p><strong>상태<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>상태<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>활동 (Active)<\/td><td>실행 중<\/td><\/tr><tr><td>부분 완료 (Partially Committed)<\/td><td><strong>마지막 연산 실행 직후<\/strong>, COMMIT 직전<\/td><\/tr><tr><td>완료 (Committed)<\/td><td>트랜잭션 성공<\/td><\/tr><tr><td>실패 (Failed)<\/td><td>오류로 중단<\/td><\/tr><tr><td>철회 (Aborted)<\/td><td>실패하여 ROLLBACK 수행<\/td><\/tr><\/tbody><\/table><\/div><p><strong>격리 수준<\/strong>: READ UNCOMMITTED &lt; READ COMMITTED &lt; REPEATABLE READ &lt; SERIALIZABLE.<\/p><p><strong>이상 현상<\/strong>: Dirty Read, Non-Repeatable Read, Phantom Read.<\/p><p><strong>COMMIT 연산<\/strong>은 영속성·원자성과 관련되고, ROLLBACK 연산은 원자성과 관련된다.<\/p>","qs":[{"s":"<p>트랜잭션의 특성 중 All or Nothing에 해당하는 것은?<\/p>","c":["원자성","영속성","독립성","일관성"],"a":0,"e":"<p>전부 수행되거나 전혀 수행되지 않는 성질이 원자성이다.<\/p>"},{"s":"<p>완료된 트랜잭션의 결과는 시스템 장애가 나도 유지되어야 한다는 특성은?<\/p>","c":["일관성","영속성","원자성","독립성"],"a":1,"e":"<p>영속성(Durability)의 정의다.<\/p>"},{"s":"<p>이체 트랜잭션의 입금 연산까지 끝났지만 COMMIT이 아직 확정되지 않았다. 이 트랜잭션의 상태는?<\/p>","c":["실패","활동","완료","부분 완료"],"a":3,"e":"<p>마지막 연산이 끝나고 확정 전인 상태는 부분 완료다.<\/p>"},{"s":"<p>트랜잭션 격리 수준을 낮은 것부터 나열한 것은?<\/p>","c":["READ UNCOMMITTED → REPEATABLE READ → READ COMMITTED → SERIALIZABLE","READ COMMITTED → READ UNCOMMITTED → SERIALIZABLE → REPEATABLE READ","READ UNCOMMITTED → READ COMMITTED → REPEATABLE READ → SERIALIZABLE","SERIALIZABLE → REPEATABLE READ → READ COMMITTED → READ UNCOMMITTED"],"a":2,"e":"<p>READ UNCOMMITTED가 가장 낮고 SERIALIZABLE이 가장 높다.<\/p>"},{"s":"<p>한 트랜잭션이 아직 완료되지 않은 다른 트랜잭션의 변경 값을 읽는 현상은?<\/p>","c":["Write Ahead","Dirty Read","Non-Repeatable Read","Phantom Read"],"a":1,"e":"<p>완료되지 않은 값을 읽는 현상은 Dirty Read다.<\/p>"}]},{"id":"recovery","title":"병행 제어와 회복","freq":"로킹, 2단계 로킹, Undo·Redo가 반복","concept":"<p><strong>병행 제어<\/strong>: 여러 트랜잭션이 동시에 실행될 때 일관성을 유지한다.<\/p><div class=\"tw\"><table><thead><tr><th>기법<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>로킹<\/td><td>자원을 잠금. <strong>단위가 크면 병행성은 낮아지고 오버헤드는 감소<\/strong>, 작으면 그 반대<\/td><\/tr><tr><td>2단계 로킹 (2PL)<\/td><td><strong>확장 단계<\/strong>(잠금만), <strong>축소 단계<\/strong>(해제만). 직렬성 보장, 교착 가능<\/td><\/tr><tr><td>타임스탬프<\/td><td>시작 시각 순서로 처리. 교착 없음<\/td><\/tr><tr><td>낙관적 검증<\/td><td>끝날 때 검증<\/td><\/tr><tr><td>다중 버전 (MVCC)<\/td><td>여러 버전 유지<\/td><\/tr><\/tbody><\/table><\/div><p><strong>병행 제어 실패 현상<\/strong>: 갱신 손실, 현황 파악 오류, 모순성, 연쇄 복귀.<\/p><p><strong>회복 기법<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>기법<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>로그 기반<\/td><td>지연 갱신, 즉시 갱신<\/td><\/tr><tr><td>지연 갱신<\/td><td>완료 시 반영. <strong>Redo만<\/strong><\/td><\/tr><tr><td>즉시 갱신<\/td><td>곧바로 반영. <strong>Undo + Redo<\/strong><\/td><\/tr><tr><td>체크포인트<\/td><td>검사점 이후 로그만 확인<\/td><\/tr><tr><td>그림자 페이징<\/td><td>로그 없이 페이지 복사본<\/td><\/tr><\/tbody><\/table><\/div><ul><li>Redo: 완료된 트랜잭션을 다시 실행.<\/li><li>Undo: 실패·미완료 트랜잭션을 취소.<\/li><\/ul>","qs":[{"s":"<p>로킹에 대한 설명으로 옳은 것은?<\/p>","c":["로킹 단위가 작아지면 병행성은 높아지고 오버헤드는 증가한다.","로킹 단위가 작아지면 오버헤드가 감소한다.","로킹 단위가 커지면 병행성이 높아진다.","로킹 단위는 병행 제어와 무관하다."],"a":0,"e":"<p>로킹 단위가 작을수록 병행성은 올라가지만 관리 비용이 늘어난다.<\/p>"},{"s":"<p>잠금만 수행하는 단계와 해제만 수행하는 단계로 나누어 직렬성을 보장하는 기법은?<\/p>","c":["타임스탬프","2단계 로킹","체크포인트","그림자 페이징"],"a":1,"e":"<p>확장 단계와 축소 단계로 나누는 2단계 로킹이다.<\/p>"},{"s":"<p>지연 갱신 회복 기법에서 사용하는 연산은?<\/p>","c":["Undo만 사용한다.","Undo와 Redo 모두 사용하지 않는다.","Undo와 Redo 모두 사용한다.","Redo만 사용한다."],"a":3,"e":"<p>지연 갱신은 완료 전에 DB를 변경하지 않으므로 Undo가 필요 없고 Redo만 사용한다.<\/p>"},{"s":"<p>데이터베이스 시스템이 장애로부터 복구할 때 완료된 트랜잭션의 내용을 다시 반영하는 연산은?<\/p>","c":["Grant","Revoke","Redo","Undo"],"a":2,"e":"<p>Redo는 재실행, Undo는 취소다.<\/p>"},{"s":"<p>트랜잭션의 시작 시각을 기준으로 순서를 정해 교착 상태가 생기지 않게 하는 병행 제어 기법은?<\/p>","c":["로그 기법","타임스탬프 기법","2단계 커밋","로킹 기법"],"a":1,"e":"<p>타임스탬프 기법은 잠금을 사용하지 않아 교착 상태가 없다.<\/p>"}]},{"id":"distributed","title":"분산 데이터베이스와 이중화","freq":"분산DB 투명성 종류가 반복, 이중화가 2027 출제기준에 명시","concept":"<p><strong>분산 데이터베이스<\/strong>: 물리적으로 분산된 DB를 하나처럼 쓴다. 구성은 분산 처리기, 분산 DB, 통신 네트워크.<\/p><div class=\"tw\"><table><thead><tr><th>투명성<\/th><th>의미<\/th><\/tr><\/thead><tbody><tr><td>위치<\/td><td>데이터의 위치를 몰라도 접근<\/td><\/tr><tr><td>분할<\/td><td>분할 사실을 몰라도 접근<\/td><\/tr><tr><td>중복 (복제)<\/td><td>복제 사실을 몰라도 접근<\/td><\/tr><tr><td>병행<\/td><td>여러 트랜잭션이 동시 수행되어도 영향 없음<\/td><\/tr><tr><td>장애<\/td><td>장애가 있어도 정상 처리<\/td><\/tr><\/tbody><\/table><\/div><ul><li>장점: 지역 자치성, 확장성, 신뢰성. 단점: 설계 복잡, 비용 증가.<\/li><li>분할 방법: <strong>수평 분할<\/strong>(행), <strong>수직 분할<\/strong>(열).<\/li><li>복제 방법: 동기(모든 곳 동시 반영), 비동기(시간차 반영).<\/li><\/ul><p><strong>데이터베이스 이중화<\/strong>: 장애에 대비해 동일한 DB를 복제한다.<\/p><div class=\"tw\"><table><thead><tr><th>구성<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>Active-Active<\/td><td>두 서버 모두 처리<\/td><\/tr><tr><td>Active-Standby<\/td><td>한쪽이 대기<\/td><\/tr><tr><td>Eager 방식<\/td><td>트랜잭션 수행 중 즉시 반영<\/td><\/tr><tr><td>Lazy 방식<\/td><td>트랜잭션 후 전파<\/td><\/tr><\/tbody><\/table><\/div><p><strong>RTO<\/strong>: 복구 목표 시간. <strong>RPO<\/strong>: 복구 목표 시점(데이터 손실 허용 범위).<\/p>","qs":[{"s":"<p>분산 DB에서 사용자에게 감춰 주는 대상이 아닌 것은?<\/p>","c":["데이터가 있는 서버의 위치","여러 트랜잭션의 동시 수행","통계 보고서의 작성 주기","데이터 복제본의 개수"],"a":2,"e":"<p>투명성은 위치, 분할, 중복, 병행, 장애 등이 있다.<\/p>"},{"s":"<p>데이터베이스 서버의 주소가 바뀌어도 애플리케이션이 논리 이름 그대로 접근할 수 있게 해 주는 성질은?<\/p>","c":["장애 투명성","위치 투명성","복제 투명성","병행 투명성"],"a":1,"e":"<p>위치 투명성의 정의다.<\/p>"},{"s":"<p>분산 데이터베이스의 특징으로 틀린 것은?<\/p>","c":["중앙 집중형보다 설계가 단순하고 비용이 항상 적다.","확장이 쉽다.","장애가 일어나도 다른 지역에서 처리할 수 있다.","지역 자치성이 높다."],"a":0,"e":"<p>분산 환경은 설계가 복잡하고 비용이 늘어날 수 있다.<\/p>"},{"s":"<p>DB 이중화 방식 중 트랜잭션 수행 중 변경이 일어나면 즉시 다른 DB에 반영하는 방식은?<\/p>","c":["Lazy 방식","Batch 방식","Bulk 방식","Eager 방식"],"a":3,"e":"<p>Eager는 즉시, Lazy는 트랜잭션 수행 후 전파한다.<\/p>"},{"s":"<p>장애 시 복구까지 허용되는 목표 시간을 뜻하는 용어는?<\/p>","c":["SLA","ETL","RTO","RPO"],"a":2,"e":"<p>RTO는 복구 목표 시간, RPO는 복구 목표 시점이다.<\/p>"}]},{"id":"physical","title":"파티셔닝·클러스터링·스토리지·사이징","freq":"2027 물리 설계 항목. 파티션 유형과 데이터 지역화","concept":"<p><strong>파티셔닝<\/strong>: 큰 테이블을 작은 단위로 나눈다.<\/p><div class=\"tw\"><table><thead><tr><th>유형<\/th><th>기준<\/th><\/tr><\/thead><tbody><tr><td>범위 분할 (Range)<\/td><td>날짜 등 값의 범위<\/td><\/tr><tr><td>목록 분할 (List)<\/td><td>특정 값 목록<\/td><\/tr><tr><td>해시 분할 (Hash)<\/td><td>해시 함수로 균등 분배<\/td><\/tr><tr><td>라운드 로빈<\/td><td>순서대로 분배<\/td><\/tr><tr><td>조합 분할 (Composite)<\/td><td>두 방법 결합<\/td><\/tr><\/tbody><\/table><\/div><p><strong>장점<\/strong>: 성능 향상, 가용성 향상, 백업·복구 용이. <strong>단점<\/strong>: 테이블 간 조인 비용이 증가할 수 있고, 관리가 복잡해진다.<\/p><p><strong>클러스터링<\/strong>: 지정한 컬럼 값의 순서로 <strong>같은 블록에 저장<\/strong>해 범위 조회와 조인을 빠르게 한다.<\/p><p><strong>데이터 지역화(Locality)<\/strong>: 자주 함께 참조되는 데이터를 가까이 저장해 접근 효율을 높이는 성질. 시간 지역성과 공간 지역성으로 나뉜다.<\/p><p><strong>스토리지<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>방식<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>DAS<\/td><td>서버에 <strong>직접 연결<\/strong><\/td><\/tr><tr><td>NAS<\/td><td><strong>네트워크<\/strong>로 파일 공유<\/td><\/tr><tr><td>SAN<\/td><td>전용 네트워크로 블록 저장 공유<\/td><\/tr><\/tbody><\/table><\/div><p><strong>RAID<\/strong>: 0(스트라이핑), 1(미러링), 5(패리티 분산), 6(이중 패리티).<\/p><p><strong>테이블 저장 사이징<\/strong>: 저장 용량 = 행 크기 × 예상 행 수 + 여유 공간. 트랜잭션 양, 증가 추세 등을 고려한다.<\/p>","qs":[{"s":"<p>날짜 범위로 테이블을 나누는 파티셔닝 유형은?<\/p>","c":["해시 분할","범위 분할","목록 분할","라운드 로빈"],"a":1,"e":"<p>값의 범위로 나누면 범위 분할이다.<\/p>"},{"s":"<p>데이터를 해시 함수에 따라 균등하게 나누는 파티셔닝 유형은?<\/p>","c":["범위 분할","조합 분할","목록 분할","해시 분할"],"a":3,"e":"<p>해시 값을 기준으로 데이터가 고르게 분배된다.<\/p>"},{"s":"<p>RAID 중 데이터를 두 디스크에 똑같이 복제하는 방식은?<\/p>","c":["RAID 5","RAID 0","RAID 1","RAID 6"],"a":2,"e":"<p>RAID 1은 미러링이다.<\/p>"},{"s":"<p>클러스터링에 대한 설명으로 옳은 것은?<\/p>","c":["같은 값을 가진 데이터를 같은 블록에 모아 저장하여 범위 조회 성능을 높인다.","서로 다른 데이터를 랜덤하게 분산한다.","데이터를 암호화하는 기법이다.","트랜잭션 로그를 지우는 기법이다."],"a":0,"e":"<p>클러스터링은 물리적 저장 위치를 모아 조회 성능을 높인다.<\/p>"},{"s":"<p>행 크기가 200바이트이고 예상 행 수가 100,000일 때 여유 공간을 제외한 저장 용량은?<\/p>","c":["200000바이트","2000000바이트","20000000바이트","200000000바이트"],"a":2,"e":"<p>200 × 100,000 = 20,000,000바이트(약 20MB)다.<\/p>"}]},{"id":"dbsecurity","title":"데이터베이스 보안·접근 제어·백업","freq":"2027 출제기준 항목. 백업 방식과 DB 암호화","concept":"<p><strong>DB 암호화 방식<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>방식<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>API 방식<\/td><td>애플리케이션에서 암호화<\/td><\/tr><tr><td>플러그인 방식<\/td><td>DB 내 함수로 암호화<\/td><\/tr><tr><td>TDE (투명)<\/td><td>DBMS 엔진에서 자동 암호화, 애플리케이션 수정 불필요<\/td><\/tr><tr><td>파일 암호화<\/td><td>OS·파일 단위 암호화<\/td><\/tr><\/tbody><\/table><\/div><p><strong>DB 접근 제어<\/strong>: GRANT·REVOKE로 권한 관리, 역할(Role) 기반, 뷰로 일부 공개.<\/p><p><strong>백업 유형<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>유형<\/th><th>대상<\/th><th>복구<\/th><\/tr><\/thead><tbody><tr><td>전체 (Full)<\/td><td>전체 데이터<\/td><td>빠름<\/td><\/tr><tr><td>증분 (Incremental)<\/td><td><strong>직전 백업 이후<\/strong> 변경분<\/td><td>모든 증분이 필요<\/td><\/tr><tr><td>차등 (Differential)<\/td><td><strong>마지막 전체 백업 이후<\/strong> 변경분<\/td><td>전체 + 마지막 차등<\/td><\/tr><tr><td>로그 백업<\/td><td>트랜잭션 로그<\/td><td>특정 시점 복구<\/td><\/tr><\/tbody><\/table><\/div><ul><li>콜드 백업: DB를 중단하고 백업. 핫 백업: 운영 중 백업.<\/li><li>유출 대응: 접근 통제와 감사 로그가 함께 필요하다.<\/li><\/ul>","qs":[{"s":"<p>애플리케이션 수정 없이 DBMS 엔진에서 자동으로 암호화하는 방식은?<\/p>","c":["API 방식","TDE","플러그인 방식","파일 암호화"],"a":1,"e":"<p>TDE는 투명한 데이터 암호화를 뜻한다.<\/p>"},{"s":"<p>마지막 전체 백업 이후 변경된 데이터 전부를 백업하는 방식은?<\/p>","c":["차등 백업","콜드 백업","전체 백업","증분 백업"],"a":0,"e":"<p>마지막 전체 백업 기준이면 차등, 직전 백업 기준이면 증분이다.<\/p>"},{"s":"<p>일요일에 전체 백업을 하고 월·화·수에 증분 백업을 했다. 목요일 장애 시 복구에 필요한 백업 조합은?<\/p>","c":["월·화·수 증분만","일요일 전체, 수 증분","수 증분만","일요일 전체, 월·화·수 증분"],"a":3,"e":"<p>증분 백업은 전체 백업과 이후 모든 증분을 차례로 적용해야 한다.<\/p>"},{"s":"<p>데이터베이스 운영을 중단하지 않고 수행하는 백업은?<\/p>","c":["콜드 백업","오프라인 백업","핫 백업","정지 시점 백업"],"a":2,"e":"<p>운영 중 백업은 핫 백업이다.<\/p>"},{"s":"<p>DB 접근 제어 수단으로 거리가 먼 것은?<\/p>","c":["뷰로 일부 데이터만 공개","정규화","역할 기반 권한 관리","GRANT 권한 부여"],"a":1,"e":"<p>정규화는 데이터 구조 설계 기법이다.<\/p>"}]},{"id":"crud-etl","title":"CRUD 분석과 데이터 전환·정제","freq":"2027 출제기준 항목. CRUD 매트릭스, ETL, 데이터 품질","concept":"<p><strong>CRUD 분석<\/strong>: 프로세스(업무)와 테이블 사이의 <strong>생성·조회·수정·삭제<\/strong> 관계를 행렬로 정리한다. 누락된 테이블·기능을 찾고 트랜잭션 분석과 튜닝의 근거로 삼는다.<\/p><p><strong>데이터 전환<\/strong>: 기존 시스템의 데이터를 새 시스템으로 옮긴다.<\/p><div class=\"tw\"><table><thead><tr><th>단계<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>Extraction<\/td><td>원천 시스템에서 <strong>추출<\/strong><\/td><\/tr><tr><td>Transformation<\/td><td>형식에 맞게 <strong>변환<\/strong><\/td><\/tr><tr><td>Loading<\/td><td>목적 시스템에 <strong>적재<\/strong><\/td><\/tr><\/tbody><\/table><\/div><p>순서는 ETL(추출 → 변환 → 적재)이다.<\/p><ul><li>초기 데이터 구축: 분석 → 설계 → 개발 → 시험 → 실행.<\/li><li>체크리스트: 전환 단계별 점검 항목을 정리.<\/li><li>데이터 검증 항목: 건수, 합계, 값의 범위.<\/li><li>파일 처리 기술: 순차 파일, 색인 순차 파일, 직접 파일.<\/li><\/ul><p><strong>데이터 정제<\/strong>: 전환 전에 오류 데이터를 측정·수정한다.<\/p><p><strong>오류 데이터 측정 기준<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>지표<\/th><th>의미<\/th><\/tr><\/thead><tbody><tr><td>정확성<\/td><td>값이 실제와 일치<\/td><\/tr><tr><td>완전성<\/td><td>필수 값 누락 없음<\/td><\/tr><tr><td>일관성<\/td><td>데이터 간 모순 없음<\/td><\/tr><tr><td>유효성<\/td><td>형식·범위 준수<\/td><\/tr><tr><td>유일성<\/td><td>중복 없음<\/td><\/tr><\/tbody><\/table><\/div><p>ISAM 파일은 색인 순차 파일로, 순차 처리와 임의 접근을 모두 지원한다.<\/p>","qs":[{"s":"<p>ETL의 처리 순서로 옳은 것은?<\/p>","c":["적재 → 추출 → 변환","변환 → 추출 → 적재","추출 → 변환 → 적재","추출 → 적재 → 변환"],"a":2,"e":"<p>ETL은 Extraction, Transformation, Loading 순서다.<\/p>"},{"s":"<p>CRUD 분석의 목적으로 옳은 것은?<\/p>","c":["사용자 화면의 색상을 분석한다.","업무와 테이블의 생성·조회·수정·삭제 관계를 분석해 누락을 찾는다.","소스 코드의 버전을 관리한다.","네트워크 트래픽을 측정한다."],"a":1,"e":"<p>CRUD 매트릭스는 프로세스와 테이블의 관계를 검증한다.<\/p>"},{"s":"<p>데이터 품질 측정 지표 중 필수 값이 빠짐없이 입력되어 있는지 보는 것은?<\/p>","c":["유일성","일관성","정확성","완전성"],"a":3,"e":"<p>누락 여부를 보는 지표는 완전성이다.<\/p>"},{"s":"<p>데이터 전환 검증 항목으로 가장 거리가 먼 것은?<\/p>","c":["전환 담당자 수","값의 범위 준수 여부","이관 건수 일치 여부","합계 대조"],"a":0,"e":"<p>건수, 합계, 범위 등을 검증한다.<\/p>"},{"s":"<p>순차 처리와 임의 접근이 모두 가능한 파일 구조는?<\/p>","c":["직접 파일","색인 순차 파일","텍스트 파일","순차 파일"],"a":1,"e":"<p>색인 순차 파일(ISAM)은 두 접근 방식을 모두 지원한다.<\/p>"}]}]},{"title":"2과목 심화: SQL·정규화 고난도","desc":"상관 서브쿼리와 후보키 판정처럼 시간이 걸리는 문제를 모았다.","types":[{"id":"sql-hard","title":"상관 서브쿼리·NOT EXISTS·CASE·외부 조인","freq":"2027 고급 SQL 항목. 실행 결과를 끝까지 추적해야 하는 유형","concept":"<ul><li><strong>상관 서브쿼리<\/strong>: 바깥 쿼리의 행마다 서브쿼리를 다시 계산한다.<\/li><li><strong>EXISTS / NOT EXISTS<\/strong>: 서브쿼리 결과가 있는지만 본다.<\/li><li><strong>외부 조인 + IS NULL<\/strong>: 짝이 없는 행을 찾는 대표 패턴이다.<\/li><li><strong>CASE<\/strong>: <code>CASE WHEN 조건 THEN 값 ELSE 값 END<\/co 역<\/th><\/tr><\/thead><tbody><tr><td>김<\/td><td>서울<\/td><\/tr><tr><td>이<\/td><td>부산<\/td><\/tr><tr><td>박<\/td><td>서울<\/td><\/tr><tr><td>최<\/td><td>대구<\/td><\/tr><\/tbody><\/table><\/div><\/figure><figure class=\"dbt\"><figcaption>[주문]<\/figcaption><div class=\"tw\"><table><thead><tr><th>번호<\/th><th>고객<\/th><th>금액<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>김<\/td><td>100<\/td><\/tr><tr><td>2<\/td><td>김<\/td><td>300<\/td><\/tr><tr><td>3<\/td><td>이<\/td><td>200<\/td><\/tr><tr><td>4<\/td><td>박<\/td><td>50<\/td><\/tr><tr><td>5<\/td><td>박<\/td><td>150<\/td><\/tr><\/tbody><\/table><\/div><\/figure><\/div><pre class=\"code\" data-lang=\"sql\"><code><span class=\"tk\">SELECT<\/span> <span class=\"tk\">COUNT<\/span>(*) <span class=\"tk\">FROM<\/span> 주문 a <span class=\"tk\">WHERE<\/span> 금액 &gt; (<span class=\"tk\">SELECT<\/span> <span class=\"tk\">AVG<\/span>(금액) <span class=\"tk\">FROM<\/span> 주문 b <span class=\"tk\">WHERE<\/span> b.고객 = a.고객);<\/code><\/pre>","c":["1","2","3","5"],"a":1,"e":"<p>김의 평균 200보다 큰 300, 박의 평균 100보다 큰 150의 2건이다. 이의 200은 자기 평균과 같아 제외된다.<\/p>"},{"s":"<p>공통 테이블에서 다음 SQL문의 결과는?<\/p><div class=\"dbs\"><figure class=\"dbt\"><figcaption>[고객]<\/figcaption><div class=\"tw\"><table><thead><tr><th>고객<\/th><th>지역<\/th><\/tr><\/thead><tbody><tr><td>김<\/td><td>서울<\/td><\/tr><tr><td>이<\/td><td>부산<\/td><\/tr><tr><td>박<\/td><td>서울<\/td><\/tr><tr><td>최<\/td><td>대구<\/td><\/tr><\/tbody><\/table><\/div><\/figure><figure class=\"dbt\"><figcaption>[주문]<\/figcaption><div class=\"tw\"><table><thead><tr><th>번호<\/th><th>고객<\/th><th>금액<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>김<\/td><td>100<\/td><\/tr><tr><td>2<\/td><td>김<\/td><td>300<\/td><\/tr><tr><td>3<\/td><td>이<\/td><td>200<\/td><\/tr><tr><td>4<\/td><td>박<\/td><td>50<\/td><\/tr><tr><td>5<\/td><td>박<\/td><td>150<\/td><\/tr><\/tbody><\/table><\/div><\/figure><\/div><pre class=\"code\" data-lang=\"sql\"><code><span class=\"tk\">SELECT<\/span> <span class=\"tk\">SUM<\/span>(CASE WHEN 금액 &gt;= 150 THEN 1 ELSE 0 END) <span class=\"tk\">FROM<\/span> 주문;<\/code><\/pre>","c":["2","3","4","800"],"a":1,"e":"<p>금액이 150 이상인 주문은 300, 200, 150의 3건이다.<\/p>"},{"s":"<p>공통 테이블에서 다음 SQL문의 결과는?<\/p><div class=\"dbs\"><figure class=\"dbt\"><figcaption>[고객]<\/figcaption><div class=\"tw\"><table><thead><tr><th>고객<\/th><th>지역<\/th><\/tr><\/thead><tbody><tr><td>김<\/td><td>서울<\/td><\/tr><tr><td>이<\/td><td>부산<\/td><\/tr><tr><td>박<\/td><td>서울<\/td><\/tr><tr><td>최<\/td><td>대구<\/td><\/tr><\/tbody><\/table><\/div><\/figure><figure class=\"dbt\"><figcaption>[주문]<\/figcaption><div class=\"tw\"><table><thead><tr><th>번호<\/th><th>고객<\/th><th>금액<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>김<\/td><td>100<\/td><\/tr><tr><td>2<\/td><td>김<\/td><td>300<\/td><\/tr><tr><td>3<\/td><td>이<\/td><td>200<\/td><\/tr><tr><td>4<\/td><td>박<\/td><td>50<\/td><\/tr><tr><td>5<\/td><td>박<\/td><td>150<\/td><\/tr><\/tbody><\/table><\/div><\/figure><\/div><pre class=\"code\" data-lang=\"sql\"><code><span class=\"tk\">SELECT<\/span> <span class=\"tk\">COUNT<\/span>(*) <span class=\"tk\">FROM<\/span> 고객 c <span class=\"tk\">LEFT<\/span> <span class=\"tk\">JOIN<\/span> 주문 o <span class=\"tk\">ON<\/span> c.고객 = o.고객;<\/code><\/pre>","c":["4","5","6","20"],"a":2,"e":"<p>주문 5행과 짝이 없는 최의 1행이 합쳐져 6행이다.<\/p>"},{"s":"<p>공통 테이블에서 지역별 주문 합계가 400 이상인 지역을 구하는 SQL문은?<\/p><div class=\"dbs\"><figure class=\"dbt\"><figcaption>[고객]<\/figcaption><div class=\"tw\"><table><thead><tr><th>고객<\/th><th>지역<\/th><\/tr><\/thead><tbody><tr><td>김<\/td><td>서울<\/td><\/tr><tr><td>이<\/td><td>부산<\/td><\/tr><tr><td>박<\/td><td>서울<\/td><\/tr><tr><td>최<\/td><td>대구<\/td><\/tr><\/tbody><\/table><\/div><\/figure><figure class=\"dbt\"><figcaption>[주문]<\/figcaption><div class=\"tw\"><table><thead><tr><th>번호<\/th><th>고객<\/th><th>금액<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>김<\/td><td>100<\/td><\/tr><tr><td>2<\/td><td>김<\/td><td>300<\/td><\/tr><tr><td>3<\/td><td>이<\/td><td>200<\/td><\/tr><tr><td>4<\/td><td>박<\/td><td>50<\/td><\/tr><tr><td>5<\/td><td>박<\/td><td>150<\/td><\/tr><\/tbody><\/table><\/div><\/figure><\/div>","c":["SELECT 지역, SUM(금액) FROM 고객 c JOIN 주문 o ON c.고객 = o.고객 GROUP BY 지역 HAVING SUM(금액) &gt;= 700;","SELECT 지역, COUNT(금액) FROM 고객 c JOIN 주문 o ON c.고객 = o.고객 GROUP BY 지역 HAVING COUNT(금액) &gt;= 4;","SELECT 지역, SUM(금액) FROM 고객 c JOIN 주문 o ON c.고객 = o.고객 GROUP BY 지역 HAVING SUM(금액) &gt;= 400;","SELECT 지역, SUM(금액) FROM 고객 c JOIN 주문 o ON c.고객 = o.고객 WHERE 금액 &gt;= 400 GROUP BY 지역;"],"a":2,"e":"<p>조인 후 지역별로 묶고 HAVING으로 그룹 합계를 거른다. WHERE는 그룹화 전 행을 거르므로 400 이상인 주문 자체가 없어 결과가 비어 있다.<\/p>"}]},{"id":"normalize-hard","title":"함수 종속으로 후보키·정규형 판정","freq":"정규화 약 20문항 중 가장 어려운 판정형","concept":"<p><strong>속성 폐포(Closure)로 후보키 찾기<\/strong><\/p><ol><li>어떤 속성 집합 X에서 출발한다.<\/li><li>함수 종속을 반복 적용해 X로 결정되는 속성을 모두 모은다.<\/li><li>모든 속성이 모이면 X는 슈퍼키다. 그중 최소인 것이 후보키다.<\/li><\/ol><p><strong>요령<\/strong>: 함수 종속의 오른쪽에 한 번도 나오지 않는 속성은 반드시 모든 후보키에 포함된다.<\/p><p><strong>정규형 판정 순서<\/strong><\/p><ol><li>키의 일부가 키가 아닌 속성을 결정하면 → <strong>2NF 위반<\/strong>.<\/li><li>키가 아닌 속성이 키가 아닌 속성을 결정하면 → <strong>3NF 위반<\/strong>.<\/li><li>결정자 중 후보키가 아닌 것이 있으면 → <strong>BCNF 위반<\/strong>.<\/li><\/ol><p>3NF에서는 결정자가 후보키가 아니어도 <strong>결정되는 쪽이 주요 속성(후보키의 일부)<\/strong>이면 위반이 아니다.<\/p>","qs":[{"s":"<p>R(A, B, C, D)의 함수 종속이 A→B, B→C, C→D일 때 후보키는?<\/p>","c":["A","AD","B","AB"],"a":0,"e":"<p>A의 폐포는 A, B, C, D 전체다. A는 오른쪽에 나오지 않으므로 모든 후보키에 포함된다.<\/p>"},{"s":"<p>R(A, B, C, D)의 함수 종속이 AB→C, C→D일 때 후보키는?<\/p>","c":["A","ABC","AB","C"],"a":2,"e":"<p>A와 B는 오른쪽에 나오지 않아 반드시 포함되고 AB의 폐포가 전체다. ABC는 최소성을 만족하지 않는다.<\/p>"},{"s":"<p>R(A, B, C)의 함수 종속이 AB→C, C→B일 때 후보키를 모두 고른 것은?<\/p>","c":["C","AB, AC","AB","AB, BC"],"a":1,"e":"<p>AB는 C를 결정하고, AC는 C→B로 B를 결정하므로 둘 다 후보키다. A는 오른쪽에 없어 반드시 포함된다.<\/p>"},{"s":"<p>R(A, B, C, D)의 기본키가 A이고 함수 종속이 A→B, A→C, A→D, B→C일 때 이 릴레이션이 만족하는 최고 정규형은?<\/p>","c":["BCNF","제3정규형","제1정규형","제2정규형"],"a":3,"e":"<p>키가 단일 속성이라 부분 종속이 없으므로 2NF다. B→C는 이행적 종속이므로 3NF는 아니다.<\/p>"},{"s":"<p>R(A, B, C)의 함수 종속이 AB→C, C→B일 때 이 릴레이션이 만족하는 최고 정규형은?<\/p>","c":["BCNF","제2정규형","제3정규형","제4정규형"],"a":2,"e":"<p>B는 후보키 AB의 일부(주요 속성)라 3NF는 만족한다. 결정자 C가 후보키가 아니므로 BCNF는 아니다.<\/p>"}]}]},{"title":"2과목 보강: 2024~2026 복원 기출 대조","desc":"최근 복원본에서 기본 유형에 빠져 있던 DB 주제를 모았다.","types":[{"id":"db-model-misc","title":"데이터 모델 종류·식별 관계·뷰 연쇄 삭제·파일 편성","freq":"2024~2026 복원본에 계층 모델, 식별 관계, 뷰 CASCADE, 파일 편성이 등장","concept":"<p><strong>논리적 데이터 모델<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>모델<\/th><th>구조<\/th><\/tr><\/thead><tbody><tr><td>계층<\/td><td><strong>트리<\/strong> 구조, 1:N, 부모 하나<\/td><\/tr><tr><td>망 (네트워크)<\/td><td><strong>그래프<\/strong> 구조, N:M 표현 가능<\/td><\/tr><tr><td>관계<\/td><td><strong>테이블<\/strong> 구조<\/td><\/tr><\/tbody><\/table><\/div><p><strong>식별 관계와 비식별 관계<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>종류<\/th><th>내용<\/th><\/tr><\/thead><tbody><tr><td>식별 관계<\/td><td>부모의 기본키가 자식의 <strong>기본키 일부<\/strong>가 됨 (실선)<\/td><\/tr><tr><td>비식별 관계<\/td><td>부모의 기본키가 자식의 <strong>일반 속성<\/strong>이 됨 (점선)<\/td><\/tr><\/tbody><\/table><\/div><p><strong>이상 현상<\/strong>은 삽입, 삭제, 갱신의 세 가지이며 원인은 데이터 중복과 종속성이다. 검색 이상이라는 분류는 없다.<\/p><p><strong>뷰의 연쇄 삭제<\/strong>: 뷰 V1을 기반으로 V2를 만든 뒤 <code>DROP VIEW V1 CASCADE<\/code>를 실행하면 V1과 V2가 모두 삭제되고, <code>RESTRICT<\/code>면 삭제가 거부된다.<\/p><p><strong>샤딩(Sharding)<\/strong>: 데이터를 <strong>여러 서버에 수평 분할<\/strong>해 저장한다.<\/p><p><strong>파일 편성<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>편성<\/th><th>특징<\/th><\/tr><\/thead><tbody><tr><td>순차<\/td><td>레코드를 차례대로 저장, 일괄 처리에 유리<\/td><\/tr><tr><td>색인 순차<\/td><td>키 순서 저장 + 인덱스, 순차·임의 접근 모두 가능<\/td><\/tr><tr><td>직접 (해싱)<\/td><td>해시 함수로 주소를 계산, 임의 접근이 빠름<\/td><\/tr><\/tbody><\/table><\/div>","qs":[{"s":"<p>개체 간의 관계를 트리 형태로 나타내며 자식이 하나의 부모만 갖는 데이터 모델은?<\/p>","c":["객체 지향 데이터 모델","망 데이터 모델","계층 데이터 모델","관계 데이터 모델"],"a":2,"e":"<p>트리 구조는 계층 데이터 모델이고, 그래프 구조는 망 데이터 모델이다.<\/p>"},{"s":"<p>정규화가 덜 된 테이블에서 나타나는 이상 현상으로 볼 수 없는 것은?<\/p>","c":["삽입 이상","검색 이상","갱신 이상","삭제 이상"],"a":1,"e":"<p>이상 현상은 삽입, 삭제, 갱신의 세 가지다.<\/p>"},{"s":"<p>뷰 V1을 이용해 뷰 V2를 만든 상태에서 <code>DROP VIEW V1 CASCADE;<\/code>를 실행한 결과는?<\/p>","c":["V2만 삭제되고 V1은 남는다.","V2가 있으므로 오류로 거부된다.","V1만 삭제되고 V2는 그대로 남는다.","V1과 V2가 함께 삭제된다."],"a":3,"e":"<p>CASCADE는 해당 객체를 참조하는 객체까지 함께 삭제한다. RESTRICT였다면 거부된다.<\/p>"},{"s":"<p>부모 개체의 기본키가 자식 개체 기본키의 일부로 포함되는 관계는?<\/p>","c":["식별 관계","배타 관계","재귀 관계","비식별 관계"],"a":0,"e":"<p>자식의 기본키에 포함되면 식별 관계, 일반 속성이면 비식별 관계다.<\/p>"},{"s":"<p>데이터를 여러 서버로 수평 분할하여 저장하는 기법은?<\/p>","c":["트리거","샤딩","정규화","미러링"],"a":1,"e":"<p>샤딩은 행을 기준으로 여러 서버에 나눠 저장한다.<\/p>"}]}]},{"title":"3과목 프로그래밍 언어 활용","desc":"20문항. 서버 구현, 언어 문법(C·Java·Python), 운영체제와 네트워크 기초를 다룬다.","types":[{"id":"c-op","title":"C 연산자·제어문 출력","freq":"C 코드 약 28문항. 증감 연산자, 비트 연산, switch, 반복문이 반복","concept":"<p><strong>연산자 우선순위 (높음 → 낮음)<\/strong><\/p><div class=\"tw\"><table><thead><tr><th>순위<\/th><th>연산자<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td><code>()<\/code> <code>[]<\/code> <code>-&gt;<\/code> <code>.<\/code> 후위 <code>++<\/code> <code>--<\/code><\/td><\/tr><tr><td>2<\/td><td>전위 <code>++<\/code> <code>--<\/code> <code>!<\/code> <code>~<\/code> 단항 <code>-<\/code> <code>*<\/code> <code>&amp;<\/code><\/td><\/tr><tr><td>3<\/td><td><code>*<\/code> <code>/<\/code> <code>%<\/code><\/td><\/tr><tr><td>4<\/td><td><code>+<\/code> <code>-<\/code><\/td><\/tr><tr><td>5<\/td><td><code>&lt;&lt;<\/code> <code>&gt;&gt;<\/code><\/td><\/tr><tr><td>6<\/td><td><code>&lt;<\/code> <code>&lt;=<\/code> <code>&gt;<\/code> <code>&gt;=<\/code><\/td><\/tr><tr><td>7<\/td><td><code>==<\/code> <code>!=<\/code><\/td><\/tr><tr><td>8~10<\/td><td><code>&amp;<\/code> → <code>^<\/code> → <code>|<\/code><\/td><\/tr><tr><td>11~12<\/td><td><code>&amp;&amp;<\/code> → <code>||<\/code><\/td><\/tr><tr><td>13<\/td><td><code>? :<\/code><\/td><\/tr><tr><td>14<\/td><td>대입 <code>=<\/code> <code>+=<\/code> 등<\/td><\/tr><\/tbody><\/table><\/div><ul><li><code>i++<\/code>는 값을 사용한 <strong>뒤<\/strong> 증가, <code>++i<\/code>는 증가한 <strong>뒤<\/strong> 사용.<\/li><li>정수끼리의 <code>/<\/code>는 몫만 남는다. <code>%<\/code>는 나머지.<\/li><li><code>a &amp; b<\/code>는 비트 AND, <code>a | b<\/code>는 OR, <code>a ^ b<\/code>는 XOR, <code>&lt;&lt;<\/code> <code>&gt;&gt;<\/code>는 시프트.<\/li><li><code>switch<\/code>는 <code>break<\/code>가 없으면 아래 case로 이어서 실행한다(fall-through).<\/li><li><code>continue<\/code>는 다음 반복으로 넘어가고, <code>break<\/code>는 반복문을 빠져나간다.<\/li><li>0은 거짓, 0이 아닌 값은 참이다.<\/li><\/ul>","qs":[{"s":"<p>다음 C 프로그램의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">int<\/span> a = 5, b = 3;\n    printf(<span class=\"ts\">\"%d\"<\/span>, a++ + <span class=\"tc\">--b);<\/span>\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","c":["6","7","8","9"],"a":1,"e":"<p><code>a++<\/code>는 5를 사용한 뒤 증가하고, <code>--b<\/code>는 먼저 2가 되므로 5 + 2 = 7이다.<\/p>"},{"s":"<p>다음 C 프로그램의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">int<\/span> x = 6, y = 3;\n    printf(<span class=\"ts\">\"%d\"<\/span>, (x &amp; y) + (x | y) + (x ^ y));\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","c":["9","12","14","16"],"a":2,"e":"<p>6(110)과 3(011)에서 AND는 2, OR는 7, XOR는 5이고 합은 14다.<\/p>"},{"s":"<p>다음 C 프로그램의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">int<\/span> n = 2, s = 0;\n    <span class=\"tk\">switch<\/span> (n) {\n        <span class=\"tk\">case<\/span> 1: s += 1;\n        <span class=\"tk\">case<\/span> 2: s += 2;\n        <span class=\"tk\">case<\/span> 3: s += 3;\n            <span class=\"tk\">break<\/span>;\n        <span class=\"tk\">case<\/span> 4: s += 4;\n    }\n    printf(<span class=\"ts\">\"%d\"<\/span>, s);\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","c":["2","3","5","9"],"a":2,"e":"<p>case 2부터 실행해 break를 만날 때까지 2와 3을 더한다.<\/p>"},{"s":"<p>다음 C 프로그램의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">int<\/span> i, sum = 0;\n    <span class=\"tk\">for<\/span> (i = 1; i &lt;= 10; i++) {\n        <span class=\"tk\">if<\/span> (i % 3 == 0) <span class=\"tk\">continue<\/span>;\n        <span class=\"tk\">if<\/span> (i &gt; 7) <span class=\"tk\">break<\/span>;\n        sum += i;\n    }\n    printf(<span class=\"ts\">\"%d\"<\/span>, sum);\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","c":["12","19","22","28"],"a":1,"e":"<p>1, 2, 4, 5, 7을 더해 19가 된다. 3과 6은 건너뛰고 8에서 멈춘다.<\/p>"},{"s":"<p>다음 C 프로그램의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">int<\/span> a = 7, b = 2;\n    <span class=\"tk\">int<\/span> c = a / b * b + a % b;\n    printf(<span class=\"ts\">\"%d\"<\/span>, c);\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","c":["5","6","7","8"],"a":2,"e":"<p>7 / 2 = 3, 3 × 2 = 6, 7 % 2 = 1이므로 7이다.<\/p>"}]},{"id":"c-pointer","title":"C 배열·포인터","freq":"배열 이름과 포인터 연산, 주소 계산이 반복","concept":"<ul><li>배열 이름은 첫 원소의 주소다. <code>a == &amp;a[0]<\/code>.<\/li><li><code>*(a + i) == a[i]<\/code>.<\/li><li><code>p + 1<\/code>은 <strong>가리키는 자료형의 크기만큼<\/strong> 주소가 증가한다. int가 4바이트면 4 증가.<\/li><li><code>*p++<\/code>는 값을 쓴 뒤 포인터를 증가시킨다.<\/li><li>2차원 배열 <code>a[2][3]<\/code>은 연속으로 저장된다.<\/li><\/ul><div class=\"tw\"><table><thead><tr><th>표현<\/th><th>의미<\/th><\/tr><\/thead><tbody><tr><td><code>int *p = a;<\/code><\/td><td>p는 a[0]을 가리킴<\/td><\/tr><tr><td><code>*p<\/code><\/td><td>p가 가리키는 값<\/td><\/tr><tr><td><code>p[2]<\/code><\/td><td><code>*(p+2)<\/code><\/td><\/tr><tr><td><code>&amp;x<\/code><\/td><td>x의 주소<\/td><\/tr><tr><td><code>int **pp<\/code><\/td><td>포인터의 포인터<\/td><\/tr><\/tbody><\/table><\/div><p>값 전달은 원본이 바뀌지 않고, 주소를 넘겨 <code>*<\/code>로 고치면 원본이 바뀐다.<\/p><p>주소 계산 예: <code>a[0]<\/code>의 주소가 100이고 int가 4바이트이면 <code>a[2]<\/code>의 주소는 108이다.<\/p><p><strong>배열 초기화<\/strong>: 원소를 일부만 지정하면 나머지는 0으로 채운다.<\/p>","qs":[{"s":"<p>다음 C 프로그램의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">int<\/span> a[] = {10, 20, 30, 40};\n    <span class=\"tk\">int<\/span> *p = a;\n    printf(<span class=\"ts\">\"%d\"<\/span>, *(p + 2) + *p);\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","c":["30","40","50","60"],"a":1,"e":"<p><code>*(p+2)<\/code>는 30, <code>*p<\/code>는 10이므로 합은 40이다.<\/p>"},{"s":"<p>다음 C 프로그램의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">int<\/span> a[5] = {1, 2};\n    <span class=\"tk\">int<\/span> i, s = 0;\n    <span class=\"tk\">for<\/span> (i = 0; i &lt; 5; i++) s += a[i];\n    printf(<span class=\"ts\">\"%d\"<\/span>, s);\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","c":["0","1","3","5"],"a":2,"e":"<p>나머지 원소는 0으로 초기화되므로 합은 1 + 2 = 3이다.<\/p>"},{"s":"<p>다음 C 프로그램의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">int<\/span> a[2][3] = {{1, 2, 3}, {4, 5, 6}};\n    <span class=\"tk\">int<\/span> *p = a[1];\n    printf(<span class=\"ts\">\"%d\"<\/span>, *(p + 1) + a[0][2]);\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","c":["6","7","8","9"],"a":2,"e":"<p><code>p<\/code>는 a[1][0]을 가리키므로 <code>*(p+1)<\/code>은 5이고, a[0][2]는 3이므로 합은 8이다.<\/p>"},{"s":"<p>다음 C 프로그램의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n<span class=\"tk\">void<\/span> change(<span class=\"tk\">int<\/span> *x, <span class=\"tk\">int<\/span> y) {\n    *x = *x + 1;\n    y = y + 1;\n}\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">int<\/span> a = 1, b = 1;\n    change(&amp;a, b);\n    printf(<span class=\"ts\">\"%d %d\"<\/span>, a, b);\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","c":["2 2","2 1","1 2","1 1"],"a":1,"e":"<p>주소로 전달한 a만 바뀌고, 값으로 전달한 b는 바뀌지 않는다.<\/p>"},{"s":"<p><code>int a[5];<\/code>에서 a[0]의 주소가 200이고 int가 4바이트일 때 a[3]의 주소는?<\/p>","c":["203","208","212","216"],"a":2,"e":"<p>시작 주소에 3 × 4를 더해 212다.<\/p>"}]},{"id":"c-string","title":"C 문자열·구조체·함수","freq":"문자열 함수와 구조체, 재귀가 반복","concept":"<p><strong>문자열<\/strong>: 끝에 널 문자 <code>'\\0'<\/code>이 있다. <code>char s[] = \"ab\";<\/code>의 크기는 3이다.<\/p><div class=\"tw\"><table><thead><tr><th>함수<\/th><th>기능<\/th><\/tr><\/thead><tbody><tr><td><code>strlen(s)<\/code><\/td><td>길이 (널 제외)<\/td><\/tr><tr><td><code>strcpy(a, b)<\/code><\/td><td>b를 a에 복사<\/td><\/tr><tr><td><code>strcat(a, b)<\/code><\/td><td>a 뒤에 b 연결<\/td><\/tr><tr><td><code>strcmp(a, b)<\/code><\/td><td>같으면 0, a가 작으면 음수, 크면 양수<\/td><\/tr><tr><td><code>strchr(s, c)<\/code><\/td><td>문자 위치 찾기<\/td><\/tr><\/tbody><\/table><\/div><ul><li><code>strrev<\/code>는 표준 함수가 아니다.<\/li><\/ul><p><strong>구조체<\/strong>: 서로 다른 자료형을 묶는다. 변수는 <code>.<\/code>로, 포인터는 <code>-&gt;<\/code>로 멤버에 접근한다.<\/p><p><strong>재귀<\/strong>: 함수가 자기 자신을 호출한다. 종료 조건이 반드시 필요하다.<\/p><p><strong>입출력 형식<\/strong>: <code>%d<\/code>(정수), <code>%c<\/code>(문자), <code>%s<\/code>(문자열), <code>%f<\/code>(실수), <code>%x<\/code>(16진수), <code>%o<\/code>(8진수).<\/p><p><strong>문자 산술<\/strong>: <code>'A'<\/code>는 65, <code>'a'<\/code>는 97이며 <code>'a' - 'A'<\/code>는 32다.<\/p>","qs":[{"s":"<p>다음 C 프로그램의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n#<span class=\"tk\">include<\/span> &lt;string.h&gt;\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">char<\/span> a[20] = <span class=\"ts\">\"Hi\"<\/span>;\n    strcat(a, <span class=\"ts\">\"There\"<\/span>);\n    printf(<span class=\"ts\">\"%d\"<\/span>, (<span class=\"tk\">int<\/span>)strlen(a));\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","c":["2","5","7","8"],"a":2,"e":"<p>\"HiThere\"의 길이는 7이고 널 문자는 세지 않는다.<\/p>"},{"s":"<p>다음 C 프로그램의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n<span class=\"tk\">struct<\/span> point { <span class=\"tk\">int<\/span> x; <span class=\"tk\">int<\/span> y; };\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">struct<\/span> point p = {3, 4};\n    <span class=\"tk\">struct<\/span> point *q = &amp;p;\n    q-&gt;x = q-&gt;x + p.y;\n    printf(<span class=\"ts\">\"%d\"<\/span>, p.x);\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","c":["1","3","4","7"],"a":3,"e":"<p><code>q<\/code>는 p를 가리키므로 p.x가 3 + 4 = 7로 바뀐다.<\/p>"},{"s":"<p>다음 C 프로그램의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n<span class=\"tk\">int<\/span> f(<span class=\"tk\">int<\/span> n) {\n    <span class=\"tk\">if<\/span> (n &lt;= 1) <span class=\"tk\">return<\/span> 1;\n    <span class=\"tk\">return<\/span> n * f(n - 1);\n}\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    printf(<span class=\"ts\">\"%d\"<\/span>, f(4));\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","c":["4","10","12","24"],"a":3,"e":"<p>재귀로 4 × 3 × 2 × 1 = 24를 계산한다.<\/p>"},{"s":"<p>C 표준 라이브러리에서 두 문자열이 같을 때 0을 반환하는 함수는?<\/p>","c":["strcat","strcmp","strlen","strcpy"],"a":1,"e":"<p>strcmp는 두 문자열이 같으면 0을 반환한다.<\/p>"},{"s":"<p>다음 C 프로그램의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"c\"><code>#<span class=\"tk\">include<\/span> &lt;stdio.h&gt;\n<span class=\"tk\">int<\/span> main(<span class=\"tk\">void<\/span>) {\n    <span class=\"tk\">char<\/span> s[] = <span class=\"ts\">\"code\"<\/span>;\n    <span class=\"tk\">int<\/span> i, n = 0;\n    <span class=\"tk\">for<\/span> (i = 0; s[i] != <span class=\"ts\">'\\0'<\/span>; i++) {\n        <span class=\"tk\">if<\/span> (s[i] == <span class=\"ts\">'o'<\/span> || s[i] == <span class=\"ts\">'e'<\/span>) n++;\n    }\n    printf(<span class=\"ts\">\"%d\"<\/span>, n);\n    <span class=\"tk\">return<\/span> 0;\n}<\/code><\/pre>","c":["1","2","3","4"],"a":1,"e":"<p>문자 'o'와 'e'가 각각 한 번씩 나온다.<\/p>"}]},{"id":"java-basic","title":"Java 기본 문법 출력","freq":"Java 코드 약 21문항. 배열, 문자열 메서드, 연산자가 반복","concept":"<ul><li>배열은 <code>int[] a = new int[3];<\/code>으로 만들고 기본값은 0이다. 길이는 <code>a.length<\/code>.<\/li><li>정수끼리의 나눗셈은 몫만 남는다.<\/li><li>문자열 비교: <code>==<\/code>는 참조 비교, <code>equals()<\/code>는 값 비교.<\/li><li>문자열 연결: <code>\"a\" + 1 + 2<\/code>는 <code>a12<\/code>, <code>1 + 2 + \"a\"<\/code>는 <code>3a<\/code>.<\/li><li><code>String<\/code> 메서드: <code>length()<\/code>, <code>charAt(i)<\/code>, <code>substring(a, b)<\/code>(a 이상 b 미만), <code>indexOf()<\/code>, <code>toUpperCase()<\/code>.<\/li><li><code>x += 식<\/code>은 왼쪽 x의 값을 먼저 읽어 두고 식을 계산해 더한다.<\/li><li><code>final<\/code>은 변경 불가, <code>static<\/code>은 클래스 단위 공유.<\/li><li>출력: <code>System.out.print<\/code>, <code>System.out.println<\/code>.<\/li><li>향상된 for: <code>for (int v : a)<\/code>.<\/li><li>자료형 크기: byte 1, short 2, int 4, long 8, float 4, double 8, char 2, boolean 1(논리).<\/li><\/ul>","qs":[{"s":"<p>다음 Java 프로그램의 출력 결과는?<\/p><pre class=\"code\" data-lang=\"java\"><code><span class=\"tk\">public<\/span> <span class=\"tk\">class<\/span> Main {\n    <span class=\"tk\">public<\/span> <span class=\"tk\">static<\/span> <span class=\"tk\">void<\/span> main(String[] args) {\n        <span class=\"tk\">int<\/span>[] a = {2, 4, 6, 8};\n        <span class=\"tk\">int<\/span> s = 0;\n        <span class=\"tk\">for<\/span> (<span class=\"tk\">int<\/span> v : a) {
